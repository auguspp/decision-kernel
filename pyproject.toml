[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-kernel"
version = "0.1.0"
description = "Small investment-decision cognition kernel extracted from Decision OS"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
]

[project.scripts]
decision-kernel = "decision_kernel.cli:main"

[project.optional-dependencies]
price-structure = [
  "czsc==1.0.1",
  "wbt==0.2.1",
  "pyarrow==25.0.1",
  "polars==1.44.2",
  "requests-toolbelt==1.0.0",
  "dill==0.4.1",
  "tenacity==9.1.4",
]
concept = [
  "eltdx==3.2.2",
]
ci-contracts = [
  "pytest==9.1.1",
]
cnequity = [
  "cnequity==0.11.0",
]
research-api = [
  "openai==3.19.2",
]
documents = [
  "pypdf==6.19.0",
  "pypdfium2==5.13.0",
]
# Keep the qualified discovery/replay parser; 4.15.0 needs separate requalification (#623).
discovery = [
  "beautifulsoup4==4.14.3",
]
feeds = [
  "feedparser==6.0.14",
  "beautifulsoup4==4.14.3",
  "requests==2.34.2",
]
dump-study = [
  "requests==2.34.2",
  "pyarrow==25.0.1",
]
dev = [
  "czsc==1.0.1",
  "wbt==0.2.1",
  "polars==1.44.2",
  "requests-toolbelt==1.0.0",
  "dill==0.4.1",
  "tenacity==9.1.4",
  "eltdx==3.2.2",
  "cnequity==0.11.0",
  "openai==3.19.2",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "pytest-split==0.11.0",
  "pypdf==6.19.0",
  "pypdfium2==5.13.0",
  "beautifulsoup4==4.14.3",
  "feedparser==6.0.14",
  "requests==2.34.2",
  "pyarrow==25.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_kernel = ["policy_data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
