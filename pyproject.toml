[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-kernel"
version = "0.1.0"
description = "Small investment-decision cognition kernel extracted from Decision OS"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.4",
]

[project.scripts]
decision-kernel = "decision_kernel.cli:main"

[project.optional-dependencies]
research-api = [
  "openai==3.11.0",
]
documents = [
  "pypdf==6.16.2",
  "pypdfium2==5.8.0",
]
discovery = [
  "beautifulsoup4==4.14.3",
]
feeds = [
  "feedparser==6.0.14",
  "beautifulsoup4==4.14.3",
  "requests==2.34.2",
]
dump-study = [
  "requests==2.34.2",
  "pyarrow==25.0.1",
]
dev = [
  "openai==3.11.0",
  "pytest==9.1.1",
  "pypdf==6.16.2",
  "pypdfium2==5.8.0",
  "beautifulsoup4==4.14.3",
  "feedparser==6.0.14",
  "requests==2.34.2",
  "pyarrow==25.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_kernel = ["policy_data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
