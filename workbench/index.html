<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://api.github.com https://raw.githubusercontent.com; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Decision Kernel · 工作台研发预览</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#243342;background:#f3f5f7;line-height:1.65;font-size:15px}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:#245e91;overflow-wrap:anywhere}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b58b35;outline-offset:3px}
.shell{max-width:1360px;margin:auto;padding:32px;display:grid;grid-template-columns:205px minmax(0,1fr);gap:36px}aside{align-self:start;position:sticky;top:24px}h1{font-size:25px;margin:0 0 3px;line-height:1.25;letter-spacing:-.6px}h2{font-size:26px;margin:0 0 5px}h3{font-size:17px;margin:0 0 12px}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#687b8b;margin-bottom:12px}.muted{color:#647789;font-size:13px}.nav{display:grid;gap:7px;margin-top:30px}.nav button{background:transparent;border:0;border-radius:7px;text-align:left;padding:11px 15px;color:#526678}.nav button[aria-current="page"]{background:#243b4d;color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.control{border:1px solid #c5d0d8;background:white;border-radius:7px;padding:8px 14px;color:#344c60}.badge{background:#e9eef2;border:1px solid #dce3e9;padding:4px 8px;border-radius:5px;font-size:11px;display:inline-block}.card{background:white;border:1px solid #dce3e9;border-radius:10px;padding:22px;margin:0 0 16px;min-width:0}.gap{border-left:4px solid #ae7a33;background:#fffcf5}.stack{display:grid;gap:10px}.note{border-top:1px solid #dce3e9;margin-top:24px;padding-top:15px;font-size:12px;color:#687b8b}p{margin:8px 0 13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;max-width:100%}summary{cursor:pointer;font-weight:600}details{margin:12px 0}input[type=search]{width:100%;border:1px solid #c5d0d8;border-radius:7px;padding:10px;background:white;margin:10px 0 18px}.ref{padding:12px 0;border-bottom:1px solid #e4e9ee}.ref button{border:0;background:none;color:#245e91;text-align:left;padding:0;max-width:100%;overflow-wrap:anywhere}.small{font-size:12px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 12px;text-align:left;border-bottom:1px solid #e4e9ee;vertical-align:top}th{color:#687b8b;font-weight:500}#identity{overflow-wrap:anywhere;margin-bottom:22px}#detail:empty{display:none}#modules{margin-top:25px;font-size:12px}#modules label{display:block;padding:3px 0}
@media(max-width:760px){.shell{grid-template-columns:1fr;padding:20px;gap:22px}aside{position:static}.nav{display:flex;overflow-x:auto;margin-top:15px}.nav button{white-space:nowrap}.toolbar{flex-wrap:wrap}#modules{display:none}.card{padding:17px}}
</style>
<script type="module" src="./app.mjs"></script>
</head>
<body>
<div class="shell">
<aside><div class="eyebrow">Research · Continuity</div><h1>Decision<br>Kernel</h1><p class="muted">个人研究与注意力工作台</p><span class="badge">只读研发预览 · 非生产上线</span><nav id="nav" class="nav" aria-label="工作台模块"></nav><div id="modules"><div class="muted">可选视图</div></div><p class="note">正式记录保留在 GitHub。<br>本页不执行研究、投资或写入。</p></aside>
<main><div class="toolbar"><div><div class="eyebrow">Workspace / Saved observations</div><h2 id="heading">注意力</h2><div id="subtitle" class="muted"></div></div><button id="refresh" class="control">读取最新保存结果</button></div><div id="identity" class="muted" role="status"></div><div id="content" aria-live="polite"></div><section id="detail" class="card" aria-label="原件阅读"></section><footer class="note">Data ≠ Evidence ≠ Judgment ≠ Decision · AI 无投资权限<br>此消费端不重算 canonical reading_hash；选中文件另验字节数与 SHA-256。页面读取、研究有效性、Human 接受分别成立。</footer></main>
</div>
</body></html>
