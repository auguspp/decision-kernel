name: CI Python environment
description: Reuse the measured uv installer without caching environments or results.
inputs:
  extras:
    required: true
    description: Existing project extras to install.
  constraints:
    required: false
    default: ''
    description: Same-run package constraints, when executing a partition.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: '0.12.17'
        enable-cache: false
    - name: Install requested dependencies
      shell: bash
      env:
        CI_EXTRAS: ${{ inputs.extras }}
        CI_CONSTRAINTS: ${{ inputs.constraints }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "$CI_CONSTRAINTS" ]; then args+=(--constraint "$CI_CONSTRAINTS"); fi
        uv pip install --system --python "$pythonLocation/bin/python" -e ".[${CI_EXTRAS}]" "${args[@]}"
