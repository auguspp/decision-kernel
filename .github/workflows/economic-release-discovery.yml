name: economic-release-discovery

on:
  workflow_dispatch:
    inputs:
      source-kind:
        description: Explicit source study; no article acceptance or market request
        type: choice
        options: [economic-directories, nbs-native-rss]
        default: economic-directories
      bootstrap:
        description: Explicit separate RSS baseline only; never a continuation or new-publication claim
        type: boolean
        default: false
      previous-run-id:
        description: Exact successful native RSS predecessor run; required unless explicitly bootstrapping
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - radar_inputs/native-rss-successor-request.json

permissions:
  contents: read

concurrency:
  group: economic-release-discovery-compatibility
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' && inputs.source-kind == 'economic-directories'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require reviewed main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Discovery proof requires reviewed main"
            exit 1
          fi
      - name: Install
        run: python -m pip install -e '.[discovery]'
      - name: Record run identity
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from decision_kernel.identity import canonical_hash, canonical_json
          root = Path("release-discovery-proof")
          root.mkdir(exist_ok=False)
          record = {key: os.environ[key] for key in (
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_EVENT_NAME"
          )}
          record.update(semantics="BOUNDED_DIRECTORY_COMPATIBILITY_PROOF_NOT_CONTINUOUS_MONITORING",
                        human_attention_authority="NONE", research_authority="NONE", investment_authority="NONE")
          record["provenance_hash"] = canonical_hash(record)
          (root / "workflow.json").write_text(canonical_json(record) + "\n", encoding="utf-8")
          PY
      - name: Scan two visible directory windows once
        run: |
          python -m decision_kernel.runtime.economic_release_inputs scan \
            --seed radar_inputs/economic-node-study-2026-09-05.json \
            --reviews-dir radar_inputs/economic-reviewed-releases \
            --output release-discovery-proof/input-run
      - name: Reconstruct discovery offline
        if: always()
        run: |
          if [ ! -f release-discovery-proof/input-run/input-set.json ]; then
            echo "::error::No assembled input receipt; no success is inferred"
            exit 1
          fi
          python -m decision_kernel.runtime.economic_release_inputs verify \
            release-discovery-proof/input-run \
            --seed radar_inputs/economic-node-study-2026-09-05.json \
            --reviews-dir radar_inputs/economic-reviewed-releases > release-discovery-proof/verification.json
          cat release-discovery-proof/verification.json
      - name: Retain complete attempt evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v7
        with:
          name: economic-release-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-discovery-proof/
          if-no-files-found: error
          retention-days: 90
      - name: Publish bounded discovery summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          if [ -f release-discovery-proof/input-run/summary.md ]; then
            cat release-discovery-proof/input-run/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No complete input assembly summary was produced; inspect failed steps." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f release-discovery-proof/input-run/scan/summary.md ]; then
            cat release-discovery-proof/input-run/scan/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[目录原文、请求计划与待核验材料](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '仅验证两个可见目录窗口；未发现候选不等于发布者没有更新。不自动接受经济事实，不生成市场事件。' >> "$GITHUB_STEP_SUMMARY"
  native-rss:
    if: github.event_name == 'push' || inputs.source-kind == 'nbs-native-rss'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install existing package with mature feed parser
        run: python -m pip install -e '.[feeds]'
      - name: Validate explicit source registry lifecycle
        id: lifecycle
        env:
          SOURCE_EVENT: ${{ github.event_name }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          PREVIOUS_RUN_ID: ${{ inputs.previous-run-id }}
        run: python .github/scripts/prepare-native-rss-successor.py request
      - name: Verify exact successful source predecessor with GitHub CLI
        id: predecessor
        if: steps.lifecycle.outputs.previous_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ steps.lifecycle.outputs.previous_run_id }}
        run: |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_RUN_ID}" > native-rss-intake/predecessor-run.json
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_RUN_ID}/artifacts?per_page=100" > native-rss-intake/predecessor-artifacts.json
          python .github/scripts/prepare-native-rss-successor.py metadata
      - name: Restore that source artifact only
        if: steps.lifecycle.outputs.previous_run_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.predecessor.outputs.artifact_id }}
          run-id: ${{ steps.lifecycle.outputs.previous_run_id }}
          github-token: ${{ github.token }}
          path: previous-native-rss
          digest-mismatch: error
      - name: Bind restored original source to verified execution before requests
        if: steps.lifecycle.outputs.previous_run_id != ''
        run: python .github/scripts/prepare-native-rss-successor.py restore
      - name: Read two native feeds once without business credentials
        id: rss-capture
        env:
          BOOTSTRAP: ${{ steps.lifecycle.outputs.baseline }}
          EXPECTED_PREVIOUS_RUN_ID: ${{ steps.lifecycle.outputs.previous_run_id }}
        run: |
          if [ -n "$EXPECTED_PREVIOUS_RUN_ID" ]; then
            test -f native-rss-intake/predecessor-verification.json
            python -m decision_kernel.runtime.radar_feed_intake capture \
              --previous previous-native-rss/capture --output native-rss-intake/capture > native-rss-intake/operation.json
          else
            test "$BOOTSTRAP" = true
            python -m decision_kernel.runtime.radar_feed_intake capture \
              --bootstrap --output native-rss-intake/capture > native-rss-intake/operation.json
          fi
      - name: Rebuild native intake from preserved bytes offline
        id: rss-verify
        if: always()
        run: |
          python -m decision_kernel.runtime.radar_feed_intake verify \
            --output native-rss-intake/capture > native-rss-intake/verification.json
      - name: Retain native source attempt
        id: rss-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radar-feed-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-rss-intake/
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact native source status
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.rss-artifact.outputs.artifact-url }}
          CAPTURE_RESULT: ${{ steps.rss-capture.outcome }}
          VERIFY_RESULT: ${{ steps.rss-verify.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('native-rss-intake/capture')
          lines = ['## 原生 RSS 来源窗口', 'SHADOW OBSERVATION ONLY · Human / Research / Investment authority = NONE']
          if (root/'capture.json').is_file():
              r = json.loads((root/'capture.json').read_text())
              lines += [f"采集状态：{r['status']}；请求尝试：{len(r['requests'])}；首次基线：{r['bootstrap']}"]
          if (root/'delta.json').is_file():
              d = json.loads((root/'delta.json').read_text())
              lines += [f"窗口状态：{d['status']}；条目出现：{d['feed_occurrences']}；去重版本：{d['current_unique_versions']}"]
          if (root/'source-rows.json').is_file():
              e = json.loads((root/'source-rows.json').read_text())
              lines += [f"来源导出：{e['status']}；待处理版本：{e.get('pending_versions', 0)}；时区缺口不自动补齐。"]
          lines += ['首次看到不等于刚刚发布；两个滚动窗口不代表完整历史。未获取文章正文，未自动接受经济事实，未调用市场。',
                    '附件保留90天；恢复失败或过期不得静默建立新基线。没有自动寻找上一成功、cache或长期checkpoint。',
                    '代码变更不再触发初始化；push 仅执行明确声明的前序接续。']
          if os.environ['ARTIFACT_URL']:
              lines += [f"[本次原始 RSS 与登记结果]({os.environ['ARTIFACT_URL']})"]
          if os.environ['CAPTURE_RESULT'] == os.environ['VERIFY_RESULT'] == 'success' and os.environ['ARTIFACT_URL']:
              lines += ['解压后打开 capture/index.html。']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write('\n\n'.join(lines)+'\n')
          PY
