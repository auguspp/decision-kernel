name: build-sector-radar-state-bootstrap-2026-09-04

on:
  pull_request:
    paths:
      - ".github/workflows/build-sector-radar-state-bootstrap-2026-09-04.yml"
      - "experiments/build_sector_radar_state_bootstrap_2026_09_04.py"

permissions:
  contents: write
  actions: read

jobs:
  build-bootstrap:
    if: github.event.pull_request.head.ref == 'data/sector-radar-state-bootstrap-2026-09-04'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download exact broad and benchmark history artifact
        uses: actions/download-artifact@v8
        with:
          name: sector-radar-pit-replay-2026-09-04
          path: broad-artifact
          github-token: ${{ github.token }}
          repository: auguspp/decision-kernel
          run-id: 33869436890
      - name: Download exact granular history artifact
        uses: actions/download-artifact@v8
        with:
          name: sector-radar-884-pit-replay-2026-09-04
          path: granular-artifact
          github-token: ${{ github.token }}
          repository: auguspp/decision-kernel
          run-id: 33878938737
      - name: Build deterministic compressed bootstrap
        run: |
          python -m pip install -e '.[dev]'
          python experiments/build_sector_radar_state_bootstrap_2026_09_04.py
      - name: Verify full repository suite
        run: python -m pytest -q
      - name: Remove one-time builder and publish bootstrap
        shell: bash
        run: |
          rm .github/workflows/build-sector-radar-state-bootstrap-2026-09-04.yml
          rm experiments/build_sector_radar_state_bootstrap_2026_09_04.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_inputs/sector-radar-state-bootstrap-2026-09-04.json.gz
          git add radar_inputs/sector-radar-state-bootstrap-2026-09-04.manifest.json
          git add docs/sector-radar-state-bootstrap-2026-09-04.md
          git add -A .github/workflows/build-sector-radar-state-bootstrap-2026-09-04.yml
          git add -A experiments/build_sector_radar_state_bootstrap_2026_09_04.py
          git commit -m "data: freeze Sector Radar state bootstrap"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
