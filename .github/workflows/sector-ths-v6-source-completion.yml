name: sector-ths-v6-source-completion

on:
  push:
    branches:
      - recovery/sector-ths-v6-final-cont-20260911

permissions:
  actions: read
  contents: read

concurrency:
  group: sector-ths-v6-source-completion-20260911
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install frozen AKShare source adapter
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'git+https://github.com/akfamily/akshare.git@8e95744b79ae22326308ccd2b4e62650c5b53c55'
          python -m py_compile .github/scripts/capture-sector-ths-v6-source-completion.py
      - name: Download frozen HiThink source
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10187281705'
          run-id: '34566950303'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/source
      - name: Download retained 292-identity continuation bundle
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10195718219'
          run-id: '34591191296'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/prior
      - name: Download accepted 884287 v6 probe
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10196014989'
          run-id: '34592027908'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/probe
      - name: Complete only remaining 28 identities over one-request v6
        id: capture
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python .github/scripts/capture-sector-ths-v6-source-completion.py \
            --source "$RUNNER_TEMP/source" \
            --prior "$RUNNER_TEMP/prior/final-v4-cont" \
            --probe "$RUNNER_TEMP/probe" \
            --output "$RUNNER_TEMP/v6-source-complete"
      - name: Retain exact raw and receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-ths-v6-source-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-source-complete/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Enforce source-completion acceptance
        if: always()
        env:
          OUTCOME: ${{ steps.capture.outcome }}
        run: test "$OUTCOME" = success
