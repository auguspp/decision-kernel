name: sub2api-codex-validator-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub2api-codex-validator-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install existing package and tests
        run: python -m pip install -e '.[dev]'

      - name: Validate Sub2API configuration without printing secrets
        env:
          SUB2API_API_KEY: ${{ secrets.SUB2API_API_KEY }}
          SUB2API_RESPONSES_ENDPOINT: ${{ vars.SUB2API_RESPONSES_ENDPOINT }}
        run: |
          test -n "$SUB2API_API_KEY"
          test -n "$SUB2API_RESPONSES_ENDPOINT"
          case "$SUB2API_RESPONSES_ENDPOINT" in
            https://*/v1/responses*|https://*/responses*) ;;
            *) echo 'SUB2API_RESPONSES_ENDPOINT must be a full HTTPS Responses API endpoint' >&2; exit 2 ;;
          esac

      - name: Prove the selected existing validators pass before involving a model
        run: >-
          python -m pytest -q
          tests/test_external_research_identity.py
          tests/test_external_research_admission.py
          -p no:cacheprovider

      - name: Prepare deterministic validator command for Codex
        run: |
          mkdir codex-smoke
          cat > codex-smoke/run-validator.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q \
            tests/test_external_research_identity.py \
            tests/test_external_research_admission.py \
            -p no:cacheprovider \
            --junitxml=codex-smoke/junit.xml \
            > codex-smoke/pytest.txt 2>&1
          code=$?
          printf '%s\n' "$code" > codex-smoke/exit-code.txt
          cat codex-smoke/pytest.txt
          exit "$code"
          SH
          chmod +x codex-smoke/run-validator.sh

      - name: Ask Codex through Sub2API to execute the existing validators
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.SUB2API_API_KEY }}
          responses-api-endpoint: ${{ vars.SUB2API_RESPONSES_ENDPOINT }}
          model: ${{ vars.SUB2API_CODEX_MODEL }}
          codex-version: '0.153.4'
          permission-profile: ':workspace'
          output-file: codex-smoke/final-message.txt
          prompt: |
            This is a Decision Kernel compatibility smoke test only.
            Do not research any company or market. Do not use web search or network tools.
            Do not inspect environment variables, credentials, GitHub tokens, or secrets.
            Do not modify any tracked repository file and do not call GitHub write APIs.

            From the repository root, execute exactly this existing prepared command:

              bash codex-smoke/run-validator.sh

            Wait for it to finish. Do not substitute a simulated PASS and do not repair a failing test.
            In the final message, report only whether that exact command was actually executed and its exit status.

      - name: Verify Codex produced real validator evidence and changed no tracked files
        if: always()
        env:
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
        run: |
          printf 'codex_step_outcome=%s\n' "$CODEX_OUTCOME"
          test "$CODEX_OUTCOME" = success
          test -s codex-smoke/exit-code.txt
          test "$(cat codex-smoke/exit-code.txt)" = 0
          test -s codex-smoke/junit.xml
          test -s codex-smoke/pytest.txt
          grep -q '<testsuite' codex-smoke/junit.xml
          git diff --exit-code
          echo 'SUB2API_CODEX_VALIDATOR_SMOKE=PASS'

      - name: Publish bounded smoke summary
        if: always()
        env:
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          CODEX_MODEL: ${{ vars.SUB2API_CODEX_MODEL }}
        run: |
          echo '## Sub2API Codex validator smoke' >> "$GITHUB_STEP_SUMMARY"
          echo "- checkout: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Codex action outcome: $CODEX_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CODEX_MODEL" ]; then echo "- configured model: $CODEX_MODEL" >> "$GITHUB_STEP_SUMMARY"; else echo '- configured model: provider/default' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f codex-smoke/exit-code.txt ]; then echo "- validator exit: $(cat codex-smoke/exit-code.txt)" >> "$GITHUB_STEP_SUMMARY"; else echo '- validator exit: NOT_RECORDED' >> "$GITHUB_STEP_SUMMARY"; fi
          if grep -q 'SUB2API_CODEX_VALIDATOR_SMOKE=PASS' "$GITHUB_STEP_SUMMARY" 2>/dev/null; then :; fi
          echo '- Research/HiThink/Odds/Action: NOT_RUN' >> "$GITHUB_STEP_SUMMARY"
          echo '- repository write permission: contents:read only' >> "$GITHUB_STEP_SUMMARY"
