name: radar-reuse-probe-20260920

on:
  push:
    branches: [probe/news-industry-reuse-20260920]

permissions:
  contents: read

jobs:
  news-reuse-probe:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing feed dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Probe external finance news sources once
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python eval/news_radar_reuse_probe.py --output "$RUNNER_TEMP/news-probe"
          test -s "$RUNNER_TEMP/news-probe/summary.json"
          test -s "$RUNNER_TEMP/news-probe/attempts.json"
          test -s "$RUNNER_TEMP/news-probe/news-observations.json"
      - name: Retain news source receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-radar-reuse-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/news-probe/
          if-no-files-found: warn
          retention-days: 30

  industry-reuse-probe:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      HITHINK_SECTOR_REQUEST_PACING: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install current package and shadow changepoint dependency
        run: python -m pip install -e . 'ruptures==1.1.10'
      - name: Probe LC CU RB through existing HiThink transport
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$HITHINK_FINANCE_API_KEY"
          python eval/industry_inflection_reuse_probe.py --output "$RUNNER_TEMP/industry-probe"
          test -s "$RUNNER_TEMP/industry-probe/summary.json"
          test -s "$RUNNER_TEMP/industry-probe/requests.json"
          test -s "$RUNNER_TEMP/industry-probe/industry-observations.json"
      - name: Retain industry source receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industry-inflection-reuse-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/industry-probe/
          if-no-files-found: warn
          retention-days: 30
