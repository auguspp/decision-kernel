name: _tmp-p0-research-work-review

on:
  push:
    branches:
      - feat/p0-research-work-reading-20260912

permissions:
  contents: write

jobs:
  apply-review-fix:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.event.head_commit.message == 'construction: run bounded Research reading review fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p0-research-work-reading-20260912
          fetch-depth: 0
      - name: Apply deterministic review correction
        shell: bash
        run: |
          set -euo pipefail
          python construction/fix_p0_research_work_review.py
          expected=$'src/decision_kernel/runtime/current_state_delivery.py\ntests/test_current_state_research_work_read.py'
          actual="$({ git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^construction/' | grep -v '^.github/workflows/_tmp-' | sort)"
          test "$actual" = "$expected"
          git diff --check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install exact repository dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused reader and existing regressions
        run: >-
          python -m pytest -q
          tests/test_current_state.py
          tests/test_current_state_delivery.py
          tests/test_current_state_isolation.py
          tests/test_incremental_disclosure.py
          tests/test_incremental_disclosure_intake.py
          tests/test_external_research_identity.py
          tests/test_current_state_research_work_read.py
      - name: Commit only review correction and regressions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/decision_kernel/runtime/current_state_delivery.py tests/test_current_state_research_work_read.py
          test "$(git diff --cached --name-only | sort)" = $'src/decision_kernel/runtime/current_state_delivery.py\ntests/test_current_state_research_work_read.py'
          git commit -m 'P0: keep optional Research reading inside base publication budget'
          git push origin HEAD:refs/heads/feat/p0-research-work-reading-20260912
