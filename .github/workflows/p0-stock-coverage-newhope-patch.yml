name: p0-stock-coverage-newhope-patch

on:
  push:
    branches:
      - fix/p0-stock-business-coverage-newhope-20260912
    paths:
      - .github/workflows/p0-stock-coverage-newhope-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-stock-business-coverage-newhope-20260912
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build bounded v3 patch without market access
        run: |
          set -euo pipefail
          python .github/scripts/p0-stock-coverage-newhope-patch.py
          git diff --check
          git status --short
      - name: Commit only production coverage, tests and receipt doc
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar_inputs/economic-company-links-livestock-v3.json \
                  radar_inputs/economic-market-links-v0.json \
                  .github/scripts/capture-stock-reading.py \
                  tests/test_stock_company_coverage_v2.py \
                  tests/test_stock_company_next_batch_evidence.py \
                  tests/test_stock_company_coverage_v3.py \
                  docs/stock-company-coverage-newhope-2026-09-12.md
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'fix: add one active feed-business company to Stock coverage'
          git push origin HEAD:fix/p0-stock-business-coverage-newhope-20260912
          echo 'BOUNDED_V3_PATCH_PUSHED; no market request or workflow dispatch.' >> "$GITHUB_STEP_SUMMARY"
