name: incremental-disclosure-intake

on:
  workflow_run:
    workflows: [kernel-tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: incremental-disclosure-work-v0
  cancel-in-progress: false

jobs:
  retain-selected-packet:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Check for an explicit request change
        id: request
        shell: bash
        run: |
          set +e
          git diff --quiet HEAD^1 HEAD -- research_runs/disclosure-intake-request.json
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          if [ "$rc" -eq 1 ]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v7
        if: steps.request.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Install existing package and GitHub-read dependencies
        if: steps.request.outputs.changed == 'true'
        run: python -m pip install -e '.[feeds]'
      - name: Retain exactly one approved saved packet, never run Research
        if: steps.request.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python -m decision_kernel.runtime.incremental_disclosure_intake
          --code-commit "$TRUSTED_COMMIT"
          --output intake-receipt
      - name: Preserve intake result or partial failure
        if: always() && steps.request.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: incremental-disclosure-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: intake-receipt/
          if-no-files-found: warn
          retention-days: 14
