name: R4 corrected source-context two-arm verification
on:
  push:
    branches: [ops/r4-source-context-check-20260924]
permissions:
  contents: write
  actions: read
concurrency:
  group: r4-2-sub2api-20260923-v1
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVAL_CODE_SHA: 1667b196b2910565482927babb0c47cc79fe0259
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1667b196b2910565482927babb0c47cc79fe0259
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install unchanged execution dependencies
        run: python -m pip install -e '.[research-api,documents,feeds]'
      - name: Verify exact tested code and run only two corrected-input arms
        env:
          GH_TOKEN: ${{ github.token }}
          SUB2API_API_KEY: ${{ secrets.SUB2API_API_KEY }}
          R4_2_APPROVAL: '5804459106'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVAL_CODE_SHA"
          test -n "$SUB2API_API_KEY"
          test "$(gh api repos/auguspp/decision-kernel/actions/runs/35932717515 --jq '.status + ":" + .conclusion + ":" + .head_sha')" = "completed:success:$EVAL_CODE_SHA"
          mkdir -p "$RUNNER_TEMP/r4-source-check"
          printf 'code=%s\nevent=%s\nrun=%s\nattempt=%s\n' "$EVAL_CODE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/r4-source-check/identity.txt"
          python -m pip list --format=json > "$RUNNER_TEMP/r4-source-check/packages.json"
          python experiments/r4_2_source_context_check.py 2>&1 | tee "$RUNNER_TEMP/r4-source-check/execution.log"
      - name: Preserve diagnostics and partial results
        if: always()
        shell: bash
        run: |
          mkdir -p research_runs/evaluations/r4-2-sub2api-20260923-v1/continuations/source-context-532-v1/diagnostics
          if test -d "$RUNNER_TEMP/r4-source-check"; then cp "$RUNNER_TEMP/r4-source-check/"* research_runs/evaluations/r4-2-sub2api-20260923-v1/continuations/source-context-532-v1/diagnostics/; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-source-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: research_runs/evaluations/r4-2-sub2api-20260923-v1/continuations/source-context-532-v1/
          if-no-files-found: error
          retention-days: 30
