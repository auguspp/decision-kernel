name: stock-business-research

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      source-stock-run-id:
        description: Exact successful saved Stock reading run, never latest
        type: string
        required: false
      retain-report-source:
        description: Retain only the explicitly approved Woton H1 original PDF; no Research or model credentials
        type: boolean
        default: false
      reviewed-question:
        description: Run only the separately enabled and approved main question request; never legacy recovery
        type: boolean
        default: false
      daily-reviewed-question:
        description: Run the enabled daily reviewed-question request within its saved policy and consumption limits
        type: boolean
        default: false
      reviewed-question-continuation:
        description: One approved technical continuation of the exact consumed reviewed-question EXECUTION_GAP
        type: boolean
        default: false
      deepseek-compat:
        description: One synthetic DeepSeek V4.1 Responses compatibility call; never Research
        type: boolean
        default: false
      code-sha:
        description: Required for reviewed-question, daily-reviewed-question, question-continuation or deepseek-compat; exact reviewed main SHA
        type: string
        required: false
      recover-sources:
        description: Use the reviewed main source-recovery request; never reset first-baseline history
        type: boolean
        default: false
      prepare-sources:
        description: Only preflight the two explicitly authorized failed sources; no model or work writes
        type: boolean
        default: false
      source-successor:
        description: CONSUMED source-successor-v1; must remain false
        type: boolean
        default: false
      source-successor-continuation:
        description: Continue only the exact failed production successor children; never reopen source-successor-v1
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stock-business-first-v0
  cancel-in-progress: false

jobs:
  research-stock-business:
    if: >-
      !inputs.retain-report-source &&
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' &&
        !inputs.prepare-sources && !inputs.deepseek-compat &&
        (!inputs.daily-reviewed-question ||
         (!inputs.reviewed-question && !inputs.reviewed-question-continuation &&
          !inputs.recover-sources && !inputs.source-successor &&
          !inputs.source-successor-continuation && !inputs.source-stock-run-id &&
          inputs.code-sha == github.sha))) ||
       (github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.issue.number == 297 && !github.event.issue.pull_request &&
        github.event.sender.login == 'auguspp' &&
        (github.event.label.name == 'woton-h1-analysis-ready' ||
         github.event.label.name == 'daily-stock-question-ready')))
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing source and Research dependencies
        run: python -m pip install -e '.[documents,feeds,research-api]'
      - name: Original Stock validation, business sources, admission and Pre with necessary Quick
        if: "github.event_name == 'workflow_dispatch' && !inputs.reviewed-question && !inputs.reviewed-question-continuation && !inputs.daily-reviewed-question"
        env:
          GH_TOKEN: ${{ github.token }}
          SUB2API_API_KEY: ${{ secrets.SUB2API_API_KEY }}
          SOURCE_STOCK_RUN: ${{ inputs.source-stock-run-id }}
          RECOVER_SOURCES: ${{ inputs.recover-sources }}
          SOURCE_SUCCESSOR: ${{ inputs.source-successor }}
          SOURCE_SUCCESSOR_CONTINUATION: ${{ inputs.source-successor-continuation }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SUB2API_API_KEY"
          test -n "$SOURCE_STOCK_RUN"
          test "$SOURCE_SUCCESSOR" != true
          enabled=0
          if [ "$RECOVER_SOURCES" = true ]; then enabled=$((enabled+1)); fi
          if [ "$SOURCE_SUCCESSOR_CONTINUATION" = true ]; then enabled=$((enabled+1)); fi
          test "$enabled" -le 1
          extra=()
          if [ "$RECOVER_SOURCES" = true ]; then extra+=(--recover-sources); fi
          if [ "$SOURCE_SUCCESSOR_CONTINUATION" = true ]; then extra+=(--source-successor-continuation); fi
          python -m decision_kernel.runtime.stock_research_host \
            --source-run-id "$SOURCE_STOCK_RUN" --code-commit "$GITHUB_SHA" --output run-output "${extra[@]}"
      - name: Approved question through original admission and saved Pre with necessary Quick
        if: github.event_name == 'workflow_dispatch' && inputs.reviewed-question && !inputs.reviewed-question-continuation && !inputs.daily-reviewed-question
        env:
          GH_TOKEN: ${{ github.token }}
          SUB2API_API_KEY: ${{ secrets.SUB2API_API_KEY }}
          EXPECTED_CODE_SHA: ${{ inputs.code-sha }}
          SOURCE_STOCK_RUN: ${{ inputs.source-stock-run-id }}
          RECOVER_SOURCES: ${{ inputs.recover-sources }}
          PREPARE_SOURCES: ${{ inputs.prepare-sources }}
          SOURCE_SUCCESSOR: ${{ inputs.source-successor }}
          SOURCE_SUCCESSOR_CONTINUATION: ${{ inputs.source-successor-continuation }}
          REVIEWED_QUESTION_CONTINUATION: ${{ inputs.reviewed-question-continuation }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_CODE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          test -z "$SOURCE_STOCK_RUN"
          test "$RECOVER_SOURCES" != true
          test "$PREPARE_SOURCES" != true
          test "$SOURCE_SUCCESSOR" != true
          test "$SOURCE_SUCCESSOR_CONTINUATION" != true
          test "$REVIEWED_QUESTION_CONTINUATION" != true
          test -n "$SUB2API_API_KEY"
          python -m decision_kernel.runtime.stock_question_host \
            --code-commit "$EXPECTED_CODE_SHA" --output run-output
      - name: Approved reviewed-question technical continuation through original admission
        if: github.event_name == 'workflow_dispatch' && inputs.reviewed-question-continuation && !inputs.reviewed-question && !inputs.daily-reviewed-question
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXPECTED_CODE_SHA: ${{ inputs.code-sha }}
          SOURCE_STOCK_RUN: ${{ inputs.source-stock-run-id }}
          RECOVER_SOURCES: ${{ inputs.recover-sources }}
          PREPARE_SOURCES: ${{ inputs.prepare-sources }}
          SOURCE_SUCCESSOR: ${{ inputs.source-successor }}
          SOURCE_SUCCESSOR_CONTINUATION: ${{ inputs.source-successor-continuation }}
          DEEPSEEK_COMPAT: ${{ inputs.deepseek-compat }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_CODE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          test -z "$SOURCE_STOCK_RUN"
          test "$RECOVER_SOURCES" != true
          test "$PREPARE_SOURCES" != true
          test "$SOURCE_SUCCESSOR" != true
          test "$SOURCE_SUCCESSOR_CONTINUATION" != true
          test "$DEEPSEEK_COMPAT" != true
          test -n "$DEEPSEEK_API_KEY"
          python -m decision_kernel.runtime.stock_question_continuation \
            --code-commit "$EXPECTED_CODE_SHA" --output run-output
      - name: Daily reviewed question through saved policy and original admission
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.daily-reviewed-question) ||
          (github.event_name == 'issues' && github.event.label.name == 'daily-stock-question-ready')
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXPECTED_CODE_SHA: ${{ inputs.code-sha || github.sha }}
          DAILY_EVENT_ACTION: ${{ github.event.action }}
          DAILY_ISSUE_NUMBER: ${{ github.event.issue.number }}
          DAILY_LABEL: ${{ github.event.label.name }}
          DAILY_SENDER: ${{ github.event.sender.login }}
          DAILY_IS_PULL_REQUEST: ${{ toJSON(github.event.issue.pull_request != null) }}
          SOURCE_STOCK_RUN: ${{ inputs.source-stock-run-id }}
          REVIEWED_QUESTION: ${{ inputs.reviewed-question }}
          REVIEWED_QUESTION_CONTINUATION: ${{ inputs.reviewed-question-continuation }}
          RECOVER_SOURCES: ${{ inputs.recover-sources }}
          PREPARE_SOURCES: ${{ inputs.prepare-sources }}
          SOURCE_SUCCESSOR: ${{ inputs.source-successor }}
          SOURCE_SUCCESSOR_CONTINUATION: ${{ inputs.source-successor-continuation }}
          DEEPSEEK_COMPAT: ${{ inputs.deepseek-compat }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            test "$DAILY_EVENT_ACTION" = labeled
            test "$DAILY_ISSUE_NUMBER" = 297
            test "$DAILY_LABEL" = daily-stock-question-ready
            test "$DAILY_SENDER" = auguspp
            test "$DAILY_IS_PULL_REQUEST" = false
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
          fi
          test "$GITHUB_REPOSITORY" = auguspp/decision-kernel
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_CODE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          test -z "$SOURCE_STOCK_RUN"
          test "$REVIEWED_QUESTION" != true
          test "$REVIEWED_QUESTION_CONTINUATION" != true
          test "$RECOVER_SOURCES" != true
          test "$PREPARE_SOURCES" != true
          test "$SOURCE_SUCCESSOR" != true
          test "$SOURCE_SUCCESSOR_CONTINUATION" != true
          test "$DEEPSEEK_COMPAT" != true
          test -n "$DEEPSEEK_API_KEY"
          python -m decision_kernel.runtime.stock_question_host \
            --daily-reviewed-question --code-commit "$EXPECTED_CODE_SHA" --output run-output
      - name: One approved Woton same-question report continuation
        if: github.event_name == 'issues' && github.event.label.name == 'woton-h1-analysis-ready'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXPECTED_CODE_SHA: ${{ github.sha }}
          REPORT_EVENT_ACTION: ${{ github.event.action }}
          REPORT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPORT_LABEL: ${{ github.event.label.name }}
          REPORT_SENDER: ${{ github.event.sender.login }}
          REPORT_IS_PULL_REQUEST: ${{ toJSON(github.event.issue.pull_request != null) }}
        run: >-
          python -m decision_kernel.runtime.woton_report_continuation
          --code-commit "$EXPECTED_CODE_SHA" --output run-output
      - name: Preserve original sources, model outputs and partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-business-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-output/
          if-no-files-found: warn
          retention-days: 30

  deepseek-compatibility:
    if: >-
      !inputs.retain-report-source &&
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' && inputs.deepseek-compat &&
      !inputs.daily-reviewed-question &&
      !inputs.reviewed-question && !inputs.reviewed-question-continuation && !inputs.prepare-sources &&
      !inputs.recover-sources && !inputs.source-successor &&
      !inputs.source-successor-continuation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing Research API dependency
        run: python -m pip install -e '.[research-api]'
      - name: One synthetic official DeepSeek V4.1 Responses call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXPECTED_CODE_SHA: ${{ inputs.code-sha }}
          SOURCE_STOCK_RUN: ${{ inputs.source-stock-run-id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_CODE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          test -z "$SOURCE_STOCK_RUN"
          test -n "$DEEPSEEK_API_KEY"
          set +e
          python eval/deepseek_responses_probe.py --output deepseek-compat-output
          probe_status=$?
          set -e
          python eval/deepseek_responses_probe.py --output deepseek-compat-output --verify-only
          exit "$probe_status"
      - name: Retain synthetic DeepSeek compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-compat-${{ github.run_id }}-${{ github.run_attempt }}
          path: deepseek-compat-output/
          if-no-files-found: error
          retention-days: 30


  retain-public-report-source:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' && inputs.retain-report-source &&
        inputs.code-sha == github.sha && !inputs.source-stock-run-id &&
        !inputs.reviewed-question && !inputs.daily-reviewed-question &&
        !inputs.reviewed-question-continuation && !inputs.deepseek-compat &&
        !inputs.recover-sources && !inputs.prepare-sources &&
        !inputs.source-successor && !inputs.source-successor-continuation) ||
       (github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.issue.number == 297 && !github.event.issue.pull_request &&
        github.event.sender.login == 'auguspp' &&
        (github.event.label.name == 'woton-h1-source-ready' ||
         github.event.label.name == 'woton-h1-representation-ready')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing source dependencies only
        run: python -m pip install -e '.[documents,feeds]'
      - name: Retain and read back the exact public issuer report without Research
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE_SHA: ${{ inputs.code-sha || github.sha }}
          REPORT_INPUTS: ${{ toJSON(inputs) }}
          REPORT_EVENT_ACTION: ${{ github.event.action }}
          REPORT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPORT_LABEL: ${{ github.event.label.name }}
          REPORT_SENDER: ${{ github.event.sender.login }}
          REPORT_IS_PULL_REQUEST: ${{ toJSON(github.event.issue.pull_request != null) }}
        run: >-
          python -m decision_kernel.runtime.woton_report_custody
          --code-commit "$EXPECTED_CODE_SHA" --output report-source-output
      - name: Preserve original report and all partial source failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-report-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: report-source-output/
          if-no-files-found: error
          retention-days: 30

  prepare-stock-sources:
    if: >-
      !inputs.retain-report-source &&
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' && inputs.prepare-sources &&
      !inputs.daily-reviewed-question
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing source dependencies only
        run: python -m pip install -e '.[documents,feeds]'
      - name: Check full sources without Research launch or model credentials
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_STOCK_RUN: ${{ inputs.source-stock-run-id }}
          RECOVER_SOURCES: ${{ inputs.recover-sources }}
          REVIEWED_QUESTION: ${{ inputs.reviewed-question }}
          REVIEWED_QUESTION_CONTINUATION: ${{ inputs.reviewed-question-continuation }}
          SOURCE_SUCCESSOR: ${{ inputs.source-successor }}
          SOURCE_SUCCESSOR_CONTINUATION: ${{ inputs.source-successor-continuation }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SOURCE_SUCCESSOR" != true
          test "$SOURCE_SUCCESSOR_CONTINUATION" != true
          test "$REVIEWED_QUESTION" != true
          test "$REVIEWED_QUESTION_CONTINUATION" != true
          extra=()
          if [ "$RECOVER_SOURCES" = true ]; then extra+=(--recover-sources); fi
          python -m decision_kernel.runtime.stock_research_host \
            --source-run-id "$SOURCE_STOCK_RUN" --code-commit "$GITHUB_SHA" \
            --output source-output --prepare-sources "${extra[@]}"
      - name: Preserve complete source preflight and partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-source-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-output/
          if-no-files-found: warn
          retention-days: 30

  prepare-declared-report-sources:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.issue.number == 297 && !github.event.issue.pull_request &&
      github.event.sender.login == 'auguspp' &&
      github.event.label.name == 'declared-report-sources-ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing report source dependencies
        run: python -m pip install -e '.[documents,feeds]'
      - name: Prepare only the exact declared public reports
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ACTION: ${{ github.event.action }}
          SOURCE_ISSUE: ${{ github.event.issue.number }}
          SOURCE_LABEL: ${{ github.event.label.name }}
          SOURCE_SENDER: ${{ github.event.sender.login }}
          SOURCE_IS_PR: ${{ toJSON(github.event.issue.pull_request != null) }}
        run: >-
          python -m decision_kernel.runtime.declared_report_sources
          --code-commit "$GITHUB_SHA" --output declared-report-output
      - name: Preserve declared report bytes and explicit source gaps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: declared-report-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: declared-report-output/
          if-no-files-found: error
          retention-days: 30
