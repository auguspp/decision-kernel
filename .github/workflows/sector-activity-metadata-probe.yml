name: sector-activity-metadata-probe
on:
  push:
    branches: [diagnostic/sector-preflight-20260925]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect five original GitHub metadata queries once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, hashlib
          from datetime import datetime, timezone
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.parse import urlencode
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise RuntimeError('REDIRECT_REFUSED')
          opener = build_opener(NoRedirect())
          for status in ('in_progress','queued','waiting','pending','requested'):
              url = 'https://api.github.com/repos/auguspp/decision-kernel/actions/runs?' + urlencode({'status':status,'per_page':100,'page':1})
              row = {'query_status':status,'requested_at':datetime.now(timezone.utc).isoformat()}
              try:
                  request = Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
                  with opener.open(request, timeout=10) as response:
                      raw = response.read(4*1024*1024+1)
                      row.update(http_status=response.status, bytes=len(raw), body_sha256=hashlib.sha256(raw).hexdigest(), next_link_present='rel="next"' in response.headers.get('Link',''), content_length=response.headers.get('Content-Length'))
                      if len(raw)>4*1024*1024:
                          raise ValueError('BODY_BOUND')
                      payload=json.loads(raw)
                      runs=payload.get('workflow_runs',[])
                      row.update(total_count=payload.get('total_count'), returned_rows=len(runs), runs=[{'id':r.get('id'),'path':r.get('path'),'status':r.get('status')} for r in runs])
              except Exception as exc:
                  row['error_type']=type(exc).__name__
              row['finished_at']=datetime.now(timezone.utc).isoformat()
              print(json.dumps(row,ensure_ascii=False))
          print('METADATA_ONLY; no market/key/provider/model/dispatch/state operation; historical failure is not rerun.')
          PY
