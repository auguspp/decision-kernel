name: sector-activity-metadata-probe
on:
  push:
    branches: [diagnostic/sector-preflight-20260925]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 80bc32656f4276265c99743db7797fcfa75fd34b
          persist-credentials: false
      - name: Validate exact reviewed metadata checker once without market access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, runpy
          from pathlib import Path
          p=Path('.github/scripts/check-sector-scheduled-activity.py')
          raw=p.read_bytes()
          assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()=='037ca31eb7f09380b3d345bd988970e3278a6185'
          m=runpy.run_path(str(p),run_name='metadata_validation')
          observations=[]
          result={'tested_code':'80bc32656f4276265c99743db7797fcfa75fd34b','source_calls':0}
          try:
              result['blockers']=m['check_activity'](m['request_reader'](os.environ['GH_TOKEN'],observations=observations))
              result['result']='NO_VISIBLE_PEER_ACTIVITY' if not result['blockers'] else 'BLOCKED_SHARED_KEY_ACTIVITY'
          except m['CheckError'] as exc:
              result['result']=str(exc)
          result['observations']=observations
          result['request_count']=len(observations)
          print(json.dumps(result,ensure_ascii=False))
          assert result['result']=='NO_VISIBLE_PEER_ACTIVITY',result['result']
          print('METADATA_RECONCILIATION_LIVE_PASS; not Sector market production or missed-session recovery.')
          PY
