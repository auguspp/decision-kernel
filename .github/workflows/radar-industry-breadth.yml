name: radar-industry-breadth

on:
  workflow_dispatch:
  workflow_run:
    workflows: [sector-radar-shadow]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: native-industry-breadth
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.path == '.github/workflows/sector-radar-shadow.yml' &&
        github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require exact independent main CI before source access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=10 > "$RUNNER_TEMP/industry-ci.json"
          python - <<'PY'
          import json, os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/industry-ci.json'))['workflow_runs']
          assert runs
          r=max(runs,key=lambda x:(x['created_at'],x['id']))
          assert r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='main'
          assert r['path']=='.github/workflows/ci.yml' and r['event']=='push'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          PY
      - name: Install existing source dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Capture one complete returned breadth snapshot
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python -m decision_kernel.runtime.industry_breadth
          --output "$RUNNER_TEMP/industry-breadth"
      - name: Retain original source attempt and explicit gaps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industry-breadth-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/industry-breadth/
          if-no-files-found: warn
          retention-days: 30

  public-context:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.path == '.github/workflows/sector-radar-shadow.yml' &&
        github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require exact independent main CI before source access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=10 > "$RUNNER_TEMP/public-ci.json"
          python - <<'PY'
          import json, os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/public-ci.json'))['workflow_runs']
          assert runs
          r=max(runs,key=lambda x:(x['created_at'],x['id']))
          assert r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='main'
          assert r['path']=='.github/workflows/ci.yml' and r['event']=='push'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          PY
      - name: Install existing source dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Capture bounded public context
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python -m decision_kernel.runtime.easy_stock_capture
          --output "$RUNNER_TEMP/easy-stock-context"
      - name: Upload public context original attempts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: easy-stock-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/easy-stock-context/
          if-no-files-found: warn
          retention-days: 30
