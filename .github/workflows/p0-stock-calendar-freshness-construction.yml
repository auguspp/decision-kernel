name: p0-stock-calendar-freshness-construction

on:
  push:
    branches: [fix/p0-stock-current-calendar-date-20260912]
    paths:
      - .github/scripts/apply-p0-stock-calendar-freshness-patch.py
      - .github/workflows/p0-stock-calendar-freshness-construction.yml

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-stock-current-calendar-date-20260912
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact calendar freshness patch
        run: python .github/scripts/apply-p0-stock-calendar-freshness-patch.py
      - name: Compile touched Python
        run: |
          python -m py_compile \
            src/decision_kernel/runtime/stock_radar_reading.py \
            .github/scripts/capture-stock-reading.py \
            tests/test_stock_reading_calendar.py
      - name: Install test environment
        run: python -m pip install -e '.[dev]'
      - name: Run focused Stock calendar and compatibility tests
        run: |
          python -m pytest -q \
            tests/test_stock_reading_calendar.py \
            tests/test_stock_market_expression.py \
            tests/test_stock_radar_reading.py \
            tests/test_stock_radar_capture.py
      - name: Commit production and test targets only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/decision_kernel/runtime/stock_radar_reading.py \
            .github/scripts/capture-stock-reading.py \
            tests/test_stock_reading_calendar.py
          git diff --cached --check
          git commit -m 'fix: qualify current non-session Stock calendars'
          git push origin HEAD:fix/p0-stock-current-calendar-date-20260912
