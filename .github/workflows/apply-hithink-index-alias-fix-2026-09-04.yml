name: apply-hithink-index-alias-fix-2026-09-04

on:
  pull_request:
    paths:
      - ".github/workflows/apply-hithink-index-alias-fix-2026-09-04.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'fix/hithink-standard-index-ticker-alias'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact bounded repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/decision_kernel/adapters/hithink_index.py")
          text = source.read_text(encoding="utf-8")
          old_constants = '_GRANULAR_INDUSTRY_THSCODE = re.compile(r"^884\\d{3}\\.TI$")\n'
          new_constants = old_constants + '_PROVIDER_INDEX_TICKER = re.compile(r"^[0-9A-Z]{6}$")\n'
          if text.count(old_constants) != 1:
              raise SystemExit("unexpected provider ticker constant anchor")
          text = text.replace(old_constants, new_constants, 1)

          old_helper_anchor = '''def normalize_hithink_index_thscode(thscode: str) -> str:
              normalized = thscode.strip().upper()
              if not _INDEX_THSCODE.fullmatch(normalized):
                  raise HithinkIndexAdapterError(
                      "HiThink index identity must be a six-digit .TI, .SH, or .SZ thscode"
                  )
              return normalized


          '''
          new_helper_anchor = '''def normalize_hithink_index_thscode(thscode: str) -> str:
              normalized = thscode.strip().upper()
              if not _INDEX_THSCODE.fullmatch(normalized):
                  raise HithinkIndexAdapterError(
                      "HiThink index identity must be a six-digit .TI, .SH, or .SZ thscode"
                  )
              return normalized


          def normalize_hithink_index_provider_ticker(
              *,
              ticker: Any,
              thscode: str,
          ) -> str:
              """Preserve provider ticker metadata without replacing exact index identity.

              Exact requested and returned ``thscode`` remains canonical. HiThink may
              return six-character aliases such as ``1B0300`` for Shanghai standard
              indices, while formal ``.TI`` industry rows retain their six-digit code.
              """

              normalized_thscode = normalize_hithink_index_thscode(thscode)
              normalized_ticker = str(ticker).strip().upper()
              if not _PROVIDER_INDEX_TICKER.fullmatch(normalized_ticker):
                  raise HithinkIndexAdapterError(
                      "HiThink index snapshot ticker metadata is invalid for "
                      f"{normalized_thscode}"
                  )
              if (
                  normalized_thscode.endswith(".TI")
                  and normalized_ticker != normalized_thscode[:6]
              ):
                  raise HithinkIndexAdapterError(
                      "HiThink industry snapshot ticker disagrees with "
                      f"{normalized_thscode}"
                  )
              return normalized_ticker


          '''
          if text.count(old_helper_anchor) != 1:
              raise SystemExit("unexpected provider ticker helper anchor")
          text = text.replace(old_helper_anchor, new_helper_anchor, 1)

          old_validation = '''        ticker = str(raw.get("ticker", "")).strip()
                  if ticker != thscode[:6]:
                      raise HithinkIndexAdapterError(
                          f"HiThink index snapshot ticker disagrees with {thscode}"
                      )

          '''
          new_validation = '''        ticker = normalize_hithink_index_provider_ticker(
                      ticker=raw.get("ticker"),
                      thscode=thscode,
                  )

          '''
          if text.count(old_validation) != 1:
              raise SystemExit("unexpected provider ticker validation anchor")
          text = text.replace(old_validation, new_validation, 1)
          source.write_text(text, encoding="utf-8")

          tests = Path("tests/test_hithink_index_adapter.py")
          text = tests.read_text(encoding="utf-8")
          insertion_anchor = '''    assert snapshot.points[0].last_price == Decimal("4548.05")
              assert snapshot.points[1].turnover == Decimal("1000")


          '''
          addition = insertion_anchor + '''def test_snapshot_preserves_standard_index_provider_ticker_aliases() -> None:
              shanghai_alias = _snapshot_row(
                  "000300.SH",
                  last="4548.05",
                  previous="4530",
              )
              shanghai_alias["ticker"] = "1b0300"
              shenzhen_index = _snapshot_row(
                  "399006.SZ",
                  last="3286.55",
                  previous="3312",
              )
              industry = _snapshot_row(
                  "881101.TI",
                  last="1847.32",
                  previous="1800",
              )

              snapshot = normalize_hithink_index_snapshot(
                  _snapshot_envelope([industry, shanghai_alias, shenzhen_index]),
                  requested_thscodes=("000300.SH", "399006.SZ", "881101.TI"),
              )

              assert [point.ticker for point in snapshot.points] == [
                  "1B0300",
                  "399006",
                  "881101",
              ]


          '''
          if text.count(insertion_anchor) != 1:
              raise SystemExit("unexpected alias test insertion anchor")
          text = text.replace(insertion_anchor, addition, 1)

          old_test = '''    bad_ticker = _snapshot_row("000300.SH", last="4548.05", previous="4530")
              bad_ticker["ticker"] = "999999"
              with pytest.raises(HithinkIndexAdapterError, match="ticker disagrees"):
                  normalize_hithink_index_snapshot(
                      _snapshot_envelope([bad_ticker]),
                      requested_thscodes=("000300.SH",),
                  )
          '''
          new_test = '''    bad_industry_ticker = _snapshot_row(
                  "881101.TI",
                  last="1847.32",
                  previous="1800",
              )
              bad_industry_ticker["ticker"] = "999999"
              with pytest.raises(
                  HithinkIndexAdapterError,
                  match="industry snapshot ticker disagrees",
              ):
                  normalize_hithink_index_snapshot(
                      _snapshot_envelope([bad_industry_ticker]),
                      requested_thscodes=("881101.TI",),
                  )

              malformed_standard_ticker = _snapshot_row(
                  "000300.SH",
                  last="4548.05",
                  previous="4530",
              )
              malformed_standard_ticker["ticker"] = "bad alias"
              with pytest.raises(
                  HithinkIndexAdapterError,
                  match="ticker metadata is invalid",
              ):
                  normalize_hithink_index_snapshot(
                      _snapshot_envelope([malformed_standard_ticker]),
                      requested_thscodes=("000300.SH",),
                  )
          '''
          if text.count(old_test) != 1:
              raise SystemExit("unexpected ticker mismatch test anchor")
          text = text.replace(old_test, new_test, 1)
          tests.write_text(text, encoding="utf-8")
          PY
      - name: Verify full repository suite
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Remove one-time workflow and publish repair
        shell: bash
        run: |
          rm .github/workflows/apply-hithink-index-alias-fix-2026-09-04.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/decision_kernel/adapters/hithink_index.py \
                  tests/test_hithink_index_adapter.py \
                  .github/workflows/apply-hithink-index-alias-fix-2026-09-04.yml
          git commit -m "fix: accept qualified standard-index ticker aliases"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
