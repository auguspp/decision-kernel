name: radar-institutional-source

on:
  workflow_dispatch:
    inputs:
      market-session:
        description: 'Explicit completed A-share session YYYY-MM-DD; no date fallback'
        required: true
        type: string
      code-sha:
        description: 'Exact reviewed current main SHA; must match checkout and event'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: radar-institutional-source
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify requested reviewed code
        env:
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          test "$EXPECTED_CODE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE"
      - name: Install existing source extras
        run: python -m pip install -e '.[feeds]'
      - name: Capture one explicit institutional source session
        id: capture
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          MARKET_SESSION: ${{ inputs.market-session }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          python -m decision_kernel.runtime.institutional_radar_capture capture \
            --market-session "$MARKET_SESSION" --expected-code "$EXPECTED_CODE" \
            --output "$RUNNER_TEMP/institutional-radar/payload"
      - name: Replay original response bytes
        if: always() && steps.capture.outcome == 'success'
        run: |
          python -m decision_kernel.runtime.institutional_radar_capture verify \
            --output "$RUNNER_TEMP/institutional-radar/payload" \
            > "$RUNNER_TEMP/institutional-radar/verification.json"
      - name: Retain exact source for offline reproduction
        if: always() && steps.capture.outcome != 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/institutional-radar"
          git archive --format=tar HEAD > "$RUNNER_TEMP/institutional-radar/implementation-source.tar"
          test "$(wc -c < "$RUNNER_TEMP/institutional-radar/implementation-source.tar")" -le 67108864
          git rev-parse HEAD > "$RUNNER_TEMP/institutional-radar/code-sha.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/institutional-radar/source-tree.txt"
          sha256sum "$RUNNER_TEMP/institutional-radar/implementation-source.tar" \
            > "$RUNNER_TEMP/institutional-radar/source-archive.sha256"
      - name: Upload source observation and explicit failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: institutional-radar-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/institutional-radar/
          if-no-files-found: warn
          retention-days: 30
      - name: Explain the observation scope
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          {
            echo '## 机构席位观察 · 独立来源入口'
            printf 'Capture step: %s\n\n' "$CAPTURE_OUTCOME"
            echo '附件内 payload/index.html 可读，capture.json 记录真实完成或失败。'
            echo '仅一个显式交易日、最多两个来源请求；无自动重试或下一批。'
            echo '不依赖行业首页或个股强势门槛；不代表 Pre/Quick 已执行。'
            echo '单日和三日榜不相加；不在榜单不等于机构没有交易。'
            echo '这是来源观察，不是完整聪明钱、概念覆盖或投资决定。'
          } >> "$GITHUB_STEP_SUMMARY"
