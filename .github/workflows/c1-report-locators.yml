name: c1-report-locators
run-name: C1 two report locators / ${{ inputs.authorization }}
on:
  workflow_dispatch:
    inputs:
      code-sha:
        description: 'Exact reviewed main with successful independent main CI'
        required: true
        type: string
      authorization:
        description: 'Original two-date plan or the single remaining native-schema query'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: radar-global-market-relay
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == 'auguspp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify reviewed main, independent CI and unused C1 request
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = c1-accelink-two-reports-20261002 || test "$AUTHORIZATION" = c1-accelink-native-schema-20261002
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE"
          test "$GITHUB_SHA" = "$EXPECTED_CODE"
          test "$(gh api repos/auguspp/decision-kernel/git/ref/heads/main --jq '.object.sha')" = "$EXPECTED_CODE"
          gh api "repos/auguspp/decision-kernel/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$EXPECTED_CODE&per_page=10" > "$RUNNER_TEMP/c1-ci.json"
          gh api --paginate --slurp "repos/auguspp/decision-kernel/actions/workflows/c1-report-locators.yml/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/c1-prior.json"
          python - <<'PY'
          import hashlib, io, json, os, subprocess, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          runs = json.loads((root/'c1-ci.json').read_bytes())['workflow_runs']
          assert runs, 'Independent main CI missing'
          r = max(runs, key=lambda x: x['run_number'])
          assert r['head_sha'] == os.environ['EXPECTED_CODE'] and r['head_branch'] == 'main'
          assert r['repository']['full_name'] == r['head_repository']['full_name'] == 'auguspp/decision-kernel'
          assert r['path'] == '.github/workflows/ci.yml' and r['event'] == 'push'
          assert r['run_attempt'] == 1 and r['status'] == 'completed' and r['conclusion'] == 'success'
          prior = [x for p in json.loads((root/'c1-prior.json').read_bytes()) for x in p['workflow_runs']
                   if str(x['id']) != os.environ['GITHUB_RUN_ID']]
          if os.environ['AUTHORIZATION'] == 'c1-accelink-two-reports-20261002':
              assert not prior, 'C1 request already invoked; preserve the original result'
          else:
              assert len(prior) == 1, 'Native successor requires the one exact prior run'
              p = prior[0]
              assert p['id'] == 36968934918 and p['run_attempt'] == 1 and p['conclusion'] == 'success'
              assert p['head_sha'] == 'c31a62bc08d543a2d5cd6e6c3a377e65f0b5b25f'
              a = json.loads(subprocess.check_output(['gh','api','repos/auguspp/decision-kernel/actions/artifacts/11210703148']))
              digest = 'e2f951b99cdd529acd3feba3fb8d736259f2bf654d84dc1e1c88efbd3031d764'
              assert not a['expired'] and a['workflow_run']['id'] == p['id']
              assert a['digest'] == 'sha256:' + digest and a['size_in_bytes'] == 2184
              raw = subprocess.check_output(['gh','api','repos/auguspp/decision-kernel/actions/artifacts/11210703148/zip'])
              assert len(raw) == 2184 and hashlib.sha256(raw).hexdigest() == digest
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  summary = json.loads(z.read('summary.json'))
                  assert summary['logical_queries_attempted'] == 1 and summary['http_receipts'] == 2
                  assert [o['status'] for o in summary['outcomes']] == ['DIRECTORY_UNQUALIFIED','NOT_ATTEMPTED_STOP']
                  body = json.loads(z.read('raw-0-2.json'))
                  assert len(body['data']['items']) == 114 and all(v == '' for row in body['data']['items'] for v in row)
          PY
      - name: Install existing dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Query two report directories with the unchanged Relay client
        id: source
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          args=()
          if [ "$AUTHORIZATION" = c1-accelink-native-schema-20261002 ]; then args+=(--native-schema); fi
          python .github/scripts/c1-report-locators.py capture --root "$RUNNER_TEMP/c1-locators" "${args[@]}"
      - name: Replay saved directory receipts without credentials
        if: always() && steps.source.outcome == 'success'
        run: python .github/scripts/c1-report-locators.py verify --root "$RUNNER_TEMP/c1-locators"
      - name: Retain complete or partial originals
        if: always() && steps.source.outcome != 'skipped' && steps.source.outcome != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: c1-report-locators-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c1-locators/
          retention-days: 30
          if-no-files-found: error
