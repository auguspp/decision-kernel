name: tdx-concept-snapshot

on:
  workflow_dispatch:
    inputs:
      market-session:
        description: Explicit completed A-share session YYYY-MM-DD; source files and last daily bar must match
        required: true
        type: string
      code-sha:
        description: Exact reviewed main commit, with successful independent main CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tdx-concept-snapshot
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require exact reviewed main and independent CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_CODE" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=10 > "$RUNNER_TEMP/tdx-concept-ci.json"
          python - <<'PY'
          import json, os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/tdx-concept-ci.json'))['workflow_runs']
          assert runs
          r=max(runs,key=lambda x:(x['created_at'],x['id']))
          assert r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='main'
          assert r['path']=='.github/workflows/ci.yml' and r['event']=='push'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          PY
      - name: Install pinned eltdx wheel and retain package identity
        run: |
          set -euo pipefail
          python -m pip install -e .
          mkdir -p "$RUNNER_TEMP/eltdx-wheel"
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            "eltdx==3.2.2" -d "$RUNNER_TEMP/eltdx-wheel"
          wheel="$(find "$RUNNER_TEMP/eltdx-wheel" -maxdepth 1 -type f -name 'eltdx-3.2.2-*.whl' -print -quit)"
          test -n "$wheel"
          test "$(find "$RUNNER_TEMP/eltdx-wheel" -maxdepth 1 -type f -name 'eltdx-3.2.2-*.whl' | wc -l)" -eq 1
          echo "ELTDX_WHEEL_SHA256=$(sha256sum "$wheel" | awk '{print $1}')" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check "$wheel"
          python - <<'PY'
          from importlib.metadata import version
          assert version('eltdx') == '3.2.2'
          PY
      - name: Capture TDX completed-session concept windows
        env:
          MARKET_SESSION: ${{ inputs.market-session }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          python -m decision_kernel.runtime.tdx_concept_snapshot capture \
            --market-session "$MARKET_SESSION" \
            --output "$RUNNER_TEMP/tdx-concept"
      - name: Replay retained source models and board files without source calls
        run: |
          python -m decision_kernel.runtime.tdx_concept_snapshot replay \
            --output "$RUNNER_TEMP/tdx-concept"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'tdx-concept'
          cap=json.loads((root/'capture.json').read_text())
          if cap['status']=='CAPTURED_TDX_CONCEPT_SNAPSHOT':
              p=json.loads((root/'observation.json').read_text())['projection']
              assert p['source_calls_during_replay']==0
              assert p['coverage']['eastmoney_required'] is False
              assert p['investment_authority']=='NONE'
          PY
      - name: Retain TDX source identity, source-native rows and explicit gaps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tdx-concept-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tdx-concept/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish scoped source summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tdx-concept/summary.md" ]; then
            cat "$RUNNER_TEMP/tdx-concept/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No retained TDX source receipt. Inspect the failed step; not no market activity.' >> "$GITHUB_STEP_SUMMARY"
          fi
