name: industry-fundamentals-probe
on:
  push:
    branches: [diagnostic/industry-fundamentals-20260925]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[feeds]'
      - name: Inspect exact upstream and bounded public responses without credentials
        run: |
          python - <<'PY'
          import ast, hashlib, json, time
          from pathlib import Path
          from datetime import datetime, timezone
          import requests
          from bs4 import BeautifulSoup
          root=Path('industrial-probe'); root.mkdir()
          session=requests.Session(); session.trust_env=False
          session.headers.update({'User-Agent':'Mozilla/5.0 DecisionKernel-public-industry','Accept-Encoding':'identity'})
          records=[]
          def read(key,url,params=None,headers=None):
              record={'id':key,'url':url,'params':params or {},'requested_at':datetime.now(timezone.utc).isoformat()}
              try:
                  with session.get(url,params=params,headers=headers,timeout=(7,12),allow_redirects=False,stream=True) as r:
                      record['http_status']=r.status_code
                      if r.status_code != 200: raise ValueError('HTTP_'+str(r.status_code))
                      parts=[]; size=0
                      for part in r.iter_content(65536):
                          size+=len(part)
                          if size>2*1024*1024: raise ValueError('BODY_LIMIT')
                          parts.append(part)
                      raw=b''.join(parts)
                  (root/(key+'.body')).write_bytes(raw)
                  record.update(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                  try: data=json.loads(raw)
                  except (ValueError,UnicodeError): data=None
                  record['kind']='JSON' if data is not None else 'HTML_OR_TEXT'
                  if isinstance(data,dict): record['top_keys']=list(data)[:15]
                  if data is not None: record['sample']=json.dumps(data,ensure_ascii=False)[:2300]
                  else:
                      soup=BeautifulSoup(raw,'html.parser')
                      for node in soup(['script','style','nav','footer']): node.decompose()
                      record['sample']=soup.get_text(' ',strip=True)[:2300]
                      record['links']=[{'text':a.get_text(' ',strip=True),'href':a.get('href')} for a in soup.find_all('a',href=True) if len(a.get_text(' ',strip=True))>15][:12]
                  record['status']='CAPTURED_NOT_YET_QUALIFIED'
              except Exception as exc:
                  record.update(status='UNAVAILABLE',error_type=type(exc).__name__)
                  if isinstance(exc,ValueError): record['error_code']=str(exc)[:60]
                  data=None
              record['received_at']=datetime.now(timezone.utc).isoformat(); records.append(record)
              print('SOURCE_PROBE='+json.dumps(record,ensure_ascii=False),flush=True)
              return data
          upstream='0191689d57c667b7c7a198fd0cf97316837ef311'
          read('akshare-macro-source',f'https://raw.githubusercontent.com/akfamily/akshare/{upstream}/akshare/economic/macro_china.py')
          tree=ast.parse((root/'akshare-macro-source.body').read_text())
          wanted={'macro_china_pmi','macro_china_gyyzj','macro_china_industrial_production_yoy','macro_china_consumer_goods_retail','macro_china_qyspjg','macro_china_lpi_index','macro_china_bdi_index','macro_china_bdti_index','macro_china_shanghai_shipping_index','macro_china_electricity','macro_china_society_electricity','macro_china_freight_index','macro_china_cpi','macro_china_ppi','macro_china_pmi_yearly','macro_china_new_financial_credit'}
          print('UPSTREAM_FUNCTIONS='+json.dumps([n.name for n in tree.body if isinstance(n,ast.FunctionDef)],ensure_ascii=False))
          count=0
          for fn in tree.body:
              if not isinstance(fn,ast.FunctionDef) or fn.name not in wanted: continue
              values={}
              for node in fn.body:
                  if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name):
                      try: values[node.targets[0].id]=ast.literal_eval(node.value)
                      except (ValueError,TypeError): pass
              print('UPSTREAM_CONTRACT='+json.dumps({'function':fn.name,'doc':ast.get_docstring(fn),'url':values.get('url'),'params':values.get('params')},ensure_ascii=False),flush=True)
              if count>=10: continue
              url=values.get('url'); params=values.get('params')
              if url=='https://datacenter-web.eastmoney.com/api/data/v1/get' and isinstance(params,dict):
                  params=dict(params,pageSize='30'); params.pop('callback',None)
                  read(fn.name,url,params); count+=1
              elif isinstance(params,dict) and 'attr_id' in params:
                  read(fn.name,'https://datacenter-api.jin10.com/reports/list_v2',params,{'x-app-id':'rU6QIu7JHe2gOUeR','x-csrf-token':'x-csrf-token','x-version':'1.0.0'}); count+=1
          read('cpca-total','http://data.cpcadata.com/api/chartlist',{'charttype':'1'})
          read('nbs-releases','https://www.stats.gov.cn/sj/zxfb/')
          read('shipping-home','https://www.sse.net.cn/home')
          read('memory-market','https://www.dramexchange.com/')
          read('trendforce-releases','https://www.trendforce.com/presscenter/news')
          endpoint='https://data.stats.gov.cn/dg/website/publicrelease/web/external/new/queryIndexTreeAsync'
          headers={'Origin':'https://data.stats.gov.cn','Referer':'https://data.stats.gov.cn/dg/website/page.html#/pc/national/monthData'}
          first=read('nbs-root',endpoint,{'pid':'','code':'1'},headers)
          if isinstance(first,dict) and isinstance(first.get('data'),list) and first['data']:
              rid=first['data'][0].get('_id')
              if isinstance(rid,str) and len(rid)<100: read('nbs-month-catalog',endpoint,{'pid':rid,'code':'1'},headers)
          (root/'probe.json').write_text(json.dumps({'upstream':upstream,'records':records,'source_truth_accepted':False,'production_writes':0,'model_calls':0},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: industry-public-probe-${{ github.run_id }}
          path: industrial-probe/
          retention-days: 14
