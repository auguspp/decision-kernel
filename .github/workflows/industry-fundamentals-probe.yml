name: industry-fundamentals-probe
on:
  push:
    branches: [diagnostic/industry-fundamentals-20260925]
    paths: [.github/workflows/industry-fundamentals-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: prep
      - uses: actions/checkout@v7
        with:
          ref: f2da085b99accb24e00cb5803a9a4467170aabb0
          persist-credentials: false
          path: repo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - working-directory: repo
        run: python -m pip install -e '.[ci-contracts,feeds]'
      - name: Verify exact original full CI identity and complete test set
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../prep/.github/scripts/verify-industrial-ci.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: industry-ci-verification-${{ github.run_id }}
          path: |
            ci-verification.json
            verified-ci.zip
          retention-days: 14
