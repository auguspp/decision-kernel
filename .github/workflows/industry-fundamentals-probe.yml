name: industry-fundamentals-probe
on:
  push:
    branches: [diagnostic/industry-fundamentals-20260925]
    paths: [.github/workflows/industry-fundamentals-probe.yml]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: prep
      - uses: actions/checkout@v7
        with:
          ref: dae7d7084ee95cc7e875a0bd520ffc8a19f00f65
          persist-credentials: false
          path: repo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare exact industrial slice
        working-directory: repo
        run: python ../prep/.github/scripts/prepare-industrial-release.py
      - name: Test public observation and original reading contracts without credentials
        working-directory: repo
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_industry_fundamentals.py tests/test_industry_breadth.py tests/test_industry_daily_question.py
      - name: Replay real retained provider responses and official release discovery
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import requests
          from decision_kernel.runtime.current_state_delivery import GitHubAPI
          from decision_kernel.runtime.current_state import unpack_archive
          from decision_kernel.runtime import industry_fundamentals as s
          api=GitHubAPI(os.environ['GH_TOKEN'])
          sources={}
          for aid,rid in ((10869756298,36146335949),(10869806946,36147004078)):
              a=api.get('actions/artifacts/'+str(aid)); r=api.get('actions/runs/'+str(rid))
              sources[aid]=unpack_archive(api.archive(a),a,r)
          first,second=sources[10869756298],sources[10869806946]
          outcomes=[]
          for family,name in (('cpca','cpca-total.body'),('logistics','macro_china_lpi_index.body'),('tanker','macro_china_bdti_index.body'),('ppi','macro_china_ppi.body'),('memory','memory-market.body')):
              try:
                  raw=first[name]
                  result,ctx=(s.cars(raw) if family=='cpca' else s.memory(raw) if family=='memory' else s.eastmoney(family,raw))
                  outcomes.append({'family':family,'status':'REPLAYED','series':len(result),'sample':[{'label':x['label'],'latest':x['latest'],'unit':x['unit']} for x in result[:3]]})
              except Exception as e:
                  outcomes.append({'family':family,'status':'REJECTED','error':type(e).__name__+':'+str(e)})
          for record in json.loads(second['probe.json']):
              if '1965308.html' not in record['url'] and '1965403.html' not in record['url']: continue
              family='nbs-industry' if '1965308' in record['url'] else 'nbs-goods'
              title='2026年8月份规模以上工业增加值增长5.2%' if family=='nbs-industry' else '2026年9月中旬流通领域重要生产资料市场价格变动情况'
              try:
                  result,ctx=s.official(family,second[record['id']+'.body'],title)
                  outcomes.append({'family':family,'status':'REPLAYED','series':len(result),'sample':[{'label':x['label'],'latest':x['latest'],'unit':x['unit']} for x in result[:3]]})
              except Exception as e:
                  outcomes.append({'family':family,'status':'REJECTED','error':type(e).__name__+':'+str(e)})
          session=requests.Session(); session.trust_env=False
          links={}
          for i,url in enumerate((s.NBS,s.NBS+'index_1.html',s.NBS+'index_2.html')):
              raw=first['nbs-releases.body'] if i==0 else session.get(url,timeout=12).content
              for family,items in s.catalog(raw,url).items(): links.setdefault(family,[]).extend(items)
          print('ACTUAL_DISCOVERY='+json.dumps({k:sorted(set(v),reverse=True)[:2] for k,v in links.items()},ensure_ascii=False),flush=True)
          for family in ('nbs-pmi','nbs-profit','nbs-energy'):
              options=sorted(set(links.get(family,[])),reverse=True)
              if not options:
                  outcomes.append({'family':family,'status':'CATALOG_GAP'}); continue
              url,title=options[0]; s.allowed_url(url)
              raw=session.get(url,timeout=12).content
              try:
                  result,ctx=s.official(family,raw,title)
                  outcomes.append({'family':family,'status':'REPLAYED','series':len(result),'sample':[{'label':x['label'],'latest':x['latest'],'unit':x['unit']} for x in result[:4]]})
              except Exception as e:
                  outcomes.append({'family':family,'status':'REJECTED','error':type(e).__name__+':'+str(e)})
          print('ACTUAL_INDUSTRY_NORMALIZATION='+json.dumps(outcomes,ensure_ascii=False),flush=True)
          Path('../qualification.json').write_text(json.dumps(outcomes,ensure_ascii=False,indent=2))
          assert all(x['status']=='REPLAYED' for x in outcomes), outcomes
          PY
      - name: Store tested implementation blobs only
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          paths=['src/decision_kernel/runtime/industry_fundamentals.py','src/decision_kernel/runtime/industry_fundamentals_reading.py','src/decision_kernel/runtime/current_state_delivery_with_odds_watch.py','.github/workflows/radar-industry-breadth.yml','tests/test_industry_fundamentals.py','docs/industry-fundamentals-v1.md']
          entries=[]
          for path in paths:
              raw=Path(path).read_bytes()
              result=subprocess.run(['gh','api','--method','POST','repos/auguspp/decision-kernel/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}),text=True,capture_output=True,check=True)
              sha=json.loads(result.stdout)['sha']
              assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          print('INDUSTRY_TREE_ENTRIES='+json.dumps(entries))
          subprocess.run(['git','add','--',*paths],check=True)
          Path('../industry.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: industry-preparation-${{ github.run_id }}
          path: |
            qualification.json
            industry.patch
          retention-days: 14
