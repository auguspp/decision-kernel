name: stock-field-source-study

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stock-field-source-study.yml
      - src/decision_kernel/runtime/stock_field_source_study.py

permissions:
  contents: read
  actions: read

concurrency:
  group: frozen-stock-field-source-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require reviewed main and fresh attempt
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Install existing isolated transport extra
        run: python -m pip install -e '.[dump-study]'
      - name: Restore the exact frozen comparison, not a new market download
        uses: actions/download-artifact@v8
        with:
          name: hithink-stock-dump-trial-33959190974-1
          path: frozen-stock-comparison
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33959190974
      - name: Record source and workflow identity
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from decision_kernel.identity import canonical_hash, canonical_json
          root = Path("stock-field-source-study")
          root.mkdir(exist_ok=False)
          value = {key: os.environ[key] for key in (
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_EVENT_NAME"
          )}
          value.update(source_run_id=33959190974, source_artifact_id=9967375391,
                       study_profile="coverage-notices",
                       semantics="FROZEN_CASE_SOURCE_STUDY_NOT_MARKET_PRODUCTION")
          value["provenance_hash"] = canonical_hash(value)
          (root / "workflow.json").write_text(canonical_json(value) + "\n", encoding="utf-8")
          (root / "source-offline-inspection.json").write_bytes(
              Path("frozen-stock-comparison/offline-inspection.json").read_bytes())
          PY
      - name: Collect targeted public coverage notices once
        run: |
          python -m decision_kernel.runtime.stock_field_source_study \
            --profile coverage-notices \
            --frozen frozen-stock-comparison --output stock-field-source-study/capture
      - name: Verify retained evidence offline even when collection is incomplete
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from decision_kernel.identity import canonical_hash
          from decision_kernel.runtime.stock_field_source_study import build_plan
          root = Path("stock-field-source-study/capture")
          if not (root / "report.json").is_file():
              raise SystemExit("No sealed collection report; inspect failed steps.")
          report = json.loads((root / "report.json").read_text())
          claimed = report.pop("study_hash")
          assert canonical_hash(report) == claimed
          plan = json.loads((root / "plan.json").read_text())
          source = json.loads(Path("stock-field-source-study/source-offline-inspection.json").read_text())
          assert build_plan(source, profile="coverage-notices") == plan
          assert plan["plan_hash"] == report["plan_hash"]
          assert plan["provider_requests"] == []
          assert report["study_profile"] == "coverage-notices"
          expected = {"plan.json", "report.json", "summary.md"}
          for item in report["files"]:
              raw = (root / item["name"]).read_bytes()
              assert len(raw) == item["bytes"]
              assert hashlib.sha256(raw).hexdigest() == item["sha256"]
              expected.add(item["name"])
          assert {p.name for p in root.iterdir()} == expected
          assert report["production_qualification"] == "NOT_ESTABLISHED"
          assert report["market_state_writes"] == report["events_created"] == 0
          print("Source plan and all retained bytes verified; this is not price acceptance.")
          PY
      - name: Retain complete study evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v7
        with:
          name: stock-field-source-study-${{ github.run_id }}-${{ github.run_attempt }}
          path: stock-field-source-study/
          if-no-files-found: error
          retention-days: 90
      - name: Publish isolated result
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          if [ -f stock-field-source-study/capture/summary.md ]; then
            cat stock-field-source-study/capture/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No sealed result; source collection has not been proved.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[原始来源与冻结差异](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
