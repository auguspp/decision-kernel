name: sector-public-history-probe

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sector-public-history-probe-20260911
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require reviewed main and fresh one-shot attempt
        run: |
          test "$GITHUB_REPOSITORY" = auguspp/decision-kernel
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
      - name: Install pinned AKShare probe dependency only
        run: |
          python -m pip install 'git+https://github.com/akfamily/akshare.git@8e95744b79ae22326308ccd2b4e62650c5b53c55'
      - name: Bind exact failed-recovery artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10187281705" > "$RUNNER_TEMP/source-artifact.json"
          jq -e '
            .id == 10187281705 and
            .name == "sector-recovery-34566950303-1" and
            .size_in_bytes == 520455 and
            .digest == "sha256:aedf5fc5507fa33c00f316be72c14b50962486961ba7199e097d2628205dc60b"
          ' "$RUNNER_TEMP/source-artifact.json" >/dev/null
      - name: Download exact retained HiThink originals
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 10187281705
          run-id: 34566950303
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/sector-recovery-source
      - name: Capture five exact public THS histories and compare
        id: capture
        run: |
          python .github/scripts/probe-sector-public-history.py capture \
            --source-root "$RUNNER_TEMP/sector-recovery-source" \
            --output-root "$RUNNER_TEMP/sector-public-probe"
      - name: Rebuild any complete comparison offline from retained bytes
        id: verify
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sector-public-probe/report.json" ] && \
             [ -f "$RUNNER_TEMP/sector-public-probe/public-ths-normalized.json" ] && \
             [ "$(jq -r .status "$RUNNER_TEMP/sector-public-probe/report.json")" != FAILED_CLOSED ]; then
            python .github/scripts/probe-sector-public-history.py verify \
              --source-root "$RUNNER_TEMP/sector-recovery-source" \
              --output-root "$RUNNER_TEMP/sector-public-probe"
          else
            echo 'Offline rebuild not applicable to an incomplete capture.'
          fi
      - name: Retain raw public bytes and comparison even on failure
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-public-history-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sector-public-probe/
          if-no-files-found: warn
          retention-days: 90
      - name: Publish bounded probe result
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          summary="$RUNNER_TEMP/sector-public-probe/summary.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; else echo 'Probe did not seal a report; inspect failed step. No production authority.' >> "$GITHUB_STEP_SUMMARY"; fi
          printf '\nCapture: %s; offline verify: %s\n' "$CAPTURE_OUTCOME" "$VERIFY_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ARTIFACT_URL" ]; then printf '\n[Raw public bytes and exact comparison](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'This probe never writes Sector state/cache/events and carries no Research or investment authority.' >> "$GITHUB_STEP_SUMMARY"
