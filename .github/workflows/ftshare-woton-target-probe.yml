name: ftshare-woton-target-probe

on:
  push:
    branches:
      - probe/ftshare-20260921

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Probe exact Woton 2026H1 target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ftshare-target-probe
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          OUT=Path("ftshare-target-probe")
          KEY=os.environ.get("FTSHARE_API_KEY","")
          BASE="https://market.ft.tech/gateway"
          TARGET={
            "announcement_id":"1225486931",
            "url_hash":"56e1b13cedf3097efc22b6511b1772ec5b1e63bbbdf16189f95749eb9ed48924",
            "known_bytes":1262185,
            "known_sha256":"27c74e31c8aaf5a38d27b688f0841d81797816420b591647bfb6763e485b7728",
          }
          report={"key_present":bool(KEY),"target":TARGET,"requests":[]}

          def req(url, label, binary=False):
              headers={"Accept":"*/*","User-Agent":"decision-kernel-ftshare-target-probe/0"}
              if KEY:
                  headers["FTSHARE_API_KEY"]=KEY
                  headers["Content-Type"]="application/json"
                  headers["X-Client-Name"]="decision-kernel-probe"
              item={"label":label,"url":url}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method="GET"),timeout=30) as r:
                      body=r.read()
                      item.update(http_status=r.status,bytes=len(body),
                                  content_type=r.headers.get("Content-Type"),
                                  sha256=hashlib.sha256(body).hexdigest())
                  if binary:
                      item["pdf_magic"]=body.startswith(b"%PDF")
                      item["matches_known_bytes"]=len(body)==TARGET["known_bytes"]
                      item["matches_known_sha256"]=hashlib.sha256(body).hexdigest()==TARGET["known_sha256"]
                      if item["pdf_magic"]:
                          (OUT/"woton-2026h1.pdf").write_bytes(body)
                  else:
                      try:
                          data=json.loads(body.decode("utf-8"))
                          item["json"]=data
                      except Exception as e:
                          item["decode_error"]=type(e).__name__
              except urllib.error.HTTPError as e:
                  body=e.read()
                  item.update(http_status=e.code,bytes=len(body),
                              content_type=e.headers.get("Content-Type") if e.headers else None,
                              sha256=hashlib.sha256(body).hexdigest())
                  try:
                      item["error_json"]=json.loads(body.decode("utf-8"))
                  except Exception:
                      item["error_preview"]=body[:300].decode("utf-8","replace")
              except Exception as e:
                  item.update(error_type=type(e).__name__,error=str(e)[:240])
              report["requests"].append(item)
              return item

          q=urllib.parse.urlencode({"stock_code":"000920.SZ","type":"stock","page":1,"page_size":200})
          req(BASE+"/api/v2/market/data/announcements/stock-announcements?"+q,
              "stock-announcements-keyed")

          q=urllib.parse.urlencode({"announcement_id":TARGET["announcement_id"]})
          req(BASE+"/api/v2/market/data/report-announcements/summary?"+q,
              "report-announcement-summary-keyed")

          # Exact target file routes suggested by current API families.
          h=TARGET["url_hash"]
          for url in [
              BASE+"/api/v2/market/data/announcements/stock-announcements/"+h,
              BASE+"/api/v1/market/data/announcements/stock-announcements/"+h,
              BASE+"/api/v2/market/data/report-announcements/"+h,
              BASE+"/api/v1/market/data/report-announcements/"+h,
          ]:
              item=req(url,"woton-target-pdf",binary=True)
              if item.get("pdf_magic"):
                  break

          # A few structured-data endpoints useful to Kernel; keep response content bounded.
          for label,url in [
              ("cashflow-stock-code",BASE+"/api/v2/market/data/finance/cashflow-stock-code?"+urllib.parse.urlencode({"stock_code":"000920","stock_name":1})),
              ("stock-holder-nums",BASE+"/api/v1/market/data/holder/stock-holder-nums?"+urllib.parse.urlencode({"stock_code":"000920.SZ"})),
              ("stock-capital-flows",BASE+"/api/v1/market/data/stock-capital-flows?"+urllib.parse.urlencode({"date":"20260918","time":"1530","symbol":"000920.SZ","page":1,"page_size":5})),
          ]:
              item=req(url,label)
              data=item.pop("json",None)
              if isinstance(data,dict):
                  item["json_summary"]={
                      "code":data.get("code"),
                      "message":data.get("message"),
                      "data_type":type(data.get("data")).__name__,
                      "data_len":len(data.get("data")) if isinstance(data.get("data"),list) else None,
                  }

          # Do not persist secret or raw large JSON from stock-announcements.
          for item in report["requests"]:
              if "json" in item:
                  data=item.pop("json")
                  if isinstance(data,dict):
                      item["json_summary"]={
                          "code":data.get("code"),
                          "message":data.get("message"),
                          "data_type":type(data.get("data")).__name__,
                      }
          raw=json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)
          if KEY:
              raw=raw.replace(KEY,"[REDACTED]")
          (OUT/"report.json").write_text(raw+"\n",encoding="utf-8")
          print(raw)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ftshare-woton-target-probe
          path: ftshare-target-probe/
          if-no-files-found: error
          retention-days: 7
