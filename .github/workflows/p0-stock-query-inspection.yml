name: p0-stock-query-inspection
on:
  push:
    branches: [fix/p0-stock-latest-attempt-scope-20260912]
    paths: [.github/workflows/p0-stock-query-inspection.yml]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/fix/p0-stock-latest-attempt-scope-20260912' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact source patch, not a new collector
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object src/decision_kernel/runtime/current_state_delivery.py)" = '72567ea015711ad8a5c5ebc185434e63b319bd57'
          test "$(git hash-object tests/test_current_state_stock_query_scope.py)" = 'e388e3c0429294747d3ea34d0f8de50495ef2cf9'
          python - <<'PY'
          from pathlib import Path
          p = Path('src/decision_kernel/runtime/current_state_delivery.py')
          source = p.read_text()
          old = '''        stock, complete = [], True
                  for run in candidates:
                      jobs = self.api.get(f"actions/runs/{run['id']}/jobs?per_page=100")'''
          old = old.replace('\n        ', '\n')
          new = '''        stock, complete = [], True
                  for run in candidates:
                      # Match select_runs' existing production-trigger scope before checking
                      # purpose. Historical push-only trials cannot make production unknown.
                      if run.get("event") not in {"schedule", "workflow_dispatch"}:
                          continue
                      jobs = self.api.get(f"actions/runs/{run['id']}/jobs?per_page=100")'''
          new = new.replace('\n        ', '\n')
          assert source.count(old) == 1
          p.write_text(source.replace(old, new))
          PY
          test "$(git hash-object src/decision_kernel/runtime/current_state_delivery.py)" = '11e3e69b31bb33043e80a16a2f3342574445b3aa'
      - name: Install exact repository test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused offline regressions
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_current_state_stock_query_scope.py tests/test_current_state.py tests/test_current_state_delivery.py tests/test_current_state_stock_completion.py tests/test_inbox_partial_delivery.py | tee "$RUNNER_TEMP/stock-query-focused.log"
      - name: Commit only the verified production target to this branch
        run: |
          set -euo pipefail
          branch='fix/p0-stock-latest-attempt-scope-20260912'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          test "$(git diff --name-only)" = 'src/decision_kernel/runtime/current_state_delivery.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/decision_kernel/runtime/current_state_delivery.py
          git commit -m 'fix: scope Stock completeness to existing production triggers'
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stock-query-focused-${{ github.run_id }}
          path: ${{ runner.temp }}/stock-query-focused.log
          retention-days: 14
          if-no-files-found: warn
