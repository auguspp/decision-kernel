name: kernel-tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

# Only obsolete heads of the SAME PR supersede one another.
# Independent main runs keep their own identity, including queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml
  contracts-v2:
    needs: prepare
    if: needs.prepare.outputs.scope == 'full'
    uses: ./.github/workflows/ci-contracts-v2.yml
  remaining-v2:
    needs: prepare
    if: needs.prepare.outputs.scope == 'full'
    uses: ./.github/workflows/ci-full-v2.yml
  test:
    needs: [prepare, contracts-v2, remaining-v2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        if: needs.prepare.outputs.scope == 'full'
        with:
          extras: ci-contracts
      - name: Verify required jobs and their complete execution
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-matrix.py finalize --report-dir "$RUNNER_TEMP/kernel-ci"
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-ci/
          if-no-files-found: warn
          retention-days: 30
