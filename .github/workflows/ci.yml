name: kernel-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# Only obsolete heads of the SAME PR supersede one another.
# Main uses a unique group: even queued independent main runs must survive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Select full or narrowly qualified content validation
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-content-scope.py select --report-dir "$RUNNER_TEMP/kernel-ci"
      - uses: actions/setup-python@v7
        if: steps.scope.outputs.scope != 'content'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        if: steps.scope.outputs.scope != 'content'
        run: python -m pip install -e '.[dev]'
      - name: Record exact code and environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_CODE_SHA"
          CI_REPORT_DIR="$RUNNER_TEMP/kernel-ci"
          printf 'CI_REPORT_DIR=%s\n' "$CI_REPORT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CI_REPORT_DIR"
          printf 'code_sha=%s\nevent_sha=%s\nevent=%s\nrun_id=%s\nattempt=%s\n' \
            "$CI_CODE_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            | tee "$CI_REPORT_DIR/identity.txt"
          python --version > "$CI_REPORT_DIR/python.txt"
          getconf _NPROCESSORS_ONLN > "$CI_REPORT_DIR/cpu-count.txt"
          python -m pip list --format=json > "$CI_REPORT_DIR/packages.json"
      - name: Validate content without installing the engineering environment
        if: steps.scope.outputs.scope == 'content'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_ci_content_scope.py 2>&1 | tee "$CI_REPORT_DIR/content-tests.log"
          python3 .github/scripts/ci-content-scope.py check --report-dir "$CI_REPORT_DIR" 2>&1 | tee "$CI_REPORT_DIR/content-check.log"
      - name: Record full test collection
        if: steps.scope.outputs.scope != 'content'
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q > "$CI_REPORT_DIR/collection.txt"
      - name: Test
        if: steps.scope.outputs.scope != 'content'
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -n 4 --dist=loadfile --max-worker-restart=0 \
            -o faulthandler_timeout=60 -o faulthandler_exit_on_timeout=true \
            --durations=100 --durations-min=1.0 \
            --junitxml="$CI_REPORT_DIR/pytest.xml" 2>&1 | tee "$CI_REPORT_DIR/pytest.log"
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-ci/
          if-no-files-found: warn
          retention-days: 30
