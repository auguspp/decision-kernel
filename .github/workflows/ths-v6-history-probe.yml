name: ths-v6-history-probe

on:
  push:
    branches:
      - probe/ths-v6-884075-20260911

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install fixed AKShare commit only for THS cookie helper
        run: |
          python -m pip install --disable-pip-version-check \
            'git+https://github.com/akfamily/akshare.git@8e95744b79ae22326308ccd2b4e62650c5b53c55'
      - name: Download frozen failed-recovery evidence
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10187281705'
          run-id: '34566950303'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/source
      - name: Probe known 884002 and stubborn 884075 over THS v6
        id: probe
        continue-on-error: true
        run: |
          python .github/scripts/probe-ths-v6-history.py \
            "$RUNNER_TEMP/source" "$RUNNER_TEMP/v6-probe"
      - name: Retain raw and comparison receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ths-v6-history-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/v6-probe/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Enforce probe
        if: always()
        env:
          OUTCOME: ${{ steps.probe.outcome }}
        run: test "$OUTCOME" = success
