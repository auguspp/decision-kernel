name: sector-member-reading

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hithink-stock-dump-qualification
  cancel-in-progress: false

jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing readers
        run: python -m pip install -e '.[feeds,discovery]'
      - name: Bind one manual request and check active shared-key work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = auguspp/decision-kernel
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          root="$RUNNER_TEMP/sector-member-reading"
          mkdir "$root"
          cp radar_inputs/sector-member-reading-v0.json "$root/request.json"
          for state in in_progress queued waiting pending requested; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$state&per_page=100" > "$root/active-$state.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'sector-member-reading'
          relevant = {'sector-radar-shadow.yml', 'decision-inbox.yml', 'hithink-stock-dump-trial.yml', 'sector-member-reading.yml'}
          for p in root.glob('active-*.json'):
              data = json.loads(p.read_text())
              assert data['total_count'] == len(data['workflow_runs']), 'active-run read incomplete'
              for r in data['workflow_runs']:
                  assert r['id'] == int(os.environ['GITHUB_RUN_ID']) or r['path'].split('/')[-1] not in relevant, 'active shared-key workflow; stop without retry'
          identity = {k: os.environ[k] for k in ('GITHUB_REPOSITORY','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_EVENT_NAME')}
          (root/'workflow.json').write_text(json.dumps(identity, indent=2)+'\n')
          PY
      - name: Download the pinned old Sector archive only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/sector-member-reading"
          run=$(python -c "import json;print(json.load(open('$root/request.json'))['source']['run_id'])")
          artifact=$(python -c "import json;print(json.load(open('$root/request.json'))['source']['artifact_id'])")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$root/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$root/source-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$root/source.zip"
          python -m decision_kernel.runtime.sector_member_reading prepare --root "$root"
      - name: Capture four bounded history and action responses
        id: capture
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python -m decision_kernel.runtime.sector_member_reading capture --root "$RUNNER_TEMP/sector-member-reading"
      - name: Repeat calculations without credentials or network requests
        if: steps.capture.outcome == 'success'
        env:
          HITHINK_FINANCE_API_KEY: ''
        run: python -m decision_kernel.runtime.sector_member_reading verify --root "$RUNNER_TEMP/sector-member-reading"
      - name: Retain results and partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-member-reading-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sector-member-reading/
          retention-days: 90
          if-no-files-found: error
      - name: Publish readable result
        if: always()
        run: |
          summary="$RUNNER_TEMP/sector-member-reading/capture/summary.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; else echo '成员比较未完成；查看本次明确失败及已保存材料，不是成功零匹配。' >> "$GITHUB_STEP_SUMMARY"; fi
