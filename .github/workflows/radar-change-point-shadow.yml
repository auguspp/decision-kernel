name: radar-change-point-shadow

on:
  pull_request:
    paths:
      - '.github/workflows/radar-change-point-shadow.yml'

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install experiment wheel
        run: |
          python -m pip install -e .
          python -m pip install 'ruptures==1.1.10'
      - name: Run sector/theme change-point shadow
        run: |
          python - <<'PY'
          from __future__ import annotations

          import math
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import numpy as np
          import ruptures as rpt

          from decision_kernel.adapters.hithink import (
              latest_completed_a_share_session,
              normalize_hithink_calendar,
          )
          from decision_kernel.runtime.hithink_http import _request_hithink_json

          api_key = os.environ.get('HITHINK_FINANCE_API_KEY')
          if not api_key:
              raise SystemExit('HITHINK_FINANCE_API_KEY is required')

          tz = ZoneInfo('Asia/Shanghai')
          now = datetime.now(tz)
          request_count = 0

          def get(path: str, params: dict[str, str]):
              global request_count
              if request_count:
                  # Experiment-local fixed pacing only; this is not a retry/runtime policy.
                  time.sleep(3.0)
              payload = _request_hithink_json(
                  api_key=api_key,
                  path=path,
                  params=params,
                  timeout_seconds=20.0,
              )
              request_count += 1
              return payload

          calendar = normalize_hithink_calendar(
              get('/api/a-share/calendar/trading-days', {})
          )
          latest = latest_completed_a_share_session(calendar, observed_at=now)
          completed = [session for session in calendar if session <= latest]
          sessions = completed[-180:]
          if len(sessions) < 120:
              raise SystemExit('not enough completed sessions for shadow experiment')

          start_ms = int(
              datetime.combine(sessions[0], datetime.min.time(), tzinfo=tz).timestamp() * 1000
          )
          end_ms = int(
              datetime.combine(latest, datetime.min.time(), tzinfo=tz).timestamp() * 1000
          )

          def catalog(tag: str):
              envelope = get('/api/a-share-index/catalog/ths-index-list', {'tag': tag})
              if envelope.get('code') != 0:
                  raise RuntimeError(f'catalog {tag} business failure: {envelope.get("code")}')
              rows = envelope.get('data', {}).get('item')
              if not isinstance(rows, list):
                  raise RuntimeError(f'catalog {tag} has no item list')
              return {
                  str(row.get('thscode') or '').strip().upper(): str(row.get('name') or '').strip()
                  for row in rows
              }

          industry = catalog('industry')
          concept = catalog('cn_concept')
          targets = (
              ('INDUSTRY', '881105.TI', '煤炭开采加工'),
              ('INDUSTRY', '881101.TI', '种植业与林业'),
              ('CONCEPT', '885927.TI', 'CRO概念'),
          )
          for kind, thscode, expected_name in targets:
              actual = industry.get(thscode) if kind == 'INDUSTRY' else concept.get(thscode)
              if actual != expected_name:
                  raise RuntimeError(
                      f'HiThink board identity changed for {thscode}: expected={expected_name!r} actual={actual!r}'
                  )

          print(f'LATEST_COMPLETED_SESSION={latest}')
          print(f'EXACT_TARGETS={targets}')

          def history(thscode: str):
              envelope = get(
                  '/api/a-share-index/prices/historical',
                  {
                      'thscode': thscode,
                      'interval': '1d',
                      'start': str(start_ms),
                      'end': str(end_ms),
                  },
              )
              if envelope.get('code') != 0:
                  raise RuntimeError(f'history {thscode} business failure: {envelope.get("code")}')
              data = envelope.get('data')
              rows = data.get('item') if isinstance(data, dict) else None
              if not isinstance(rows, list) or not rows:
                  raise RuntimeError(f'history {thscode} is empty')
              parsed = {}
              for row in rows:
                  ms = int(row['date_ms'])
                  session = datetime.fromtimestamp(ms / 1000, tz=tz).date()
                  parsed[session] = float(row['close_price'])
              return parsed

          benchmark = history('000001.SH')
          target_sessions = [session for session in sessions if session in benchmark]

          def analyze(kind: str, thscode: str, name: str):
              board = history(thscode)
              common = [session for session in target_sessions if session in board]
              if len(common) < 120:
                  raise RuntimeError(f'{name} {thscode} has only {len(common)} common sessions')

              board_close = np.array([board[session] for session in common], dtype=float)
              market_close = np.array([benchmark[session] for session in common], dtype=float)
              relative_daily = np.diff(np.log(board_close)) - np.diff(np.log(market_close))
              rolling = np.convolve(relative_daily, np.ones(5) / 5.0, mode='valid')
              dates = common[5:]
              std = float(np.std(rolling))
              if not math.isfinite(std) or std <= 0:
                  raise RuntimeError(f'{name} {thscode} has a degenerate relative-return signal')

              standardized = ((rolling - float(np.mean(rolling))) / std).reshape(-1, 1)
              n = len(standardized)
              penalties = (2.0 * math.log(n), 3.0 * math.log(n), 4.0 * math.log(n))
              print(f'\nBOARD {kind} {name} {thscode} n={n} rolling_std={std:.6f}')

              latest_breaks = []
              for penalty in penalties:
                  breaks = (
                      rpt.Pelt(model='l2', min_size=10, jump=1)
                      .fit(standardized)
                      .predict(pen=penalty)
                  )
                  internal = [index for index in breaks if index < n]
                  dated = [dates[index - 1].isoformat() for index in internal]
                  latest_index = internal[-1] if internal else None
                  latest_breaks.append(latest_index)
                  print(f'  PELT pen={penalty:.3f} breaks={dated}')

              stable = [index for index in latest_breaks if index is not None]
              if len(stable) == len(penalties) and max(stable) - min(stable) <= 5:
                  split = round(sum(stable) / len(stable))
                  before = standardized[max(0, split - 20):split, 0]
                  after = standardized[split:min(n, split + 20), 0]
                  shift = float(np.mean(after) - np.mean(before))
                  print(
                      f'  STABLE_LATEST_BREAK≈{dates[split - 1].isoformat()} '
                      f'local_standardized_mean_shift={shift:+.3f}'
                  )
              else:
                  print('  STABLE_LATEST_BREAK=NO')

          for target in targets:
              analyze(*target)

          print(f'\nTOTAL_HITHINK_REQUESTS={request_count}')
          PY
