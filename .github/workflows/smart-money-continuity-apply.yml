name: smart-money-continuity-apply
on:
  push:
    branches: [work/smart-money-continuity-20260926]
    paths: [.github/workflows/smart-money-continuity-apply.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: smart-money-continuity-apply
  cancel-in-progress: false
jobs:
  inspect-remaining-public-fields:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/work/smart-money-continuity-20260926' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 64f3d9619ee9ac5e5fe531766551f4060cc9872a
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[feeds]'
      - name: Read official protocol event summary and after-quarter historical form
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          from datetime import datetime,timezone
          from bs4 import BeautifulSoup
          from decision_kernel.runtime.hithink_dump_trial import _session
          from decision_kernel.runtime import smart_money_sources as s,smart_money_documents as d
          assert datetime.now(timezone.utc)<datetime(2026,9,27,tzinfo=timezone.utc)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'remaining';root.mkdir();items=[]
          def get(client,name,url,params=None,form=None):
              a={'name':name,'url':url,'params':params,'method':'POST' if form else 'GET','started':s.now()}
              try:
                  with client.request(a['method'],url,params=params,data=form,timeout=(10,25),allow_redirects=False,stream=True,headers={'Accept-Encoding':'identity','User-Agent':'Mozilla/5.0 DecisionKernel-SmartMoney/1'}) as response:
                      chunks=[];n=0
                      for chunk in response.iter_content(65536):
                          n+=len(chunk);assert n<=4*1024*1024;chunks.append(chunk)
                      body=b''.join(chunks);(root/(name+'.body')).write_bytes(body)
                      a.update(status=response.status_code,bytes=n,sha256=hashlib.sha256(body).hexdigest(),final_url=response.url,finished=s.now());items.append(a)
                      return response.status_code,body
              except Exception as exc:
                  a.update(error_type=type(exc).__name__,finished=s.now());items.append(a);return None,b''
          q=s.spec('activity','disclosures','2026-06-28','2026-09-26');q['params'].update(columns='ALL',pageSize='50')
          with _session() as client:
              status,raw=get(client,'activity-detail50',q['url'],q['params'])
              if status not in (401,403,429):
                  p=dict(q['params']);p.update(reportName='RPT_ORG_SURVEYNEW',pageSize='500',sortColumns='NOTICE_DATE,SUM,RECEIVE_START_DATE,SECURITY_CODE',sortTypes='-1,-1,-1,1',filter='(NUMBERNEW="1")(IS_SOURCE="1")(NOTICE_DATE>=\'2026-06-28\')(NOTICE_DATE<=\'2026-09-26\')')
                  get(client,'activity-events500',q['url'],p)
          with _session() as client:
              status,raw=get(client,'hkex-session-get',d.HKEX,{'t':'sh'})
              if status==200:
                  form=d.post_form(raw,'SH','2026-04-30')
                  status,result=get(client,'hkex-query-april30',d.HKEX,{'t':'sh'},form)
                  h=BeautifulSoup(result,'html.parser')
                  print('HKEX_RESULT',status,[x.get_text(' ',strip=True) for x in h.select('h2.ccass-heading')])
          (root/'manifest.json').write_text(json.dumps(items,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smart-money-remaining-${{ github.run_id }}-1
          path: ${{ runner.temp }}/remaining/
          retention-days: 30
          if-no-files-found: error
