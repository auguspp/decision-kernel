name: smart-money-continuity-apply
on:
  push:
    branches: [work/smart-money-continuity-20260926]
    paths: [.github/workflows/smart-money-continuity-apply.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: smart-money-continuity-apply
  cancel-in-progress: false
jobs:
  check-protocol-delta:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/work/smart-money-continuity-20260926' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 64f3d9619ee9ac5e5fe531766551f4060cc9872a
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply reviewed final delta and download only saved originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          from datetime import datetime,timezone
          assert datetime.now(timezone.utc)<datetime(2026,9,27,tzinfo=timezone.utc)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'checked';root.mkdir()
          b=json.loads(subprocess.check_output(['gh','api','repos/auguspp/decision-kernel/git/blobs/1c1e227d955e90a9bcfa28bd87d81b183cca25a8']))
          raw=base64.b64decode(b['content']);assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==b['sha']=='1c1e227d955e90a9bcfa28bd87d81b183cca25a8'
          # Correct the single transcribed patch hunk-count typo, then demand
          # the complete originally tested patch hash. No content drift allowed.
          old=b'@@ -91,0 +92,41 @@ def test_legacy_plan_shape_stays_legacy_and_new_watermarks_explicit():'
          assert raw.count(old)==1
          raw=raw.replace(old,old.replace(b'+92,41',b'+92,44'))
          assert len(raw)==11379 and hashlib.sha256(raw).hexdigest()=='5e2b72a9e25265ff96d1a73d926b15a325e25e77171b7ff1a0256f75b3b7daa8'
          (root/'protocol.patch').write_bytes(raw)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(root/'protocol.patch')],check=True)
          for aid,name,sha in ((10896403657,'production.zip','246843ac886cdc055ec37950f01a9dca6a6c5ee696bc1ae887ff4bc57947bc52'),(10897492295,'protocol-source.zip','46bd280bc0a45bf94505079a0806665ed7431363a0b92cdd89b507f571fb2e57')):
              raw=subprocess.check_output(['gh','api',f'repos/auguspp/decision-kernel/actions/artifacts/{aid}/zip'])
              assert hashlib.sha256(raw).hexdigest()==sha;(root/name).write_bytes(raw)
          PY
      - run: python -m pip install -e '.[dev]'
      - name: Test changed contracts with no credentials
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_smart_money*.py tests/test_institutional_radar_compat.py tests/test_radar_company_reading.py --junitxml="$RUNNER_TEMP/checked/junit.xml" | tee "$RUNNER_TEMP/checked/tests.log"
          python - <<'PY'
          import json,os,pathlib,zipfile
          from decision_kernel.runtime import smart_money_capture as c,smart_money_sources as s,smart_money_view as v,smart_money_documents as d
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'checked'
          with zipfile.ZipFile(root/'production.zip') as z:
              assert z.testzip() is None;files={i.filename:z.read(i) for i in z.infolist() if not i.is_dir()}
          m=s.decode(files['capture.json']);o=c.replay(files,m['identity'],cutoff=s.now())
          assert o['source_calls_during_replay']==0
          (root/'production-replay.json').write_bytes(s.encoded(v.summarize(o,v.history(o))))
          with zipfile.ZipFile(root/'protocol-source.zip') as z:
              assert z.testzip() is None
              req=s.spec('activity','disclosures','2026-06-28','2026-09-26');obj=s.decode(z.read('activity-events500.body'));rows,total,pages=s.page_data(obj,req)
              items=[i for n,r in enumerate(rows) for i in s.normalize(r,req,n,0,obj)];events=s.aggregate_activity(items)
              assert len(events)==500 and total==5586 and pages==12
              req=s.spec('north_holdings','SH@2026-03-31','2026-06-28','2026-09-26');table=d.northbound_table(z.read('hkex-query-april30.body'),req)
              assert table['period']=='2026-03-31' and table['count']==1958
          (root/'source-checks.json').write_text(json.dumps({'activity_groups':500,'source_total':5586,'pages':12,'full_roster':False,'hkex_march_sh_rows':1958,'new_source_calls':0}))
          PY
      - name: Retain verified blobs through ordinary content scope only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'checked'
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(paths)=={'docs/smart-money-continuity-live-fixes.md','src/decision_kernel/runtime/smart_money_capture.py','src/decision_kernel/runtime/smart_money_sources.py','src/decision_kernel/runtime/smart_money_view.py','tests/test_smart_money_live_regressions.py'}
          entries=[]
          for path in paths:
              data=pathlib.Path(path).read_bytes();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/auguspp/decision-kernel/git/blobs','--input','-'],input=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode()))
              assert result['sha']==sha
              entries.append({'path':path,'sha':sha,'mode':'100644','type':'blob'})
          # The previous tree request was denied; do not retry it, mutate refs,
          # escalate this token or merge. The authorized caller does normal PR work.
          (root/'blobs.json').write_text(json.dumps({'entries':entries,'tree':subprocess.check_output(['git','write-tree'],text=True).strip(),'base':'64f3d9619ee9ac5e5fe531766551f4060cc9872a'},indent=2))
          PY
      - name: Export exact tested source
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/checked"
          git archive --format=zip "$(git write-tree)" > "$RUNNER_TEMP/checked/source.zip"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smart-money-protocol-${{ github.run_id }}-1
          path: ${{ runner.temp }}/checked/
          retention-days: 30
          if-no-files-found: error
