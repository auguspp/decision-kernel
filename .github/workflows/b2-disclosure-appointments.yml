name: b2-disclosure-appointments
run-name: B2 selected securities / ${{ inputs.source-kind }} / ${{ inputs.report-period }}${{ inputs.start-date }}
on:
  workflow_dispatch:
    inputs:
      code-sha:
        description: 'Reviewed exact current main; explicit registered securities only'
        required: true
        type: string
      reference-ids:
        description: 'Comma-separated current registry IDs, one per selected security, max six'
        required: true
        type: string
      source-kind:
        description: 'One explicit source only; no automatic combined collection'
        required: true
        type: choice
        default: appointments
        options: [appointments, announcements]
      report-period:
        description: 'Appointments only: required YYYY-MM-DD quarter end'
        required: false
        type: string
      start-date:
        description: 'Announcements only: required publication window start YYYY-MM-DD'
        required: false
        type: string
      end-date:
        description: 'Announcements only: required publication window end YYYY-MM-DD'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: radar-global-market-relay
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == 'auguspp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Confirm exact current main and independent main CI before source access
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE"
          test "$GITHUB_SHA" = "$EXPECTED_CODE"
          test "$(gh api repos/auguspp/decision-kernel/git/ref/heads/main --jq '.object.sha')" = "$EXPECTED_CODE"
          test "$(git hash-object src/decision_kernel/runtime/tushare_relay.py)" = d2ee02a81648eafe7204a47e7f8e41b56c3c48fd
          gh api "repos/auguspp/decision-kernel/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$EXPECTED_CODE&per_page=10" > "$RUNNER_TEMP/b2-ci.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          runs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'b2-ci.json').read_text())['workflow_runs']
          assert runs, 'No independent main CI'
          r = max(runs, key=lambda value: value['run_number'])
          assert r['head_sha'] == os.environ['EXPECTED_CODE'] and r['head_branch'] == 'main'
          assert r['repository']['full_name'] == 'auguspp/decision-kernel'
          assert r['head_repository']['full_name'] == 'auguspp/decision-kernel'
          assert r['path'] == '.github/workflows/ci.yml' and r['event'] == 'push'
          assert r['run_attempt'] == 1 and r['status'] == 'completed' and r['conclusion'] == 'success'
          print('Exact independent main CI:', r['id'])
          PY
      - name: Install existing feed dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Capture one explicitly selected CNINFO source without credentials
        id: capture
        env:
          B2_REFERENCE_IDS: ${{ inputs.reference-ids }}
          B2_REPORT_PERIOD: ${{ inputs.report-period }}
          B2_SOURCE_KIND: ${{ inputs.source-kind }}
          B2_START_DATE: ${{ inputs.start-date }}
          B2_END_DATE: ${{ inputs.end-date }}
        run: >-
          python .github/scripts/b2-disclosure-appointments.py
          --output "$RUNNER_TEMP/b2-appointments"
          --reference-ids "$B2_REFERENCE_IDS"
          --report-period "$B2_REPORT_PERIOD"
          --source-kind "$B2_SOURCE_KIND"
          --start-date "$B2_START_DATE"
          --end-date "$B2_END_DATE"
      - name: Retain originals and partial failures
        if: always() && steps.capture.outcome != 'skipped' && steps.capture.outcome != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: b2-${{ inputs.source-kind == 'announcements' && 'announcements' || 'appointments' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b2-appointments/
          retention-days: 30
          if-no-files-found: error
