name: harden-hithink-sector-breadth-acquisition-2026-09-05

on:
  pull_request:
    paths:
      - ".github/workflows/harden-hithink-sector-breadth-acquisition-2026-09-05.yml"
      - "tests/test_hithink_sector_breadth_identity.py"

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: github.event.pull_request.head.ref == 'feat/hithink-sector-breadth-acquisition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact A-share identity hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/decision_kernel/runtime/hithink_sector_breadth_http.py")
          text = source.read_text(encoding="utf-8")
          import_anchor = "from __future__ import annotations\n\n"
          if text.count(import_anchor) != 1:
              raise SystemExit("unexpected import anchor")
          text = text.replace(import_anchor, import_anchor + "import re\n", 1)

          constant_anchor = '''HITHINK_SECTOR_BREADTH_INVESTMENT_AUTHORITY = "NONE"

_RequestJSON = Callable[[str, Mapping[str, str]], Mapping[str, Any]]
          '''
          replacement = '''HITHINK_SECTOR_BREADTH_INVESTMENT_AUTHORITY = "NONE"

_A_SHARE_THSCODE = re.compile(r"^\\d{6}\\.(?:SH|SZ|BJ)$")
_RequestJSON = Callable[[str, Mapping[str, str]], Mapping[str, Any]]
          '''
          if text.count(constant_anchor) != 1:
              raise SystemExit("unexpected constant anchor")
          text = text.replace(constant_anchor, replacement, 1)

          validation_anchor = '''    thscode = str(raw.get("thscode", "")).strip().upper()
              ticker = str(raw.get("ticker", "")).strip()
              if ticker != thscode[:6]:
          '''
          validation_replacement = '''    thscode = str(raw.get("thscode", "")).strip().upper()
              ticker = str(raw.get("ticker", "")).strip()
              if not _A_SHARE_THSCODE.fullmatch(thscode):
                  raise HithinkRuntimeError(
                      f"{row_label} has an invalid A-share identity {thscode!r}"
                  )
              if ticker != thscode[:6]:
          '''
          if text.count(validation_anchor) != 1:
              raise SystemExit("unexpected stock identity validation anchor")
          text = text.replace(validation_anchor, validation_replacement, 1)
          source.write_text(text, encoding="utf-8")
          PY
      - name: Verify full repository suite
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Remove one-time workflow and publish hardening
        shell: bash
        run: |
          rm .github/workflows/harden-hithink-sector-breadth-acquisition-2026-09-05.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/decision_kernel/runtime/hithink_sector_breadth_http.py
          git add tests/test_hithink_sector_breadth_identity.py
          git add -A .github/workflows/harden-hithink-sector-breadth-acquisition-2026-09-05.yml
          git commit -m "test: harden A-share snapshot identity validation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
