name: cninfo-smoke

on:
  pull_request:
    paths:
      - 'src/decision_kernel/adapters/cninfo.py'
      - 'src/decision_kernel/runtime/cninfo_http.py'
      - '.github/workflows/cninfo-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Fetch one official disclosure window
        run: |
          python - <<'PY'
          from datetime import date
          from decision_kernel.runtime.cninfo_http import fetch_cninfo_disclosures

          batch = fetch_cninfo_disclosures(
              stock_code='600036',
              start_date=date(2026, 8, 29),
              end_date=date(2026, 8, 31),
          )
          print(f'org_id={batch.org_id}')
          print(f'announcement_count={len(batch.announcements)}')
          if not batch.announcements:
              raise SystemExit('expected at least one CMB disclosure in smoke window')
          first = batch.announcements[0]
          print(f'first_id={first.announcement_id}')
          print(f'first_title={first.title}')
          print(f'first_locator={first.source_locator}')
          PY
