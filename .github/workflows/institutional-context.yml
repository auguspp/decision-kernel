name: institutional-context

on:
  workflow_dispatch:
    inputs:
      code-sha:
        description: Exact reviewed main commit with successful main CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: institutional-context
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require exact reviewed main and successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_CODE" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=10 > "$RUNNER_TEMP/institutional-ci.json"
          python - <<'PY'
          import json, os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/institutional-ci.json'))['workflow_runs']
          assert runs
          r=max(runs,key=lambda x:(x['created_at'],x['id']))
          assert r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='main'
          assert r['path']=='.github/workflows/ci.yml' and r['event']=='push'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          PY
      - name: Install existing isolated transport dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Capture one issuer window with two fixed requests
        run: >-
          python -m decision_kernel.runtime.institutional_context capture
          --ticker 002436.SZ --begin 2026-08-11 --end 2026-09-24
          --output "$RUNNER_TEMP/institutional-context"
      - name: Replay retained bytes without source calls
        run: >-
          python -m decision_kernel.runtime.institutional_context replay
          --output "$RUNNER_TEMP/institutional-context"
      - name: Retain exact bodies and explicit gaps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: institutional-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/institutional-context/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish bounded summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/institutional-context/summary.md" ]; then
            cat "$RUNNER_TEMP/institutional-context/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No validated context; inspect the failed step. Not no activity.' >> "$GITHUB_STEP_SUMMARY"
          fi
