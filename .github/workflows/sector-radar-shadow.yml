name: sector-radar-shadow

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Sector operation
        required: true
        default: produce
        type: choice
        options:
          - produce
          - adopt-recovery-2026-09-10
  schedule:
    # UTC 10:13 = Asia/Shanghai 18:13, Monday-Friday. Calendar remains authoritative.
    - cron: "13 10 * * 1-5"

permissions:
  actions: read
  contents: read

concurrency:
  group: sector-radar-prospective-state
  cancel-in-progress: false

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[discovery]'
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Sector Radar state production is allowed only from main"
            exit 1
          fi
      - name: Require fresh workflow dispatch
        shell: bash
        run: |
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "::error::Do not rerun a Sector Radar workflow run; use a new scheduled run or fresh workflow_dispatch so run and artifact identity remain unique"
            exit 1
          fi
      - name: Check HiThink secret
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'produce'
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        shell: bash
        run: |
          if [ -z "${HITHINK_FINANCE_API_KEY:-}" ]; then
            echo "::error::Missing repository secret HITHINK_FINANCE_API_KEY"
            exit 1
          fi
      - name: Restore cache acceleration copy
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'produce'
        id: state-cache
        uses: actions/cache/restore@v6
        with:
          path: decision-state/sector-radar
          key: sector-radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sector-radar-state-
      - name: Discover latest successful state artifact
        id: state-artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m decision_kernel.runtime.sector_radar_producer discover-artifact \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-file sector-radar-shadow.yml \
            --current-run-id "${GITHUB_RUN_ID}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Download exact latest successful state artifact
        if: steps.state-artifact.outputs.artifact_available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.state-artifact.outputs.artifact_name }}
          path: restored-artifact/sector-radar
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.state-artifact.outputs.artifact_run_id }}
      - name: Download exact recovery checkpoint
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'adopt-recovery-2026-09-10'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10196584150'
          run-id: '34593517648'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/sector-recovery-checkpoint
      - name: Adopt exact recovery checkpoint into original Sector lineage
        id: recovery-adoption
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'adopt-recovery-2026-09-10'
        env:
          HITHINK_FINANCE_API_KEY: ""
          RECOVERY_OPERATION: adopt-recovery-2026-09-10
        run: |
          python .github/scripts/adopt-sector-recovery-checkpoint.py adopt \
            --parent restored-artifact/sector-radar \
            --checkpoint "${RUNNER_TEMP}/sector-recovery-checkpoint" \
            --state-dir decision-state/sector-radar \
            --output sector-radar-run \
            --discovered-run-id "${{ steps.state-artifact.outputs.artifact_run_id }}" \
            --discovered-artifact-id "${{ steps.state-artifact.outputs.artifact_id }}" \
            --discovered-head-sha "${{ steps.state-artifact.outputs.artifact_head_sha }}"
      - name: Verify recovery adoption exact offline match
        id: recovery-adoption-verify
        if: success() && github.event_name == 'workflow_dispatch' && inputs.operation == 'adopt-recovery-2026-09-10'
        env:
          HITHINK_FINANCE_API_KEY: ""
          RECOVERY_OPERATION: adopt-recovery-2026-09-10
        run: |
          python .github/scripts/adopt-sector-recovery-checkpoint.py verify \
            --checkpoint "${RUNNER_TEMP}/sector-recovery-checkpoint" \
            --state-dir decision-state/sector-radar \
            --output sector-radar-run
      - name: Check shared-Key activity once before acquisition
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'produce'
        id: key-activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HITHINK_FINANCE_API_KEY: ""
        run: python .github/scripts/check-sector-scheduled-activity.py
      - name: Run independent Sector Radar shadow producer
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'produce'
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          # Conservative per-process spacing, not a verified provider quota.
          HITHINK_SECTOR_REQUEST_PACING: "1"
        shell: bash
        run: |
          python -m decision_kernel.runtime.sector_radar_producer run \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-path .github/workflows/sector-radar-shadow.yml \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --commit-sha "${GITHUB_SHA}" \
            --prior-success-found "${{ steps.state-artifact.outputs.prior_success_found }}" \
            --artifact-available "${{ steps.state-artifact.outputs.artifact_available }}" \
            --state-directory decision-state/sector-radar \
            --artifact-directory restored-artifact/sector-radar \
            --output-directory sector-radar-run
      - name: Verify exact offline replay before publication
        id: replay-check
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'produce')
        env:
          HITHINK_FINANCE_API_KEY: ""
        run: python .github/scripts/verify-sector-radar-publication.py
      - name: Render read-only saved-state context
        id: context-view
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'produce')
        env:
          HITHINK_FINANCE_API_KEY: ""
        run: |
          python -m decision_kernel.runtime.sector_radar_context \
            --bundle decision-state/sector-radar \
            --parent-hints radar_inputs/sector-parent-hints-2026-09-05.json \
            --output sector-radar-run/context
      - name: Package joint economic and company reading
        id: joint-reading
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'produce')
        env:
          HITHINK_FINANCE_API_KEY: ""
        run: python .github/scripts/build-sector-radar-reading.py
      - name: Upload complete run audit
        id: run-audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-radar-run-${{ github.run_id }}
          path: sector-radar-run/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload authoritative state bundle
        id: state-upload
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sector-radar-state-bundle
          path: decision-state/sector-radar/
          if-no-files-found: error
          retention-days: 90
      - name: Save cache acceleration copy
        id: cache-save
        if: success()
        uses: actions/cache/save@v6
        with:
          path: decision-state/sector-radar
          key: sector-radar-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish separate shadow summary
        if: always()
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          KEY_ACTIVITY_OUTCOME: ${{ steps.key-activity.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay-check.outcome }}
          CONTEXT_OUTCOME: ${{ steps.context-view.outcome }}
          JOINT_OUTCOME: ${{ steps.joint-reading.outcome }}
          ADOPTION_OUTCOME: ${{ steps.recovery-adoption.outcome }}
          ADOPTION_VERIFY_OUTCOME: ${{ steps.recovery-adoption-verify.outcome }}
          STATE_UPLOAD_OUTCOME: ${{ steps.state-upload.outcome }}
          CACHE_SAVE_OUTCOME: ${{ steps.cache-save.outcome }}
          RUN_AUDIT_URL: ${{ steps.run-audit.outputs.artifact-url }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$OPERATION" = "adopt-recovery-2026-09-10" ]; then
            {
              echo '### Sector production recovery adoption'
              printf 'Run: `%s`; attempt: `%s`; commit: `%s`\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
              echo 'This case-bounded mode makes no market/provider request. It validates the exact retained 2026-09-10 checkpoint, preserves the old event ledger, and only then prepares the original Sector state artifact lineage.'
              echo
              printf 'Local checkpoint adoption: `%s`; independent offline exact verification: `%s`.\n\n' "$ADOPTION_OUTCOME" "$ADOPTION_VERIFY_OUTCOME"
              printf 'Authoritative state artifact upload: `%s`; cache acceleration save: `%s`.\n\n' "$STATE_UPLOAD_OUTCOME" "$CACHE_SAVE_OUTCOME"
              echo 'The candidate state bytes intentionally keep their historical source label ending in NOT_RESTORE_AUTHORITY; restore authority comes only from this successful original-workflow state artifact publication, not from rewriting the frozen candidate.'
              echo
              echo 'No retrospective candidate event, Research, Human attention, Odds, Action or investment authority is created. A later ordinary Sector production run must separately prove normal reconnection.'
              if [ -n "$RUN_AUDIT_URL" ]; then
                printf '\n[Download this adoption audit](%s)\n' "$RUN_AUDIT_URL"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Sector production invocation'
            printf 'Trigger: `%s`; run: `%s`; attempt: `%s`; commit: `%s`\n\n' "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
            printf 'Summary recorded at UTC: `%s`\n\n' "$(date -u +%FT%TZ)"
            printf 'Shared-Key activity precheck: `%s` (one observation, not a global lock).\n\n' "$KEY_ACTIVITY_OUTCOME"
            echo 'A failed or missing production record is not quiet success. Gap or unavailable/integrity-failed authoritative state requires explicit qualified recovery; ordinary production cannot bridge or reset it. Any 429 stops this attempt: no Re-run, retry or fallback.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f sector-radar-run/operations.md ]; then
            cat sector-radar-run/operations.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sector Discovery Radar operations unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "The workflow failed before a structured operations record was written." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f sector-radar-run/summary.md ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat sector-radar-run/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "### 发布前离线重放" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REPLAY_OUTCOME" = "success" ]; then
            echo '重放与待上传文件逐字节一致。核验记录：`publication-verification.json`；此记录不代替远端 artifact 上传和 cache 保存的成功证明。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '发布前重放未通过或未执行；本次不应发布新的权威状态包或 cache。计算阶段摘要不是整个工作流成功证明。' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "### 完整行业状态 · 只读附件" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CONTEXT_OUTCOME" = "success" ] && [ -n "$RUN_AUDIT_URL" ]; then
            printf '[下载本次运行附件](%s)\n\n' "$RUN_AUDIT_URL" >> "$GITHUB_STEP_SUMMARY"
            echo '解压后用浏览器打开 `context/index.html`；机器可读数据在 `context/context.json`。这不是已托管的网站。' >> "$GITHUB_STEP_SUMMARY"
            echo '该页只读取本次保存状态，不再获取行情，不新增提醒；页面不代替整个 workflow、状态上传和 cache 保存的成功证明。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '本次未能提供已上传的完整状态页面。请检查 Render read-only saved-state context 与 Upload complete run audit 步骤；不要使用旧页面冒充本次结果。' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '### 行业—产业数据—公司依据 · 联合阅读' >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOINT_OUTCOME" = "success" ] && [ -n "$RUN_AUDIT_URL" ]; then
            printf '[下载包含联合页面的本次附件](%s)\n\n' "$RUN_AUDIT_URL" >> "$GITHUB_STEP_SUMMARY"
            echo '打开 `economic-company/index.html`；三份业务 JSON、`delivery.json` 与 `inputs.zip` 同目录保留。无需再运行采集工作流。' >> "$GITHUB_STEP_SUMMARY"
            echo '只读既有经济记录与牧原／圆通依据；未验证最新发布、未重读公司 PDF，也不代表受益确认。输入截止不等于行情交易日。' >> "$GITHUB_STEP_SUMMARY"
            echo '联合页面和输入副本不是恢复事实源。权威状态包与 cache 是否保存，仍看对应步骤；本地交付凭证不是上传成功证明。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '本次没有已上传的联合页面；不要以旧页、现有单独行业页或计算成功摘要代替它。联合页生成失败将阻止本次权威状态与 cache 发布，失败审计仍保留。' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
