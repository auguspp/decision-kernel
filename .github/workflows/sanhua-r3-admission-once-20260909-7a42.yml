name: Sanhua r3 admission once 7a42

on:
  push:
    branches: ["ops/sanhua-r3-admission-20260909-7a42"]
    paths: [".github/workflows/sanhua-r3-admission-once-20260909-7a42.yml"]

permissions:
  contents: read

concurrency:
  group: sanhua-r3-admission-20260909-7a42
  cancel-in-progress: false

jobs:
  admit:
    if: github.repository == 'auguspp/decision-kernel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRUSTED_MAIN: 381f4d1f826a6d98844d27d626129211218ca332
    steps:
      - name: Require one fresh exact-main admission
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$EVENT_BEFORE" = "$TRUSTED_MAIN"
          test "$(TZ=Asia/Shanghai date +%F)" = "2026-09-09"
      - uses: actions/checkout@v7
        with:
          ref: 381f4d1f826a6d98844d27d626129211218ca332
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install unchanged trusted package
        run: python -m pip install -e '.[dev]'
      - name: Run original execute_after_admission with exact remote input readback
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          from decision_kernel.identity import canonical_json
          from decision_kernel.runtime.external_research_admission import execute_after_admission
          from decision_kernel.runtime.external_research_execution import ExternalResearchInputPacket

          REPO = 'auguspp/decision-kernel'
          MAIN = '381f4d1f826a6d98844d27d626129211218ca332'
          INPUT_COMMIT = 'dd0d1d4e046f1f5cdcf18eecec64d1e54e270601'
          INPUT_PATH = 'research_runs/candidates/002050.SZ/p0-4a-sanhua-20260909T1208Z-r3-7a42/input.json'
          INPUT_BLOB = 'b1dd77dd11023b92ff3d4e8e7454f3efa69c82fb'
          INPUT_SHA256 = '764931c626934e30c57930745d4528a85fa5ccc828e0fa3f0ad320b7d2d3130d'
          PRE_COMMIT = 'da2c8b6d0de27d8bae03243072e65be009eb990d'
          PRE_PATH = 'research_runs/candidates/002050.SZ/p0-4a-sanhua-20260909T1208Z-r3-7a42/preflight.json'
          PRE_BLOB = '87d73c296aa0a597e412883af4c9fb8fd514429c'
          PRE_SHA256 = 'd37c7281c4b8f6370f32511801143a0098503c97e38b39c500c240038ebccb59'
          CATALOG_BLOB = '4c4c458d6e076e6deaa69c66fe7516f51592e7e8'
          EXPECTED_KEY = {'execution_id': 'p0-4a-sanhua-20260909T1208Z-r3-7a42',
                          'canonical_input_hash': '0361878270ed68f07b26a4bd6faa360c0b3835a5db84f74775ed06ef76566f40'}

          def gh_json(*args):
              return json.loads(subprocess.check_output(['gh', 'api', *args]))

          def load(spec):
              endpoint = f"repos/{REPO}/contents/{quote(spec['path'], safe='/')}"
              value = gh_json('--method', 'GET', endpoint, '-f', f"ref={spec['ref']}")
              return base64.b64decode(value['content'])

          def commit(sha):
              return gh_json(f'repos/{REPO}/git/commits/{sha}')

          def current_code():
              return gh_json(f'repos/{REPO}/git/ref/heads/main')['object']['sha']

          input_source = {'repository': REPO, 'ref': INPUT_COMMIT, 'path': INPUT_PATH,
                          'git_blob': INPUT_BLOB, 'sha256': INPUT_SHA256}
          pre_source = {'repository': REPO, 'ref': PRE_COMMIT, 'path': PRE_PATH,
                        'git_blob': PRE_BLOB, 'sha256': PRE_SHA256}
          catalog_source = {'repository': REPO, 'ref': MAIN, 'path': 'research_runs/execution-inputs.json',
                            'git_blob': CATALOG_BLOB}
          input_raw = load(input_source)
          preflight_raw = load(pre_source)
          assert hashlib.sha256(input_raw).hexdigest() == INPUT_SHA256
          assert hashlib.sha256(preflight_raw).hexdigest() == PRE_SHA256
          packet = ExternalResearchInputPacket.model_validate_json(input_raw)
          assert packet.execution_id == EXPECTED_KEY['execution_id']

          root = Path('sanhua-r3-admission')
          root.mkdir(exist_ok=False)
          launched = {}
          def executor(raw, key):
              now = datetime.now(timezone.utc).isoformat()
              marker = {
                  'schema_version': 1,
                  'status': 'TRUSTED_ADAPTER_LAUNCHED_EXTERNAL_EXECUTOR',
                  'execution_id': key['execution_id'],
                  'canonical_input_hash': key['canonical_input_hash'],
                  'launched_at': now,
                  'input_file_sha256': hashlib.sha256(raw).hexdigest(),
                  'formal_research_budget_used_in_callback': 0,
                  'handoff_semantics': 'CURRENT_CHATGPT_RESEARCH_EXECUTOR_MUST_BIND_EXACT_KEY_AND_PRODUCE_SEPARATE_RECEIPT',
                  'authority': 'NONE',
              }
              launched.update(marker)
              return marker

          checked_at = datetime.now(timezone.utc).isoformat()
          report, output = execute_after_admission(
              executor=executor,
              input_raw=input_raw,
              preflight_raw=preflight_raw,
              catalog_source=catalog_source,
              load=load,
              commit=commit,
              checked_at=checked_at,
              current_code=current_code,
              now=lambda: datetime.now(timezone.utc).isoformat(),
              input_source=input_source,
              expected_key=EXPECTED_KEY,
          )
          assert report['research_execution_allowed'] is True
          assert report['reason'] == 'RESEARCH_EXECUTION_ALLOWED'
          assert report['execution_key'] == EXPECTED_KEY
          assert output == launched and output['status'] == 'TRUSTED_ADAPTER_LAUNCHED_EXTERNAL_EXECUTOR'
          assert current_code() == MAIN
          (root / 'admission.json').write_text(canonical_json(report) + '\n', encoding='utf-8')
          (root / 'launch.json').write_text(canonical_json(output) + '\n', encoding='utf-8')
          print(canonical_json({'admission': report['reason'], 'launch': output['status'],
                                'execution_key': EXPECTED_KEY, 'finished_at': report['finished_at']}))
          PY
      - name: Upload admission and launch handoff
        uses: actions/upload-artifact@v7
        with:
          name: sanhua-r3-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: sanhua-r3-admission/
          if-no-files-found: error
          retention-days: 90
