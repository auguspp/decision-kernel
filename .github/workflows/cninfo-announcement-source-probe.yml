name: cninfo-announcement-source-probe

on:
  workflow_dispatch:
    inputs:
      probe-kind:
        description: "Existing metadata probe or fixed PDF transport comparison"
        type: choice
        options: [announcement, pdf-transport]
        default: announcement
      code-sha:
        description: "Required for PDF mode: exact reviewed main SHA at dispatch"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cninfo-announcement-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require reviewed main and one fresh attempt
        env:
          PROBE_KIND: ${{ inputs.probe-kind }}
          EXPECTED_CODE_SHA: ${{ inputs.code-sha }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          case "$PROBE_KIND" in
            ""|announcement|pdf-transport) ;;
            *) exit 1 ;;
          esac
          if [ "$PROBE_KIND" = "pdf-transport" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            [[ "$EXPECTED_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$EXPECTED_CODE_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          fi
      - name: Install existing isolated transport extra
        run: python -m pip install -e '.[dump-study]'
      - name: Probe bounded CNINFO announcement request contracts
        if: inputs.probe-kind != 'pdf-transport'
        run: python -m decision_kernel.runtime.cninfo_announcement_probe --output cninfo-announcement-probe
      - name: Verify sealed diagnostic result
        if: inputs.probe-kind != 'pdf-transport'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from decision_kernel.identity import canonical_hash

          path = Path("cninfo-announcement-probe/probe.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          claimed = result.pop("probe_hash")
          assert canonical_hash(result) == claimed
          assert result["semantics"] == "CASE_BOUNDED_CNINFO_REQUEST_CONTRACT_PROBE_NOT_EVIDENCE"
          assert 1 <= result["request_count"] <= result["max_requests"] == 7
          assert result["cause"] == "UNKNOWN"
          assert result["production_qualification"] == "NOT_ESTABLISHED"
          assert result["research_authority"] == "NONE"
          assert result["human_attention_authority"] == "NONE"
          assert result["investment_authority"] == "NONE"
          assert result["market_state_writes"] == result["events_created"] == 0
          print("CNINFO source probe record verified; this is not production acceptance.")
          PY
      - name: Compare the six fixed official PDF request slots
        if: inputs.probe-kind == 'pdf-transport'
        env:
          EXPECTED_CODE_SHA: ${{ inputs.code-sha }}
        run: python eval/cninfo_pdf_transport_probe.py --output cninfo-pdf-transport-probe
      - name: Verify retained PDF probe bytes without new requests
        if: inputs.probe-kind == 'pdf-transport'
        run: python eval/cninfo_pdf_transport_probe.py --output cninfo-pdf-transport-probe --verify-only
      - name: Retain complete probe evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.probe-kind == 'pdf-transport' && 'cninfo-pdf-transport-probe' || 'cninfo-announcement-source-probe' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.probe-kind == 'pdf-transport' && 'cninfo-pdf-transport-probe' || 'cninfo-announcement-probe' }}/
          if-no-files-found: error
          retention-days: 30
      - name: Publish diagnostic summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          PROBE_DIR: ${{ inputs.probe-kind == 'pdf-transport' && 'cninfo-pdf-transport-probe' || 'cninfo-announcement-source-probe' }}
        run: |
          if [ -f "$PROBE_DIR/summary.md" ]; then
            cat "$PROBE_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Probe did not produce a sealed diagnostic result.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[CNINFO request-contract probe artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
