name: sector-public-ths-recovery-candidate

on:
  push:
    branches:
      - recovery/sector-public-ths-gap-20260911

permissions:
  actions: read
  contents: read

concurrency:
  group: sector-public-ths-recovery-candidate-20260911
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact isolated recovery branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install existing Kernel and fixed AKShare reuse commit
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check \
            'git+https://github.com/akfamily/akshare.git@8e95744b79ae22326308ccd2b4e62650c5b53c55'
          python -m py_compile .github/scripts/capture-sector-public-ths-recovery.py

      - name: Download exact failed-recovery source artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10187281705'
          run-id: '34566950303'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/sector-recovery-source

      - name: Capture only the 211 missing exact THS histories
        id: capture
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python .github/scripts/capture-sector-public-ths-recovery.py capture \
            --source "$RUNNER_TEMP/sector-recovery-source" \
            --output "$RUNNER_TEMP/sector-public-ths-capture" \
            --spacing-seconds 1.0

      - name: Offline rebuild candidate without network
        id: verify
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          python .github/scripts/capture-sector-public-ths-recovery.py verify \
            --source "$RUNNER_TEMP/sector-recovery-source" \
            --capture "$RUNNER_TEMP/sector-public-ths-capture" \
            --output "$RUNNER_TEMP/sector-public-ths-verify"

      - name: Retain raw public source, candidate and receipts
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-public-ths-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sector-public-ths-capture/
            ${{ runner.temp }}/sector-public-ths-verify/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Enforce candidate-only acceptance without retry
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          printf 'Capture outcome: %s; offline verify: %s\n' "$CAPTURE_OUTCOME" "$VERIFY_OUTCOME"
          test "$CAPTURE_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
