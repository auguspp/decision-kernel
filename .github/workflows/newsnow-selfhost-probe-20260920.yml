name: newsnow-selfhost-probe-20260920

on:
  push:
    branches: [probe/newsnow-selfhost-20260920]
    paths: [.github/workflows/newsnow-selfhost-probe-20260920.yml]

permissions:
  contents: read

jobs:
  sample:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing feed dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Start isolated upstream image by resolved digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/newsnow-probe/identity"
          printf 'code_sha=%s\nrun_id=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/newsnow-probe/identity/run.txt"
          docker pull ghcr.io/ourongxing/newsnow:latest
          docker image inspect ghcr.io/ourongxing/newsnow:latest --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/newsnow-probe/identity/image-digests.json"
          docker image inspect ghcr.io/ourongxing/newsnow:latest --format 'id={{.Id}} created={{.Created}}' > "$RUNNER_TEMP/newsnow-probe/identity/image.txt"
          image=$(python -c 'import json,sys; a=json.load(open(sys.argv[1])); a=[x for x in a if x.startswith("ghcr.io/ourongxing/newsnow@sha256:")]; assert len(a)==1; print(a[0])' "$RUNNER_TEMP/newsnow-probe/identity/image-digests.json")
          docker run -d --name newsnow-probe --publish 127.0.0.1:4444:4444 --cap-drop ALL --security-opt no-new-privileges --memory 768m --cpus 2 --pids-limit 256 -e HOST=0.0.0.0 -e PORT=4444 -e INIT_TABLE=true -e ENABLE_CACHE=true "$image"
          ready=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:4444/ >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
      - name: Sample the same seven sources once at the client boundary
        run: python eval/newsnow_selfhost_once.py "$RUNNER_TEMP/newsnow-probe/sample"
      - name: Retain diagnostics and remove temporary container
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/newsnow-probe/identity"
          docker logs newsnow-probe > "$RUNNER_TEMP/newsnow-probe/identity/container.log" 2>&1 || true
          docker rm -f newsnow-probe >/dev/null 2>&1 || true
      - name: Preserve sample and actual image identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: newsnow-selfhost-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/newsnow-probe/
          if-no-files-found: warn
          retention-days: 30
