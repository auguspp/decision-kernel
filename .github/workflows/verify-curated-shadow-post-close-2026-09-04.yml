name: verify-curated-shadow-post-close-2026-09-04

on:
  pull_request:
    paths:
      - '.github/workflows/verify-curated-shadow-post-close-2026-09-04.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Run exact corrected shadow batch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HITHINK_FINANCE_API_KEY:-}" ]; then
            echo '::error::Missing repository secret HITHINK_FINANCE_API_KEY'
            exit 1
          fi
          shadow_packages=(
            dogfood/600519-moutai.json
            dogfood/300750-catl.json
            dogfood/600036-cmb.json
            dogfood/601088-shenhua.json
            research_cases/603986-gigadevice-deep-research-v2.json
            research_cases/002050-sanhua-deep-research-v1.json
          )
          python -m decision_kernel.runtime.market_history_shadow \
            "${shadow_packages[@]}" \
            --output-dir market-history-shadow \
            2>&1 | tee market-history-shadow-status.txt
      - name: Validate complete six-case batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path('market-history-shadow').glob('*.json'))
          if len(paths) != 6:
              raise SystemExit(f'expected 6 shadow observations, got {len(paths)}: {paths}')
          payloads = [json.loads(path.read_text(encoding='utf-8')) for path in paths]
          tickers = {payload['security']['ticker'] for payload in payloads}
          expected = {'600519', '300750', '600036', '601088', '603986', '002050'}
          if tickers != expected:
              raise SystemExit(f'unexpected shadow ticker set: {sorted(tickers)}')
          if '688277' in tickers:
              raise SystemExit('Tinavi non-package artifact leaked into shadow batch')
          for payload in payloads:
              if payload['radar_semantics'] != 'SHADOW_OBSERVATION_ONLY':
                  raise SystemExit('shadow semantics boundary missing')
              if payload['human_attention_authority'] != 'NONE':
                  raise SystemExit('shadow gained Human attention authority')
              if payload['investment_authority'] != 'NONE':
                  raise SystemExit('shadow gained investment authority')
              if payload['market_contract']['response_session'] != '2026-09-04':
                  raise SystemExit('shadow did not reach the completed 2026-09-04 session')
          PY
      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Corrected Surprise Radar shadow proof'
            echo
            if [ -f market-history-shadow-status.txt ]; then
              echo '```text'
              cat market-history-shadow-status.txt
              echo '```'
            else
              echo 'No shadow status was produced.'
            fi
            echo
            echo 'This one-time workflow will be removed before merge.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curated-shadow-post-close-proof
          path: |
            market-history-shadow-status.txt
            market-history-shadow/
          if-no-files-found: warn
          retention-days: 7
