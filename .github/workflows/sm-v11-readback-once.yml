name: sm-v11-readback-once
on:
  push:
    branches: [work/sm-v11-readback-20260926]
    paths: [.github/workflows/sm-v11-readback-once.yml]
permissions:
  contents: read
jobs:
  export-published-reading:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 05c0e12c4d3ad9d3243c028c9d7630fa89264e26
          persist-credentials: false
      - name: Export exact saved files without running or regenerating them
        run: |
          set -eu
          test "$(date -u +%F)" = 2026-09-26
          test "$(git rev-parse HEAD)" = 05c0e12c4d3ad9d3243c028c9d7630fa89264e26
          mkdir -p "$RUNNER_TEMP/sm-v11-published"
          git archive --format=zip HEAD current-state.json README.md details/radar/smart-money.md details/radar/smart-money/ sources/artifacts/646acc208d0ac12abc00d9ae8e34c37dc5381c057f40a95134b4afb2824b4bbe.zip sources/artifacts/1358c8eb48c614fc1c61717d2fc96f9c1fab55c2ec0b5eaaf93eef67e4ab4279.zip > "$RUNNER_TEMP/sm-v11-published/reading.zip"
          git ls-tree -r HEAD > "$RUNNER_TEMP/sm-v11-published/tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/sm-v11-published/identity.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: sm-v11-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sm-v11-published/
          if-no-files-found: error
          retention-days: 30
