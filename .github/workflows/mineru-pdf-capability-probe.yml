name: mineru-pdf-capability-probe

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mineru-pdf-capability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FROZEN_ARTIFACT_ID: "10320565453"
      FROZEN_ARTIFACT_SHA256: "25cda8a1d4afb4783432320239cd6271fe193cfdc5ed6dc2095a5deb833dce9c"
      MINERU_MODEL_SOURCE: auto
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require reviewed main and one fresh attempt
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Download the frozen retained source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mineru-pdf-probe mineru-pdf-work
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_ARTIFACT_ID/zip" \
            -o retained-source.zip
          printf '%s  %s\n' "$FROZEN_ARTIFACT_SHA256" retained-source.zip | sha256sum --check --strict
      - name: Install upstream MinerU 4.0.2 locally
        shell: bash
        run: |
          set -o pipefail
          mkdir -p mineru-pdf-probe/environment
          set +e
          python -m pip install --disable-pip-version-check "mineru==4.0.2" \
            2>&1 | tee mineru-pdf-probe/environment/pip-install.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > mineru-pdf-probe/environment/pip-install-exit-code.txt
          # Package installation failure stays visible in the retained diagnostic;
          # it is not silently converted into a parser-quality result.
          exit 0
      - name: Run bounded MinerU Basic CPU A/B
        shell: bash
        run: |
          python eval/mineru_pdf_probe.py \
            --archive retained-source.zip \
            --work mineru-pdf-work \
            --output mineru-pdf-probe
      - name: Retain complete probe evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v7
        with:
          name: mineru-pdf-capability-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: mineru-pdf-probe/
          if-no-files-found: error
          retention-days: 30
      - name: Publish diagnostic summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        shell: bash
        run: |
          if [ -f mineru-pdf-probe/summary.md ]; then
            cat mineru-pdf-probe/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'MinerU probe did not produce a sealed diagnostic result.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[MinerU PDF capability probe artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
