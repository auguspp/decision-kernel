name: manual-radar-2026-09-03

on:
  push:
    branches:
      - ops/manual-radar-2026-09-03

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[documents]'
      - name: Check HiThink secret
        shell: bash
        run: |
          if [ -z "${HITHINK_FINANCE_API_KEY:-}" ]; then
            echo "::error::Missing repository secret HITHINK_FINANCE_API_KEY"
            exit 1
          fi
      - name: Build Decision Inbox
        shell: bash
        run: |
          decision-kernel build-inbox \
            dogfood/*.json \
            research_cases/603986-gigadevice-deep-research-v2.json \
            research_cases/002050-sanhua-deep-research-v1.json
      - name: Capture Surprise Radar market-history shadow
        shell: bash
        run: |
          set -euo pipefail
          python -m decision_kernel.runtime.market_history_shadow \
            dogfood/*.json \
            research_cases/603986-gigadevice-deep-research-v2.json \
            research_cases/002050-sanhua-deep-research-v1.json \
            --output-dir market-history-shadow \
            2>&1 | tee market-history-shadow-status.txt
      - name: Scan official disclosures
        shell: bash
        run: |
          set -euo pipefail
          decision-kernel scan-disclosures \
            dogfood/600519-moutai.json \
            dogfood/300750-catl.json \
            dogfood/600036-cmb.json \
            dogfood/601088-shenhua.json \
            research_cases/603986-gigadevice-deep-research-v2.json \
            research_cases/002050-sanhua-deep-research-v1.json \
            --through 2026-09-03 \
            --packet-dir disclosure-assessment-packets \
            --packet-limit 10 | tee disclosure-scan.txt
      - name: Print one-off summary
        if: always()
        shell: bash
        run: |
          echo '=== DECISION INBOX ==='
          if [ -f decision-inbox/summary.md ]; then cat decision-inbox/summary.md; fi
          echo '=== MARKET HISTORY SHADOW ==='
          if [ -f market-history-shadow-status.txt ]; then cat market-history-shadow-status.txt; fi
          find market-history-shadow -maxdepth 2 -type f -print 2>/dev/null || true
          echo '=== DISCLOSURE SCAN ==='
          if [ -f disclosure-scan.txt ]; then cat disclosure-scan.txt; fi
      - name: Upload one-off Radar outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-radar-2026-09-03
          path: |
            decision-inbox/
            market-history-shadow/
            market-history-shadow-status.txt
            disclosure-scan.txt
            disclosure-assessment-packets/
          if-no-files-found: warn
          retention-days: 14
