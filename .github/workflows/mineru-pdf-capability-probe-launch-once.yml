name: mineru-pdf-capability-probe-launch-once

on:
  workflow_run:
    workflows: [kernel-tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: mineru-pdf-capability-probe-launch-once
  cancel-in-progress: false

jobs:
  launch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.display_title == 'probe: launch one MinerU retained-PDF run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify exact one-shot launch context
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          test "$(cat .github/mineru-pdf-probe-launch-20260918)" = "ISSUE_428_HUMAN_AUTHORIZED_ONE_SHOT"
      - name: Dispatch the existing manual MinerU probe exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run mineru-pdf-capability-probe.yml --ref main
          echo "Dispatched mineru-pdf-capability-probe.yml on main."
