name: scan-disclosures-now-2026-09-04

on:
  pull_request:
    paths:
      - '.github/workflows/scan-disclosures-now-2026-09-04.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install with official PDF extraction
        run: python -m pip install -e '.[documents]'
      - name: Restore exact quiet-disposition receipt memory
        id: disclosure-memory
        uses: actions/cache/restore@v6
        with:
          path: decision-state/disclosure-receipts.json
          key: disclosure-receipts-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            disclosure-receipts-state-
      - name: Scan current official disclosures
        shell: bash
        run: |
          set -euo pipefail
          through="$(date +%F)"
          receipt_args=()
          if [ -f decision-state/disclosure-receipts.json ]; then
            receipt_args=(--receipts decision-state/disclosure-receipts.json)
            echo 'RECEIPT_MEMORY=RESTORED' | tee disclosure-scan-meta.txt
          else
            echo 'RECEIPT_MEMORY=MISSING_REASSESS' | tee disclosure-scan-meta.txt
          fi
          echo "THROUGH=$through" | tee -a disclosure-scan-meta.txt
          decision-kernel scan-disclosures \
            dogfood/600519-moutai.json \
            dogfood/300750-catl.json \
            dogfood/600036-cmb.json \
            dogfood/601088-shenhua.json \
            research_cases/603986-gigadevice-deep-research-v2.json \
            research_cases/002050-sanhua-deep-research-v1.json \
            --through "$through" \
            --packet-dir disclosure-assessment-packets \
            --packet-limit 20 \
            "${receipt_args[@]}" | tee disclosure-scan.txt
      - name: Publish scan summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Current official disclosure scan'
            echo
            if [ -f disclosure-scan-meta.txt ]; then
              echo '```text'
              cat disclosure-scan-meta.txt
              echo '```'
            fi
            if [ -f disclosure-scan.txt ]; then
              echo '```text'
              cat disclosure-scan.txt
              echo '```'
            else
              echo 'No scan result was produced.'
            fi
            echo
            echo 'Assessment packets are Research-producer inputs only; they create no Recommendation, Human wake or investment authority.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload current scan artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-official-disclosure-scan
          path: |
            disclosure-scan.txt
            disclosure-scan-meta.txt
            disclosure-assessment-packets/
          if-no-files-found: warn
          retention-days: 3
