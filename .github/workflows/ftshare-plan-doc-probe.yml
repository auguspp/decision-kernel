name: ftshare-plan-doc-probe

on:
  push:
    branches:
      - probe/ftshare-20260921

permissions:
  contents: read

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate FTShare public document loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          u="https://market.ft.tech/gateway/doc/assets/index-CBGSO5Wy.js"
          req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"})
          with urllib.request.urlopen(req,timeout=30) as r:
              t=r.read().decode("utf-8","replace")
          print("BYTES",len(t))

          def show(label, needle, limit=20, span=1800):
              print("\n###",label,repr(needle))
              pos=0
              n=0
              while n<limit:
                  i=t.find(needle,pos)
                  if i<0: break
                  print("\n--- HIT",n+1,"AT",i,"---")
                  print(t[max(0,i-span):min(len(t),i+span)].replace("\n"," ")[:span*2])
                  pos=i+len(needle)
                  n+=1
              print("HITS",n)

          for label,needle,limit in [
              ("FREE_CN","免费",10),
              ("PLAN_CN","套餐",10),
              ("ROUTE_P","/p/",20),
              ("SHARE_CODE","shareCode",20),
              ("SHARE_ID","shareId",20),
              ("PUBLIC_SHARE","publicShare",20),
              ("SHARE","share",30),
              ("SLUG","slug",20),
              ("AXIOS_CREATE","axios.create",10),
              ("BASE_URL","baseURL",20),
          ]:
              show(label,needle,limit)

          print("\n### STRING_LITERALS")
          vals=[]
          for q in (chr(34),chr(39),chr(96)):
              parts=t.split(q)
              for s in parts:
                  if 1<=len(s)<=240 and any(k in s.lower() for k in ("share","slug","public","page","doc")):
                      if s not in vals:
                          vals.append(s)
          for s in vals:
              if any(ch in s for ch in ("/","share","Share","slug","Slug","public","Public")):
                  print(repr(s))
          PY
