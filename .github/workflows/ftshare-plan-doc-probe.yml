name: ftshare-plan-doc-probe

on:
  push:
    branches:
      - probe/ftshare-20260921

permissions:
  contents: read

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch FTShare free-plan capability document JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url="https://market.ft.tech/gateway/doc/api/pages/pb8eizu3"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read()
              print("STATUS",r.status)
          envelope=json.loads(body.decode("utf-8"))
          print("CODE",envelope.get("code"))
          print("MSG",envelope.get("msg"))
          data=envelope.get("data") or {}
          print("DATA_KEYS",sorted(data.keys()) if isinstance(data,dict) else type(data).__name__)
          print("TITLE",data.get("title") if isinstance(data,dict) else None)
          print("LABEL",data.get("label") if isinstance(data,dict) else None)
          print("UPDATED",data.get("updated_at") if isinstance(data,dict) else None)
          content=data.get("content","") if isinstance(data,dict) else ""
          print("CONTENT_BEGIN")
          print(content)
          print("CONTENT_END")
          PY
