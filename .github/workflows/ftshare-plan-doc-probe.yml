name: ftshare-plan-doc-probe

on:
  push:
    branches:
      - probe/ftshare-20260921

permissions:
  contents: read

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect FTShare document frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read(), r.headers.get("Content-Type")

          page_url="https://market.ft.tech/gateway/doc/p/pb8eizu3"
          body,ctype=get(page_url)
          print("PAGE",json.dumps({"bytes":len(body),"content_type":ctype},ensure_ascii=False))

          js_url="https://market.ft.tech/gateway/doc/assets/index-CBGSO5Wy.js"
          js,jctype=get(js_url)
          text=js.decode("utf-8","replace")
          print("JS",json.dumps({"bytes":len(js),"content_type":jctype},ensure_ascii=False))

          needles=["/api/","/gateway/","document","share","slug","page","public","permission","free","plan","套餐","免费"]
          for needle in needles:
              print("COUNT",needle,text.count(needle))

          seen=set()
          markers=["/api/","axios","fetch(","document","share","slug","public","permission","plan"]
          emitted=0
          for marker in markers:
              start=0
              while emitted<180:
                  i=text.find(marker,start)
                  if i<0:
                      break
                  frag=text[max(0,i-280):min(len(text),i+1100)]
                  key=frag[:180]
                  if key not in seen:
                      seen.add(key)
                      print("CTX",marker,frag.replace("\n"," ")[:1500])
                      emitted+=1
                  start=i+len(marker)
              if emitted>=180:
                  break

          vals=[]
          for q in (chr(34), chr(39), chr(96)):
              parts=text.split(q)
              for s in parts:
                  if 4 <= len(s) <= 260 and any(k in s for k in ("/api/","/doc/","document","share","page","slug")):
                      if s not in vals:
                          vals.append(s)
          print("STRINGS_BEGIN")
          for s in vals[:500]:
              print(s)
          print("STRINGS_END")
          PY
