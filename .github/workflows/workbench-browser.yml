name: workbench-browser
on:
  pull_request:
    paths:
      - 'workbench/**'
      - '.github/workflows/workbench-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install isolated browser tooling (no project or business credentials)
        run: |
          python -m pip install -r workbench/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run real Workbench with offline synthetic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python workbench/browser/smoke.py --output "$RUNNER_TEMP/workbench-browser"
      - name: Retain actual browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbench-browser
          if-no-files-found: warn
          retention-days: 14
