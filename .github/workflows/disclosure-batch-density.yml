name: disclosure-batch-density

on:
  pull_request:
    paths:
      - '.github/workflows/disclosure-batch-density.yml'

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install current repo
        run: python -m pip install -e .
      - name: Measure live disclosure batches
        run: |
          python - <<'PY'
          from datetime import date

          from decision_kernel.runtime.cninfo_http import fetch_cninfo_disclosures
          from decision_kernel.runtime.disclosure_radar import group_disclosures_by_publication_date

          cases = (
              ('600519', '贵州茅台'),
              ('300750', '宁德时代'),
              ('600036', '招商银行'),
              ('601088', '中国神华'),
              ('603986', '兆易创新'),
          )
          names = dict(cases)
          start = date(2026, 8, 26)
          end = date(2026, 9, 2)

          all_announcements = []
          for code, _name in cases:
              batch = fetch_cninfo_disclosures(
                  stock_code=code,
                  start_date=start,
                  end_date=end,
                  timeout_seconds=20.0,
              )
              all_announcements.extend(batch.announcements)

          batches = group_disclosures_by_publication_date(all_announcements)
          print(f'WINDOW={start.isoformat()}..{end.isoformat()}')
          print(f'RAW_ANNOUNCEMENTS={len(all_announcements)}')
          print(f'DATED_BATCHES={len(batches)}')
          for batch in batches:
              print(
                  f'\nBATCH={batch.publication_date.isoformat()} '
                  f'{batch.stock_code} {names[batch.stock_code]} '
                  f'COUNT={len(batch.announcements)} '
                  f'FIRST={batch.first_published_at.isoformat()} '
                  f'LAST={batch.last_published_at.isoformat()}'
              )
              for item in batch.announcements:
                  print(f'  id={item.announcement_id} | {item.title}')
          PY
