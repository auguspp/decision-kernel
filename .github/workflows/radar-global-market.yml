name: radar-global-market
run-name: global-market / ${{ inputs.family }}
on:
  workflow_dispatch:
    inputs:
      code-sha:
        description: 'Reviewed exact current main with successful independent main CI'
        required: true
        type: string
      family:
        description: 'One finite source family only; Shibor is CNY interbank, not US Treasury'
        required: true
        type: choice
        options:
          - indices
          - shibor
      as-of-date:
        description: 'Optional YYYY-MM-DD; last 31 days, at most yesterday UTC. Blank uses yesterday.'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: radar-global-market-relay
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Confirm exact current main and its successful CI before any source call
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE"
          test "$GITHUB_SHA" = "$EXPECTED_CODE"
          current=$(gh api repos/auguspp/decision-kernel/git/ref/heads/main --jq '.object.sha')
          test "$current" = "$EXPECTED_CODE"
          gh api "repos/auguspp/decision-kernel/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$EXPECTED_CODE&per_page=10" > "$RUNNER_TEMP/global-market-ci.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          runs=json.loads((Path(os.environ['RUNNER_TEMP'])/'global-market-ci.json').read_text())['workflow_runs']
          assert runs, 'No independent main CI for this code'
          r=max(runs,key=lambda v:v['run_number'])
          assert r['head_sha']==os.environ['EXPECTED_CODE'] and r['head_branch']=='main'
          assert r['repository']['full_name']=='auguspp/decision-kernel'
          assert r['head_repository']['full_name']=='auguspp/decision-kernel'
          assert r['path']=='.github/workflows/ci.yml' and r['event']=='push'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          print('Exact independent main CI confirmed:',r['id'])
          PY
      - name: Install existing source dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Capture one explicitly selected family with the unchanged Relay client
        id: capture
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
          FAMILY: ${{ inputs.family }}
          AS_OF: ${{ inputs.as-of-date }}
        run: |
          args=()
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -m decision_kernel.runtime.global_market_context --family "$FAMILY" \
            --output "$RUNNER_TEMP/global-market" "${args[@]}"
      - name: Replay retained responses without source credentials
        if: always() && steps.capture.outcome != 'skipped' && steps.capture.outcome != ''
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from decision_kernel.runtime import global_market_context as g
          root=Path(os.environ['RUNNER_TEMP'])/'global-market'
          result=g.replay({p.name:p.read_bytes() for p in root.iterdir()},g.identity(os.environ),g.relay.now())
          print(json.dumps({'status':result['status'],'available_values':result['available_values'],
                            'capture_hash':result['capture_hash'],'source_calls_during_replay':0}))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(g.render(result))
          PY
      - name: Retain original responses and partial checkpoints
        if: always() && steps.capture.outcome != 'skipped' && steps.capture.outcome != ''
        uses: actions/upload-artifact@v7
        with:
          name: global-market-${{ inputs.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/global-market/
          retention-days: 30
          if-no-files-found: warn
