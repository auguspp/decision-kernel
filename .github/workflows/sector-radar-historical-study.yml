name: sector-radar-historical-study

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact prior Sector workflow run that owns the frozen state artifact
        required: true
        type: string
      expected_state_hash:
        description: Exact validated Sector market-state hash expected from the source artifact
        required: true
        type: string
      expected_market_session:
        description: Exact completed market session represented by the frozen state
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: sector-radar-historical-study-${{ inputs.source_run_id }}-${{ inputs.expected_state_hash }}
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require reviewed main and one fresh attempt
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Install existing package
        run: python -m pip install -e .
      - name: Download exact frozen Sector state
        uses: actions/download-artifact@v8
        with:
          name: sector-radar-state-bundle
          path: source-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          digest-mismatch: error
      - name: Validate exact frozen state identity
        env:
          EXPECTED_STATE_HASH: ${{ inputs.expected_state_hash }}
          EXPECTED_MARKET_SESSION: ${{ inputs.expected_market_session }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from decision_kernel.runtime.sector_radar_state import load_sector_radar_market_state

          path = Path("source-state/market-state.json")
          if not path.is_file() or path.is_symlink():
              raise SystemExit("expected one regular frozen market-state.json")
          state = load_sector_radar_market_state(path)
          if state.state_hash != os.environ["EXPECTED_STATE_HASH"]:
              raise SystemExit("downloaded Sector state hash disagrees with explicit expected identity")
          if state.sessions[-1].isoformat() != os.environ["EXPECTED_MARKET_SESSION"]:
              raise SystemExit("downloaded Sector market session disagrees with explicit expected identity")
          if state.human_attention_authority != "NONE":
              raise SystemExit("frozen Sector state unexpectedly carries Human attention authority")
          if state.investment_authority != "NONE":
              raise SystemExit("frozen Sector state unexpectedly carries investment authority")
          print(f"validated frozen Sector state {state.state_hash} @ {state.sessions[-1].isoformat()}")
          PY
      - name: Run merged frozen-universe historical study
        id: execute
        shell: bash
        run: |
          generated_at="$(date -u +%FT%TZ)"
          python -m decision_kernel.runtime.sector_radar_historical_study \
            --state source-state/market-state.json \
            --generated-at "$generated_at" \
            --output historical-study
          printf 'generated_at=%s\n' "$generated_at" >> "$GITHUB_OUTPUT"
      - name: Verify sealed study and retain execution receipt
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_STATE_HASH: ${{ inputs.expected_state_hash }}
          EXPECTED_MARKET_SESSION: ${{ inputs.expected_market_session }}
          GENERATED_AT: ${{ steps.execute.outputs.generated_at }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from decision_kernel.identity import canonical_hash, canonical_json

          study_path = Path("historical-study/study.json")
          report = json.loads(study_path.read_text(encoding="utf-8"))
          payload = report["study"]
          if report["study_hash"] != canonical_hash(payload):
              raise SystemExit("historical study hash verification failed")
          if payload["source_state_hash"] != os.environ["EXPECTED_STATE_HASH"]:
              raise SystemExit("historical study source-state hash drifted")
          if payload["source_state_session"] != os.environ["EXPECTED_MARKET_SESSION"]:
              raise SystemExit("historical study source session drifted")
          if payload["historical_universe_identity_qualification"] != "FROZEN_UNIVERSE_PRICE_PATH_ONLY__CATALOG_EFFECTIVE_DATE_NOT_INDEPENDENTLY_PROVEN":
              raise SystemExit("historical study universe qualification drifted")
          if payload["edge_acceptance"] != "NOT_CERTIFIED__HISTORICAL_CATALOG_EFFECTIVE_DATE_UNKNOWN":
              raise SystemExit("historical study edge qualification drifted")
          for field in (
              "signal_transition_authority",
              "research_authority",
              "human_attention_authority",
              "investment_authority",
          ):
              if payload[field] != "NONE":
                  raise SystemExit(f"historical study unexpectedly acquired {field}")

          receipt = {
              "schema_version": 1,
              "semantics": "READ_ONLY_HISTORICAL_STUDY_EXECUTION_RECEIPT",
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_artifact_name": "sector-radar-state-bundle",
              "expected_state_hash": os.environ["EXPECTED_STATE_HASH"],
              "expected_market_session": os.environ["EXPECTED_MARKET_SESSION"],
              "study_hash": report["study_hash"],
              "code_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "generated_at": os.environ["GENERATED_AT"],
              "market_state_writes": 0,
              "provider_requests": 0,
              "research_authority": "NONE",
              "human_attention_authority": "NONE",
              "investment_authority": "NONE",
          }
          receipt["receipt_hash"] = canonical_hash(receipt)
          Path("historical-study/execution.json").write_text(
              canonical_json(receipt) + "\n", encoding="utf-8"
          )
          print(f"sealed historical study {report['study_hash']}")
          PY
      - name: Retain read-only historical study
        id: evidence
        uses: actions/upload-artifact@v7
        with:
          name: sector-radar-historical-study-${{ github.run_id }}-${{ github.run_attempt }}
          path: historical-study/
          if-no-files-found: error
          retention-days: 90
      - name: Publish read-only study summary
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          cat historical-study/summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nExecution source run: `%s`; code commit: `%s`.\n' "${{ inputs.source_run_id }}" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'This is a frozen-universe historical price-path study, not natural production, Research, Odds, Action, or Investment Authority.\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Historical study artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
