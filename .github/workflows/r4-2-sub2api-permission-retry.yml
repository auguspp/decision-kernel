name: R4-2 explicitly approved Sub2API permission retry
on:
  push:
    branches: [ops/r4-2-sub2api-permission-retry-1-20260923]
permissions:
  contents: write
  actions: read
concurrency:
  group: r4-2-sub2api-20260923-v1
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EVAL_CODE_SHA: e8b06ae6a7a4df5201eb501c28130ff7a1692fda
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e8b06ae6a7a4df5201eb501c28130ff7a1692fda
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install unchanged pinned execution dependencies
        run: python -m pip install -e '.[research-api,documents,feeds]'
      - name: Continue the existing experiment after explicit Human retry permission
        env:
          GH_TOKEN: ${{ github.token }}
          SUB2API_API_KEY: ${{ secrets.SUB2API_API_KEY }}
          R4_2_RETRY_APPROVAL: '5797702255'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVAL_CODE_SHA"
          test -n "$SUB2API_API_KEY"
          test "$(gh api repos/auguspp/decision-kernel/actions/runs/35882616610 --jq '.status + ":" + .conclusion + ":" + .head_sha')" = "completed:success:$EVAL_CODE_SHA"
          mkdir -p "$RUNNER_TEMP/r4-retry"
          printf 'code=%s\nevent=%s\nrun=%s\nattempt=%s\n' "$EVAL_CODE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/r4-retry/identity.txt"
          python -m pip list --format=json > "$RUNNER_TEMP/r4-retry/packages.json"
          python experiments/r4_2_resume403.py 2>&1 | tee "$RUNNER_TEMP/r4-retry/execution.log"
      - name: Preserve actual diagnostics even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p research_runs/evaluations/r4-2-sub2api-20260923-v1/continuations/permission-retry-1/diagnostics
          if test -d "$RUNNER_TEMP/r4-retry"; then cp "$RUNNER_TEMP/r4-retry/"* research_runs/evaluations/r4-2-sub2api-20260923-v1/continuations/permission-retry-1/diagnostics/; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-2-sub2api-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: research_runs/evaluations/r4-2-sub2api-20260923-v1/continuations/permission-retry-1/
          if-no-files-found: error
          retention-days: 30
