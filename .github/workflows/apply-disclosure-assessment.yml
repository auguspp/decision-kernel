name: apply-disclosure-assessment

on:
  workflow_dispatch:
    inputs:
      scan_run_id:
        description: decision-inbox workflow run id that produced the official-disclosure-scan artifact
        required: true
        type: string
      packet_filename:
        description: Exact assessment packet filename from that scan summary
        required: true
        type: string
      assessment_json:
        description: Compact DisclosureResearchAssessment JSON from the external Research producer
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: disclosure-receipt-memory
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Restore best-effort disclosure receipt memory
        id: disclosure-memory
        uses: actions/cache/restore@v4
        with:
          path: decision-state/disclosure-receipts.json
          key: disclosure-receipts-apply-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            disclosure-receipts-state-
      - name: Download exact disclosure scan artifact
        uses: actions/download-artifact@v8
        with:
          name: official-disclosure-scan
          path: disclosure-handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.scan_run_id }}
      - name: Materialize exact packet and external assessment
        shell: bash
        env:
          PACKET_FILENAME: ${{ inputs.packet_filename }}
          ASSESSMENT_JSON: ${{ inputs.assessment_json }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          packet_filename = os.environ["PACKET_FILENAME"].strip()
          packet_name = Path(packet_filename)
          if not packet_filename or packet_name.name != packet_filename or packet_name.suffix != ".json":
              raise SystemExit("packet_filename must be one exact JSON basename from the scan artifact")

          source = Path("disclosure-handoff/disclosure-assessment-packets") / packet_filename
          if not source.is_file():
              candidates = sorted(
                  path.name
                  for path in Path("disclosure-handoff/disclosure-assessment-packets").glob("*.json")
              )
              raise SystemExit(
                  f"packet not found in scan artifact: {packet_filename}; available={candidates}"
              )

          raw_assessment = os.environ["ASSESSMENT_JSON"]
          try:
              assessment_payload = json.loads(raw_assessment)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"assessment_json must contain valid JSON: {exc}") from exc
          if not isinstance(assessment_payload, dict):
              raise SystemExit("assessment_json must contain one JSON object")

          audit_dir = Path("disclosure-assessment-application")
          audit_dir.mkdir(parents=True, exist_ok=True)
          packet_path = audit_dir / "packet.json"
          assessment_path = audit_dir / "assessment.json"
          shutil.copyfile(source, packet_path)
          assessment_path.write_text(
              json.dumps(assessment_payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(packet_path)
          PY
      - name: Apply exact semantic assessment
        id: apply-assessment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p decision-state
          decision-kernel apply-disclosure-assessment \
            disclosure-assessment-application/packet.json \
            disclosure-assessment-application/assessment.json \
            --receipts decision-state/disclosure-receipts.json | tee disclosure-assessment-application/result.txt

          if grep -q '^RECEIPT: RECORDED' disclosure-assessment-application/result.txt; then
            echo 'memory_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'memory_changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save updated best-effort disclosure receipt memory
        if: success() && steps.apply-assessment.outputs.memory_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: decision-state/disclosure-receipts.json
          key: disclosure-receipts-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish assessment summary
        if: always()
        shell: bash
        env:
          SCAN_RUN_ID: ${{ inputs.scan_run_id }}
          PACKET_FILENAME: ${{ inputs.packet_filename }}
        run: |
          {
            echo "## Disclosure Research assessment"
            echo
            echo "Source scan run: \`$SCAN_RUN_ID\`"
            echo
            echo "Packet: \`$PACKET_FILENAME\`"
            echo
            if [ -f disclosure-assessment-application/result.txt ]; then
              echo '```text'
              cat disclosure-assessment-application/result.txt
              echo '```'
            else
              echo "The exact packet/assessment pair failed before a Research Funnel result was produced."
            fi
            echo
            echo "Only existing Research Funnel quiet states may update best-effort receipt memory. DEEPEN_REQUIRED remains actionable and unreceipted."
            echo
            echo "This workflow does not perform semantic Research, create a Recommendation, invoke Human Surface, or gain investment authority."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload assessment audit snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disclosure-assessment-application-${{ github.run_id }}
          path: |
            disclosure-assessment-application/
            decision-state/disclosure-receipts.json
          if-no-files-found: warn
          retention-days: 30
