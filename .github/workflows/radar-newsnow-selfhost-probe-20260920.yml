name: radar-newsnow-selfhost-probe-20260920

on:
  push:
    branches: [probe/newsnow-selfhost-20260920]

permissions:
  contents: read
  packages: read

jobs:
  newsnow-selfhost-probe:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing feed dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Start upstream NewsNow container
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/ourongxing/newsnow:latest
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}} {{.Id}}' > "$RUNNER_TEMP/newsnow-image-identity.txt"
          docker run -d --name newsnow -p 4444:4444 \
            -e HOST=0.0.0.0 -e PORT=4444 -e NODE_ENV=production \
            -e ENABLE_CACHE=false -e INIT_TABLE=true \
            "$image"
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4444/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Probe seven finance sources through self-hosted NewsNow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin \
            refs/heads/read-model/current-state:refs/remotes/origin/read-model-current-state
          test "$(git rev-parse refs/remotes/origin/read-model-current-state)" = \
            "9e46792c1cb813e9fb1297c674d13c2d7a13b8d9"
          git show 9e46792c1cb813e9fb1297c674d13c2d7a13b8d9:details/radar/company-reading.json \
            > "$RUNNER_TEMP/company-reading.json"
          test "$(git hash-object "$RUNNER_TEMP/company-reading.json")" = \
            "5658cddfadaba10624f20f4b90d47598d4e00184"
          python eval/news_radar_reuse_probe.py \
            --newsnow-base-url http://127.0.0.1:4444/api/s \
            --company-reading "$RUNNER_TEMP/company-reading.json" \
            --output "$RUNNER_TEMP/news-selfhost"
          cp "$RUNNER_TEMP/newsnow-image-identity.txt" "$RUNNER_TEMP/news-selfhost/newsnow-image-identity.txt"
          printf '%s\n' 'R=9e46792c1cb813e9fb1297c674d13c2d7a13b8d9 blob=5658cddfadaba10624f20f4b90d47598d4e00184' \
            > "$RUNNER_TEMP/news-selfhost/company-reading-identity.txt"
          docker logs newsnow > "$RUNNER_TEMP/news-selfhost/newsnow-container.log" 2>&1 || true
          test -s "$RUNNER_TEMP/news-selfhost/summary.json"
          test -s "$RUNNER_TEMP/news-selfhost/news-observations.json"
      - name: Stop local service
        if: always()
        run: docker rm -f newsnow >/dev/null 2>&1 || true
      - name: Retain self-hosted NewsNow receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newsnow-selfhost-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/news-selfhost/
          if-no-files-found: warn
          retention-days: 30
