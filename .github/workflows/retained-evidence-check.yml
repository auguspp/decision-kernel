name: retained-evidence-check
on:
  push:
    branches: [diagnostic/inbox-sector-evidence-20260925]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 75398ca2821c2dbe6371f84de7c8c744a26b67cb
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - name: Verify exact final full CI bytes without re-running tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,runpy
          from pathlib import Path
          r=runpy.run_path('.github/scripts/ci-merge-reuse.py');root=Path.cwd()
          run=r['api'](root,'actions/runs/36117644993')
          head='75398ca2821c2dbe6371f84de7c8c744a26b67cb'
          assert run['head_sha']==head and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1 and run['event']=='pull_request'
          meta=r['api'](root,'actions/artifacts/10855772223')
          assert meta['workflow_run']['head_sha']==head and meta['workflow_run']['id']==36117644993
          raw=r['command'](root,'gh','api','repos/auguspp/decision-kernel/actions/artifacts/10855772223/zip')
          assert len(raw)==1818111 and hashlib.sha256(raw).hexdigest()=='54291ec840fb923ac3aaf7c79cd8206a151c8e95693838d71318f89e40930f87'
          with r['verified_archive'](raw,meta) as z:
              env=json.loads(z.read('environment.json'))
              count=r['full_evidence'](raw,meta,run,env)
              assert count==6108
              print('FULL_EVIDENCE_REBUILT',json.dumps({'head':head,'run':run['id'],'artifact':meta['id'],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'tests':count,'identity':z.read('identity.txt').decode(),'scope':json.loads(z.read('scope.json'))}))
          print('Downloaded archives are data only. Original test environment checked across nested groups; this host is not the original test host. No source calls, test reruns, or production writes.')
          PY
