name: retained-evidence-check
on:
  push:
    branches: [diagnostic/inbox-sector-evidence-20260925]
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d10459d478cdc6ea6a8feaa24dad35031f4f71f1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[discovery]'
      - name: Validate retained source and archive exact bytes to the isolated evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,io,json,hashlib,subprocess,tempfile,zipfile
          from pathlib import Path, PurePosixPath
          from decision_kernel.runtime import sector_radar_audit as audit
          repo='repos/auguspp/decision-kernel/'
          def api(method,path,body=None):
              cmd=['gh','api','-X',method,repo+path]
              if body is not None:cmd+=['--input','-']
              raw=subprocess.run(cmd,input=None if body is None else json.dumps(body).encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout
              return json.loads(raw)
          branch='research/e2e-market-20260925';parent='d10459d478cdc6ea6a8feaa24dad35031f4f71f1'
          assert api('GET','git/ref/heads/'+branch)['object']['sha']==parent
          raw=subprocess.check_output(['gh','api',repo+'actions/artifacts/10854970574/zip'])
          assert len(raw)==824854 and hashlib.sha256(raw).hexdigest()=='fd343eaf142e0a428cfc46f1fde3b9d22d9d080d34f95860b3d89320e4015e18'
          with zipfile.ZipFile(io.BytesIO(raw)) as z, tempfile.TemporaryDirectory() as tmp:
              assert z.testzip() is None and len(z.namelist())==len(set(z.namelist()))
              root=Path(tmp)
              for name in z.namelist():
                  p=PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
                  dest=root/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(z.read(name))
              manifest=audit.validate_sector_radar_input_audit_integrity(root/'input-audit')
              assert manifest['audit_hash']=='1c78947cc29464e07478240684e9195049a4940fc245de79d1c995d008b2c1f2'
              replay=audit.replay_sector_radar_input_audit(root/'input-audit')
              print('ORIGINAL_REPLAY',json.dumps(replay,default=str))
              assert replay['status']=='MATCHED_REJECTED'
              prep=z.read('preparation.json')
              assert prep==z.read('input-audit/expected/output/preparation.json')
              print('PREPARATION',prep.decode())
              files={'docs/readings/e2e-2026-09-25/sector-20260924-preparation.json':prep,
                     'docs/readings/e2e-2026-09-25/sector-20260924-preparation.md':z.read('preparation.md'),
                     'docs/readings/e2e-2026-09-25/sector-36113627698-audit.zip':raw}
          note='''# 9/24 Sector 补采：指数准备结果已取得，完整生产未通过\n\n2026-09-25 实际取得的9/24完成日指数输入，从9/23原状态推进计算；不是9/24当时已知。Source run36113627698/attempt1；source code f09a4f444e8a9ad25af258e888e0b9fa10cb037d。\n\n原审计ZIP824854bytes、SHA256 fd343eaf142e0a428cfc46f1fde3b9d22d9d080d34f95860b3d89320e4015e18；原manifest 1c78947cc29464e07478240684e9195049a4940fc245de79d1c995d008b2c1f2。使用既有validator和replayer验证MATCHED_REJECTED，preparation是原包相同字节的已完成指数准备结果；不是整个run成功、最终Sector result、股票资格或生产恢复权威。\n\n27份成员表为9/25取得的当前成员，不冒充9/24历史PIT。全市场snapshot第一页面时间9/25，与目标完成日9/24不同；无逐股票市场日证明，保留拒绝。不覆盖旧失败、不改state/ledger、不触发Stock。Quick可把有范围的指数观察作为线索自行研究，不据此认定经营受益。AI Investment Authority=NONE。\n\n原始ZIP在本Git目录独立保存，不冒称普通read-model已经物化或ON_DEMAND reader已验；本次研究从精确Git commit读取准备结果。'''
          files['docs/readings/e2e-2026-09-25/sector-source-status.md']=note.encode()
          entries=[];receipt=[]
          for path,data in files.items():
              blob=api('POST','git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})['sha']
              assert blob==hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob})
              receipt.append({'path':path,'blob':blob,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          tree=api('POST','git/trees',{'base_tree':api('GET','git/commits/'+parent)['tree']['sha'],'tree':entries})['sha']
          commit=api('POST','git/commits',{'message':'retain: actual 9/24 Sector prefix and rejected source archive for E2E research','tree':tree,'parents':[parent]})['sha']
          assert api('GET','git/ref/heads/'+branch)['object']['sha']==parent
          api('PATCH','git/refs/heads/'+branch,{'sha':commit,'force':False})
          for item in receipt:
              saved=api('GET','git/blobs/'+item['blob'])
              data=base64.b64decode(saved['content'])
              assert hashlib.sha256(data).hexdigest()==item['sha256']
          print('GIT_ARCHIVE_READBACK',json.dumps({'commit':commit,'files':receipt,'source_calls':0,'production_state_updated':False}))
          PY
