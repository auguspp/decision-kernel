name: retained-evidence-check
on:
  push:
    branches: [diagnostic/inbox-sector-evidence-20260925]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8a6dc40e61f0f1c75b9ec8d7199183a98bdb085a
          persist-credentials: false
      - name: Prepare exact test changes as unreferenced Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import ast,base64,hashlib,json,subprocess
          from pathlib import Path
          files={}
          specs=[('tests/test_current_state.py','6fbf197a059b1b6ac12e6a3c693ab83a6ca25cc9'),('tests/test_sanhua_full_research_v1.py','458f4a5dea2feec4b04a7609f4aa358a93579a9c')]
          for path,sha in specs:
              raw=Path(path).read_bytes()
              assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()==sha
              text=raw.decode()
              if path.endswith('test_current_state.py'):
                  old='    assert "research_cases/603986-gigadevice-deep-research-v2.json" in production\n    assert "research_cases/002050-sanhua-deep-research-v1.json" in production\n'
                  new='    # R5 retires automatic legacy Odds, not stored research or Human history.\n    assert production == []\n'
              else:
                  old='    # The current workflow deliberately uses the same frozen Research in three\n    # separate Harness contexts: Human Inbox, non-authoritative Surprise Radar\n    # history sampling, and official-disclosure acquisition. None of these\n    # occurrences creates another investment-authority or Human-wake policy.\n    assert workflow.count(path) == 3\n'
                  new='    # R5 retains only non-authoritative shadow and disclosure uses.\n    # Daily typed Watch does not re-run this legacy probability package.\n    assert workflow.count(path) == 2\n    decision_block = workflow.split("decision_packages=(", 1)[1].split(")", 1)[0]\n    assert path not in decision_block\n'
              assert text.count(old)==1
              text=text.replace(old,new);ast.parse(text)
              data=text.encode()
              result=json.loads(subprocess.run(['gh','api','-X','POST','repos/auguspp/decision-kernel/git/blobs','--input','-'],input=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),stdout=subprocess.PIPE,check=True).stdout)
              files[path]=result['sha']
          print('TEST_BLOBS',json.dumps(files))
          print('History, registry/authority checks and production validators retained. No ref or source writes.')
          PY
