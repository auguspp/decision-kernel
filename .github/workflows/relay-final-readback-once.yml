name: relay-final-readback-once
on:
  push:
    branches: [work/relay-final-readback-20260926]
    paths: [.github/workflows/relay-final-readback-once.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 97d261a880d1c418c942de95808d97b92070d169
          path: code
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 13eaef475e4f20c505556540ba45bde8bb8559a2
          path: reading
          persist-credentials: false
      - name: Export immutable tracked source and bounded reading data only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path, PurePosixPath
          M = '97d261a880d1c418c942de95808d97b92070d169'
          R = '13eaef475e4f20c505556540ba45bde8bb8559a2'
          out = Path(os.environ['RUNNER_TEMP']) / 'relay-readback'
          out.mkdir()
          def git(folder, *args):
              return subprocess.check_output(['git', '-C', folder, *args])
          assert git('code', 'rev-parse', 'HEAD').decode().strip() == M
          assert git('reading', 'rev-parse', 'HEAD').decode().strip() == R
          (out / 'source.zip').write_bytes(git('code', 'archive', '--format=zip', M))
          (out / 'code-tree.txt').write_bytes(git('code', 'ls-tree', '-r', M))
          (out / 'reading-tree.txt').write_bytes(git('reading', 'ls-tree', '-r', R))
          (out / 'identity.json').write_text(json.dumps({'M':M,'R':R,'code_tree':git('code','rev-parse','HEAD^{tree}').decode().strip(),'reading_tree':git('reading','rev-parse','HEAD^{tree}').decode().strip()}, sort_keys=True))
          names = set(git('reading','ls-tree','-r','--name-only',R).decode().splitlines())
          chosen = {'README.md','current-state.json','details/radar/smart-money.md'}
          chosen.update(n for n in names if n.startswith('details/radar/smart-money/') and n.endswith(('.json','.gz')))
          pending = list(chosen)
          receipts = {}
          missing = []
          total = 0
          def references(value):
              if isinstance(value, dict):
                  path = value.get('read_path')
                  if isinstance(path, str) and re.fullmatch(r'sources/artifacts/[0-9a-f]{64}\.zip',path):
                      yield path
                  for child in value.values():
                      yield from references(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from references(child)
          while pending:
              name = pending.pop()
              if name in receipts or name in missing:
                  continue
              assert not PurePosixPath(name).is_absolute() and '..' not in PurePosixPath(name).parts
              if name not in names:
                  missing.append(name)
                  continue
              src = Path('reading') / name
              assert src.is_file() and not src.is_symlink()
              raw = src.read_bytes()
              total += len(raw)
              assert total <= 100 * 1024 * 1024 and len(receipts) < 100
              blob = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert git('reading','rev-parse',R+':'+name).decode().strip() == blob
              dest = out / 'reading' / name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(raw)
              receipts[name] = {'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'git_blob':blob}
              if name.endswith('.json') and name != 'current-state.json':
                  pending.extend(references(json.loads(raw)))
          (out / 'export-manifest.json').write_text(json.dumps({'M':M,'R':R,'files':receipts,'missing_at_this_R':sorted(missing),'total_reading_bytes':total},sort_keys=True))
          print(json.dumps({'files':len(receipts),'reading_bytes':total,'missing':len(missing),'source_requests':0}))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: relay-final-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relay-readback/
          if-no-files-found: error
          retention-days: 30
