name: ftshare-zhenjiang-discovery
on:
  push:
    branches: [probe/ftshare-zhenjiang-discovery-20260921]
    paths: [.github/workflows/ftshare-zhenjiang-discovery.yml]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read two public announcement indexes without model or secret access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          """Two fixed public FTShare announcement-index reads; not issuer-PDF custody."""
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          
          OUT = Path('ftshare-discovery')
          BASE = 'https://market.ft.tech/gateway/api/v1/market/data/report-announcements/list'
          TARGETS = [('000920', '20260821'), ('603507', '20260826')]
          LIMIT = 2 * 1024 * 1024
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def now():
              return datetime.now(timezone.utc).isoformat()
          
          def main():
              assert os.environ['GITHUB_REPOSITORY'] == 'auguspp/decision-kernel'
              assert os.environ['GITHUB_REF'] == 'refs/heads/probe/ftshare-zhenjiang-discovery-20260921'
              assert os.environ['GITHUB_EVENT_NAME'] == 'push'
              assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
              OUT.mkdir(exist_ok=False)
              report = {'kind':'PUBLIC_DISCLOSURE_DISCOVERY_ONLY', 'provider':'FTSHARE',
                  'code_commit':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
                  'started_at':now(), 'requests':[], 'model_calls':0, 'pdf_calls':0,
                  'investment_authority':'NONE', 'source_custody':'NOT_ESTABLISHED',
                  'scope':'Two fixed issuer/date index queries. Not a full disclosure inventory.',
                  'auth_header_used':False, 'automatic_retry':False}
              opener = urllib.request.build_opener(NoRedirect())
              for code, date in TARGETS:
                  params = {'date':date, 'sec_code':code, 'page':1, 'page_size':200}
                  url = BASE + '?' + urllib.parse.urlencode(params)
                  entry = {'parameters':params, 'url':url, 'started_at':now()}
                  body = None
                  try:
                      req = urllib.request.Request(url, headers={'Accept':'application/json',
                          'User-Agent':'decision-kernel-public-discovery/1'}, method='GET')
                      with opener.open(req, timeout=30) as response:
                          body = response.read(LIMIT + 1)
                          entry.update(http_status=response.status,
                              content_type=response.headers.get('Content-Type'))
                  except urllib.error.HTTPError as exc:
                      body = exc.read(LIMIT + 1)
                      entry.update(http_status=exc.code, error_type=type(exc).__name__)
                  except (OSError, ValueError) as exc:
                      entry['error_type'] = type(exc).__name__
                  if body is not None:
                      entry.update(bytes=len(body), sha256=hashlib.sha256(body).hexdigest())
                      if len(body) > LIMIT:
                          entry.update(status='RESPONSE_BYTE_LIMIT_EXCEEDED', body_complete=False)
                      else:
                          name = code + '-' + date + '.json'
                          with (OUT / name).open('xb') as f:
                              f.write(body)
                          entry.update(raw_path=name, body_complete=True)
                          try:
                              value = json.loads(body)
                              entry['json_type'] = type(value).__name__
                              if isinstance(value, dict):
                                  entry['top_level_fields'] = sorted(value)
                              entry['status'] = 'INDEX_RETURN_SAVED_NOT_PRIMARY_EVIDENCE'
                          except (ValueError, UnicodeError):
                              entry['status'] = 'NON_JSON_RESPONSE'
                  entry['finished_at'] = now()
                  report['requests'].append(entry)
              report['finished_at'] = now()
              with (OUT / 'receipt.json').open('x', encoding='utf-8') as f:
                  json.dump(report, f, ensure_ascii=False, indent=2)
              print(json.dumps(report, ensure_ascii=False))
          
          if __name__ == '__main__':
              main()
          PY
      - name: Retain source-discovery responses and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ftshare-discovery-${{ github.run_id }}-1
          path: ftshare-discovery/
          if-no-files-found: error
          retention-days: 30
