name: gpt56sol-cognition-dogfood

on:
  pull_request:
    paths:
      - '.github/workflows/gpt56sol-cognition-dogfood.yml'

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install current repo
        run: python -m pip install -e '.[dev]'
      - name: Materialize current-chat semantic candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          from decision_kernel.identity import canonical_hash
          from decision_kernel.research_funnel import (
              DiscoveryInput,
              DiscoveryObservation,
              DiscoverySource,
              PreResearchResult,
              PreResearchRoute,
              QuickResearchResult,
              QuickResearchRoute,
              ResearchClaim,
              ResearchClaimKind,
          )
          from decision_kernel.runtime.disclosure_assessment import parse_disclosure_assessment_packet
          from decision_kernel.runtime.disclosure_research import DisclosureResearchAssessment

          corpus = json.loads(Path('eval/disclosure_cognition/catl-v0.json').read_text(encoding='utf-8'))
          out = Path('gpt56sol-cognition-dogfood')
          raw_dir = out / 'raw'
          assessment_dir = out / 'assessments'
          raw_dir.mkdir(parents=True)
          assessment_dir.mkdir(parents=True)

          # These semantic specs are the current ChatGPT conversation's direct judgments over the
          # frozen packet text. This is intentionally a non-blind dogfood run: the conversation has
          # prior knowledge of the historical corpus. The experiment therefore tests the cognition
          # seam and auditability, not independent benchmark accuracy.
          specs = {
              '300750-2026-07-30': {
                  'economic_direction': 'capital-return process administration',
                  'observations': [
                      {
                          'statement': 'The filing discloses top shareholder lists around the previously announced A-share repurchase process and contains no repurchase execution evidence.',
                          'announcement_ids': ['1225448968'],
                      },
                  ],
                  'what_is_this': 'A procedural shareholder-list filing tied to an already announced A-share repurchase proposal.',
                  'business_role': 'Governance and disclosure administration around a capital-return process, not operating performance.',
                  'driver': 'Only later approval and actual repurchase cash deployment could materially affect per-share capital allocation.',
                  'expectation': 'The frozen Research already questions cash conversion and capital intensity; shareholder-list composition does not resolve those questions.',
                  'claims': [
                      {
                          'statement': 'The 2026-07-30 filing provides required shareholder lists for the repurchase process rather than repurchase execution data.',
                          'kind': 'FACT',
                          'announcement_ids': ['1225448968'],
                      },
                  ],
                  'contradiction': 'No operating or cash-conversion contradiction is established by this filing.',
                  'unknown': 'Whether the proposed repurchase is approved and then executed at a meaningful scale.',
                  'next_search': 'Use later shareholder-approval and repurchase-progress filings to observe actual capital deployment.',
                  'stop_condition': 'Stop if the filing adds no execution, operating, or capital-deployment evidence.',
                  'pre_route': 'STOP',
                  'pre_reason': 'The filing is procedural and does not independently change the frozen Research decision context.',
              },
              '300750-2026-08-04': {
                  'economic_direction': 'cash distribution and shareholder capital return',
                  'observations': [
                      {
                          'statement': 'CATL implemented an A-share interim cash dividend of RMB1.411 per participating share, totaling RMB6,180,230,196.33.',
                          'announcement_ids': ['1225456175'],
                      },
                  ],
                  'what_is_this': 'Implementation of a previously approved 2026 interim A-share cash dividend.',
                  'business_role': 'A direct cash distribution to shareholders that uses corporate liquidity but does not itself update battery demand, margins, utilization, or capex.',
                  'driver': 'Capital returns matter to the frozen thesis only together with sustainable operating cash conversion after reinvestment.',
                  'expectation': 'The frozen Research already asks whether profit growth converts into cash strongly enough to support capital intensity and shareholder returns.',
                  'claims': [
                      {
                          'statement': 'The implemented A-share interim dividend totals RMB6.180bn, equal to RMB1.411 per participating share.',
                          'kind': 'FACT',
                          'announcement_ids': ['1225456175'],
                      },
                  ],
                  'contradiction': 'Execution confirms a real cash return but does not establish that future free-cash-flow conversion can sustain dividends, repurchases, and expansion together.',
                  'unknown': 'Whether operating cash flow after capex can sustain this level of shareholder distributions and future repurchases without weakening incremental returns.',
                  'next_search': 'Compare the next quarterly operating cash flow and capex with actual repurchase cash deployment.',
                  'stop_condition': 'Do not deepen unless later execution or operating evidence changes the cash-conversion question.',
                  'pre_route': 'WAIT_FOR_TRIGGER',
                  'pre_reason': 'The payout is decision-relevant cash-return execution, but mostly implements a pre-cutoff plan and is insufficient to change the frozen thesis by itself.',
              },
              '300750-2026-08-06': {
                  'economic_direction': 'routine securities administration',
                  'observations': [
                      {
                          'statement': 'The filing is CATL’s monthly securities return and does not present a new operating, cash-flow, or capital-allocation event material to the frozen Research questions.',
                          'announcement_ids': ['1225462006'],
                      },
                  ],
                  'what_is_this': 'A routine monthly securities-return filing.',
                  'business_role': 'Administrative share-capital reporting rather than evidence about battery operations or cash conversion.',
                  'driver': 'Only economically material issuance, dilution, or financing would alter per-share economics in the current Research context.',
                  'expectation': 'Routine securities administration does not change the market-expectation hypothesis around growth, competition, cash conversion, or capital intensity.',
                  'claims': [
                      {
                          'statement': 'The 2026-08-06 document is a routine monthly securities-return filing rather than an operating-results disclosure.',
                          'kind': 'FACT',
                          'announcement_ids': ['1225462006'],
                      },
                  ],
                  'contradiction': 'No decision-relevant contradiction or support is established.',
                  'unknown': 'No new material unknown beyond the frozen Research questions.',
                  'next_search': 'No follow-up unless a later securities change becomes economically material.',
                  'stop_condition': 'Stop when share-capital administration remains immaterial to the frozen thesis.',
                  'pre_route': 'STOP',
                  'pre_reason': 'The filing is administrative and does not warrant additional Research budget.',
              },
              '300750-2026-08-07': {
                  'economic_direction': 'capital-return process administration',
                  'observations': [
                      {
                          'statement': 'The filing provides shareholder lists for the repurchase shareholder-meeting record date and contains no repurchase execution evidence.',
                          'announcement_ids': ['1225464975'],
                      },
                  ],
                  'what_is_this': 'A second procedural shareholder-list filing for the repurchase shareholder-meeting process.',
                  'business_role': 'Governance procedure around a proposed repurchase, not operating or cash-deployment evidence.',
                  'driver': 'Economic relevance resides in shareholder approval and actual repurchase execution, not the ownership list itself.',
                  'expectation': 'The ownership snapshot does not change expectations around CATL growth, cash conversion, capex, or capital returns.',
                  'claims': [
                      {
                          'statement': 'The 2026-08-07 filing contains shareholder lists for the repurchase meeting record date rather than repurchase execution data.',
                          'kind': 'FACT',
                          'announcement_ids': ['1225464975'],
                      },
                  ],
                  'contradiction': 'No contradiction to the frozen thesis is established.',
                  'unknown': 'Whether shareholders approve the repurchase and how much cash is actually deployed afterward.',
                  'next_search': 'Read the shareholder-meeting resolution and subsequent repurchase-progress filings.',
                  'stop_condition': 'Stop if no capital deployment or operating evidence is added.',
                  'pre_route': 'STOP',
                  'pre_reason': 'The filing is procedural and does not update the decision context.',
              },
              '300750-2026-08-12': {
                  'economic_direction': 'capital allocation, shareholder return, and external investment',
                  'observations': [
                      {
                          'statement': 'CATL committed RMB2.475bn of its own funds for 49.5% of an eight-year Hainan green-industry equity fund.',
                          'announcement_ids': ['1225470687'],
                      },
                      {
                          'statement': 'Shareholders approved the company’s A-share repurchase proposal at the 2026 first extraordinary general meeting.',
                          'announcement_ids': ['1225470688'],
                      },
                  ],
                  'what_is_this': 'A dated capital-allocation batch combining shareholder approval of a large repurchase proposal with a new long-duration external green-industry fund commitment.',
                  'business_role': 'The repurchase can return capital and reduce share count while the fund commitment consumes cash for long-duration external investment.',
                  'driver': 'The balance among operating cash generation, capex, shareholder returns, and external investments directly bears on per-share capital returns.',
                  'expectation': 'The frozen Research assumes strong growth but questions whether cash conversion and returns can keep pace with capital deployment.',
                  'claims': [
                      {
                          'statement': 'Shareholders approved CATL’s A-share repurchase proposal.',
                          'kind': 'FACT',
                          'announcement_ids': ['1225470688'],
                      },
                      {
                          'statement': 'CATL committed RMB2.475bn of own funds for a 49.5% interest in an eight-year Hainan green-industry fund.',
                          'kind': 'FACT',
                          'announcement_ids': ['1225470687'],
                      },
                  ],
                  'contradiction': 'Stronger shareholder-return intent and simultaneous external investment both increase the importance of testing whether accounting growth converts into distributable cash.',
                  'unknown': 'How much repurchase cash will actually be deployed, over what period and funding mix, and how that use interacts with capex and future operating cash flow.',
                  'next_search': 'Quantify actual repurchase execution and compare it with subsequent operating cash flow, capex, utilization, and any material fund capital calls.',
                  'stop_condition': 'Wait rather than deepen if there is still no meaningful repurchase execution or new operating cash-flow evidence.',
                  'pre_route': 'CONTINUE_TO_QUICK',
                  'pre_reason': 'The batch directly intersects the frozen capital-allocation and cash-conversion question and merits one bounded Quick Research pass.',
                  'quick': {
                      'business_model': 'Global power- and energy-storage-battery manufacturer with high capital intensity and a growing overseas footprint.',
                      'segment_mix': 'The frozen Research focuses on power and storage batteries; this disclosure adds capital-allocation evidence rather than new segment operating data.',
                      'economic_role': 'A scaled battery leader that must fund capacity and ecosystem growth while converting profit into cash and preserving per-share returns.',
                      'profit_drivers': ['battery shipment growth', 'pricing and gross margin', 'capacity utilization', 'overseas economics'],
                      'industry_variables': ['EV and storage demand', 'battery capacity additions', 'price competition', 'raw-material costs'],
                      'value_chain_position': 'Scaled global battery supplier with meaningful bargaining power and very large reinvestment requirements.',
                      'industry_state': 'No new industry supply-demand evidence is established by these capital-allocation filings.',
                      'expectation': 'The market likely rewards CATL’s scale and growth while discounting capital intensity; sustainable re-rating requires profit and shareholder returns to outpace capital consumed.',
                      'supporting_claims': [
                          {
                              'statement': 'The official batch establishes both shareholder approval of the repurchase proposal and a RMB2.475bn own-funds external investment commitment.',
                              'kind': 'FACT',
                              'announcement_ids': ['1225470687', '1225470688'],
                          },
                      ],
                      'contradictory_claims': [],
                      'authority': 'Both decision-relevant facts come from official CNINFO filings, but neither provides actual repurchase cash deployment or updated operating cash flow and capex.',
                      'variant': 'Capital-return intent is clearer than in the frozen snapshot, but execution and cash sustainability remain unproven.',
                      'unresolved': [
                          'Actual repurchase amount, pace, average price, and funding source.',
                          'Whether subsequent operating cash flow improves relative to profit and capex.',
                          'Whether external investments and capacity expansion dilute per-share capital returns.',
                      ],
                      'next_evidence': [
                          'Official repurchase progress or completion filings.',
                          'Next quarterly operating cash flow, capex, and capacity-utilization evidence.',
                          'Material fund capital-call and deployment evidence.',
                      ],
                      'route': 'WAIT_FOR_TRIGGER',
                      'reason': 'Quick Research confirms material capital-allocation intent but still lacks actual cash deployment and updated cash-flow/capex evidence, so Deep Research is not justified yet.',
                  },
              },
              '300750-2026-08-25': {
                  'economic_direction': 'administrative corporate information',
                  'observations': [
                      {
                          'statement': 'The H-share filing changes CATL’s principal place of business in Hong Kong effective 2026-08-25.',
                          'announcement_ids': ['1225502236'],
                      },
                  ],
                  'what_is_this': 'An administrative H-share principal-business-address change.',
                  'business_role': 'Corporate administration only.',
                  'driver': 'No fundamental driver for the frozen investment thesis is established.',
                  'expectation': 'The address change does not alter expectations for battery growth, margins, cash conversion, capex, or overseas returns.',
                  'claims': [
                      {
                          'statement': 'The filing changes CATL’s principal place of business in Hong Kong effective 2026-08-25.',
                          'kind': 'FACT',
                          'announcement_ids': ['1225502236'],
                      },
                  ],
                  'contradiction': 'No support or contradiction to the frozen thesis is established.',
                  'unknown': 'No new material unknown for the current Research questions.',
                  'next_search': 'No follow-up unless a later filing links the address change to a substantive corporate event.',
                  'stop_condition': 'Stop while the change remains purely administrative.',
                  'pre_route': 'STOP',
                  'pre_reason': 'The filing has no decision-context impact and should consume no additional Research budget.',
              },
          }

          def claims_from(spec_claims, by_announcement):
              return tuple(
                  ResearchClaim(
                      statement=item['statement'],
                      kind=ResearchClaimKind(item['kind']),
                      evidence_artifact_ids=tuple(
                          by_announcement[announcement_id].evidence_artifact.id
                          for announcement_id in item['announcement_ids']
                      ),
                  )
                  for item in spec_claims
              )

          run_cases = []
          for case in corpus['cases']:
              case_id = case['case_id']
              spec = specs[case_id]
              raw_path = raw_dir / f'{case_id}.json'
              raw_path.write_text(json.dumps(spec, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

              packet = parse_disclosure_assessment_packet(Path(case['packet_path']).read_text(encoding='utf-8'))
              by_announcement = {item.announcement_id: item for item in packet.evidence}
              discovery = DiscoveryInput(
                  discovery_id=f'chatgpt-dogfood:{packet.stock_code}:{packet.publication_date.isoformat()}',
                  source_lane=packet.source_lane,
                  ticker=packet.stock_code,
                  economic_direction=spec['economic_direction'],
                  as_of=packet.prepared_at,
                  factual_observations=tuple(
                      DiscoveryObservation(
                          statement=item['statement'],
                          evidence_artifact_ids=tuple(
                              by_announcement[announcement_id].evidence_artifact.id
                              for announcement_id in item['announcement_ids']
                          ),
                      )
                      for item in spec['observations']
                  ),
                  source_lineage=tuple(
                      DiscoverySource(
                          evidence_artifact_id=item.evidence_artifact.id,
                          source_locator=item.evidence_artifact.source_locator,
                          available_at=item.evidence_artifact.available_at,
                      )
                      for item in packet.evidence
                  ),
                  why_now='This exact official disclosure batch is newer than the frozen Research cutoff and requires semantic assessment.',
                  contradiction_or_mapping_warning=spec['contradiction'],
                  next_discriminating_search=spec['next_search'],
                  known_stop_or_downgrade_condition=spec['stop_condition'],
              )
              pre = PreResearchResult(
                  discovery_id=discovery.discovery_id,
                  as_of=discovery.as_of,
                  what_is_this=spec['what_is_this'],
                  economic_direction=spec['economic_direction'],
                  why_surfaced_now=discovery.why_now,
                  basic_business_role=spec['business_role'],
                  potential_fundamental_driver=spec['driver'],
                  current_market_expectation_hypothesis=spec['expectation'],
                  material_claims=claims_from(spec['claims'], by_announcement),
                  obvious_contradiction=spec['contradiction'],
                  largest_unknown=spec['unknown'],
                  next_discriminating_search=spec['next_search'],
                  route=PreResearchRoute(spec['pre_route']),
                  route_reason=spec['pre_reason'],
              )

              quick = None
              if 'quick' in spec:
                  q = spec['quick']
                  quick = QuickResearchResult(
                      discovery_id=discovery.discovery_id,
                      pre_research_hash=canonical_hash(pre),
                      as_of=discovery.as_of,
                      business_model=q['business_model'],
                      segment_mix=q['segment_mix'],
                      economic_role=q['economic_role'],
                      major_profit_drivers=tuple(q['profit_drivers']),
                      industry_supply_demand_variables=tuple(q['industry_variables']),
                      value_chain_position=q['value_chain_position'],
                      current_industry_state=q['industry_state'],
                      market_expectation_hypothesis=q['expectation'],
                      supporting_claims=claims_from(q['supporting_claims'], by_announcement),
                      contradictory_claims=claims_from(q['contradictory_claims'], by_announcement),
                      evidence_authority_assessment=q['authority'],
                      variant_perception=q['variant'],
                      unresolved_questions=tuple(q['unresolved']),
                      next_discriminating_evidence=tuple(q['next_evidence']),
                      route=QuickResearchRoute(q['route']),
                      route_reason=q['reason'],
                  )

              assessment = DisclosureResearchAssessment(
                  assessment_input_hash=packet.assessment_input_hash,
                  discovery=discovery,
                  pre_research=pre,
                  quick_research=quick,
              )
              assessment_path = assessment_dir / f'{case_id}.json'
              assessment_path.write_text(assessment.model_dump_json(indent=2) + '\n', encoding='utf-8')
              run_cases.append(
                  {
                      'case_id': case_id,
                      'assessment_path': str(assessment_path.relative_to(out)),
                      'raw_response_path': str(raw_path.relative_to(out)),
                      'invoked_at': '2026-09-02T07:39:01Z',
                  }
              )

          run_manifest = {
              'schema_version': 1,
              'run_id': 'gpt-5.6-sol-nonblind-conversation-dogfood-20260902',
              'corpus_id': corpus['corpus_id'],
              'producer': {
                  'provider': 'openai-chatgpt',
                  'model': 'GPT-5.6 Sol',
                  'producer_version': 'conversation-dogfood-v1',
                  'prompt_version': 'frozen-disclosure-packet-review-v1',
              },
              'cases': run_cases,
          }
          (out / 'candidate-run.json').write_text(
              json.dumps(run_manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Score candidate through production Research semantics
        shell: bash
        run: |
          set -euo pipefail
          cd gpt56sol-cognition-dogfood
          python ../eval/disclosure_cognition/score_candidate_run.py candidate-run.json --output score.json
          cat score.json
      - name: Upload dogfood trace
        uses: actions/upload-artifact@v4
        with:
          name: gpt56sol-cognition-dogfood
          path: gpt56sol-cognition-dogfood/
          retention-days: 7
