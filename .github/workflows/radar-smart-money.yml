name: radar-smart-money
run-name: ${{ inputs.ftshare-stock-history == 'three-stock-20260930' && 'FTShare three-stock comparison 20260930' || 'radar-smart-money' }}
on:
  schedule:
    - cron: '20 9 * * 1-5'
    - cron: '10 12 * * 1-5'
  workflow_dispatch:
    inputs:
      ftshare-stock-history:
        description: Explicit isolated three-stock historical comparison; never normal collection
        required: false
        type: choice
        options: [none, three-stock-20260930]
        default: none
      code-sha:
        description: 'Reviewed exact current main; leave empty only for normal scheduled code identity'
        required: false
        type: string
      relay-only:
        description: 'Explicitly capture only the Relay supplement, reusing the exact retained primary calendar'
        required: false
        default: false
        type: boolean
      relay-reports-only:
        description: 'With relay-only: repair only seven dated forecast pages; do not repeat other Relay interfaces'
        required: false
        default: false
        type: boolean
      repair-pending:
        description: 'Explicitly repair retained incomplete partitions using this reviewed main; do not reacquire completed scopes'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: radar-smart-money
  cancel-in-progress: false
jobs:
  compare-ftshare-stock-history:
    if: >-
      github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && github.event_name == 'workflow_dispatch' &&
      inputs.ftshare-stock-history == 'three-stock-20260930' &&
      inputs.code-sha == github.sha && !inputs.relay-only &&
      !inputs.relay-reports-only && !inputs.repair-pending
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require successful exact main CI before any provider request
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE"
          test "$(gh api repos/auguspp/decision-kernel/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_CODE"
          gh api --method GET repos/auguspp/decision-kernel/actions/workflows/ci.yml/runs \
            -f head_sha="$EXPECTED_CODE" -f event=push -f per_page=10 > "$RUNNER_TEMP/ftshare-main-ci.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNNER_TEMP'])/'ftshare-main-ci.json').read_text())['workflow_runs']
          rows=[r for r in rows if r['head_sha']==os.environ['EXPECTED_CODE'] and r['head_branch']=='main' and r['path']=='.github/workflows/ci.yml' and r['event']=='push' and r['repository']['full_name']=='auguspp/decision-kernel' and r['head_repository']['full_name']=='auguspp/decision-kernel']
          assert rows, 'MAIN_CI_MISSING'
          latest=max(rows,key=lambda r:(r['created_at'],r['id']))
          assert latest['run_attempt']==1 and latest['status']=='completed' and latest['conclusion']=='success', 'MAIN_CI_NOT_PASSED'
          PY
      - name: Install existing core only
        run: python -m pip install -e .
      - name: Read exact already-retained HiThink reference
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '11141865519'
          run-id: '36815556951'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ftshare-hithink-reference
          digest-mismatch: error
      - name: Capture at most twelve source requests without retry
        env:
          FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
          FTSHARE_COMPARISON: ${{ inputs.ftshare-stock-history }}
        run: |
          python -m decision_kernel.runtime.ftshare_stock_history_comparison \
            --reference "$RUNNER_TEMP/ftshare-hithink-reference/independent-stock-capture" \
            --output "$RUNNER_TEMP/ftshare-stock-history"
      - name: Retain safe producer-side diagnostics only
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ftshare-stock-history-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ftshare-stock-history/safe-report/report.json
          retention-days: 30
          if-no-files-found: warn

  capture-smart-money:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.ftshare-stock-history != 'three-stock-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    outputs:
      run_capture: ${{ steps.control.outputs.run_capture }}
      run_relay: ${{ steps.control.outputs.run_relay }}
      relay_source_run_id: ${{ steps.control.outputs.relay_source_run_id }}
      relay_source_artifact_id: ${{ steps.control.outputs.relay_source_artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing source and document dependencies
        run: python -m pip install -e '.[feeds,documents]'
      - name: Validate current main and exact prior delivery
        id: control
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
          REPAIR_PENDING: ${{ inputs.repair-pending }}
          RELAY_ONLY: ${{ inputs.relay-only }}
          RELAY_REPORTS_ONLY: ${{ inputs.relay-reports-only }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python .github/scripts/smart-money-control.py
      - name: Capture public participants and capital behavior
        if: steps.control.outputs.run_capture == 'true'
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
          SKIP_HITHINK: ${{ steps.control.outputs.skip_hithink }}
          REPAIR_PENDING: ${{ steps.control.outputs.repair_pending }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/smart-money-previous-state.json" ]; then
            args+=(--previous-state "$RUNNER_TEMP/smart-money-previous-state.json")
          fi
          if [ "$SKIP_HITHINK" = 'true' ]; then args+=(--skip-hithink); fi
          if [ "$REPAIR_PENDING" = 'true' ]; then args+=(--repair-pending); fi
          python -m decision_kernel.runtime.smart_money_capture --output "$RUNNER_TEMP/smart-money" "${args[@]}"
      - name: Rebuild originals offline without source credentials
        if: steps.control.outputs.run_capture == 'true' && success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from decision_kernel.runtime import smart_money_capture as c
          root=Path(os.environ['RUNNER_TEMP'])/'smart-money'
          files={p.name:p.read_bytes() for p in root.iterdir()}
          result=c.replay(files,c.identity(os.environ),cutoff=c.s.now())
          print(json.dumps({'status':result['status'],'requests':result['requests'],
            'capture_hash':result['capture_hash'],'unresolved':result['unresolved'],
            'source_calls_during_replay':result['source_calls_during_replay']},ensure_ascii=False))
          PY
      - name: Retain exact source bytes and partial checkpoints
        if: always() && steps.control.outputs.run_capture == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smart-money-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smart-money/
          retention-days: 30
          if-no-files-found: warn
      - name: Retain actual delivery preflight
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smart-money-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smart-money-control/
          retention-days: 30
          if-no-files-found: warn
  capture-tushare-relay:
    needs: capture-smart-money
    if: needs.capture-smart-money.result == 'success' && needs.capture-smart-money.outputs.run_relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing source and document dependencies
        run: python -m pip install -e '.[feeds,documents]'
      - name: Download this run's exact control
        uses: actions/download-artifact@v8
        with:
          name: smart-money-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smart-money-relay-control
          digest-mismatch: error
      - name: Download exact previously retained primary capture
        if: needs.capture-smart-money.outputs.relay_source_artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.capture-smart-money.outputs.relay_source_artifact_id }}
          run-id: ${{ needs.capture-smart-money.outputs.relay_source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/smart-money
          digest-mismatch: error
      - name: Download exact primary capture from this run
        if: needs.capture-smart-money.outputs.relay_source_artifact_id == ''
        uses: actions/download-artifact@v8
        with:
          name: smart-money-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smart-money
          digest-mismatch: error
      - name: Capture bounded Tushare Relay supplement
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: |
          python -m decision_kernel.runtime.smart_money_relay \
            --source-capture "$RUNNER_TEMP/smart-money" \
            --control "$RUNNER_TEMP/smart-money-relay-control/control.json" \
            --output "$RUNNER_TEMP/smart-money-relay"
      - name: Retain Relay originals and explicit queue gaps
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smart-money-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smart-money-relay/
          retention-days: 30
          if-no-files-found: warn
