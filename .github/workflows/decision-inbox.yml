name: verify-inbox-after-120

on:
  push:
    branches:
      - ops/verify-inbox-after-120

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Check HiThink secret
        shell: bash
        run: |
          if [ -z "${HITHINK_FINANCE_API_KEY:-}" ]; then
            echo "::error::Missing repository secret HITHINK_FINANCE_API_KEY"
            exit 1
          fi
      - name: Build curated Decision Inbox
        shell: bash
        run: |
          decision-kernel build-inbox \
            dogfood/600519-moutai.json \
            dogfood/300750-catl.json \
            dogfood/601088-shenhua.json \
            research_cases/603986-gigadevice-deep-research-v2.json \
            research_cases/002050-sanhua-deep-research-v1.json
      - name: Verify CMB excluded
        shell: bash
        run: |
          if grep -Eq "招商银行|600036" decision-inbox/summary.md; then
            echo "::error::CMB unexpectedly present in curated Human Inbox"
            exit 1
          fi
          cat decision-inbox/summary.md
      - name: Upload verified Inbox
        uses: actions/upload-artifact@v7
        with:
          name: verified-inbox-after-120
          path: decision-inbox/
          retention-days: 14
