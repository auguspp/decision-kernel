name: tdx-retain-once
on:
  push:
    branches: [archive/tdx-concept-36096006542]
    paths: [.github/workflows/tdx-retain-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1aa0098eec22ae46e7723eb2b96618d62ab9ece3
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[feeds]'
      - name: Inspect the original archive; do not retrieve market data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,pathlib
          from decision_kernel.runtime.current_state_delivery import GitHubAPI
          from decision_kernel.runtime import current_state as model
          from decision_kernel.runtime import tdx_concept_snapshot as tdx
          api=GitHubAPI(os.environ['GH_TOKEN'],max_calls=4)
          run=api.get('actions/runs/36096006542')
          art=api.get('actions/artifacts/10846812870')
          raw=api.archive(art);files=model.unpack_archive(raw,art,run)
          cap=json.loads(files['capture.json'])
          listed=set(cap['files']);actual=set(files)-{'capture.json'}
          print('TDX_ARCHIVE_INVENTORY='+json.dumps({'run':run['id'],'artifact':art['id'],'files':{k:len(v) for k,v in files.items()},'missing_from_zip':sorted(listed-actual),'extra_in_zip':sorted(actual-listed),'source_capture_status':cap['status'],'market_session':cap['market_session'],'source_calls':0},ensure_ascii=False,sort_keys=True))
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'tdx-inspection';root.mkdir()
          for k,v in files.items():
              p=root/k;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(v)
          try:
              r=tdx.replay(root)
          except ValueError as e:
              print('POST_UPLOAD_REPLAY_REJECTED='+str(e))
          else:
              print('POST_UPLOAD_REPLAY_STATUS='+r.get('projection',r).get('status','UNKNOWN'))
          PY
