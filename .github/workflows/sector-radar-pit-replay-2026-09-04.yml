name: sector-radar-pit-replay-2026-09-04

on:
  pull_request:
    paths:
      - ".github/workflows/sector-radar-pit-replay-2026-09-04.yml"
      - "experiments/sector_radar_pit_replay_analysis_v3.py"

permissions:
  contents: read
  actions: read

jobs:
  analyze-retained-inputs:
    if: github.event.pull_request.head.ref == 'experiment/sector-radar-pit-replay-2026-09-04'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Restore exact qualified histories from retained run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "9936117543"
          github-token: ${{ github.token }}
          repository: auguspp/decision-kernel
          run-id: "33869436890"
          path: prior-run
      - name: Analyze frozen PITs without new provider calls
        shell: bash
        run: |
          set -euo pipefail
          python experiments/sector_radar_pit_replay_analysis_v3.py \
            --input-dir prior-run \
            --output-json sector-radar-pit-replay-analysis.json \
            --output-summary sector-radar-pit-replay-analysis-summary.md \
            2>&1 | tee sector-radar-pit-replay-analysis-status.txt
      - name: Publish analysis summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Sector Discovery Radar frozen-PIT replay'
            echo
            if [ -f sector-radar-pit-replay-analysis-summary.md ]; then
              cat sector-radar-pit-replay-analysis-summary.md
            else
              echo 'Analysis failed closed. No completed conclusion was published.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload analysis evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-radar-pit-replay-analysis-2026-09-04
          path: |
            sector-radar-pit-replay-analysis.json
            sector-radar-pit-replay-analysis-summary.md
            sector-radar-pit-replay-analysis-status.txt
          if-no-files-found: warn
          retention-days: 14
