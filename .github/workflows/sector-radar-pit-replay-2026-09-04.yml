name: sector-radar-pit-replay-2026-09-04

on:
  pull_request:
    paths:
      - ".github/workflows/sector-radar-pit-replay-2026-09-04.yml"
      - "experiments/sector_radar_pit_replay_2026_09_04.py"
      - "experiments/sector_radar_pit_replay_transport_v2.py"

permissions:
  contents: read

jobs:
  replay:
    if: github.event.pull_request.head.ref == 'experiment/sector-radar-pit-replay-2026-09-04'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      SECTOR_RADAR_HISTORY_PACE_SECONDS: "15"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Replay exact broad-industry frozen PITs
        run: |
          set -o pipefail
          python experiments/sector_radar_pit_replay_transport_v2.py \
            2>&1 | tee sector-radar-pit-replay-status.txt
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Sector Discovery Radar frozen-PIT replay'
            echo
            if [ -f sector-radar-pit-replay-summary.md ]; then
              cat sector-radar-pit-replay-summary.md
            elif [ -f sector-radar-pit-replay-error.json ]; then
              echo 'Replay failed closed. No completed result was published.'
              echo
              echo '```json'
              cat sector-radar-pit-replay-error.json
              echo '```'
              if [ -f sector-radar-pit-replay-progress.jsonl ]; then
                echo
                echo "Completed progress records: $(wc -l < sector-radar-pit-replay-progress.jsonl)"
              fi
            else
              echo 'Replay ended before a result or explicit error artifact was written.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-radar-pit-replay-2026-09-04
          path: |
            sector-radar-pit-replay.json
            sector-radar-pit-replay-summary.md
            sector-radar-pit-replay-progress.jsonl
            sector-radar-pit-replay-error.json
            sector-radar-pit-replay-status.txt
            sector-radar-pit-replay-inputs/
          if-no-files-found: warn
          retention-days: 14
