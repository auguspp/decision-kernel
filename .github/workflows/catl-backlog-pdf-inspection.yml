name: catl-backlog-pdf-inspection

on:
  pull_request:
    paths:
      - '.github/workflows/catl-backlog-pdf-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install current repo with documents
        run: python -m pip install -e '.[documents]'
      - name: Fetch and extract six unassessed CATL batches
        run: |
          python - <<'PY'
          from datetime import date

          from decision_kernel.adapters.pdf_text import extract_pdf_text
          from decision_kernel.runtime.cninfo_http import (
              fetch_cninfo_disclosures,
              fetch_cninfo_pdf_bytes,
          )

          expected = {
              date(2026, 7, 30): {'1225448968'},
              date(2026, 8, 4): {'1225456175'},
              date(2026, 8, 6): {'1225462006'},
              date(2026, 8, 7): {'1225464975'},
              date(2026, 8, 12): {'1225470688', '1225470687', '1225470689'},
              date(2026, 8, 25): {'1225502236'},
          }

          for publication_date, expected_ids in expected.items():
              raw = fetch_cninfo_disclosures(
                  stock_code='300750',
                  start_date=publication_date,
                  end_date=publication_date,
                  timeout_seconds=20.0,
              )
              by_id = {item.announcement_id: item for item in raw.announcements}
              missing = expected_ids - set(by_id)
              if missing:
                  raise RuntimeError(
                      f'missing expected CNINFO announcements on {publication_date}: {sorted(missing)}'
                  )

              print(f'=== BATCH {publication_date.isoformat()} ===')
              for announcement_id in sorted(expected_ids):
                  announcement = by_id[announcement_id]
                  pdf_bytes = fetch_cninfo_pdf_bytes(
                      source_locator=announcement.source_locator,
                      timeout_seconds=20.0,
                  )
                  extracted = extract_pdf_text(pdf_bytes)
                  text = '\n'.join(page.text for page in extracted.pages)
                  print(f'--- ANNOUNCEMENT {announcement.announcement_id} ---')
                  print(f'TITLE={announcement.title}')
                  print(f'PUBLISHED_AT={announcement.published_at.isoformat() if announcement.published_at else None}')
                  print(f'SOURCE={announcement.source_locator}')
                  print(f'PDF_SHA256={extracted.pdf_sha256}')
                  print(f'PAGES={extracted.page_count} CHARS={extracted.extracted_char_count} STATUS={extracted.status.value}')
                  print('TEXT_START')
                  print(text[:12000])
                  print('TEXT_END')
          PY
