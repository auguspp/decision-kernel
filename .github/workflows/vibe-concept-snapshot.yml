name: vibe-concept-snapshot

on:
  workflow_dispatch:
    inputs:
      code-sha:
        description: Exact reviewed main commit, with successful independent main CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vibe-concept-snapshot
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require exact reviewed main and independent CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_CODE" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=10 > "$RUNNER_TEMP/concept-ci.json"
          python - <<'PY'
          import json, os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/concept-ci.json'))['workflow_runs']
          assert runs
          r=max(runs,key=lambda x:(x['created_at'],x['id']))
          assert r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='main'
          assert r['path']=='.github/workflows/ci.yml' and r['event']=='push'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          PY
      - name: Install existing isolated transport dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Capture bounded concept windows without keys or retries
        run: python -m decision_kernel.runtime.vibe_concept_snapshot capture --output "$RUNNER_TEMP/concept-snapshot"
      - name: Replay exact retained bytes without source calls
        run: |
          python -m decision_kernel.runtime.vibe_concept_snapshot replay --output "$RUNNER_TEMP/concept-snapshot"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'concept-snapshot/observation.json').read_text())['projection']
          assert p['source_calls_during_replay']==0
          assert p['investment_authority']=='NONE'
          PY
      - name: Retain originals, observations and explicit failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vibe-concept-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/concept-snapshot/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish scoped source summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/concept-snapshot/summary.md" ]; then
            cat "$RUNNER_TEMP/concept-snapshot/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No sealed source observation. Inspect the failed step; not no market activity.' >> "$GITHUB_STEP_SUMMARY"
          fi
