name: ftshare-plan-doc-assets\n\non:\n  push:\n    branches:\n      - probe/ftshare-20260921\n\npermissions:\n  contents: read\n\njobs:\n  inspect:\n    runs-on: ubuntu-latest\n    timeout-minutes: 8\n    steps:\n      - name: Inspect doc frontend bundle\n        shell: bash\n        run: |\n          set -euo pipefail\n          python - <<'PY'\n          import json,re,urllib.request\n          jsurl='https://market.ft.tech/gateway/doc/assets/index-CBGSO5Wy.js'\n          with urllib.request.urlopen(urllib.request.Request(jsurl,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:\n              b=r.read()\n          t=b.decode('utf-8','replace')\n          print('JS',len(b))\n          for n in ['/api/','gateway/doc','document','page','slug','public','permission','plan','share']:\n              print('NEEDLE',n,t.count(n))\n          strings=sorted(set(re.findall(r"['\"]([^'\"]{0,180}(?:/api/|/doc/|document|page)[^'\"]{0,180})['\"]",t,re.I)))\n          print('STRINGS',json.dumps(strings[:400],ensure_ascii=False))\n          pats=[r'/api/[^\"\' ]{1,180}',r'fetch\([^)]{0,800}\)',r'document[^;]{0,1200}',r'page[^;]{0,1200}']\n          for pat in pats:\n              count=0\n              for m in re.finditer(pat,t,re.I|re.S):\n                  print('CTX',pat,m.group(0)[:1500])\n                  count+=1\n                  if count>=40: break\n          PY\n