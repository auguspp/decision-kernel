name: tushare-relay-queue-retest
on:
  push:
    branches: [work/tushare-relay-queue-retest-20260926]
    paths: [.github/workflows/tushare-relay-queue-retest.yml]
permissions:
  contents: read
jobs:
  retest:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Bounded queue retest
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,time,pathlib,requests
          from datetime import datetime,timezone
          key=os.environ["TUSHARE_PROXY_API_KEY"]
          base="https://pcd.mobcvb.cn/tushare/pro"
          cap="https://pcd.mobcvb.cn/tushare/capabilities"
          s=requests.Session();s.trust_env=False
          h={"X-API-Key":key}
          cases=[
            ("hm_list",{"__probe":"0","limit":"5"}),
            ("hm_detail",{"trade_date":"20260924","limit":"5"}),
            ("report_rc",{"ts_code":"000651.SZ","report_date":"20260924","limit":"5"}),
          ]
          out=[]
          for name,params in cases:
            cr=s.get(f"{cap}/{name}",headers=h,timeout=15,allow_redirects=False)
            try:cbody=cr.json()
            except Exception:cbody={}
            attempts=[]
            for i,delay in enumerate((0,2,4),start=1):
              if delay: time.sleep(delay)
              r=s.get(f"{base}/{name}",params=params,headers=h,timeout=30,allow_redirects=False)
              try:b=r.json()
              except Exception:b={}
              d=b.get("data") if isinstance(b,dict) else {}
              items=d.get("items") if isinstance(d,dict) else None
              attempts.append({
                "attempt":i,"http":r.status_code,
                "code":b.get("code") if isinstance(b,dict) else None,
                "error":b.get("error") if isinstance(b,dict) else None,
                "message":b.get("message") if isinstance(b,dict) else None,
                "msg":b.get("msg") if isinstance(b,dict) else None,
                "count":b.get("count") if isinstance(b,dict) else None,
                "rows":len(items) if isinstance(items,list) else None,
                "x_cache":r.headers.get("X-Cache"),
                "request_id":r.headers.get("X-Request-ID"),
              })
              if r.status_code==200 and isinstance(b,dict) and b.get("code",0) in (0,None):
                break
              if not (r.status_code in (502,503,504) or (isinstance(b,dict) and b.get("error")=="upstream_pool_exhausted")):
                break
            out.append({"api":name,"cap_http":cr.status_code,
                        "cap_enabled":cbody.get("enabled") if isinstance(cbody,dict) else None,
                        "params":params,"attempts":attempts})
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"queue";p.mkdir()
          (p/"report.json").write_text(json.dumps({"checked_at":datetime.now(timezone.utc).isoformat(),"results":out},ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tushare-relay-queue-retest-${{ github.run_id }}-1
          path: ${{ runner.temp }}/queue/
          retention-days: 7
          if-no-files-found: error
