name: stock-reading-human-demo-once-20260912

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stock-reading-human-demo-once-20260912.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: stock-reading-human-demo-once-20260912
  cancel-in-progress: false

jobs:
  dispatch-existing-stock-reading:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate exact saved natural Sector input
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_RUN: '34610140283'
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'auguspp/decision-kernel'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MARKET_RUN" > /tmp/market-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MARKET_RUN/artifacts?per_page=100" > /tmp/market-artifacts.json
          python - <<'PY'
          import json
          run = json.load(open('/tmp/market-run.json'))
          artifacts = json.load(open('/tmp/market-artifacts.json'))['artifacts']
          assert run['name'] == 'sector-radar-shadow'
          assert run['path'].split('@', 1)[0] == '.github/workflows/sector-radar-shadow.yml'
          assert run['event'] == 'schedule'
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'success'
          assert run['run_attempt'] == 1
          assert run['head_branch'] == 'main'
          assert any(a['name'] == 'sector-radar-run-34610140283' and not a['expired'] for a in artifacts)
          print('PINNED_NATURAL_SECTOR_INPUT_OK')
          PY

      - name: Workflow-scoped shared-Key activity observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          peers = (
              'sector-radar-shadow.yml',
              'hithink-stock-dump-trial.yml',
              'decision-inbox.yml',
              'live-dogfood.yml',
          )
          active = ('in_progress', 'queued', 'waiting', 'pending', 'requested')
          blockers = []
          for workflow in peers:
              expected_path = f'.github/workflows/{workflow}'
              for status in active:
                  path = f'repos/{repository}/actions/workflows/{workflow}/runs?status={status}&per_page=100&page=1'
                  raw = subprocess.check_output(['gh', 'api', path], text=True)
                  payload = json.loads(raw)
                  rows = payload.get('workflow_runs')
                  count = payload.get('total_count')
                  if not isinstance(rows, list) or type(count) is not int or not 0 <= count <= 100 or len(rows) != count:
                      raise SystemExit(f'INCOMPLETE_ACTIVITY_VIEW {workflow} {status}')
                  seen = set()
                  for row in rows:
                      run_id = row.get('id')
                      row_path = str(row.get('path', '')).split('@', 1)[0]
                      if type(run_id) is not int or run_id <= 0 or run_id in seen or row_path != expected_path or row.get('status') != status:
                          raise SystemExit(f'INVALID_ACTIVITY_ROW {workflow} {status}')
                      seen.add(run_id)
                      blockers.append(run_id)
          if blockers:
              raise SystemExit('BLOCKED_SHARED_KEY_ACTIVITY run_ids=' + ','.join(map(str, sorted(set(blockers)))))
          print('NO_VISIBLE_SHARED_KEY_PEER_ACTIVITY_NOT_A_GLOBAL_LOCK')
          PY
          printf '%s\n' 'Temporary demo preflight is workflow-scoped to avoid the prior all-repository activity-list race; production shared-Key checker is unchanged.' >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch existing Stock reading exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/dispatch.json
          import json
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'trial-purpose': 'stock-reading',
                  'stock-market-run-id': '34610140283',
              },
          }, separators=(',', ':')))
          PY
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/hithink-stock-dump-trial.yml/dispatches" \
            --input /tmp/dispatch.json
          printf '%s\n' 'DISPATCH_ACCEPTED_ONCE; no polling/retry in this workflow.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'HUMAN_AUTHORIZED_DEMO after #328; not natural-schedule acceptance.' >> "$GITHUB_STEP_SUMMARY"
