name: stock-reading-human-demo-once-20260912

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stock-reading-human-demo-once-20260912.yml

permissions:
  contents: write

concurrency:
  group: stock-reading-human-demo-once-20260912
  cancel-in-progress: false

jobs:
  patch-scheduled-sector-binding:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/stock-accept-scheduled-sector-20260912
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact two-file P0 binder fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/native-feed-acceptance.py')
          text = script.read_text(encoding='utf-8')
          old = "                or run['event'] not in {'push', 'workflow_dispatch'}):"
          new = "                or run['event'] not in ({'push', 'workflow_dispatch', 'schedule'} if kind == 'market' else {'push', 'workflow_dispatch'})):"
          assert text.count(old) == 1, 'expected one exact event-admission line'
          script.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_native_feed_acceptance.py')
          body = test.read_text(encoding='utf-8')
          anchor = """@pytest.mark.parametrize('kind',['source','market'])\ndef test_actual_existing_metadata_binding_rules_reused(kind):\n    mod=code();r=mod['intent'](environment(),AS_OF.isoformat()); run,listing=remote(kind)\n    binding=mod['metadata'](r,kind,run,listing)\n    assert binding['artifact_id']=='200' and binding['commit']=='b'*40\n\n\n"""
          addition = """def test_market_metadata_accepts_natural_sector_schedule_without_other_event_widening():\n    mod=code();r=mod['intent'](environment(),AS_OF.isoformat());run,listing=remote('market')\n    run['event']='schedule'\n    binding=mod['metadata'](r,'market',run,listing)\n    assert binding['artifact_id']=='200' and binding['commit']=='b'*40\n    run['event']='repository_dispatch'\n    with pytest.raises(ValueError,match='identity'):\n        mod['metadata'](r,'market',run,listing)\n\n\n"""
          assert body.count(anchor) == 1, 'expected one exact metadata regression-test anchor'
          test.write_text(body.replace(anchor, anchor + addition), encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/scripts/native-feed-acceptance.py tests/test_native_feed_acceptance.py

      - name: Commit only the reviewed binder and regression test
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l)" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/native-feed-acceptance.py tests/test_native_feed_acceptance.py
          git commit -m 'fix: accept natural Sector schedule as Stock market input'
          git push origin HEAD:fix/stock-accept-scheduled-sector-20260912
          printf '%s\n' 'PATCH_BRANCH_UPDATED; no market request, dispatch, retry, or state write.' >> "$GITHUB_STEP_SUMMARY"
