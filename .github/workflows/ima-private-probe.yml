name: ima-private-probe

on:
  workflow_dispatch:
    inputs:
      code-sha:
        description: Exact reviewed main commit with successful main CI
        required: true
        type: string
      knowledge-base-query:
        description: IMA knowledge-base name fragment; not retained in the public receipt
        required: true
        type: string
      document-query:
        description: Optional first-page private search query; not retained in the public receipt
        required: false
        default: ''
        type: string

      report-title-terms:
        description: Optional title keywords for ONE candidate media/PDF check; empty means search only
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ima-private-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == 'auguspp'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require exact reviewed main and successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_CODE" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=10 > "$RUNNER_TEMP/ima-main-ci.json"
          python - <<'PY'
          import json, os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/ima-main-ci.json'))['workflow_runs']
          assert runs
          r=max(runs,key=lambda x:(x['created_at'],x['id']))
          assert r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='main'
          assert r['path']=='.github/workflows/ci.yml' and r['event']=='push'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          PY
      - name: Install existing HTTP dependency set
        run: python -m pip install -e '.[feeds,documents]'
      - name: Probe IMA without retaining private source text
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_BASE_QUERY: ${{ inputs.knowledge-base-query }}
          IMA_DOCUMENT_QUERY: ${{ inputs.document-query }}
          IMA_REPORT_TITLE_TERMS: ${{ inputs.report-title-terms }}
        run: >-
          python -m decision_kernel.runtime.ima_private_probe
          --output "$RUNNER_TEMP/ima-private-probe"
      - name: Retain sanitized receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ima-private-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ima-private-probe/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish private-safe summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ima-private-probe/summary.md" ]; then
            cat "$RUNNER_TEMP/ima-private-probe/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'IMA probe produced no sanitized receipt; inspect the failed step. No private result is implied.' >> "$GITHUB_STEP_SUMMARY"
          fi
