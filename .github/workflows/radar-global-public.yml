name: radar-global-public
run-name: 'B1 public · ${{ inputs.family }} · ${{ inputs.as-of-date }}'
on:
  workflow_dispatch:
    inputs:
      code-sha:
        description: 'Reviewed exact current main with successful independent main CI'
        required: true
        type: string
      family:
        description: 'One finite public source family; no credentials or fallback'
        required: true
        type: choice
        options: [treasury, fx, commodities, crypto]
      as-of-date:
        description: 'Optional YYYY-MM-DD, last 31 days and at most yesterday UTC'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: radar-global-public
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Confirm exact current main and independent main CI before source requests
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE"
          test "$GITHUB_SHA" = "$EXPECTED_CODE"
          test "$(gh api repos/auguspp/decision-kernel/git/ref/heads/main --jq '.object.sha')" = "$EXPECTED_CODE"
          gh api "repos/auguspp/decision-kernel/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$EXPECTED_CODE&per_page=10" > "$RUNNER_TEMP/public-ci.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          runs=json.loads((Path(os.environ['RUNNER_TEMP'])/'public-ci.json').read_text())['workflow_runs']
          assert runs, 'Independent main CI missing'
          r=max(runs,key=lambda v:v['run_number'])
          assert r['head_sha']==os.environ['EXPECTED_CODE'] and r['head_branch']=='main'
          assert r['repository']['full_name']==r['head_repository']['full_name']=='auguspp/decision-kernel'
          assert r['path']=='.github/workflows/ci.yml' and r['event']=='push'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          print('Independent exact main CI:',r['id'])
          PY
      - name: Install existing source dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Capture selected public family without source credentials
        id: capture
        env:
          FAMILY: ${{ inputs.family }}
          AS_OF: ${{ inputs.as-of-date }}
        run: |
          args=()
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -m decision_kernel.runtime.global_public_context --family "$FAMILY" \
            --output "$RUNNER_TEMP/global-public" "${args[@]}"
      - name: Verify saved original bytes without networking
        if: always() && steps.capture.outcome != 'skipped' && steps.capture.outcome != ''
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from decision_kernel.runtime import global_public_context as g
          root=Path(os.environ['RUNNER_TEMP'])/'global-public'
          report=g.replay({p.name:p.read_bytes() for p in root.iterdir()},g.identity(os.environ),g.now())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(g.render(report))
          print('Raw replay verified; source calls:',report['source_calls_during_replay'])
          PY
      - name: Retain original public responses and partial checkpoint
        if: always() && steps.capture.outcome != 'skipped' && steps.capture.outcome != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: global-public-${{ inputs.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/global-public/
          retention-days: 30
          if-no-files-found: warn
