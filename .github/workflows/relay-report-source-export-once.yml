name: relay-report-source-export-once
on:
  push:
    branches: [work/relay-report-source-export-20260926]
    paths: [.github/workflows/relay-report-source-export-once.yml]
permissions:
  contents: read
jobs:
  export-source:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6814f9dcd4c13e5cb93341c344464f0a2e77f15b
          persist-credentials: false
      - name: Export immutable source and tree without credentials
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 6814f9dcd4c13e5cb93341c344464f0a2e77f15b
          mkdir -p "$RUNNER_TEMP/relay-source"
          git archive --format=zip HEAD > "$RUNNER_TEMP/relay-source/source.zip"
          git ls-tree -r HEAD > "$RUNNER_TEMP/relay-source/tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/relay-source/identity.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: relay-report-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relay-source/
          if-no-files-found: error
          retention-days: 30
