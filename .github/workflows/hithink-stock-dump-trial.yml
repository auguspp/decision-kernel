name: hithink-stock-dump-trial

on:
  workflow_dispatch:
    inputs:
      trial-purpose:
        description: Explicit isolated study; never updates Sector state
        type: choice
        options: [stock-dump, theme-probe, theme-source, native-feed-acceptance]
        default: stock-dump
      native-feed-run-id:
        description: Native acceptance only - exact successful RSS run; never initializes or refetches RSS
        type: string
        default: ''
      native-market-run-id:
        description: Native acceptance only - exact successful Sector state run; required only for qualified pending sources
        type: string
        default: ''
      native-batch-size:
        description: Isolated trial batch, not a continuous consumer or automatic next batch
        type: choice
        options: ['1', '4', '8', '16', '32']
        default: '32'
      native-execute:
        description: Explicitly execute this trial's exact market plan after scanning (otherwise catalogs and scan only)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/scripts/capture-theme-probe.py
      - radar_inputs/theme-source-sample-v0.json

permissions:
  contents: read

concurrency:
  group: hithink-stock-dump-qualification
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.trial-purpose == 'stock-dump'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require reviewed main and a fresh run
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Install isolated reader and transport
        run: python -m pip install -e '.[dump-study]'
      - name: Record workflow identity
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from decision_kernel.identity import canonical_hash, canonical_json
          root = Path("stock-dump-trial")
          root.mkdir(exist_ok=False)
          value = {key: os.environ[key] for key in (
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_EVENT_NAME"
          )}
          value.update(semantics="ISOLATED_DATA_COMPATIBILITY_TRIAL_NOT_MARKET_PRODUCTION",
                       human_attention_authority="NONE", research_authority="NONE", investment_authority="NONE")
          value["provenance_hash"] = canonical_hash(value)
          (root / "workflow.json").write_text(canonical_json(value) + "\n", encoding="utf-8")
          PY
      - name: Acquire one recent dump and reconcile qualified references
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          python -m decision_kernel.runtime.hithink_dump_trial --output stock-dump-trial/capture
      - name: Repeat row inspection offline when all inputs exist
        if: always()
        run: |
          root=stock-dump-trial/capture
          if [ ! -f "$root/snapshot.json" ] || [ ! -f "$root/universe.json" ] || [ ! -f "$root/sessions.json" ]; then
            echo "Reference acquisition did not complete; full-field offline inspection is unavailable."
            exit 0
          fi
          python -m decision_kernel.runtime.hithink_dump_inspection \
            --parquet "$root/daily-k-10d.parquet" --sessions "$root/sessions.json" \
            --universe "$root/universe.json" --snapshot "$root/snapshot.json" \
            --output stock-dump-trial/offline-inspection.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("stock-dump-trial")
          original = json.loads((root / "capture/report.json").read_text())
          replay = json.loads((root / "offline-inspection.json").read_text())
          assert original["inspection"] == replay["inspection"], "offline inspection differs"
          PY
      - name: Retain complete attempt evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v7
        with:
          name: hithink-stock-dump-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: stock-dump-trial/
          if-no-files-found: error
          retention-days: 90
      - name: Publish isolated study result
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          if [ -f stock-dump-trial/capture/summary.md ]; then
            cat stock-dump-trial/capture/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Stock dump trial did not produce a sealed result; inspect failed steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[隔离数据试验与原始文件](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '不是行业状态更新、历史成员宽度或投资信号。没有执行自动恢复或替代来源。' >> "$GITHUB_STEP_SUMMARY"
  theme-probe:
    if: github.event_name == 'push' || inputs.trial-purpose == 'theme-probe' || inputs.trial-purpose == 'theme-source'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require reviewed main and one attempt
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Install existing transport and probe environment
        run: python -m pip install -e '.[dump-study,discovery]'
      - name: Capture bounded theme catalogs then frozen request plan
        id: capture
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
        run: |
          mkdir theme-probe-trial
          selection=radar_inputs/theme-source-sample-v0.json
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$TRIAL_PURPOSE" = theme-probe ]; then
            selection=radar_inputs/theme-probe-sample-v0.json
          fi
          python .github/scripts/capture-theme-probe.py capture --selection "$selection" \
            --output theme-probe-trial/capture > theme-probe-trial/operation.json
      - name: Rebuild from original responses without market credentials
        id: verification
        if: always()
        env:
          HITHINK_FINANCE_API_KEY: ""
        run: |
          python .github/scripts/capture-theme-probe.py verify \
            --output theme-probe-trial/capture > theme-probe-trial/verification.json
      - name: Preserve bounded theme trial including any failure
        id: theme-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: theme-probe-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: theme-probe-trial/
          if-no-files-found: error
          retention-days: 90
      - name: Publish explicit theme trial status
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.theme-evidence.outputs.artifact-url }}
          CAPTURE_RESULT: ${{ steps.capture.outcome }}
          VERIFY_RESULT: ${{ steps.verification.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['## 跨行业主题有界试验', 'SHADOW OBSERVATION ONLY · NOT RESEARCH · NOT A RECOMMENDATION']
          report = Path('theme-probe-trial/capture/capture.json')
          if report.is_file():
              r = json.loads(report.read_text())
              lines += [f"Status: {r['status']}", f"实际请求：{r['requests_attempted']}；保存市场日：{r['market_session']}"]
              if r['failure']:
                  lines += [f"Failure type: {r['failure']['type']}；具体原因见 capture.json，未替换来源或重试。"]
          else:
              lines += ['没有完整采集记录，请检查失败步骤。']
          lines += [f"采集步骤：{os.environ['CAPTURE_RESULT']}；离线核验步骤：{os.environ['VERIFY_RESULT']}",
                    '失败核验成功只证明已保留字节或来源扫描可重建，不代表主题行情计算成功。',
                    '没有生产市场状态、候选账本、Human / Research / Investment authority 变更。']
          if os.environ['ARTIFACT_URL']:
              lines += [f"[本次原始响应与核验附件]({os.environ['ARTIFACT_URL']})"]
              if Path('theme-probe-trial/capture/source-discovery.html').is_file():
                  lines += ['来源线索与阻塞原因：capture/source-discovery.html。留存文字可能是部分转述，提及不是受益。']
          if (os.environ['CAPTURE_RESULT'] == os.environ['VERIFY_RESULT'] == 'success'
                  and os.environ['ARTIFACT_URL'] and Path('theme-probe-trial/capture/index.html').is_file()):
              lines += ['解压后打开 capture/index.html；不是全市场主题排名或真实前瞻候选。']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n\n'.join(lines) + '\n')
          PY
  native-feed:
    if: github.event_name == 'workflow_dispatch' && inputs.trial-purpose == 'native-feed-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing feed and market libraries
        run: python -m pip install -e '.[feeds,dump-study,discovery]'
      - name: Record explicit isolated native acceptance intent
        id: intent
        env:
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
          NATIVE_FEED_RUN_ID: ${{ inputs.native-feed-run-id }}
          NATIVE_MARKET_RUN_ID: ${{ inputs.native-market-run-id }}
          NATIVE_BATCH_SIZE: ${{ inputs.native-batch-size }}
          NATIVE_EXECUTE: ${{ inputs.native-execute }}
        run: python .github/scripts/native-feed-acceptance.py init
      - name: Bind exact source artifact metadata
        id: source-meta
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.intent.outputs.source_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > native-feed-acceptance/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > native-feed-acceptance/source-artifacts.json
          python .github/scripts/native-feed-acceptance.py metadata --kind source
      - name: Download only the bound source artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source-meta.outputs.artifact_id }}
          run-id: ${{ steps.intent.outputs.source_run_id }}
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: native-feed-acceptance/source
      - name: Rebuild and qualify sources before market access
        id: source-check
        run: python .github/scripts/native-feed-acceptance.py qualify
      - name: Bind exact saved market artifact when sources qualify
        id: market-meta
        if: steps.source-check.outputs.needs_market == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_RUN: ${{ steps.intent.outputs.market_run_id }}
        run: |
          test -n "$MARKET_RUN"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MARKET_RUN" > native-feed-acceptance/market-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MARKET_RUN/artifacts?per_page=100" > native-feed-acceptance/market-artifacts.json
          python .github/scripts/native-feed-acceptance.py metadata --kind market
      - name: Download only the bound read-only market state
        if: steps.source-check.outputs.needs_market == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.market-meta.outputs.artifact_id }}
          run-id: ${{ steps.intent.outputs.market_run_id }}
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: native-feed-acceptance/market
      - name: Scan one batch and optionally execute its exact plan
        id: native-capture
        if: steps.source-check.outputs.needs_market == 'true'
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python .github/scripts/native-feed-acceptance.py run > native-feed-acceptance/operation.json
      - name: Rebuild isolated acceptance without credentials
        id: native-verify
        if: always()
        env:
          HITHINK_FINANCE_API_KEY: ''
        run: python .github/scripts/native-feed-acceptance.py verify
      - name: Preserve isolated acceptance including failed steps
        id: native-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-feed-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-feed-acceptance/
          retention-days: 90
          if-no-files-found: error
      - name: Publish native acceptance stage status
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.native-evidence.outputs.artifact-url }}
          UPLOAD_RESULT: ${{ steps.native-evidence.outcome }}
          SOURCE_RESULT: ${{ steps.source-check.outcome }}
          CAPTURE_RESULT: ${{ steps.native-capture.outcome }}
          VERIFY_RESULT: ${{ steps.native-verify.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('native-feed-acceptance')
          lines = ['## 原生来源隔离验收', 'SHADOW OBSERVATION ONLY · Human / Research / Investment authority = NONE',
                   '明确空的试验回执历史；不是每日消费、RSS 初始化或跨运行去重证明。没有 RSS、文章或生产 Sector 请求。']
          for name in ['source-qualification.json', 'trial/acceptance.json', 'verification.json']:
              p = root / name
              if p.is_file():
                  value = json.loads(p.read_text())
                  lines += [name + ': ' + value.get('acceptance_status', value.get('status', 'UNKNOWN'))]
                  if 'requests_attempted' in value:
                      lines += [f"本次市场请求 {value['requests_attempted']}；上限15，不自动执行下一批。"]
          lines += [f"来源资格 {os.environ['SOURCE_RESULT']}；扫描／执行 {os.environ['CAPTURE_RESULT']}；重建 {os.environ['VERIFY_RESULT']}；上传 {os.environ['UPLOAD_RESULT']}",
                    '无后基线版本不是新来源通过；来源时间受阻时不获取目录和行情。旧资料不伪装成新发布。']
          if os.environ['UPLOAD_RESULT'] == 'success' and os.environ['ARTIFACT_URL']:
              lines += [f"[本次来源原文、精确输入与阶段证据]({os.environ['ARTIFACT_URL']})"]
              if os.environ['VERIFY_RESULT'] == 'success' and os.environ['CAPTURE_RESULT'] == 'success':
                  if (root/'trial/scan/index.html').is_file():
                      lines += ['来源页面：trial/scan/index.html。扫描完成不等于行情已执行。']
                  if (root/'trial/execution/index.html').is_file():
                      lines += ['市场页面：trial/execution/index.html。采集重建和远端上传分别记录，不证明 Human 阅读或投资结论。']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n\n'.join(lines) + '\n')
          PY
