name: hithink-stock-dump-trial
run-name: >-
  ${{ inputs.trial-purpose || 'stock-dump' }} | sector=${{ inputs.stock-market-run-id || 'none' }} | page=${{ inputs.stock-discovery-page || 'base' }} | recovery=${{ inputs.recovery-key || 'none' }}

on:
  workflow_dispatch:
    inputs:
      recovery-key:
        description: Optional reconciliation intent identity; never changes data qualification
        type: string
        required: false
        default: ''
      trial-purpose:
        description: Explicit isolated study; never updates Sector state
        type: choice
        options: [stock-dump, theme-probe, theme-source, native-feed-acceptance, stock-reading, stock-independent-observations, tushare-c2-price-check, tushare-c2-factor-gaps]
        default: stock-dump
      independent-closure-date:
        description: 'Independent K3 only: explicit reviewed Oct1 closure capture, anchored Sep30; never quiet active-day proof'
        type: choice
        options: ['none', '2026-10-01']
        default: 'none'
      stock-discovery-page:
        description: 'Optional stock-reading page: exact pool_hash:offset. Empty preserves original route; no automatic next page.'
        type: string
        required: false
        default: ''
      stock-market-run-id:
        description: '选 stock-reading 时必填：已成功的 sector-radar-shadow 运行编号；不是本次股票编号，无 latest 或 bootstrap 回退'
        type: string
        default: ''
      native-feed-run-id:
        description: Native acceptance only - exact successful RSS run; never initializes or refetches RSS
        type: string
        default: ''
      native-market-run-id:
        description: Native acceptance only - exact successful Sector state run; required only for qualified pending sources
        type: string
        default: ''
      native-batch-size:
        description: Isolated trial batch, not a continuous consumer or automatic next batch
        type: choice
        options: ['1', '4', '8', '16', '32']
        default: '32'
      native-execute:
        description: Explicitly execute this trial's exact market plan after scanning (otherwise catalogs and scan only)
        type: boolean
        default: false
      native-history-mode:
        description: Isolated trial, explicit first consumer history, or pinned continuation (never resets RSS)
        type: choice
        options: [isolated, initialize, continue]
        default: isolated
      native-history-run-id:
        description: Continue only - exact prior run publishing verified native history, including retained failed market attempts
        type: string
        default: ''
      native-history-hash:
        description: Continue only - exact history_hash from the prior successful history upload
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - .github/scripts/capture-theme-probe.py
      - radar_inputs/theme-source-sample-v0.json

permissions:
  contents: read

concurrency:
  group: hithink-stock-dump-qualification
  cancel-in-progress: false

jobs:
  tushare-c2-price-check:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.trial-purpose == 'tushare-c2-price-check' || inputs.trial-purpose == 'tushare-c2-factor-gaps') &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing Relay dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Bind exact main CI, unused source check and retained cohort before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
          STOCK_MARKET_RUN_ID: ${{ inputs.stock-market-run-id }}
          STOCK_DISCOVERY_PAGE: ${{ inputs.stock-discovery-page }}
          RECOVERY_KEY: ${{ inputs.recovery-key }}
          CLOSURE_DATE: ${{ inputs.independent-closure-date }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          from decision_kernel.runtime.tushare_c2_price_check import (
              workflow_identity, one_shot_scope, reference, READING, DETAIL, GAP_MODE,
              BASE_RUN, BASE_COMMIT, BASE_ARTIFACT, BASE_BYTES, BASE_ZIP_SHA256, original_input)
          env=os.environ
          workflow_identity(env, mode=env['TRIAL_PURPOSE'])
          assert not any(env[k] for k in ('STOCK_MARKET_RUN_ID','STOCK_DISCOVERY_PAGE','RECOVERY_KEY'))
          assert env['CLOSURE_DATE']=='none'
          repo=env['GITHUB_REPOSITORY']
          def get(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          sha=env['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          assert get('git/ref/heads/main')['object']['sha']==sha
          runs=get(f'actions/workflows/ci.yml/runs?head_sha={sha}&event=push&per_page=20')['workflow_runs']
          assert runs
          ci=max(runs,key=lambda r:(r['created_at'],r['id']))
          assert ci['head_sha']==sha and ci['head_branch']=='main' and ci['event']=='push'
          assert ci['path']=='.github/workflows/ci.yml' and ci['run_attempt']==1
          assert ci['status']=='completed' and ci['conclusion']=='success'
          assert ci['repository']['full_name']==ci['head_repository']['full_name']==repo
          rows=[]
          for page in range(1,11):
              data=get(f'actions/workflows/hithink-stock-dump-trial.yml/runs?per_page=100&page={page}')
              rows.extend(data['workflow_runs'])
              if len(rows)>=data['total_count']:break
          one_shot_scope(rows,data['total_count'],int(env['GITHUB_RUN_ID']),mode=env['TRIAL_PURPOSE'])
          if env['TRIAL_PURPOSE'] == GAP_MODE:
              from decision_kernel.runtime import current_state as saved
              from decision_kernel.runtime.current_state_delivery import GitHubAPI
              run=get(f'actions/runs/{BASE_RUN}')
              saved.run_identity(run, 'stock', success=True)
              assert run['id']==BASE_RUN and run['head_sha']==BASE_COMMIT
              assert run['display_title']=='tushare-c2-price-check | sector=none | page=base | recovery=none'
              artifact=get(f'actions/artifacts/{BASE_ARTIFACT}')
              assert artifact['id']==BASE_ARTIFACT and artifact['expired'] is False
              assert artifact['workflow_run']['id']==BASE_RUN and artifact['workflow_run']['head_sha']==BASE_COMMIT
              assert artifact['size_in_bytes']==BASE_BYTES and artifact['digest']=='sha256:'+BASE_ZIP_SHA256
              raw=GitHubAPI(env['GH_TOKEN']).archive(artifact)
              original_input(raw)
              Path(env['RUNNER_TEMP'],'tushare-c2-original.zip').write_bytes(raw)
          else:
              source=get(f'contents/{DETAIL}?ref={READING}')
              assert source['encoding']=='base64'
              raw=base64.b64decode(source['content'],validate=False)
              reference(raw)
              Path(env['RUNNER_TEMP'],'tushare-c2-reference.json').write_bytes(raw)
          PY
      - name: Check the retained cohort with the existing Relay client once
        id: relay-capture
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
        run: |
          if test "$TRIAL_PURPOSE" = tushare-c2-factor-gaps; then
            python -m decision_kernel.runtime.tushare_c2_price_check capture-gaps \
              --original "$RUNNER_TEMP/tushare-c2-original.zip" \
              --root "$RUNNER_TEMP/tushare-c2-price-check"
          else
            python -m decision_kernel.runtime.tushare_c2_price_check capture \
              --reference "$RUNNER_TEMP/tushare-c2-reference.json" \
              --root "$RUNNER_TEMP/tushare-c2-price-check"
          fi
      - name: Replay actual responses without source credentials
        id: relay-verify
        if: always() && (steps.relay-capture.outcome == 'success' || steps.relay-capture.outcome == 'failure')
        env:
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
        run: |
          mode=verify
          if test "$TRIAL_PURPOSE" = tushare-c2-factor-gaps; then mode=verify-gaps; fi
          python -m decision_kernel.runtime.tushare_c2_price_check "$mode" \
            --root "$RUNNER_TEMP/tushare-c2-price-check"
      - name: Retain the actual source attempt including failure
        if: always() && (steps.relay-capture.outcome == 'success' || steps.relay-capture.outcome == 'failure')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.trial-purpose }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tushare-c2-price-check/
          retention-days: 30
          if-no-files-found: error
      - name: Keep source availability distinct from engineering completion
        if: always()
        run: |
          echo 'C2 Relay: original scope 33/66; factor-gap scope 5/10 logical/HTTP maxima, separately consumed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No recurring acquisition, historical database, action-detail or total-return certification. Saved comparison publication is separate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect receipt/report for source failure and each of the 16 retained names; workflow success is not C2 acceptance.' >> "$GITHUB_STEP_SUMMARY"

  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.trial-purpose == 'stock-dump'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require reviewed main and a fresh run
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Install isolated reader and transport
        run: python -m pip install -e '.[dump-study]'
      - name: Record workflow identity
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from decision_kernel.identity import canonical_hash, canonical_json
          root = Path("stock-dump-trial")
          root.mkdir(exist_ok=False)
          value = {key: os.environ[key] for key in (
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_EVENT_NAME"
          )}
          value.update(semantics="ISOLATED_DATA_COMPATIBILITY_TRIAL_NOT_MARKET_PRODUCTION",
                       human_attention_authority="NONE", research_authority="NONE", investment_authority="NONE")
          value["provenance_hash"] = canonical_hash(value)
          (root / "workflow.json").write_text(canonical_json(value) + "\n", encoding="utf-8")
          PY
      - name: Acquire one recent dump and reconcile qualified references
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          python -m decision_kernel.runtime.hithink_dump_trial --output stock-dump-trial/capture
      - name: Repeat row inspection offline when all inputs exist
        if: always()
        run: |
          root=stock-dump-trial/capture
          if [ ! -f "$root/snapshot.json" ] || [ ! -f "$root/universe.json" ] || [ ! -f "$root/sessions.json" ]; then
            echo "Reference acquisition did not complete; full-field offline inspection is unavailable."
            exit 0
          fi
          python -m decision_kernel.runtime.hithink_dump_inspection \
            --parquet "$root/daily-k-10d.parquet" --sessions "$root/sessions.json" \
            --universe "$root/universe.json" --snapshot "$root/snapshot.json" \
            --output stock-dump-trial/offline-inspection.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("stock-dump-trial")
          original = json.loads((root / "capture/report.json").read_text())
          replay = json.loads((root / "offline-inspection.json").read_text())
          assert original["inspection"] == replay["inspection"], "offline inspection differs"
          PY
      - name: Retain complete attempt evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hithink-stock-dump-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: stock-dump-trial/
          if-no-files-found: error
          retention-days: 90
      - name: Publish isolated study result
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          if [ -f stock-dump-trial/capture/summary.md ]; then
            cat stock-dump-trial/capture/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Stock dump trial did not produce a sealed result; inspect failed steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[隔离数据试验与原始文件](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '不是行业状态更新、历史成员宽度或投资信号。没有执行自动恢复或替代来源。' >> "$GITHUB_STEP_SUMMARY"
  stock-independent-observations:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.trial-purpose == 'stock-independent-observations' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing Stock transport
        run: python -m pip install -e '.[feeds]'
      - name: Require explicit independent identity and exact-main CI
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
          STOCK_MARKET_RUN_ID: ${{ inputs.stock-market-run-id }}
          STOCK_DISCOVERY_PAGE: ${{ inputs.stock-discovery-page }}
          RECOVERY_KEY: ${{ inputs.recovery-key }}
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os
          from decision_kernel.runtime.hithink_independent_capture import intent
          intent(os.environ)
          PYCODE
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=10 > "$RUNNER_TEMP/independent-ci.json"
          python - <<'PYCODE'
          import json, os
          runs = json.load(open(os.environ['RUNNER_TEMP']+'/independent-ci.json'))['workflow_runs']
          assert runs
          r = max(runs, key=lambda x: (x['created_at'], x['id']))
          assert r['head_sha'] == os.environ['GITHUB_SHA'] and r['head_branch'] == 'main'
          assert r['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert r['path'] == '.github/workflows/ci.yml' and r['event'] == 'push'
          assert r['run_attempt'] == 1 and r['status'] == 'completed' and r['conclusion'] == 'success'
          PYCODE
      - name: Observe shared-Key peers once without source requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import os, runpy
          m = runpy.run_path('.github/scripts/check-sector-scheduled-activity.py')
          m['require_invocation'](os.environ)
          peers = frozenset('.github/workflows/'+name+'.yml' for name in
                            ('sector-radar-shadow', 'decision-inbox', 'live-dogfood'))
          blockers = m['check_activity'](m['request_reader'](os.environ['GH_TOKEN']), peers=peers)
          assert not blockers, 'BLOCKED_SHARED_KEY_ACTIVITY'
          print('No visible peers; metadata observation is not an atomic lock or quota proof')
          PYCODE
      - name: Capture one complete denominator and frozen K3
        id: independent-capture
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
          STOCK_MARKET_RUN_ID: ${{ inputs.stock-market-run-id }}
          STOCK_DISCOVERY_PAGE: ${{ inputs.stock-discovery-page }}
          RECOVERY_KEY: ${{ inputs.recovery-key }}
          CLOSURE_DATE: ${{ inputs.independent-closure-date }}
        run: |
          args=()
          if test "$CLOSURE_DATE" != none; then args+=(--closure-date "$CLOSURE_DATE"); fi
          python -m decision_kernel.runtime.hithink_independent_capture capture \
            --root "$RUNNER_TEMP/independent-stock-capture" "${args[@]}"
      - name: Replay this attempt offline without credentials
        id: independent-verify
        if: always() && (steps.independent-capture.outcome == 'success' || steps.independent-capture.outcome == 'failure')
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from decision_kernel.identity import canonical_json
          from decision_kernel.runtime.hithink_independent_capture import verify
          from decision_kernel.runtime.independent_stock_observations import _load
          root = Path(os.environ['RUNNER_TEMP'])/'independent-stock-capture'
          pin = _load(root/'capture.json')['capture_hash']
          receipt = verify(root, expected_capture_hash=pin)
          print(canonical_json(receipt))
          (root.parent/'independent-stock-verification.json').write_text(canonical_json(receipt)+'\n')
          PYCODE
      - name: Retain independent attempt including failures
        id: independent-evidence
        if: always() && (steps.independent-capture.outcome == 'success' || steps.independent-capture.outcome == 'failure')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stock-independent-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/independent-stock-capture/
            ${{ runner.temp }}/independent-stock-verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Keep independent acceptance boundaries visible
        if: always()
        env:
          CAPTURE_RESULT: ${{ steps.independent-capture.outcome }}
          VERIFY_RESULT: ${{ steps.independent-verify.outcome }}
          UPLOAD_RESULT: ${{ steps.independent-evidence.outcome }}
        run: |
          {
            echo 'Independent Stock capture is manual-only, capped at 26 attempts including failures; no retry or next batch.'
            printf 'Capture=%s; offline verification=%s; upload=%s.\n' "$CAPTURE_RESULT" "$VERIFY_RESULT" "$UPLOAD_RESULT"
            echo 'Raw artifacts and observation sampling are separate from quiet-day evidence, Surprise value, Research, current-state Stock admission and investment authority.'
          } >> "$GITHUB_STEP_SUMMARY"
  stock-reading:
    if: github.event_name == 'workflow_dispatch' && inputs.trial-purpose == 'stock-reading'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing evidence and market dependencies
        run: python -m pip install -e '.[feeds,discovery]'
      - name: Record explicit stock reading intent
        id: stock-intent
        env:
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
          STOCK_MARKET_RUN_ID: ${{ inputs.stock-market-run-id }}
          STOCK_DISCOVERY_PAGE: ${{ inputs.stock-discovery-page }}
        run: python .github/scripts/capture-stock-reading.py init --root "$RUNNER_TEMP/stock-reading-run"
      - name: Bind exact successful Sector state artifact
        id: stock-state
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_RUN: ${{ steps.stock-intent.outputs.market_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MARKET_RUN" > "$RUNNER_TEMP/stock-reading-run/market-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MARKET_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/stock-reading-run/market-artifacts.json"
          python .github/scripts/capture-stock-reading.py metadata --root "$RUNNER_TEMP/stock-reading-run"
      - name: Download only exact read-only Sector input
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.stock-state.outputs.artifact_id }}
          run-id: ${{ steps.stock-intent.outputs.market_run_id }}
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/stock-reading-run/market
      - name: Download exact read-only Sector result context
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.stock-state.outputs.context_artifact_id }}
          run-id: ${{ steps.stock-intent.outputs.market_run_id }}
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/stock-reading-run/market-context
      - name: Build stock-first observations
        id: stock-capture
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python .github/scripts/capture-stock-reading.py capture --root "$RUNNER_TEMP/stock-reading-run" > "$RUNNER_TEMP/stock-reading-run/operation.json"
      - name: Rebuild stock selection without credentials
        id: stock-verify
        if: always() && (steps.stock-capture.outcome == 'success' || steps.stock-capture.outcome == 'failure')
        env:
          HITHINK_FINANCE_API_KEY: ''
        run: python .github/scripts/capture-stock-reading.py verify --root "$RUNNER_TEMP/stock-reading-run"
      - name: Retain stock page and exact evidence including failures
        id: stock-evidence
        if: always() && steps.stock-intent.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stock-reading-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stock-reading-run/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Show stocks before technical details
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.stock-evidence.outputs.artifact-url }}
          UPLOAD_RESULT: ${{ steps.stock-evidence.outcome }}
          CAPTURE_RESULT: ${{ steps.stock-capture.outcome }}
          VERIFY_RESULT: ${{ steps.stock-verify.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'stock-reading-run'
          lines = ['## 股票观察 · 可展开看的对象', 'SHADOW ONLY；不是买入建议或 canonical Inbox 推送。']
          success = all(os.environ[k] == 'success' for k in ('UPLOAD_RESULT','CAPTURE_RESULT','VERIFY_RESULT'))
          report = root/'reading/stock-reading.json'
          preflight = root/'preflight.json'
          if preflight.is_file():
              p = json.loads(preflight.read_text())
              lines += [p['message'], '输入校验未通过；采集未开始，未调用 HiThink。不是扫描后零匹配。',
                        '失败诊断见附件根目录 index.html / preflight.json；修正参数后使用新的 Run workflow，不重跑旧任务。']
          elif success and report.is_file():
              from decision_kernel.runtime.stock_radar_reading import STATUS_LABELS
              p = json.loads(report.read_text())['projection']
              c = p['coverage']
              lines += ['**'+STATUS_LABELS[p['status']]+'**',
                        f"计划 {c['planned_issuers']}；已完成条件检查 {c['evaluated_issuers']}；条件不满足 {c['conditions_not_met_issuers']}；数据不可用 {c['unavailable_issuers']}。"]
              if not c['scope_complete']:
                  lines += ['覆盖尚未完整；只能陈述已检查子集，不能称作全计划零匹配。']
              lines += [f"行情交易日 {p['market_session']}；本次有界 Market Expression 范围内 {len(p['surfaced_stocks'])} 只通过观察条件。"]
              for row in p['surfaced_stocks']:
                  lines += [f"**{row['thscode']} {row['company_name']}** · 来源：" + '、'.join(o['node_label'] for o in row['current_origins'])]
              lines += [f"计划候选 {c['planned_issuers']}；其中 exact reviewed business link {p['reviewed_issuers']}；Business Evidence 不是候选门槛；不是全 A 股盲选。",
                        '解压后打开 reading/index.html；所有剔除原因和覆盖缺口均保留。']
          else:
              lines += ['本次未形成可发布的股票结果。请看失败步骤，不用空名单冒充扫描成功。']
          lines += [f"采集 {os.environ['CAPTURE_RESULT']}；重建 {os.environ['VERIFY_RESULT']}；上传 {os.environ['UPLOAD_RESULT']}。"]
          if os.environ['UPLOAD_RESULT'] == 'success' and os.environ['ARTIFACT_URL']:
              lines += [f"[本次股票阅读／失败诊断附件]({os.environ['ARTIFACT_URL']})"]
          lines += ['不使用未通过资格的全市场 dump；没有生产状态、候选账本或 Human / Research / Investment authority 变更。']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n\n'.join(lines)+'\n')
          PY
  theme-probe:
    if: github.event_name == 'push' || inputs.trial-purpose == 'theme-probe' || inputs.trial-purpose == 'theme-source'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require reviewed main and one attempt
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Install existing transport and probe environment
        run: python -m pip install -e '.[dump-study,discovery]'
      - name: Capture bounded theme catalogs then frozen request plan
        id: capture
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
        run: |
          mkdir theme-probe-trial
          selection=radar_inputs/theme-source-sample-v0.json
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$TRIAL_PURPOSE" = theme-probe ]; then
            selection=radar_inputs/theme-probe-sample-v0.json
          fi
          python .github/scripts/capture-theme-probe.py capture --selection "$selection" \
            --output theme-probe-trial/capture > theme-probe-trial/operation.json
      - name: Rebuild from original responses without market credentials
        id: verification
        if: always()
        env:
          HITHINK_FINANCE_API_KEY: ""
        run: |
          python .github/scripts/capture-theme-probe.py verify \
            --output theme-probe-trial/capture > theme-probe-trial/verification.json
      - name: Preserve bounded theme trial including any failure
        id: theme-evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: theme-probe-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: theme-probe-trial/
          if-no-files-found: error
          retention-days: 90
      - name: Publish explicit theme trial status
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.theme-evidence.outputs.artifact-url }}
          CAPTURE_RESULT: ${{ steps.capture.outcome }}
          VERIFY_RESULT: ${{ steps.verification.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['## 跨行业主题有界试验', 'SHADOW OBSERVATION ONLY · NOT RESEARCH · NOT A RECOMMENDATION']
          report = Path('theme-probe-trial/capture/capture.json')
          if report.is_file():
              r = json.loads(report.read_text())
              lines += [f"Status: {r['status']}", f"实际请求：{r['requests_attempted']}；保存市场日：{r['market_session']}"]
              if r['failure']:
                  lines += [f"Failure type: {r['failure']['type']}；具体原因见 capture.json，未替换来源或重试。"]
          else:
              lines += ['没有完整采集记录，请检查失败步骤。']
          lines += [f"采集步骤：{os.environ['CAPTURE_RESULT']}；离线核验步骤：{os.environ['VERIFY_RESULT']}",
                    '失败核验成功只证明已保留字节或来源扫描可重建，不代表主题行情计算成功。',
                    '没有生产市场状态、候选账本、Human / Research / Investment authority 变更。']
          if os.environ['ARTIFACT_URL']:
              lines += [f"[本次原始响应与核验附件]({os.environ['ARTIFACT_URL']})"]
              if Path('theme-probe-trial/capture/source-discovery.html').is_file():
                  lines += ['来源线索与阻塞原因：capture/source-discovery.html。留存文字可能是部分转述，提及不是受益。']
          if (os.environ['CAPTURE_RESULT'] == os.environ['VERIFY_RESULT'] == 'success'
                  and os.environ['ARTIFACT_URL'] and Path('theme-probe-trial/capture/index.html').is_file()):
              lines += ['解压后打开 capture/index.html；不是全市场主题排名或真实前瞻候选。']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n\n'.join(lines) + '\n')
          PY
  native-feed:
    if: github.event_name == 'workflow_dispatch' && inputs.trial-purpose == 'native-feed-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing feed and market libraries
        run: python -m pip install -e '.[feeds,dump-study,discovery]'
      - name: Record explicit native acceptance and history intent
        id: intent
        env:
          TRIAL_PURPOSE: ${{ inputs.trial-purpose }}
          NATIVE_FEED_RUN_ID: ${{ inputs.native-feed-run-id }}
          NATIVE_MARKET_RUN_ID: ${{ inputs.native-market-run-id }}
          NATIVE_BATCH_SIZE: ${{ inputs.native-batch-size }}
          NATIVE_EXECUTE: ${{ inputs.native-execute }}
          NATIVE_HISTORY_MODE: ${{ inputs.native-history-mode }}
          NATIVE_HISTORY_RUN_ID: ${{ inputs.native-history-run-id }}
          NATIVE_HISTORY_HASH: ${{ inputs.native-history-hash }}
        run: python .github/scripts/native-feed-acceptance.py init
      - name: Bind exact source artifact metadata
        id: source-meta
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.intent.outputs.source_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > native-feed-acceptance/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > native-feed-acceptance/source-artifacts.json
          python .github/scripts/native-feed-acceptance.py metadata --kind source
      - name: Download only the bound source artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source-meta.outputs.artifact_id }}
          run-id: ${{ steps.intent.outputs.source_run_id }}
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: native-feed-acceptance/source
      - name: Rebuild and qualify sources before market access
        id: source-check
        run: python .github/scripts/native-feed-acceptance.py qualify
      - name: Bind explicitly selected history artifact
        id: history-meta
        if: steps.intent.outputs.history_mode == 'continue'
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_RUN: ${{ steps.intent.outputs.history_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HISTORY_RUN" > native-feed-acceptance/history-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HISTORY_RUN/artifacts?per_page=100" > native-feed-acceptance/history-artifacts.json
          python .github/scripts/native-feed-acceptance.py metadata --kind history
      - name: Download only the pinned history artifact
        if: steps.intent.outputs.history_mode == 'continue'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.history-meta.outputs.artifact_id }}
          run-id: ${{ steps.intent.outputs.history_run_id }}
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: native-feed-acceptance/previous-history
      - name: Verify pinned history before market access
        id: history-ready
        run: python .github/scripts/native-feed-acceptance.py history-prepare
      - name: Bind exact saved market artifact when sources qualify
        id: market-meta
        if: steps.source-check.outputs.needs_market == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_RUN: ${{ steps.intent.outputs.market_run_id }}
        run: |
          test -n "$MARKET_RUN"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MARKET_RUN" > native-feed-acceptance/market-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MARKET_RUN/artifacts?per_page=100" > native-feed-acceptance/market-artifacts.json
          python .github/scripts/native-feed-acceptance.py metadata --kind market
      - name: Download only the bound read-only market state
        if: steps.source-check.outputs.needs_market == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.market-meta.outputs.artifact_id }}
          run-id: ${{ steps.intent.outputs.market_run_id }}
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: native-feed-acceptance/market
      - name: Scan one batch and optionally execute its exact plan
        id: native-capture
        if: steps.source-check.outputs.needs_market == 'true'
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python .github/scripts/native-feed-acceptance.py run > native-feed-acceptance/operation.json
      - name: Rebuild isolated acceptance without credentials
        id: native-verify
        if: always()
        env:
          HITHINK_FINANCE_API_KEY: ''
        run: python .github/scripts/native-feed-acceptance.py verify
      - name: Register replayed history including valid failed market attempts
        id: history-save
        if: always() && steps.source-check.outcome == 'success' && steps.history-ready.outcome == 'success' && steps.intent.outputs.history_mode != 'isolated'
        env:
          HITHINK_FINANCE_API_KEY: ''
        run: python .github/scripts/native-feed-acceptance.py history-save
      - name: Publish only fully verified consumer history
        id: history-upload
        if: always() && steps.history-save.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-feed-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-feed-acceptance/history-export/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve isolated acceptance including failed steps
        id: native-evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-feed-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-feed-acceptance/
          retention-days: 90
          if-no-files-found: error
      - name: Publish native acceptance stage status
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.native-evidence.outputs.artifact-url }}
          UPLOAD_RESULT: ${{ steps.native-evidence.outcome }}
          SOURCE_RESULT: ${{ steps.source-check.outcome }}
          CAPTURE_RESULT: ${{ steps.native-capture.outcome }}
          VERIFY_RESULT: ${{ steps.native-verify.outcome }}
          HISTORY_MODE: ${{ steps.intent.outputs.history_mode }}
          HISTORY_SAVE: ${{ steps.history-save.outcome }}
          HISTORY_UPLOAD: ${{ steps.history-upload.outcome }}
          HISTORY_URL: ${{ steps.history-upload.outputs.artifact-url }}
          HISTORY_HASH: ${{ steps.history-save.outputs.history_hash }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('native-feed-acceptance')
          lines = ['## 原生来源手动验收', 'SHADOW OBSERVATION ONLY · Human / Research / Investment authority = NONE',
                   '不是每日消费、RSS 初始化或全局最新状态证明。没有 RSS、文章或生产 Sector 请求。']
          if os.environ['HISTORY_MODE'] == 'isolated':
              lines += ['隔离模式：明确空的试验回执历史，不登记进度。']
          else:
              lines += [f"处理历史模式 {os.environ['HISTORY_MODE']}；原始回执与失败尝试不改写。"]
          lines += [f"历史登记 {os.environ['HISTORY_SAVE']}；历史附件上传 {os.environ['HISTORY_UPLOAD']}。"]
          if os.environ['HISTORY_UPLOAD'] == 'success' and os.environ['HISTORY_URL']:
              lines += [f"[已保存的精确处理历史]({os.environ['HISTORY_URL']})",
                        f"下一次明确选择本次 run 与 history_hash={os.environ['HISTORY_HASH']}。",
                        '历史保存成功不代表行情成功；失败尝试仍失败，不自动重试或刷新旧计划。']

          for name in ['source-qualification.json', 'trial/acceptance.json', 'verification.json']:
              p = root / name
              if p.is_file():
                  value = json.loads(p.read_text())
                  lines += [name + ': ' + value.get('acceptance_status', value.get('status', 'UNKNOWN'))]
                  if 'requests_attempted' in value:
                      lines += [f"本次市场请求 {value['requests_attempted']}；上限15，不自动执行下一批。"]
          lines += [f"来源资格 {os.environ['SOURCE_RESULT']}；扫描／执行 {os.environ['CAPTURE_RESULT']}；重建 {os.environ['VERIFY_RESULT']}；上传 {os.environ['UPLOAD_RESULT']}",
                    '无后基线版本不是新来源通过；来源时间受阻时不获取目录和行情。旧资料不伪装成新发布。']
          if os.environ['UPLOAD_RESULT'] == 'success' and os.environ['ARTIFACT_URL']:
              lines += [f"[本次来源原文、精确输入与阶段证据]({os.environ['ARTIFACT_URL']})"]
              if os.environ['VERIFY_RESULT'] == 'success' and os.environ['CAPTURE_RESULT'] == 'success':
                  if (root/'trial/scan/index.html').is_file():
                      lines += ['来源页面：trial/scan/index.html。扫描完成不等于行情已执行。']
                  if (root/'trial/execution/index.html').is_file():
                      lines += ['市场页面：trial/execution/index.html。采集重建和远端上传分别记录，不证明 Human 阅读或投资结论。']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n\n'.join(lines) + '\n')
          PY
