name: sector-ths-dual-complete-candidate

on:
  push:
    branches: [recovery/sector-ths-dual-complete-20260911]

permissions:
  actions: read
  contents: read

concurrency:
  group: sector-ths-dual-complete-candidate-20260911
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install Kernel and fixed AKShare helper
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check \
            'git+https://github.com/akfamily/akshare.git@8e95744b79ae22326308ccd2b4e62650c5b53c55'
          python -m py_compile .github/scripts/capture-sector-ths-v6-complete.py .github/scripts/capture-sector-ths-dual-complete.py
      - name: Download frozen HiThink source
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10187281705'
          run-id: '34566950303'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/source
      - name: Download latest 40-v4 plus 27-v6 valid source bundle
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10189565008'
          run-id: '34575644848'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/prior
      - name: Download accepted 884118 v4 fallback probe
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10189654420'
          run-id: '34576022176'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/probe
      - name: Complete only remaining 143 identities with bounded v6 to v4 fallback
        id: capture
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python .github/scripts/capture-sector-ths-dual-complete.py capture \
            --source "$RUNNER_TEMP/source" \
            --prior "$RUNNER_TEMP/prior/sector-ths-v6-complete" \
            --probe "$RUNNER_TEMP/probe" \
            --output "$RUNNER_TEMP/dual-complete"
      - name: Offline exact rebuild
        id: verify
        if: ${{ steps.capture.outcome == 'success' }}
        continue-on-error: true
        run: |
          python .github/scripts/capture-sector-ths-dual-complete.py verify \
            --source "$RUNNER_TEMP/source" \
            --capture "$RUNNER_TEMP/dual-complete" \
            --output "$RUNNER_TEMP/dual-verify"
      - name: Retain all source raw, attempts, candidate and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-ths-dual-complete-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dual-complete/
            ${{ runner.temp }}/dual-verify/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Enforce candidate-only acceptance
        if: always()
        env:
          C: ${{ steps.capture.outcome }}
          V: ${{ steps.verify.outcome }}
        run: |
          printf 'capture=%s verify=%s\n' "$C" "$V"
          test "$C" = success
          test "$V" = success
