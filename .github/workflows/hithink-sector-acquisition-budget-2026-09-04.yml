name: hithink-sector-acquisition-budget-2026-09-04

on:
  pull_request:
    paths:
      - '.github/workflows/hithink-sector-acquisition-budget-2026-09-04.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Inspect industry catalog layers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from collections import Counter
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from decision_kernel.runtime.hithink_http import _request_hithink_json

          api_key = os.environ.get('HITHINK_FINANCE_API_KEY')
          if not api_key:
              raise SystemExit('HITHINK_FINANCE_API_KEY is required')

          envelope = _request_hithink_json(
              api_key=api_key,
              path='/api/a-share-index/catalog/ths-index-list',
              params={'tag': 'industry'},
              timeout_seconds=25.0,
          )
          if envelope.get('code') != 0:
              raise SystemExit(
                  f"industry catalog business failure: {envelope.get('code')}"
              )
          data = envelope.get('data')
          rows = data.get('item') if isinstance(data, dict) else None
          if not isinstance(rows, list) or not rows:
              raise SystemExit('industry catalog is empty')

          items = sorted(
              (
                  {
                      'thscode': str(row.get('thscode', '')).strip().upper(),
                      'name': str(row.get('name', '')).strip(),
                  }
                  for row in rows
                  if isinstance(row, dict)
              ),
              key=lambda item: item['thscode'],
          )
          if any(not item['thscode'].endswith('.TI') or not item['name'] for item in items):
              raise SystemExit('industry catalog contains malformed identity')
          if len({item['thscode'] for item in items}) != len(items):
              raise SystemExit('industry catalog contains duplicate identity')

          prefixes = Counter(item['thscode'][:3] for item in items)
          families = {
              prefix: [item for item in items if item['thscode'].startswith(prefix)]
              for prefix in sorted(prefixes)
          }
          human_keywords = (
              '船舶', '航海', '水产', '养殖', '农业', '种植', '林业',
          )

          canonical_bytes = json.dumps(
              items,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ).encode('utf-8')
          result = {
              'schema_version': 1,
              'captured_at': datetime.now(ZoneInfo('Asia/Shanghai')).isoformat(),
              'source_timestamp': data.get('timestamp') if isinstance(data, dict) else None,
              'item_count': len(items),
              'catalog_sha256': hashlib.sha256(canonical_bytes).hexdigest(),
              'prefix_counts': dict(sorted(prefixes.items())),
              'families': families,
              'human_example_matches': [
                  item
                  for item in items
                  if any(keyword in item['name'] for keyword in human_keywords)
              ],
              'semantics': 'CATALOG_LAYER_PROBE_ONLY',
              'production_universe_decision': 'NOT_MADE_BY_THIS_PROBE',
              'human_attention_authority': 'NONE',
              'investment_authority': 'NONE',
          }
          Path('hithink-industry-catalog-layers.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          print(f"ITEM_COUNT={len(items)}")
          print(f"PREFIX_COUNTS={dict(sorted(prefixes.items()))}")
          print(f"CATALOG_SHA256={result['catalog_sha256']}")
          for prefix, family in families.items():
              print(f"FAMILY={prefix} COUNT={len(family)}")
              for item in family:
                  print(f"  {item['thscode']} {item['name']}")
          print(f"HUMAN_EXAMPLE_MATCHES={result['human_example_matches']}")
          print('SEMANTICS=CATALOG_LAYER_PROBE_ONLY')
          print('HUMAN_ATTENTION_AUTHORITY=NONE')
          print('INVESTMENT_AUTHORITY=NONE')
          PY
      - name: Publish catalog-layer summary
        if: always()
        shell: bash
        run: |
          {
            echo '## HiThink industry catalog layer probe'
            echo
            if [ -f hithink-industry-catalog-layers.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('hithink-industry-catalog-layers.json').read_text(encoding='utf-8')
          )
          print(f"Catalog identities: **{data['item_count']}**")
          print(f"Prefix counts: `{data['prefix_counts']}`")
          print(f"Catalog hash: `{data['catalog_sha256']}`")
          print()
          print('Human-example matches:')
          for item in data['human_example_matches']:
              print(f"- {item['name']} `{item['thscode']}`")
          print()
          print('Catalog probe only; no production universe or alert decision is made here.')
          PY
            else
              echo 'Catalog-layer probe failed before a result was written.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload catalog-layer artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hithink-industry-catalog-layers-2026-09-04
          path: hithink-industry-catalog-layers.json
          if-no-files-found: warn
          retention-days: 14
