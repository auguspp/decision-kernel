name: sanhua-relation-acquisition

on:
  push:
    branches: [main]
    paths: [.github/source-acquisition/sanhua-relation-v0-20260909.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: sanhua-relation-acquisition-v0
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_BASE: ${{ github.event.before }}
    steps:
      - name: Require reviewed main and one fresh attempt
        run: |
          test "$GITHUB_REPOSITORY" = "auguspp/decision-kernel"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$SOURCE_BASE" = "b71ff68984a243f3aa397819336b7aaf7e586515"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing isolated public transport extra
        run: python -m pip install -e '.[dump-study]'
      - name: Require first addition and freeze invocation
        run: |
          request=.github/source-acquisition/sanhua-relation-v0-20260909.json
          if git cat-file -e "$SOURCE_BASE:$request" 2>/dev/null; then
            echo 'Relation request already existed; no repeat acquisition.'
            exit 1
          fi
          test "$(git diff --name-only --diff-filter=A "$SOURCE_BASE" "$GITHUB_SHA" -- "$request")" = "$request"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from decision_kernel.identity import canonical_hash, canonical_json
          from decision_kernel.runtime.sanhua_source_acquisition import plan
          request = json.loads(Path('.github/source-acquisition/sanhua-relation-v0-20260909.json').read_text())
          assert request['approved_base'] == os.environ['SOURCE_BASE']
          assert request['plan'] == plan('relation')
          root = Path('sanhua-relation-package')
          root.mkdir(exist_ok=False)
          value = {k: os.environ[k] for k in (
              'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'GITHUB_EVENT_NAME')}
          value.update(semantics='SINGLE_RELATION_CAPTURE_NOT_RESEARCH', source_channel='CNINFO_RELATION',
                       request_hash=canonical_hash(request), previous_fulltext=plan('relation')['previous_fulltext'])
          value['invocation_hash'] = canonical_hash(value)
          (root / 'workflow.json').write_text(canonical_json(value) + '\n', encoding='utf-8')
          PY
      - name: Retrieve exact saved fulltext artifact for offline compatibility only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 60s gh api --method GET repos/auguspp/decision-kernel/actions/artifacts/10090204888/zip > "$RUNNER_TEMP/sanhua-legacy.zip"
          python - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'sanhua-legacy.zip'
          assert path.stat().st_size == 1008406
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '0c67714a58dc46bbf9fdd391ff44c29ff7ebc6821f9d449630446d8e6a17dfd0'
          expected = {'workflow.json', 'verification.json', 'capture/plan.json', 'capture/capture.json',
                      'capture/request-journal.jsonl', 'capture/001.json', 'capture/002.json', 'capture/003.pdf'}
          with zipfile.ZipFile(path) as z:
              assert len(z.infolist()) == 8 and set(z.namelist()) == expected
              assert sum(i.file_size for i in z.infolist()) < 8 * 1024 * 1024
              assert z.testzip() is None
              z.extractall(Path(os.environ['RUNNER_TEMP']) / 'sanhua-legacy')
          PY
      - name: Rebuild old fulltext capture unchanged with the installed new code
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from decision_kernel.identity import canonical_json
          from decision_kernel.runtime.sanhua_source_acquisition import verify
          legacy = Path(os.environ['RUNNER_TEMP']) / 'sanhua-legacy'
          before = {str(p.relative_to(legacy)): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in legacy.rglob('*') if p.is_file()}
          result = verify(legacy / 'capture')
          assert result == json.loads((legacy / 'verification.json').read_text())
          assert result['capture_hash'] == '5eeef570ac42299532e438f57b42beb09bc07749597c592a65afe6f30082e34f'
          assert result['capture_status'] == 'SOURCE_CAPTURE_INCOMPLETE' and result['network_calls'] == 0
          assert before == {str(p.relative_to(legacy)): hashlib.sha256(p.read_bytes()).hexdigest()
                            for p in legacy.rglob('*') if p.is_file()}
          Path('sanhua-relation-package/legacy-fulltext-verification.json').write_text(canonical_json(result) + '\n')
          print('LEGACY_FULLTEXT_EXACT_OUTCOME_PASS ' + canonical_json(result))
          PY
      - name: Capture relation inventory and at most one IR original once
        run: python -m decision_kernel.runtime.sanhua_source_acquisition capture sanhua-relation-package/capture --channel relation
      - name: Verify retained relation success or failure offline
        if: always()
        run: |
          if test -f sanhua-relation-package/capture/capture.json; then
            python -m decision_kernel.runtime.sanhua_source_acquisition verify sanhua-relation-package/capture --channel relation > sanhua-relation-package/verification.json
          else
            echo 'No sealed relation capture; verification not established.'
            exit 1
          fi
      - name: Preserve relation bytes and explicit outcome
        if: always()
        id: source
        uses: actions/upload-artifact@v7
        with:
          name: sanhua-relation-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: sanhua-relation-package/
          if-no-files-found: error
          retention-days: 90
      - name: Publish source-only result
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.source.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('sanhua-relation-package/capture/capture.json')
          lines = ['## Sanhua CNINFO relation (not Research)', '']
          if path.is_file():
              value = json.loads(path.read_text())
              out = value['outcome']
              lines += [f"Status: `{out['status']}`", f"Failure: `{out['problem']}`",
                        f"Inventory complete: `{out['inventory_complete']}`",
                        f"IR PDF containers retained: `{len(out['bodies'])}`",
                        f"Capture hash: `{value['capture_hash']}`"]
          else:
              lines += ['Relation capture NOT_ESTABLISHED. See the first failed step.']
          verification = Path('sanhua-relation-package/verification.json')
          if verification.is_file() and verification.stat().st_size:
              v = json.loads(verification.read_text())
              lines += [f"Offline verification: `{v['status']}`; capture: `{v['capture_status']}`"]
          lines += ['', 'Independent from fulltext run 34316364031 / artifact 10090204888.',
                    'No H1 source reacquisition. Title qualification is not activity or robotics evidence.',
                    'Research / Human attention / Investment authority = NONE.']
          if os.environ.get('ARTIFACT_URL'):
              lines += ['', '[Raw relation package (90-day retention)](' + os.environ['ARTIFACT_URL'] + ')']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY
