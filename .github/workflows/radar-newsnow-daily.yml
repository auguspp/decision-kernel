name: radar-newsnow-daily

on:
  workflow_dispatch:
  workflow_run:
    workflows: [sector-radar-shadow]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: native-newsnow-capture
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.path == '.github/workflows/sector-radar-shadow.yml' &&
        github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require exact current code to have passed independent main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=10 > "$RUNNER_TEMP/news-ci.json"
          python - <<'PY'
          import json, os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/news-ci.json'))['workflow_runs']
          assert runs
          r=max(runs,key=lambda x:(x['created_at'],x['id']))
          assert r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='main'
          assert r['path']=='.github/workflows/ci.yml' and r['event']=='push'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          PY
      - name: Install existing source dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Start the pinned upstream NewsNow image without repository credentials
        run: |
          set -euo pipefail
          image=ghcr.io/ourongxing/newsnow@sha256:98b62bd971d308040937fdfde5263a00715b357894936e88b3ce3c0d8adbf55a
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}} {{.Id}}' > "$RUNNER_TEMP/news-image.txt"
          docker run -d --name newsnow -p 127.0.0.1:4444:4444 \
            -e HOST=0.0.0.0 -e PORT=4444 -e NODE_ENV=production \
            -e ENABLE_CACHE=false -e INIT_TABLE=true "$image"
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4444/ >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Capture seven original windows with explicit failures
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python -m decision_kernel.runtime.news_daily
          --image-identity "$RUNNER_TEMP/news-image.txt"
          --output "$RUNNER_TEMP/newsnow-daily"
      - name: Stop local service
        if: always()
        run: docker rm -f newsnow >/dev/null 2>&1 || true
      - name: Retain the original finite source attempt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newsnow-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/newsnow-daily/
          if-no-files-found: warn
          retention-days: 30
