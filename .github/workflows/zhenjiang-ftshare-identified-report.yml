name: zhenjiang-ftshare-identified-report
on:
  push:
    branches: [probe/ftshare-zhenjiang-discovery-20260921]
    paths: [.github/workflows/zhenjiang-ftshare-identified-report.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cb0d3f74624b2a9397b11423d404bcac5cdb0f0b
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install unchanged source dependencies
        run: python -m pip install -e '.[documents,feeds]'
      - name: Resolve exact official record and retain only required report
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cb0d3f74624b2a9397b11423d404bcac5cdb0f0b
          python - <<'PY'
          """Acquire only the FTShare-identified report through unchanged CNINFO primitives."""
          from dataclasses import asdict
          from datetime import date, datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os
          from decision_kernel.runtime import cninfo_http as cninfo
          from decision_kernel.adapters.pdf_text import extract_pdf_text
          
          OUT = Path('zhenjiang-source')
          TARGET = {'ticker':'603507', 'announcement_id':'1225506358',
              'title':'振江股份2026年半年度报告', 'date':'2026-08-26',
              'discovery_run':35603062208, 'discovery_artifact':10641000153,
              'discovery_response_sha256':'8d5561012481755c48c38e2aabd0d736cf9099d1a80c0e2fbb1d74c7895dcb5b',
              'code_commit':'cb0d3f74624b2a9397b11423d404bcac5cdb0f0b'}
          
          def now():
              return datetime.now(timezone.utc).isoformat()
          
          def store(name, data):
              raw = data if isinstance(data, bytes) else json.dumps(data, ensure_ascii=False, indent=2, default=str).encode()
              with (OUT / name).open('xb') as f:
                  f.write(raw)
              return {'path':name, 'bytes':len(raw), 'sha256':hashlib.sha256(raw).hexdigest()}
          
          def main():
              assert os.environ['GITHUB_REPOSITORY']=='auguspp/decision-kernel'
              assert os.environ['GITHUB_REF']=='refs/heads/probe/ftshare-zhenjiang-discovery-20260921'
              assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
              OUT.mkdir(exist_ok=False)
              report = {'target':TARGET, 'run_id':os.environ['GITHUB_RUN_ID'],
                  'workflow_commit':os.environ['GITHUB_SHA'], 'started_at':now(),
                  'status':'SOURCE_PREPARATION_INCOMPLETE', 'query_events':[],
                  'model_calls':0, 'research_execution':'NOT_EXECUTED', 'automatic_retry':False,
                  'investment_authority':'NONE', 'phase':'OFFICIAL_DIRECTORY'}
              def query(method, url, form=None):
                  assert url in {cninfo.CNINFO_STOCK_MAP_URL, cninfo.CNINFO_ANNOUNCEMENT_QUERY_URL}
                  assert len(report['query_events']) < 4
                  event = {'method':method, 'url':url, 'parameters':form, 'started_at':now()}
                  report['query_events'].append(event)
                  try:
                      value = cninfo._request_json(url=url, method=method, form=form, timeout_seconds=20)
                      event.update(status='DECODED_QUERY_RETURN_SAVED_NOT_WIRE_BYTES',
                          source=store('query-'+str(len(report['query_events']))+'.json', value))
                      return value
                  except Exception as exc:
                      event.update(status='FAILED', error_type=type(exc).__name__)
                      raise
                  finally:
                      event['finished_at']=now()
              try:
                  day=date.fromisoformat(TARGET['date'])
                  batch=cninfo.fetch_cninfo_disclosures(stock_code=TARGET['ticker'], start_date=day, end_date=day,
                      get_json=lambda url:query('GET',url), post_json=lambda url,form:query('POST',url,form))
                  report['inventory']=store('inventory.json', asdict(batch))
                  found=[r for r in batch.announcements if r.announcement_id==TARGET['announcement_id']]
                  assert len(found)==1 and found[0].title==TARGET['title']
                  row=found[0]
                  assert row.stock_code==TARGET['ticker'] and row.published_at is not None
                  report.update(selected=asdict(row), phase='EXACT_ORIGINAL_PDF', pdf_started_at=now())
                  raw=cninfo.fetch_cninfo_pdf_bytes(source_locator=row.source_locator, max_bytes=8*1024*1024, timeout_seconds=45)
                  report['pdf']=store(TARGET['ticker']+'-2026H1.pdf',raw)
                  report.update(pdf_finished_at=now(), phase='FULL_TEXT_REPRESENTATION')
                  parsed=extract_pdf_text(raw, max_pdf_bytes=8*1024*1024, max_pages=500, max_extracted_chars=1000000)
                  report['extraction']=store('extraction.json',asdict(parsed))
                  first=''.join(p.text for p in parsed.pages[:10])
                  assert TARGET['ticker'] in first and '2026' in first and '半年度报告' in first
                  report.update(status='EXACT_REPORT_RETAINED_NOT_RESEARCH_ADMITTED', page_count=parsed.page_count,
                      representation='ORIGINAL_PDF_AND_PYPDF_FULL_TEXT_NOT_VISUAL_REVIEW')
              except Exception as exc:
                  report['error_type']=type(exc).__name__
                  diagnostic=cninfo.pdf_failure_diagnostic(exc)
                  if diagnostic is not None:
                      report['pdf_diagnostic']=diagnostic
              finally:
                  report['finished_at']=now()
                  store('receipt.json',report)
              print(json.dumps(report,ensure_ascii=False,default=str))
          
          if __name__=='__main__':
              main()
          PY
      - name: Preserve original and partial source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zhenjiang-source-${{ github.run_id }}-1
          path: zhenjiang-source/
          if-no-files-found: error
          retention-days: 90
