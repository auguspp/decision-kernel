name: tushare-relay-30s-retest
on:
  push:
    branches: [work/tushare-relay-30s-retest-20260926]
    paths: [.github/workflows/tushare-relay-30s-retest.yml]
permissions:
  contents: read
jobs:
  retest:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Retest queued endpoints after 30 seconds including business timeout
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, requests
          from datetime import datetime, timezone
          key=os.environ["TUSHARE_PROXY_API_KEY"]
          base="https://pcd.mobcvb.cn/tushare/pro"
          s=requests.Session(); s.trust_env=False
          h={"X-API-Key":key}
          cases=[
            ("hm_detail",{"trade_date":"20260924","limit":"5"}),
            ("report_rc",{"ts_code":"000651.SZ","report_date":"20260924","limit":"5"}),
          ]
          results=[]
          for name,params in cases:
            attempts=[]
            for attempt in (1,2):
              if attempt==2: time.sleep(30)
              r=s.get(f"{base}/{name}",params=params,headers=h,timeout=35,allow_redirects=False)
              try:b=r.json()
              except Exception:b={}
              d=b.get("data") if isinstance(b,dict) else {}
              items=d.get("items") if isinstance(d,dict) else None
              attempts.append({
                "attempt":attempt,"http":r.status_code,
                "code":b.get("code") if isinstance(b,dict) else None,
                "error":b.get("error") if isinstance(b,dict) else None,
                "msg":b.get("msg") if isinstance(b,dict) else None,
                "message":b.get("message") if isinstance(b,dict) else None,
                "count":b.get("count") if isinstance(b,dict) else None,
                "rows":len(items) if isinstance(items,list) else None,
                "request_id":r.headers.get("X-Request-ID"),
                "x_cache":r.headers.get("X-Cache")
              })
              if r.status_code==200 and isinstance(b,dict) and b.get("code",0) in (0,None):
                break
              transient=(
                r.status_code in (502,503,504)
                or (isinstance(b,dict) and b.get("error")=="upstream_pool_exhausted")
                or (isinstance(b,dict) and b.get("code")==1 and b.get("msg")=="timeout")
              )
              if not transient: break
            results.append({"api":name,"params":params,"attempts":attempts})
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"queue30"; out.mkdir()
          (out/"report.json").write_text(json.dumps({
            "checked_at":datetime.now(timezone.utc).isoformat(),
            "wait_seconds":30,"client_timeout_seconds":35,"results":results
          },ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tushare-relay-30s-retest-${{ github.run_id }}-1
          path: ${{ runner.temp }}/queue30/
          retention-days: 7
          if-no-files-found: error
