name: _tmp-p0-research-work-reading

on:
  push:
    branches:
      - feat/p0-research-work-reading-20260912

permissions:
  contents: write

jobs:
  apply-tested-patch:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.event.head_commit.message == 'construction: stage p0 research work reading workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p0-research-work-reading-20260912
          fetch-depth: 0
      - name: Apply exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check construction/p0-research-work-reading.patch
          git apply construction/p0-research-work-reading.patch
          expected=$'current_state/registry.json\nsrc/decision_kernel/runtime/current_state_delivery.py\ntests/test_current_state_research_work_read.py'
          actual="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort)"
          test "$actual" = "$expected"
          git diff --check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install exact repository dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused reader regressions
        run: >-
          python -m pytest -q
          tests/test_current_state.py
          tests/test_current_state_delivery.py
          tests/test_current_state_isolation.py
          tests/test_incremental_disclosure.py
          tests/test_incremental_disclosure_intake.py
          tests/test_external_research_identity.py
          tests/test_current_state_research_work_read.py
      - name: Commit only product and regression files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            current_state/registry.json \
            src/decision_kernel/runtime/current_state_delivery.py \
            tests/test_current_state_research_work_read.py
          test "$(git diff --cached --name-only | sort)" = $'current_state/registry.json\nsrc/decision_kernel/runtime/current_state_delivery.py\ntests/test_current_state_research_work_read.py'
          git commit -m 'P0: expose retained Research work in fixed reading'
          git push origin HEAD:refs/heads/feat/p0-research-work-reading-20260912
