name: smart-money-readback-once
on:
  push:
    branches: [work/smart-money-readback-20260926]
    paths: [.github/workflows/smart-money-readback-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/work/smart-money-readback-20260926' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 72f38d8e14d1940efb3631085d008e8bdd111b40
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing read dependencies
        run: python -m pip install -e '.[feeds,documents]'
      - name: Read exact saved results and actual volatile metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          from decision_kernel.runtime import current_state as m,current_state_delivery as d
          from decision_kernel.runtime import smart_money_reading as r,smart_money_view as v
          assert datetime.now(timezone.utc)<datetime(2026,9,27,tzinfo=timezone.utc)
          M='72f38d8e14d1940efb3631085d008e8bdd111b40'
          R='182c1ede0c35e077fa025e7dd31a1f09a1a94c5f'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==M
          out=Path(os.environ['RUNNER_TEMP'])/'sm-readback';out.mkdir()
          log=[]
          class API(d.GitHubAPI):
              def get(self,path):
                  result=super().get(path)
                  if path.startswith('actions/') and ('runs/' in path or '/runs?' in path):
                      keep=('id','path','head_sha','head_branch','event','status','conclusion','run_attempt','created_at','updated_at')
                      item={k:result[k] for k in keep if k in result}
                      if 'workflow_runs' in result:item['workflow_runs']=[{k:x[k] for k in keep if k in x} for x in result['workflow_runs']]
                      if 'total_count' in result:item['total_count']=result['total_count']
                      log.append({'path':path,'at':datetime.now(timezone.utc).isoformat(),'value':item})
                  return result
          api=API(os.environ['GH_TOKEN'],max_calls=360)
          prior=json.loads(api.file('current-state.json',R));m.validate_read_package(prior)
          c=d.Collector(api,M,Path.cwd(),prior,R)
          result={'M':M,'R':R,'started':c.now(),'source_calls':0,'remote_writes':0}
          try:
              old,why=r.previous(c);result['previous_status']=why
              current=r.native(c)
              result['native']={k:value for k,value in current.items() if k!='observation'}
              if current.get('observation'):
                  obs=current['observation'];hist=v.history(obs,(old or {}).get('history'))
                  summary=v.summarize(obs,hist)
                  (out/'native-summary.json').write_bytes(m.json_bytes(summary))
                  result['native_record_count']=len(hist['records'])
              exact=api.get('actions/runs/36217120177')
              saved=r.read_run(c,exact,follow_control=False)
              result['exact_source']={k:value for k,value in saved.items() if k!='observation'}
              if saved.get('observation'):
                  obs=saved['observation'];r.restore_deferred_documents(c,old,obs)
                  hist=v.history(obs,(old or {}).get('history'));summary=v.summarize(obs,hist)
                  (out/'exact-summary.json').write_bytes(m.json_bytes(summary))
                  (out/'exact-summary.md').write_text(v.render(summary,hist))
          except Exception as e:
              result['error_type']=type(e).__name__
              result['safe_error']=str(e) if type(e) in (ValueError,KeyError) else 'DIAGNOSTIC_ERROR'
              raise
          finally:
              result.update(finished=c.now(),api_calls=api.calls,reads=log)
              (out/'diagnostic.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sm-readback-${{ github.run_id }}-1
          path: ${{ runner.temp }}/sm-readback/
          retention-days: 30
          if-no-files-found: error
