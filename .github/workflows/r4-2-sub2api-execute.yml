name: R4-2 approved Sub2API experiment
on:
  push:
    branches: [ops/r4-2-sub2api-execute-20260923]
permissions:
  contents: write
  actions: read
concurrency:
  group: r4-2-sub2api-20260923-v1
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EVAL_CODE_SHA: cc336116d175d0c37d8ab4f16e4c5aae5bc2c29b
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cc336116d175d0c37d8ab4f16e4c5aae5bc2c29b
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install original pinned execution dependencies
        run: python -m pip install -e '.[research-api,documents,feeds]'
      - name: Execute only approved fixed comparison
        env:
          GH_TOKEN: ${{ github.token }}
          SUB2API_API_KEY: ${{ secrets.SUB2API_API_KEY }}
          R4_2_APPROVAL: '5796637317'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVAL_CODE_SHA"
          test -n "$SUB2API_API_KEY"
          test "$(gh api repos/auguspp/decision-kernel/actions/runs/35876889000 --jq '.status + ":" + .conclusion + ":" + .head_sha')" = "completed:success:$EVAL_CODE_SHA"
          mkdir -p "$RUNNER_TEMP/r4-eval"
          printf 'code=%s\nevent=%s\nrun=%s\nattempt=%s\n' "$EVAL_CODE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/r4-eval/identity.txt"
          python -m pip list --format=json > "$RUNNER_TEMP/r4-eval/packages.json"
          python experiments/r4_2_sub2api.py --execute 2>&1 | tee "$RUNNER_TEMP/r4-eval/execution.log"
      - name: Preserve diagnostics without hiding failures
        if: always()
        shell: bash
        run: |
          mkdir -p research_runs/evaluations/r4-2-sub2api-20260923-v1/diagnostics
          if test -d "$RUNNER_TEMP/r4-eval"; then cp "$RUNNER_TEMP/r4-eval/"* research_runs/evaluations/r4-2-sub2api-20260923-v1/diagnostics/; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-2-sub2api-${{ github.run_id }}-${{ github.run_attempt }}
          path: research_runs/evaluations/r4-2-sub2api-20260923-v1/
          if-no-files-found: error
          retention-days: 30
