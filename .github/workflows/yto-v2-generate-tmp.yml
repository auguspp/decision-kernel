name: yto-v2-generate-tmp

on:
  pull_request:
    paths:
      - "src/decision_kernel/source_policy_v2.py"
      - "src/decision_kernel/claim_audit_contract_v2.py"
      - "src/decision_kernel/research_contract_v2.py"
      - "scripts/generate_yto_v2_tmp.py"
      - "scripts/run_yto_v2_tmp.py"
      - ".github/workflows/yto-v2-generate-tmp.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate YTO v2
        run: python scripts/run_yto_v2_tmp.py
      - name: Upload generated research
        uses: actions/upload-artifact@v6
        with:
          name: yto-v2-generated
          path: generated-yto-v2/
          if-no-files-found: error
