name: yto-v2-generate-tmp

on:
  pull_request:
    paths:
      - "src/decision_kernel/source_policy_v2.py"
      - "src/decision_kernel/claim_audit_contract_v2.py"
      - "src/decision_kernel/research_contract_v2.py"
      - "scripts/generate_yto_v2_tmp.py"
      - "scripts/run_yto_v2_tmp.py"
      - ".github/workflows/yto-v2-generate-tmp.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate YTO v2
        run: python scripts/run_yto_v2_tmp.py
      - name: Freeze exact generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp generated-yto-v2/600233-yto-deep-research-v2.json research_cases/
          cp generated-yto-v2/600233-yto-claim-audit-v2.json research_cases/
          cp generated-yto-v2/600233-yto-research-contract-v2.json research_cases/
          if git diff --quiet -- research_cases/600233-yto-deep-research-v2.json research_cases/600233-yto-claim-audit-v2.json research_cases/600233-yto-research-contract-v2.json; then
            echo "Generated YTO v2 artifacts already frozen exactly."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_cases/600233-yto-deep-research-v2.json research_cases/600233-yto-claim-audit-v2.json research_cases/600233-yto-research-contract-v2.json
          git commit -m "research: freeze generated YTO Full Research v2"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
