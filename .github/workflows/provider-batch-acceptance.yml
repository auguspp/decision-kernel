name: provider-batch-acceptance
on:
  push:
    branches: [work/provider-batch-20260922]
    paths: [.github/workflows/provider-batch-acceptance.yml]
permissions:
  contents: write
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 879ffedc771db29aecccdda87dddc332fbd2118e
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Native integration checks before provider requests
        run: python -m pytest -q tests/test_cnequity_bridge.py tests/test_provider_batch.py
      - name: Reuse retained history and execute one complete provider batch
        env:
          FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/provider-acceptance
        run: |
          python - <<'PY'
          import os,json,hashlib,zipfile,io,subprocess,importlib.metadata
          from datetime import datetime,date
          from decimal import Decimal
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from decision_kernel.runtime.current_state_delivery import GitHubAPI
          from decision_kernel.runtime import cnequity_bridge as cne,provider_batch as batch
          from decision_kernel.runtime.ftshare_financial import raw_json
          out=Path(os.environ['OUT']);out.mkdir()
          api=GitHubAPI(os.environ['GH_TOKEN'],max_calls=8)
          original=api.archive({'id':10633229345})
          assert hashlib.sha256(original).hexdigest()=='08697e11810d40b49cecece98a2f5db7ba290483d24e226ba7d7d721b1979460'
          z=zipfile.ZipFile(io.BytesIO(original));assert z.testzip() is None
          history_raw=z.read('reading/responses/08.json');snapshot_raw=z.read('reading/responses/09.json')
          assert hashlib.sha256(history_raw).hexdigest()=='f1fb7920d412bea3c7e628ef095f1f43d672149672489f96a242957b92e586e6'
          assert hashlib.sha256(snapshot_raw).hexdigest()=='e18027ee510ee84268779830b19fe282446a98e315c9d88c7302f7e81a1a7e2d'
          receipt=json.loads(z.read('reading/capture.json'))
          event=next(x for x in receipt['requests'] if x['response_file']=='responses/08.json')
          fetched=datetime.fromisoformat(event['received_at'].replace('Z','+00:00'))
          data=json.loads(history_raw)['data'];assert data['thscode']=='603507.SH' and data['adjust']=='none' and data['interval']=='1d'
          rows=[]
          for p in data['item']:
              volume=Decimal(str(p['volume']));assert volume==volume.to_integral_value()
              row={'symbol':'603507.SH','trade_date':datetime.fromtimestamp(p['date_ms']/1000,ZoneInfo('Asia/Shanghai')).date(),
                   **{k:float(p[k+'_price']) for k in ('open','high','low','close')},'volume':int(volume),'amount':float(p['turnover']),
                   'source':'hithink_retained_35588490572','data_version':'v2','fetched_at':fetched,
                   'volume_unit':'SHARES','currency':'CNY','adjustment':'NONE','original_sha256':hashlib.sha256(history_raw).hexdigest()}
              rows.append(row)
          (out/'original-history.json').write_bytes(history_raw);(out/'original-snapshot.json').write_bytes(snapshot_raw)
          (out/'original-stock-receipt.json').write_bytes(z.read('reading/capture.json'))
          cne.retain_bars(rows=rows,output=out/'native-lake')
          snapshot=json.loads(snapshot_raw)['data'];assert snapshot['item'][0]['thscode']=='603507.SH'
          assert datetime.fromtimestamp(snapshot['timestamp']/1000,ZoneInfo('Asia/Shanghai')).date()==date(2026,9,21)
          s=snapshot['item'][0]
          reference={'ticker':'603507.SH','session':'2026-09-21',
                     'prices':{**{k:s[k+'_price'] for k in ('open','high','low')},'close':s['last_price'],'prev_close':s['prev_price']},
                     'volume':s['volume'],'turnover':s['turnover'],'volume_unit':'SHARES','currency':'CNY','adjustment':'NONE',
                     'source_sha256':hashlib.sha256(snapshot_raw).hexdigest()}
          config=json.loads(Path('provider_requests/ftshare-batch-example.json').read_text())
          result=batch.prepare(config['market'],out/'batch',company=config['company'],reference=reference,
              lake={'data_root':out/'native-lake','dataset':'daily_bars','start':date(2026,9,1),'end':date(2026,9,21),'symbols':['603507.SH']})
          assert result['model_calls']==0 and not result['default_provider_changed']
          assert result['families']['cnequity']['status']=='CONTEXT_READY'
          (out/'identity.json').write_bytes(raw_json({'code':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'run':os.environ['GITHUB_RUN_ID'],'workflow_commit':os.environ['GITHUB_SHA'],'model_calls':0,
              'status':result['status'],'cnequity_version':importlib.metadata.version('cnequity'),'source_history_rows':len(rows)}))
          for artifact,name,digest in [(10674779160,'initial-contracts.zip','b6ae2c5c363c73a3d87a5642201fee0a2401e323be6b6914a584fda90551af35'),
                                      (10676011560,'corrected-contracts.zip','c6624f1e95f09b9678f4566ef57daaf449c439b68df214da168b6c5c3b7a9c4f')]:
              raw=api.archive({'id':artifact});assert hashlib.sha256(raw).hexdigest()==digest;(out/name).write_bytes(raw)
          print(json.dumps({'status':result['status'],'families':{k:v['status'] for k,v in result['families'].items()}},ensure_ascii=False))
          PY
      - name: Retain data in a new archive ref; never overwrite main or old records
        env:
          OUT: ${{ runner.temp }}/provider-acceptance
        run: |
          python - <<'PY'
          import os,subprocess,json,zipfile,hashlib
          from pathlib import Path
          out=Path(os.environ['OUT']);root=out/'publication';root.mkdir()
          for name,path in [('provider-batch.md',out/'batch/provider-batch.md'),('provider-batch.json',out/'batch/provider-batch.json'),('identity.json',out/'identity.json')]:
              (root/name).write_bytes(path.read_bytes())
          with zipfile.ZipFile(root/'retained-inputs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(out.rglob('*')):
                  if p.is_file() and root not in p.parents:z.write(p,str(p.relative_to(out)))
          files=[p for p in root.iterdir() if p.is_file()]
          manifest={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2));files.append(root/'manifest.json')
          env={**os.environ,'GIT_INDEX_FILE':str(out/'archive-index')}
          def git(*args,input=None):return subprocess.check_output(['git',*args],input=input,env=env).decode().strip()
          git('read-tree','--empty')
          prefix='research_runs/provider-batch/'+os.environ['GITHUB_RUN_ID']+'/'
          for p in files:
              sha=git('hash-object','-w','--stdin',input=p.read_bytes())
              git('update-index','--add','--cacheinfo','100644,'+sha+','+prefix+p.name)
          tree=git('write-tree')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          commit=git('commit-tree',tree,'-p','879ffedc771db29aecccdda87dddc332fbd2118e','-m','Retain complete provider batch, native lake and original failures; Data only')
          ref='refs/heads/archive/provider-batch-'+os.environ['GITHUB_RUN_ID']
          git('push','origin',commit+':'+ref)
          (out/'archive.json').write_text(json.dumps({'commit':commit,'ref':ref,'prefix':prefix,'files':manifest},indent=2))
          print(commit)
          PY
      - name: Export exact implementation for verification
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/provider-acceptance"
          git archive HEAD > "$RUNNER_TEMP/provider-acceptance/implementation.tar"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provider-batch-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-acceptance/
          retention-days: 30
