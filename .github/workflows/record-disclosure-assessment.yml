name: record-disclosure-assessment

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: Current Research package path for the security
        required: true
        default: dogfood/300750-catl.json
        type: string
      publication_date:
        description: Exact CNINFO publication date (YYYY-MM-DD)
        required: true
        type: string
      result:
        description: Quiet Research Funnel terminal result
        required: true
        type: choice
        options:
          - WAIT_FOR_TRIGGER
          - DROP_FOR_NOW

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: disclosure-receipt-memory
      cancel-in-progress: false
    env:
      PACKAGE_PATH: ${{ inputs.package_path }}
      PUBLICATION_DATE: ${{ inputs.publication_date }}
      ASSESSMENT_RESULT: ${{ inputs.result }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Restore best-effort disclosure receipt memory
        id: disclosure-memory
        uses: actions/cache/restore@v4
        with:
          path: decision-state/disclosure-receipts.json
          key: disclosure-receipts-record-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            disclosure-receipts-state-
      - name: Record reviewed quiet assessment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p decision-state
          decision-kernel record-disclosure-assessment "$PACKAGE_PATH" \
            --publication-date "$PUBLICATION_DATE" \
            --result "$ASSESSMENT_RESULT" \
            --receipts decision-state/disclosure-receipts.json | tee disclosure-assessment-record.txt
      - name: Save updated best-effort disclosure receipt memory
        if: success()
        uses: actions/cache/save@v4
        with:
          path: decision-state/disclosure-receipts.json
          key: disclosure-receipts-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish recorder summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Disclosure assessment receipt"
            echo
            echo "Package: \`$PACKAGE_PATH\`"
            echo
            echo "Publication date: \`$PUBLICATION_DATE\`"
            echo
            if [ -f disclosure-assessment-record.txt ]; then
              echo '```text'
              cat disclosure-assessment-record.txt
              echo '```'
            else
              echo "No receipt was written. Check the failed step above."
            fi
            echo
            echo "This workflow records only an already-reviewed quiet Research result. It does not perform semantic assessment or gain investment authority."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload receipt memory snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: disclosure-receipts-${{ github.run_id }}
          path: decision-state/disclosure-receipts.json
          retention-days: 30
