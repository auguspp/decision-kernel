name: sm-reading-diagnostic
on:
  push:
    branches: [work/sm-reading-diagnostic-20260926]
    paths: [.github/workflows/sm-reading-diagnostic.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: sm-reading-diagnostic-20260926
  cancel-in-progress: false
jobs:
  inspect-reading:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/work/sm-reading-diagnostic-20260926' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 02d30ccd472ebf3533fd229c8fae6a0eadddc106
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing reading dependencies
        run: python -m pip install -e '.[feeds,documents]'
      - name: Inspect current trusted reading without writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,traceback,base64,re,time
          from datetime import datetime,timezone
          from decision_kernel.runtime import current_state as m, current_state_delivery as b
          from decision_kernel.runtime import current_state_delivery_with_odds_watch as w
          from decision_kernel.runtime.read_blob_reuse import GitHubReadReuseAPI,pending_blob_writes
          from decision_kernel.runtime.stock_research_reading import EXTRA_API_CALLS
          M='02d30ccd472ebf3533fd229c8fae6a0eadddc106'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==M
          assert datetime.now(timezone.utc)<datetime(2026,9,27,tzinfo=timezone.utc)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'reading-diagnostic';out.mkdir()
          records=[];stage='INITIAL_READING';col=None
          proof={'code_commit':M,'run_id':int(os.environ['GITHUB_RUN_ID']),
              'workflow':'.github/workflows/sm-reading-diagnostic.yml','published':False,
              'market_calls':0,'research_calls':0,'started_at':datetime.now(timezone.utc).isoformat()}
          class ReadOnly(GitHubReadReuseAPI):
              def _call(self,method,endpoint,body=None):
                  assert method=='GET' and body is None,'DIAGNOSTIC_WRITE_FORBIDDEN'
                  entry={'stage':stage,'method':method,'endpoint':endpoint,
                      'started_at':datetime.now(timezone.utc).isoformat()};records.append(entry)
                  try:
                      r=super()._call(method,endpoint,body)
                      entry.update(status=r.status_code,response_bytes=len(r.content))
                      for h in ('X-RateLimit-Remaining','X-RateLimit-Limit','Retry-After'):
                          val=r.headers.get(h)
                          if val and val.isdigit():entry[h]=int(val)
                      return r
                  except Exception as e:
                      entry['error_type']=type(e).__name__
                      label=e.args[0] if type(e) is b.GitHubReadError and len(e.args)==1 else None
                      if isinstance(label,str) and (re.fullmatch(r'GitHub HTTP [0-9]{3}',label) or label in {'GitHub transport unavailable','artifact transport unavailable'}):entry['safe_error']=label
                      raise
                  finally:
                      entry['finished_at']=datetime.now(timezone.utc).isoformat()
                      (out/'requests.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          api=ReadOnly(os.environ['GH_TOKEN'],max_calls=b.MAX_API_CALLS+EXTRA_API_CALLS)
          try:
              refs=api.get('git/matching-refs/heads/'+m.READ_REF)
              exact=[r for r in refs if r['ref']=='refs/heads/'+m.READ_REF];assert len(exact)==1
              R=exact[0]['object']['sha'];proof['previous_reading']=R
              previous=json.loads(api.file('current-state.json',R));m.validate_read_package(previous)
              col=w.Collector(api,M,pathlib.Path.cwd(),previous,R)
              for name in ('radar_discovery','concept_discovery','concept_detail','external_radar',
                      'industry_breadth','easy_stock_context','tdx_concept_context','daily_news','smart_money','reviewed_questions'):
                  setattr(col,'include_'+name,True)
              stage='COLLECT_ONLY'
              refresh={'workflow':proof['workflow'],'run_id':os.environ['GITHUB_RUN_ID'],'attempt':1,
                  'event':'push','publication_status':'DIAGNOSTIC_ONLY_NOT_PUBLISHED'}
              payload=col.collect(refresh)
              proof.update(status='COLLECTION_COMPLETE_NOT_PUBLISHED',reading_hash=payload['reading_hash'],
                  smart_money=payload['research'].get('smart_money'),
                  file_count=len(col.files),retained_bytes=sum(map(len,col.files.values())),
                  pending_blob_posts=pending_blob_writes(api,col.files),api_calls=api.calls)
              base=out/'reading'
              for path,data in col.files.items():
                  p=base/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              proof['largest_files']=sorted([{'path':p,'bytes':len(v),'blob':m.blob_sha(v),
                  'already_proven':m.blob_sha(v) in api.proven_read_blobs} for p,v in col.files.items()],
                  key=lambda x:x['bytes'],reverse=True)[:30]
              print(json.dumps({k:proof[k] for k in ('status','file_count','retained_bytes','pending_blob_posts','api_calls')},ensure_ascii=False))
          except Exception as e:
              proof.update(status='DIAGNOSTIC_READING_FAILED',stage=stage,error_type=type(e).__name__,
                  trace=[{'file':pathlib.Path(f.filename).name,'line':f.lineno,'function':f.name} for f in traceback.extract_tb(e.__traceback__)],
                  api_calls=api.calls,file_count=len(col.files) if col else 0)
              print(json.dumps(proof,ensure_ascii=False))
          finally:
              proof['finished_at']=datetime.now(timezone.utc).isoformat()
              (out/'proof.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2))
              (out/'requests.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          PY
      - name: Retain trusted diagnostic implementation
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/reading-diagnostic"
          git archive --format=zip HEAD > "$RUNNER_TEMP/reading-diagnostic/source.zip"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sm-reading-diagnostic-${{ github.run_id }}-1
          path: ${{ runner.temp }}/reading-diagnostic/
          retention-days: 30
          if-no-files-found: error
