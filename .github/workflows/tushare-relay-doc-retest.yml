name: tushare-relay-doc-retest
on:
  push:
    branches: [work/tushare-relay-doc-retest-20260926]
    paths: [.github/workflows/tushare-relay-doc-retest.yml]
permissions:
  contents: read
concurrency:
  group: tushare-relay-doc-retest-20260926
  cancel-in-progress: false
jobs:
  retest:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install requests
      - name: Retest current documented relay contract
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, hashlib, requests, time
          from datetime import datetime, timezone
          key=os.environ["TUSHARE_PROXY_API_KEY"]
          assert key and len(key)>=8
          base="https://pcd.mobcvb.cn"
          pro=base+"/tushare/pro"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"relay"; out.mkdir()
          s=requests.Session(); s.trust_env=False
          headers={"X-API-Key":key}
          targets={
            "hm_list":{"__probe":"0","limit":"5"},
            "hm_detail":{"trade_date":"20260924","limit":"5"},
            "report_rc":{"ts_code":"000651.SZ","report_date":"20260924","limit":"5"},
            "stk_surv":{"ts_code":"603986.SH","start_date":"20260628","end_date":"20260924","limit":"5"},
            "balancesheet":{"ts_code":"600519.SH","period":"20260630","limit":"5"},
            "cashflow":{"ts_code":"600519.SH","period":"20260630","limit":"5"},
            "fina_indicator":{"ts_code":"600519.SH","period":"20260630","limit":"5"},
            "cn_pmi":{"m":"202608","limit":"5"},
            "shibor":{"start_date":"20260924","end_date":"20260924","limit":"5"},
            "dividend":{"ts_code":"600519.SH","limit":"5"},
            "index_classify":{"level":"L1","src":"SW2021","limit":"5"},
            "cn_schedule":{"start_date":"20260926","end_date":"20261010","limit":"5"},
            "research_report":{"ts_code":"000651.SZ","limit":"5"},
            "broker_recommend":{"ts_code":"000651.SZ","limit":"5"},
            "hsgt_top10":{"trade_date":"20260924","limit":"5"},
            "moneyflow_hsgt":{"trade_date":"20260924","limit":"5"},
            "top_list":{"trade_date":"20260924","limit":"5"},
            "top_inst":{"trade_date":"20260924","limit":"5"},
            "anns_d":{"ann_date":"20260924","limit":"5"},
            "irm_qa_sh":{"ts_code":"600519.SH","start_date":"20260901","limit":"5"},
            "dc_hot":{"trade_date":"20260924","limit":"5"},
            "ths_hot":{"trade_date":"20260924","limit":"5"}
          }
          def safe_body(r,name,kind):
            raw=r.content
            if key.encode() in raw:
              return {"saved":False,"reason":"KEY_ECHO"}
            if len(raw)>1024*1024:
              return {"saved":False,"reason":"BODY_TOO_LARGE","bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
            p=out/f"{kind}-{name}.body"; p.write_bytes(raw)
            return {"saved":True,"path":p.name,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
          def summarize_json(r):
            try: b=r.json()
            except Exception: return {"json":False}
            d=b.get("data") if isinstance(b,dict) else None
            items=d.get("items") if isinstance(d,dict) else None
            fields=d.get("fields") if isinstance(d,dict) else None
            return {"json":True,"code":b.get("code") if isinstance(b,dict) else None,
                    "ok":b.get("ok") if isinstance(b,dict) else None,
                    "error":b.get("error") if isinstance(b,dict) else None,
                    "msg":b.get("msg") if isinstance(b,dict) else None,
                    "message":b.get("message") if isinstance(b,dict) else None,
                    "count":b.get("count") if isinstance(b,dict) else None,
                    "api_name":b.get("api_name") if isinstance(b,dict) else None,
                    "fields":fields,
                    "rows":len(items) if isinstance(items,list) else None,
                    "sample":items[:2] if isinstance(items,list) else None,
                    "provider":b.get("provider") if isinstance(b,dict) else None,
                    "enabled":b.get("enabled") if isinstance(b,dict) else None,
                    "required":b.get("required") if isinstance(b,dict) else None,
                    "required_any":b.get("required_any") if isinstance(b,dict) else None,
                    "methods":b.get("methods") if isinstance(b,dict) else None,
                    "probe_example":b.get("probe_example") if isinstance(b,dict) else None}
          results=[]
          for name,params in targets.items():
            cap_url=base+"/tushare/capabilities/"+name
            cr=s.get(cap_url,headers=headers,timeout=15,allow_redirects=False)
            csum=summarize_json(cr); csave=safe_body(cr,name,"cap")
            time.sleep(0.15)
            url=pro+"/"+name
            r=s.get(url,params=params,headers=headers,timeout=30,allow_redirects=False)
            summary=summarize_json(r); saved=safe_body(r,name,"data")
            hdr={k:r.headers.get(k) for k in ["X-Request-ID","X-Cache","X-RateLimit-Remaining","X-RateLimit-IP-Remaining","Retry-After"] if r.headers.get(k) is not None}
            results.append({"api":name,"params":params,
              "capability":{"http":cr.status_code,"summary":csum,"body":csave},
              "request":{"http":r.status_code,"summary":summary,"headers":hdr,"body":saved}})
            time.sleep(0.2)
          report={"checked_at":datetime.now(timezone.utc).isoformat(),
                  "base":base,"pro":pro,"tls_verify":True,"allow_redirects":False,
                  "requests":len(targets)*2,"targets":results}
          (out/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps([{"api":x["api"],"cap_http":x["capability"]["http"],
            "enabled":x["capability"]["summary"].get("enabled"),
            "http":x["request"]["http"],"code":x["request"]["summary"].get("code"),
            "error":x["request"]["summary"].get("error"),
            "count":x["request"]["summary"].get("count"),
            "rows":x["request"]["summary"].get("rows"),
            "cache":x["request"]["headers"].get("X-Cache")} for x in results],
            ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tushare-relay-doc-retest-${{ github.run_id }}-1
          path: ${{ runner.temp }}/relay/
          retention-days: 14
          if-no-files-found: error
