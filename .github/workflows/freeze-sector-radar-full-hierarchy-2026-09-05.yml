name: freeze-sector-radar-full-hierarchy-2026-09-05

on:
  pull_request:
    paths:
      - ".github/workflows/freeze-sector-radar-full-hierarchy-2026-09-05.yml"
      - "experiments/freeze_sector_radar_full_hierarchy_2026_09_05.py"

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    if: github.event.pull_request.head.ref == 'docs/sector-radar-full-current-hierarchy-result-2026-09-05'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download exact completed hierarchy artifact
        uses: actions/download-artifact@v8
        with:
          name: sector-radar-full-current-hierarchy-2026-09-04
          path: hierarchy-artifact
          github-token: ${{ github.token }}
          repository: auguspp/decision-kernel
          run-id: 33894305778
      - name: Validate evidence and generate frozen result
        run: python experiments/freeze_sector_radar_full_hierarchy_2026_09_05.py
      - name: Verify full repository suite
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Remove one-time freezer and publish result
        shell: bash
        run: |
          rm .github/workflows/freeze-sector-radar-full-hierarchy-2026-09-05.yml
          rm experiments/freeze_sector_radar_full_hierarchy_2026_09_05.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sector-discovery-radar-full-current-hierarchy-result-2026-09-05.md
          git add radar_inputs/sector-parent-hints-2026-09-05.json
          git add -A .github/workflows/freeze-sector-radar-full-hierarchy-2026-09-05.yml
          git add -A experiments/freeze_sector_radar_full_hierarchy_2026_09_05.py
          git commit -m "docs: freeze full current sector hierarchy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
