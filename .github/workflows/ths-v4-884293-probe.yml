name: ths-v4-884293-probe

on:
  push:
    branches: [probe/ths-v4-884293-20260911]

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install frozen AKShare source adapter
        run: python -m pip install --disable-pip-version-check 'git+https://github.com/akfamily/akshare.git@8e95744b79ae22326308ccd2b4e62650c5b53c55'
      - name: Download frozen source evidence
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10187281705'
          run-id: '34566950303'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/source
      - name: Probe 884293 over one exact THS HTTP-v4 request
        id: probe
        continue-on-error: true
        run: python .github/scripts/probe-ths-v4-884293.py "$RUNNER_TEMP/source" "$RUNNER_TEMP/probe"
      - name: Retain exact raw and receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ths-v4-884293-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Enforce fail-closed probe
        if: always()
        env:
          OUTCOME: ${{ steps.probe.outcome }}
        run: test "$OUTCOME" = success
