name: tushare-proxy-probe
on:
  push:
    branches: [work/tushare-proxy-20260926]
    paths: [.github/workflows/tushare-proxy-probe.yml]
permissions:
  contents: read
concurrency:
  group: tushare-proxy-probe-20260926
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/work/tushare-proxy-20260926' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify exact bounded probe source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:.github/scripts/tushare-proxy-probe.py)" = f8e513f5786f4b73bb42ff4f313656f84493f007
          python - <<'PY'
          from datetime import datetime,timezone
          assert datetime.now(timezone.utc)<datetime(2026,9,27,tzinfo=timezone.utc)
          PY
      - name: Install existing pinned HTTP dependency without credentials
        run: python -m pip install requests==2.34.2
      - name: Check envelope and credential suppression without network or credentials
        run: |
          python -m py_compile .github/scripts/tushare-proxy-probe.py
          python - <<'PY'
          import runpy
          p=runpy.run_path('.github/scripts/tushare-proxy-probe.py')
          assert len(p['PLAN'])==32 and len({x[0] for x in p['PLAN']})==32
          assert p['sensitive']({'data':'EXAMPLE_KEY_NOT_REAL'},'EXAMPLE_KEY_NOT_REAL')
          assert p['sensitive']({'api_key':'value'},'EXAMPLE_KEY_NOT_REAL')
          assert not p['sensitive']({'data':{'fields':['ts_code'],'items':[['000001.SZ']]}},'EXAMPLE_KEY_NOT_REAL')
          f,r,shape=p['unpack']({'code':0,'data':{'fields':['ts_code'],'items':[['000001.SZ']]}})
          assert r==[{'ts_code':'000001.SZ'}] and shape=='FIELDS_ITEMS'
          assert p['error_category']({'msg':'权限不足'})==('ENDPOINT_PERMISSION_NOT_ESTABLISHED',False)
          assert p['error_category']({'msg':'invalid token'})==('AUTHENTICATION_STOP',True)
          assert p['inspect']({'code':0,'data':{'fields':['ts_code'],'items':[['000002.SZ']]}},'daily',{'ts_code':'000001.SZ'},['ts_code'])[0]['status']=='FILTER_MISMATCH'
          print('8 bounded local assertions passed; no source requests')
          PY
      - name: Run one request per approved API against the fixed HTTPS vendor
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
          PROBE_OUTPUT: ${{ runner.temp }}/tushare-proxy-probe
        run: python .github/scripts/tushare-proxy-probe.py
      - name: Retain actual source identity
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/tushare-proxy-probe"
          git rev-parse HEAD > "$RUNNER_TEMP/tushare-proxy-probe/probe-head.txt"
          cp .github/scripts/tushare-proxy-probe.py "$RUNNER_TEMP/tushare-proxy-probe/probe-source.py"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tushare-proxy-probe-${{ github.run_id }}-1
          path: ${{ runner.temp }}/tushare-proxy-probe/
          retention-days: 30
          if-no-files-found: error
