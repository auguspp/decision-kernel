name: pdf-text-smoke

on:
  pull_request:
    paths:
      - '.github/workflows/pdf-text-smoke.yml'
      - 'src/decision_kernel/adapters/pdf_text.py'
      - 'src/decision_kernel/runtime/cninfo_http.py'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install document adapter
        run: python -m pip install -e '.[documents]'
      - name: Extract one live CNINFO filing
        run: |
          python - <<'PY'
          from datetime import date
          from urllib.request import Request, urlopen

          from decision_kernel.adapters.pdf_text import PdfTextStatus, extract_pdf_text
          from decision_kernel.runtime.cninfo_http import fetch_cninfo_disclosures

          batch = fetch_cninfo_disclosures(
              stock_code='600036',
              start_date=date(2026, 8, 29),
              end_date=date(2026, 8, 31),
          )
          candidates = [
              item
              for item in batch.announcements
              if '半年度报告' in item.title and '摘要' not in item.title
          ]
          target = candidates[0] if candidates else batch.announcements[0]
          request = Request(
              target.source_locator,
              headers={
                  'User-Agent': 'Mozilla/5.0',
                  'Referer': 'https://www.cninfo.com.cn/',
              },
          )
          with urlopen(request, timeout=45) as response:  # noqa: S310
              payload = response.read(50 * 1024 * 1024 + 1)

          result = extract_pdf_text(payload)
          assert result.status is PdfTextStatus.EXTRACTED
          assert result.page_count > 1
          assert result.extracted_char_count > 1_000
          first_non_empty = next(page for page in result.pages if page.text)

          print(f'TITLE={target.title}')
          print(f'LOCATOR={target.source_locator}')
          print(f'PDF_SHA256={result.pdf_sha256}')
          print(f'TEXT_SHA256={result.text_sha256}')
          print(f'PAGE_COUNT={result.page_count}')
          print(f'EXTRACTED_CHARS={result.extracted_char_count}')
          print(f'FIRST_TEXT_PAGE={first_non_empty.page_number}')
          print(f'FIRST_TEXT_SNIPPET={first_non_empty.text[:300]!r}')
          PY
