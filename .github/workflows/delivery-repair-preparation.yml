name: delivery-repair-preparation
on:
  push:
    branches: [diagnostic/delivery-repair-20260925]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: prep
      - uses: actions/checkout@v7
        with:
          ref: b89dc93c23ab1a795ef389c7a2561bd6b76e90c9
          persist-credentials: false
          path: repo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare corrected literal test and normal policy entry
        working-directory: repo
        run: python ../prep/.github/scripts/patch-recovery-result-gate.py
      - name: Test revised orchestration and original validation
        working-directory: repo
        run: |
          python -m pip install -e '.[ci-contracts,feeds]' PyYAML
          python -m pytest -q tests/test_radar_delivery_reconciliation.py tests/test_stock_daily_successor_result_gate.py tests/test_stock_daily_successor.py tests/test_sector_delivery_continuity.py
      - name: Save tested blobs without branch updates
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          paths = ['tests/test_stock_daily_successor_result_gate.py', '.github/scripts/reconcile-radar-delivery.py', 'tests/test_radar_delivery_reconciliation.py', 'docs/sector-radar-scheduled-production.md']
          entries = []
          for path in paths:
              raw = Path(path).read_bytes()
              data = json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              reply = subprocess.run(['gh','api','--method','POST','repos/auguspp/decision-kernel/git/blobs','--input','-'], input=data,text=True,capture_output=True,check=True)
              sha = json.loads(reply.stdout)['sha']
              assert sha == hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          print('CORRECTION_TREE_ENTRIES=' + json.dumps(entries))
          subprocess.run(['git','diff','--stat'],check=True)
          PY
