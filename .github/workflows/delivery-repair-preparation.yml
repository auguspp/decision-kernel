name: delivery-repair-preparation
on:
  push:
    branches: [diagnostic/delivery-repair-20260925]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: prep
      - uses: actions/checkout@v7
        with:
          ref: b236080c424689183c30b7cebe88769b851875ea
          persist-credentials: false
          path: repo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare existing recovery composition
        working-directory: repo
        run: python ../prep/.github/scripts/prepare-radar-recovery.py
      - name: Test recovery, original TDX and source contracts
        working-directory: repo
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_radar_delivery_reconciliation.py tests/test_stock_daily_successor.py tests/test_sector_radar_schedule.py tests/test_sector_request_pacing.py tests/test_sector_radar_publication_gate.py tests/test_current_state_delivery.py
      - name: Check actual current artifacts without dispatch or Issue writes
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          from datetime import datetime, timezone
          from decision_kernel.runtime.current_state_delivery import GitHubAPI
          m = runpy.run_path('.github/scripts/reconcile-radar-delivery.py', run_name='recovery_readonly_probe')
          os.environ['GITHUB_SHA'] = 'b236080c424689183c30b7cebe88769b851875ea'
          api = GitHubAPI(os.environ['GH_TOKEN'], max_calls=240)
          now = datetime.now(timezone.utc)
          result = m['choose'](m['collect'](api, Path.cwd(), now), now)
          print('ACTUAL_RECONCILIATION=' + json.dumps(result))
          assert result['status'] == 'UP_TO_DATE_WITH_ISSUER_GAPS' and result['action'] is None
          PY
      - name: Store tested blobs only
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          paths = ['.github/scripts/reconcile-radar-delivery.py', '.github/workflows/stock-reading-after-sector.yml', '.github/workflows/sector-radar-shadow.yml', '.github/workflows/hithink-stock-dump-trial.yml', 'tests/test_radar_delivery_reconciliation.py', 'tests/test_stock_daily_successor.py', 'docs/radar-delivery-recovery-v1.md']
          entries = []
          for path in paths:
              raw = Path(path).read_bytes()
              data = json.dumps({'content':base64.b64encode(raw).decode(), 'encoding':'base64'})
              reply = subprocess.run(['gh','api','--method','POST','repos/auguspp/decision-kernel/git/blobs','--input','-'],input=data,text=True,capture_output=True,check=True)
              sha = json.loads(reply.stdout)['sha']
              assert sha == hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          print('RECOVERY_TREE_ENTRIES=' + json.dumps(entries))
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          PY
