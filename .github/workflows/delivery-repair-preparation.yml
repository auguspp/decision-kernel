name: delivery-repair-preparation
on:
  push:
    branches: [diagnostic/delivery-repair-20260925]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b5c8aebd97eef21a67abc2eef4805c7ab93305d0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify actual complete CI ZIP and original product reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import io, json, os, runpy, zipfile
          from pathlib import Path
          from decision_kernel.runtime.current_state_delivery import GitHubAPI, Collector
          from decision_kernel.runtime.current_state import _reading_navigation
          head = 'b5c8aebd97eef21a67abc2eef4805c7ab93305d0'
          api = GitHubAPI(os.environ['GH_TOKEN'], max_calls=160)
          run = api.get('actions/runs/36130477570')
          assert run['head_sha'] == head and run['run_attempt'] == 1
          assert run['event'] == 'pull_request' and run['conclusion'] == 'success'
          metadata = api.get('actions/runs/36130477570/artifacts?per_page=100')
          assert metadata['total_count'] == len(metadata['artifacts'])
          artifacts = [a for a in metadata['artifacts'] if a['name'] == 'kernel-ci-results-36130477570-1']
          assert len(artifacts) == 1 and not artifacts[0]['expired'], [a['name'] for a in metadata['artifacts']]
          artifact = artifacts[0]
          raw = api.archive(artifact)
          check = runpy.run_path('.github/scripts/ci-merge-reuse.py')
          with check['verified_archive'](raw, artifact) as z:
              env = json.loads(z.read('environment.json'))
          assert env['tree'] == '52e4a42b8f5c910cf6b1576309987b21ec20e376'
          count = check['full_evidence'](raw, artifact, run, env)
          print('VERIFIED_FULL_CI=' + json.dumps({'run_id':run['id'], 'head':head, 'artifact_id':artifact['id'], 'digest':artifact['digest'], 'bytes':len(raw), 'passed':count, 'environment':'recorded CI environment; not this verifier runner environment'}))
          c = Collector(api, head, Path.cwd())
          sector = c.lane('sector')
          saved = sector['last_qualified_result']
          assert saved['run']['id'] == 36122381294 and saved['candidate_count'] == 21, sector
          assert sector['latest_state_validation']['run']['id'] == 36122768750, sector
          assert saved['groups']['all_groups'] == 14
          summary_path = saved['details']['summary.md']['read_path']
          assert summary_path in c.files and b'87' in c.files[summary_path]
          navigation = '\n'.join(_reading_navigation({'research':{}, 'lanes':{'sector':sector}}, str))
          assert summary_path in navigation and '不重发事件' in navigation
          print('ACTUAL_READER_PASS=' + json.dumps({'latest_attempt':sector['latest_attempt']['id'], 'latest_state_validation':sector['latest_state_validation']['run']['id'], 'result_run':saved['run']['id'], 'market_session':saved['market_session'], 'groups':saved['groups'], 'summary_path':summary_path, 'files_retained':len(c.files), 'source_calls':0,'production_writes':0}))
          PY
