name: delivery-repair-preparation
on:
  push:
    branches: [diagnostic/delivery-repair-20260925]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d50b9c99406cb01b11fcb77265198a82361886df
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ci-contracts,feeds]'
      - name: Verify complete CI archive and real no-duplicate recovery plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          from datetime import datetime, timezone
          from decision_kernel.runtime.current_state_delivery import GitHubAPI
          head = 'd50b9c99406cb01b11fcb77265198a82361886df'
          api = GitHubAPI(os.environ['GH_TOKEN'], max_calls=240)
          run = api.get('actions/runs/36133419629')
          assert run['head_sha'] == head and run['run_attempt'] == 1
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'success'
          metadata = api.get('actions/runs/36133419629/artifacts?per_page=100')
          assert metadata['total_count'] == len(metadata['artifacts'])
          items = [a for a in metadata['artifacts'] if a['name'] == 'kernel-ci-36133419629-1']
          assert len(items) == 1 and not items[0]['expired']
          artifact = items[0]
          raw = api.archive(artifact)
          checker = runpy.run_path('.github/scripts/ci-merge-reuse.py')
          with checker['verified_archive'](raw, artifact) as z:
              env = json.loads(z.read('environment.json'))
          assert env['tree'] == '5a2c8c449cce9c97cd597431a86da96f05b3b329'
          count = checker['full_evidence'](raw, artifact, run, env)
          print('VERIFIED_RECOVERY_FULL_CI=' + json.dumps({'run':run['id'],'head':head,'artifact_id':artifact['id'],'bytes':len(raw),'digest':artifact['digest'],'tests':count,'environment':'actual recorded CI, not this verifier environment'}))
          code = runpy.run_path('.github/scripts/reconcile-radar-delivery.py', run_name='readonly_reconciliation_verification')
          os.environ['GITHUB_SHA'] = 'b236080c424689183c30b7cebe88769b851875ea'
          now = datetime.now(timezone.utc)
          result = code['choose'](code['collect'](api, Path.cwd(), now), now)
          assert result['status'] == 'UP_TO_DATE_WITH_ISSUER_GAPS' and result['action'] is None
          assert result['sector_run_id'] == 36122381294 and result['stock_parent'] == '36122381294'
          print('FINAL_REAL_READONLY_RECONCILIATION=' + json.dumps(result))
          PY
