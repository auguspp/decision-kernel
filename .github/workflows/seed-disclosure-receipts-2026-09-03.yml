name: seed-disclosure-receipts-2026-09-03

on:
  pull_request:
    paths:
      - '.github/workflows/seed-disclosure-receipts-2026-09-03.yml'
      - '.github/scripts/seed_disclosure_receipts_2026_09_03.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-disclosure-receipts-2026-09-03.yml'
      - '.github/scripts/seed_disclosure_receipts_2026_09_03.py'

permissions:
  actions: read
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: disclosure-receipt-memory
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Restore best-effort disclosure receipt memory
        uses: actions/cache/restore@v6
        with:
          path: decision-state/disclosure-receipts.json
          key: disclosure-receipts-seed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            disclosure-receipts-state-
      - name: Download exact scheduled disclosure artifact
        uses: actions/download-artifact@v8
        with:
          name: official-disclosure-scan
          path: disclosure-handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33757562673
      - name: Validate all nine quiet dispositions and materialize receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p decision-state disclosure-receipt-seed-audit
          python .github/scripts/seed_disclosure_receipts_2026_09_03.py \
            --packet-dir disclosure-handoff/disclosure-assessment-packets \
            --receipts decision-state/disclosure-receipts.json \
            --audit-dir disclosure-receipt-seed-audit \
            | tee disclosure-receipt-seed-audit/run.txt
          grep -q '^DISCLOSURE RECEIPTS: 9 exact quiet batches$' disclosure-receipt-seed-audit/run.txt
          grep -q '^DEEPEN_REQUIRED: 0$' disclosure-receipt-seed-audit/run.txt
          grep -q '^INVESTMENT AUTHORITY: NONE$' disclosure-receipt-seed-audit/run.txt
      - name: Save main-branch disclosure receipt memory
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: decision-state/disclosure-receipts.json
          key: disclosure-receipts-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if [ -f disclosure-receipt-seed-audit/summary.md ]; then
            cat disclosure-receipt-seed-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Disclosure receipt seed unavailable' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload exact receipt seed audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disclosure-receipt-seed-audit-${{ github.run_id }}
          path: |
            disclosure-receipt-seed-audit/
            decision-state/disclosure-receipts.json
          if-no-files-found: warn
          retention-days: 14
