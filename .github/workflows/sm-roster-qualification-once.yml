name: sm-roster-qualification-once
on:
  push:
    branches: [work/sm-roster-qualification-20260926]
    paths: [.github/workflows/sm-roster-qualification-once.yml]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 97d261a880d1c418c942de95808d97b92070d169
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[feeds]'
      - name: Three fixed public source checks, no research or credential access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os, hashlib, time
          from datetime import datetime, timezone
          import requests
          from decision_kernel.runtime.hithink_dump_trial import _session
          out=Path(os.environ['RUNNER_TEMP'])/'roster-qualification'
          out.mkdir()
          url='https://datacenter-web.eastmoney.com/api/data/v1/get'
          receipts=[]
          for i,(begin,page) in enumerate([('2026-06-28',1),('2026-06-28',2),('2026-09-01',1)]):
              p={'sortColumns':'NOTICE_DATE,RECEIVE_START_DATE,SECURITY_CODE,NUMBERNEW',
                 'sortTypes':'-1,-1,1,-1','pageSize':'500','pageNumber':str(page),
                 'reportName':'RPT_ORG_SURVEY','columns':'ALL','source':'WEB','client':'WEB',
                 'filter':f'(IS_SOURCE="1")(NOTICE_DATE>=\'{begin}\')(NOTICE_DATE<=\'2026-09-26\')'}
              item={'index':i,'url':url,'params':p,'requested_at':datetime.now(timezone.utc).isoformat()}
              stop=False
              try:
                  with _session() as client:
                      with client.get(url,params=p,headers={'Accept-Encoding':'identity'},
                                      timeout=(10,25),stream=True,allow_redirects=False) as r:
                          assert r.url==requests.Request('GET',url,params=p).prepare().url
                          raw=b''
                          for chunk in r.iter_content(65536):
                              raw+=chunk
                              assert len(raw)<=4*1024*1024
                          name=f'raw-{i}.json'
                          (out/name).write_bytes(raw)
                          item.update(http_status=r.status_code,body=name,bytes=len(raw),
                                      sha256=hashlib.sha256(raw).hexdigest())
                          stop=r.status_code in (401,403,429) or 300<=r.status_code<400
              except (requests.RequestException,AssertionError) as exc:
                  item['error_type']=type(exc).__name__
                  stop=True
              item['received_at']=datetime.now(timezone.utc).isoformat()
              receipts.append(item)
              (out/'manifest.json').write_text(json.dumps({'code_commit':'97d261a880d1c418c942de95808d97b92070d169',
                  'run_id':os.environ['GITHUB_RUN_ID'],'requests':receipts,'production':False},sort_keys=True))
              if stop: break
              time.sleep(0.3)
          print(json.dumps({'started_requests':len(receipts),'production':False}))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sm-roster-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/roster-qualification/
          if-no-files-found: error
          retention-days: 30
