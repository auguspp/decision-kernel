name: smart-money-preparation
on:
  push:
    branches: [work/smart-money-20260926]
    paths: [.github/workflows/smart-money-preparation.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: smart-money-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/work/smart-money-20260926' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify bounded public preparation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from datetime import datetime, timezone
          assert datetime.now(timezone.utc)<datetime(2026,9,27,tzinfo=timezone.utc)
          PY
      - name: Install existing dependencies
        run: python -m pip install -e '.[feeds]'
      - name: Read observed public navigation and report originals
        run: python .github/scripts/smart-money-source-probe-final.py
      - name: Retain exact preparation code
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/smart-money-probe"
          git archive --format=zip HEAD > "$RUNNER_TEMP/smart-money-probe/implementation.zip"
      - name: Upload actual preparation, not production acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-money-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smart-money-probe/
          retention-days: 30
          if-no-files-found: warn
