name: smart-money-preparation
on:
  push:
    branches: [work/smart-money-20260926]
    paths: [.github/workflows/smart-money-preparation.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: smart-money-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/work/smart-money-20260926' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify bounded inspection scope
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from datetime import datetime, timezone
          assert datetime.now(timezone.utc)<datetime(2026,9,28,tzinfo=timezone.utc)
          PY
      - name: Install existing CI evidence reader
        run: python -m pip install -e '.[ci-contracts]'
      - name: Download and verify exact composition-fix full evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: '36212707763'
          EVIDENCE_HEAD: 'd85f88cb77b577ae560c11b97a16d3129c604bb9'
        run: python .github/scripts/smart-money-ci-evidence.py
      - name: Retain verification identity
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/smart-money-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/smart-money-evidence/verification-code-sha.txt"
      - name: Upload original CI archive and inspection proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-money-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smart-money-evidence/
          retention-days: 30
          if-no-files-found: warn
