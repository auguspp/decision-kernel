name: source-orchestration-verify-once
on:
  push:
    branches: [work/source-orchestration-verify-20260926]
    paths: [.github/workflows/source-orchestration-verify-once.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7170b4f40493931239deb543701dee56b15ae592
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Export exact existing source, without workflow or credentials
        run: |
          test "$(git rev-parse HEAD)" = 7170b4f40493931239deb543701dee56b15ae592
          mkdir -p "$RUNNER_TEMP/source-verify"
          git archive --format=zip HEAD > "$RUNNER_TEMP/source-verify/source.zip"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-verify/tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-verify/identity.txt"
      - name: Install existing scoped dependencies
        run: python -m pip install -e '.[feeds,documents,ci-contracts]'
      - name: Existing Smart Money and new Relay scoped tests, no source access
        run: |
          set -o pipefail
          python -m pytest -q tests/test_smart_money*.py tests/test_tushare_relay.py --junitxml="$RUNNER_TEMP/source-verify/scoped.xml" 2>&1 | tee "$RUNNER_TEMP/source-verify/scoped.log"
      - name: Retain exact source and actual results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-orchestration-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-verify/
          if-no-files-found: error
          retention-days: 30
