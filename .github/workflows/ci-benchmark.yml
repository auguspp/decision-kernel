name: ci-v2-benchmark

# Bounded experiment branch only; never merge this harness or use it to publish.
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-v2-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  execution:
    if: github.repository == 'auguspp/decision-kernel' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/20260925-v2-shard-benchmark' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {layout: single4, splits: 1, group: 1, workers: 4, sample: 2}
          - {layout: four2, splits: 4, group: 1, workers: 2, sample: 2}
          - {layout: four2, splits: 4, group: 2, workers: 2, sample: 2}
          - {layout: four2, splits: 4, group: 3, workers: 2, sample: 2}
          - {layout: four2, splits: 4, group: 4, workers: 2, sample: 2}
          - {layout: single4, splits: 1, group: 1, workers: 4, sample: 3}
          - {layout: four2, splits: 4, group: 1, workers: 2, sample: 3}
          - {layout: four2, splits: 4, group: 2, workers: 2, sample: 3}
          - {layout: four2, splits: 4, group: 3, workers: 2, sample: 3}
          - {layout: four2, splits: 4, group: 4, workers: 2, sample: 3}
          - {layout: four4, splits: 4, group: 1, workers: 4, sample: 1}
          - {layout: four4, splits: 4, group: 2, workers: 4, sample: 1}
          - {layout: four4, splits: 4, group: 3, workers: 4, sample: 1}
          - {layout: four4, splits: 4, group: 4, workers: 4, sample: 1}
    env:
      BENCH_CODE_SHA: 24ed9aa6499b053e79c4a928625449868216b41a
      BENCH_HARNESS_SHA: ${{ github.event.pull_request.head.sha }}
      BENCH_SAMPLE: ${{ matrix.sample }}
      BENCH_LAYOUT: ${{ matrix.layout }}
      BENCH_SPLITS: ${{ matrix.splits }}
      BENCH_GROUP: ${{ matrix.group }}
      BENCH_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BENCH_CODE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install same engineering dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install fixed experimental splitter without resolving project packages
        run: |
          printf '%s\n' 'pytest-split==0.11.0 --hash=sha256:899d7c0f5730da91e2daf283860eb73b503259cb416851a65599368849c7f382' > "$RUNNER_TEMP/split-requirements.txt"
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r "$RUNNER_TEMP/split-requirements.txt"
      - name: Recover one immutable historical duration hint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-benchmark"
          gh api repos/auguspp/decision-kernel/actions/artifacts/10821896535/zip > "$RUNNER_TEMP/ci-benchmark/durations-source.zip"
          python - <<'PY'
          import json, os, runpy, xml.etree.ElementTree as ET
          from pathlib import Path
          from _pytest.junitxml import mangle_test_address
          reader = runpy.run_path('.github/scripts/ci-merge-reuse.py')
          out = Path(os.environ['RUNNER_TEMP']) / 'ci-benchmark'
          raw = (out / 'durations-source.zip').read_bytes()
          meta = dict(size_in_bytes=304019, digest='sha256:b10d355f41a67467fbe504778786cfda4f201c7a7e0589e28483f50c40b4af65')
          with reader['verified_archive'](raw, meta) as z:
              collection = z.read('collection.txt').decode()
              xml = z.read('pytest.xml')
              reader['passed_test_set'](collection, xml)
              by_case = {(c.get('classname'), c.get('name')): float(c.get('time')) for c in ET.fromstring(xml).findall('.//testcase')}
              durations = {}
              for node in collection.splitlines():
                  if node.startswith('tests/') and '::' in node:
                      names = mangle_test_address(node)
                      durations[node] = by_case[('.'.join(names[:-1]), names[-1])]
          (out / 'durations.json').write_text(json.dumps(durations, sort_keys=True))
          paths = Path('.github/ci-v2-research.txt').read_text().splitlines()
          (out / 'remaining.txt').write_text(''.join('--ignore=' + p + '\n' for p in paths))
          PY
      - name: Record environment and measured executions
        env:
          BENCH_CACHE_HIT: ${{ steps.python.outputs.cache-hit }}
        run: |
          python - <<'PY'
          import hashlib, json, os, runpy, subprocess, sys, time
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'ci-benchmark'
          reader = runpy.run_path('.github/scripts/ci-merge-reuse.py')
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == os.environ['BENCH_CODE_SHA']
          (out / 'packages.json').write_bytes(subprocess.check_output([sys.executable, '-m', 'pip', 'list', '--format=json']))
          environment = reader['environment'](Path.cwd(), out, os.environ)
          (out / 'environment.json').write_text(json.dumps(environment, sort_keys=True, indent=2))
          metrics = dict(code_sha=os.environ['BENCH_CODE_SHA'], harness_sha=os.environ['BENCH_HARNESS_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
              attempt=os.environ['GITHUB_RUN_ATTEMPT'], sample=int(os.environ['BENCH_SAMPLE']), cpu_count=int(subprocess.check_output(['getconf', '_NPROCESSORS_ONLN'])), layout=os.environ['BENCH_LAYOUT'], splits=int(os.environ['BENCH_SPLITS']),
              group=int(os.environ['BENCH_GROUP']), workers=int(os.environ['BENCH_WORKERS']), cache_hit=os.environ.get('BENCH_CACHE_HIT', ''),
              duration_sha256=hashlib.sha256((out/'durations.json').read_bytes()).hexdigest(), scope='BENCHMARK_REMAINING_ONLY', merge_eligible=False, rootdir_policy='EXPLICIT_PROJECT_CONFIG')
          def run(name, command):
              started = time.perf_counter()
              with (out / (name + '.log')).open('wb') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
              metrics[name] = dict(seconds=time.perf_counter()-started, exit_code=result.returncode)
              (out / 'metrics.json').write_text(json.dumps(metrics, sort_keys=True, indent=2))
              if result.returncode:
                  print((out / (name + '.log')).read_text()[-12000:])
                  raise SystemExit(result.returncode)
          run('full_collection', [sys.executable, '-m', 'pytest', '-c', 'pyproject.toml', '--collect-only', '-q'])
          full = (out/'full_collection.log').read_text()
          paths = Path('.github/ci-v2-research.txt').read_text().splitlines()
          domain, remaining = reader['partition_nodes'](full, paths)
          metrics.update(total_tests=len(domain)+len(remaining), domain_tests=len(domain), remaining_tests=len(remaining))
          args = ['@' + str(out/'remaining.txt')]
          if metrics['splits'] > 1:
              args += ['--splits', str(metrics['splits']), '--group', str(metrics['group']), '--splitting-algorithm', 'duration_based_chunks', '--durations-path', str(out/'durations.json')]
          run('selected_collection', [sys.executable, '-m', 'pytest', '-c', 'pyproject.toml', '--collect-only', '-q', *args])
          selected_nodes = [n for n in (out/'selected_collection.log').read_text().splitlines() if n.startswith('tests/') and '::' in n]
          assert selected_nodes and len(selected_nodes) == len(set(selected_nodes)) and set(selected_nodes) <= set(remaining), 'ROOT_OR_SELECTION_IDENTITY'
          hints = json.loads((out/'durations.json').read_text())
          metrics['matched_duration_nodes'] = sum(n in hints for n in selected_nodes)
          assert metrics['matched_duration_nodes'] > 0, 'NO_DURATION_HINT_MATCH'
          workers = [] if metrics['workers'] == 1 else ['-n', str(metrics['workers']), '--dist=loadfile', '--max-worker-restart=0']
          run('execution', [sys.executable, '-m', 'pytest', '-c', 'pyproject.toml', '-q', *args, *workers, '-o', 'faulthandler_timeout=60', '-o', 'faulthandler_exit_on_timeout=true',
              '--durations=30', '--junitxml=' + str(out/'result.xml')])
          count = reader['passed_test_set']((out/'selected_collection.log').read_text(), (out/'result.xml').read_bytes())
          metrics.update(executed_tests=count, selected_identity_sha256=hashlib.sha256((out/'selected_collection.log').read_bytes()).hexdigest(), selected_set_passed=True)
          (out/'metrics.json').write_text(json.dumps(metrics, sort_keys=True, indent=2))
          print(json.dumps(metrics, indent=2))
          PY
      - name: Preserve all measured results including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-benchmark-${{ github.run_id }}-${{ matrix.layout }}-${{ matrix.sample }}-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-benchmark/
          retention-days: 30
          if-no-files-found: error
  installation:
    if: github.repository == 'auguspp/decision-kernel' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/20260925-v2-shard-benchmark' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        installer: [pip, uv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 24ed9aa6499b053e79c4a928625449868216b41a
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.installer == 'uv'
        with:
          version: '0.12.17'
          enable-cache: 'false'
          download-from-astral-mirror: 'false'
      - name: Recover fixed installed-version reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-install-benchmark"
          gh api repos/auguspp/decision-kernel/actions/artifacts/10824825453/zip > "$RUNNER_TEMP/ci-install-benchmark/reference.zip"
          python - <<'CHECK'
          import json, os, runpy
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'ci-install-benchmark'
          reader = runpy.run_path('.github/scripts/ci-merge-reuse.py')
          meta = dict(size_in_bytes=430823, digest='sha256:a671ecaa1435c1e0151daa4b415c2b79be158bb242308ccd9b7cb5111ef1daae')
          with reader['verified_archive']((out/'reference.zip').read_bytes(), meta) as z:
              reference = json.loads(z.read('environment.json'))
          (out/'reference-environment.json').write_text(json.dumps(reference, sort_keys=True))
          versions = reference['packages']
          (out/'constraints.txt').write_text(''.join(k+'=='+v+'\n' for k,v in sorted(versions.items()) if k not in ('pip','decision-kernel')))
          CHECK
      - name: Measure three cold and warm fresh installations
        env:
          INSTALLER: ${{ matrix.installer }}
          HARNESS_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'MEASURE'
          import json, os, re, shutil, subprocess, sys, time
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'ci-install-benchmark'
          installer = os.environ['INSTALLER']
          cache = out/'controlled-cache'
          ref = json.loads((out/'reference-environment.json').read_text())
          expected = {k:v for k,v in ref['packages'].items() if k != 'pip'}
          report = dict(code_sha='24ed9aa6499b053e79c4a928625449868216b41a', harness_sha=os.environ['HARNESS_SHA'],
              run_id=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'], installer=installer,
              python=sys.version, scope='INSTALL_BENCHMARK_ONLY', merge_eligible=False, rows=[],
              cache_scope='CONTROLLED_LOCAL_DOWNLOAD_CACHE_NOT_GITHUB_RESTORE_BENCHMARK')
          if installer == 'uv': report['uv_version'] = subprocess.check_output(['uv','--version']).decode().strip()
          def size(path): return sum(p.stat().st_size for p in path.rglob('*') if p.is_file()) if path.exists() else 0
          for sample in range(1,4):
              shutil.rmtree(cache, ignore_errors=True)
              for state in ('cold','warm'):
                  target = out/(str(sample)+'-'+state)
                  before = time.perf_counter()
                  subprocess.run([sys.executable,'-m','venv',str(target)],check=True)
                  venv_seconds = time.perf_counter()-before
                  python = str(target/'bin/python')
                  env = {**os.environ,'PIP_CACHE_DIR':str(cache),'UV_CACHE_DIR':str(cache),'PIP_DISABLE_PIP_VERSION_CHECK':'1','UV_PYTHON_DOWNLOADS':'never'}
                  env.pop('GH_TOKEN',None)
                  cmd = [python,'-m','pip','install'] if installer=='pip' else ['uv','pip','install','--python',python]
                  cmd += ['-c',str(out/'constraints.txt'),'-e','.[dev]']
                  row = dict(sample=sample,state=state,cache_bytes_before=size(cache),venv_seconds=venv_seconds)
                  start=time.perf_counter()
                  with (out/(str(sample)+'-'+state+'.log')).open('wb') as log:
                      result=subprocess.run(cmd,env=env,stdout=log,stderr=subprocess.STDOUT)
                  row.update(install_seconds=time.perf_counter()-start,exit_code=result.returncode,cache_bytes_after=size(cache))
                  report['rows'].append(row)
                  (out/'metrics.json').write_text(json.dumps(report,indent=2))
                  if result.returncode: raise SystemExit(result.returncode)
                  inventory = json.loads(subprocess.check_output([python,'-m','pip','list','--format=json']))
                  actual = {re.sub(r'[-_.]+','-',x['name']).lower():x['version'] for x in inventory}
                  (out/(str(sample)+'-'+state+'-packages.json')).write_text(json.dumps(actual,sort_keys=True))
                  row['pip_seed_version']=actual.pop('pip')
                  assert actual == expected, 'INSTALLED_RUNTIME_PACKAGES_DIFFER'
                  row['matched_runtime_packages']=len(actual)
                  start=time.perf_counter()
                  with (out/(str(sample)+'-'+state+'-contracts.log')).open('wb') as log:
                      checked=subprocess.run([python,'-m','pytest','-c','pyproject.toml','-q','@.github/ci-v2-research.txt'],env=env,stdout=log,stderr=subprocess.STDOUT)
                  row.update(contract_seconds=time.perf_counter()-start,contract_exit_code=checked.returncode)
                  (out/'metrics.json').write_text(json.dumps(report,indent=2))
                  if checked.returncode: raise SystemExit(checked.returncode)
                  shutil.rmtree(target)
          print(json.dumps(report,indent=2))
          MEASURE
      - name: Preserve installation metrics and raw logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-install-benchmark-${{ github.run_id }}-${{ matrix.installer }}
          path: |
            ${{ runner.temp }}/ci-install-benchmark/*.json
            ${{ runner.temp }}/ci-install-benchmark/*.txt
            ${{ runner.temp }}/ci-install-benchmark/*.log
          retention-days: 30
          if-no-files-found: error
  collect-results:
    needs: [execution, installation]
    if: always() && github.repository == 'auguspp/decision-kernel' && github.head_ref == 'ci/20260925-v2-shard-benchmark' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve this experiment and its failed predecessor as raw data
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'benchmark-packet'
          out.mkdir()
          def get(path):
              return subprocess.check_output(['gh', 'api', 'repos/auguspp/decision-kernel/' + path], timeout=60)
          for run in ['36035887604', '36037362383', os.environ['GITHUB_RUN_ID']]:
              folder = out / run; folder.mkdir()
              payload = json.loads(get('actions/runs/' + run + '/artifacts?per_page=100'))
              assert payload['total_count'] == len(payload['artifacts'])
              (folder/'artifacts.json').write_text(json.dumps(payload, indent=2))
              (folder/'jobs.json').write_bytes(get('actions/runs/' + run + '/jobs?per_page=100'))
              (folder/'run.json').write_bytes(get('actions/runs/' + run))
              for artifact in payload['artifacts']:
                  if not artifact['name'].startswith(('ci-benchmark-' + run + '-', 'ci-workflow-audit-' + run, 'ci-install-benchmark-' + run + '-')):
                      continue
                  assert type(artifact['id']) is int and artifact['id'] > 0 and not artifact['expired']
                  raw = get('actions/artifacts/' + str(artifact['id']) + '/zip')
                  assert len(raw) == artifact['size_in_bytes'] and 'sha256:' + hashlib.sha256(raw).hexdigest() == artifact['digest']
                  (folder/(str(artifact['id']) + '.zip')).write_bytes(raw)
          (out/'needs.json').write_text(os.environ['NEEDS_JSON'])
          print('Raw benchmark data only; producer conclusions and failed predecessor are preserved.')
          PY
      - name: Retain one bounded audit packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-benchmark-packet-${{ github.run_id }}
          path: ${{ runner.temp }}/benchmark-packet/
          retention-days: 30
          if-no-files-found: error
