name: disclosure-radar-shadow

on:
  pull_request:
    paths:
      - '.github/workflows/disclosure-radar-shadow.yml'

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install current repo
        run: python -m pip install -e .
      - name: Measure recent official-disclosure density
        run: |
          python - <<'PY'
          from datetime import date

          from decision_kernel.runtime.cninfo_http import fetch_cninfo_disclosures

          cases = (
              ('600519', '贵州茅台'),
              ('300750', '宁德时代'),
              ('600036', '招商银行'),
              ('601088', '中国神华'),
              ('603986', '兆易创新'),
          )
          start = date(2026, 8, 26)
          end = date(2026, 9, 2)

          print(f'WINDOW={start.isoformat()}..{end.isoformat()}')
          total = 0
          for code, name in cases:
              batch = fetch_cninfo_disclosures(
                  stock_code=code,
                  start_date=start,
                  end_date=end,
                  timeout_seconds=20.0,
              )
              rows = sorted(
                  batch.announcements,
                  key=lambda item: (
                      item.published_at.isoformat() if item.published_at else '',
                      item.announcement_id,
                  ),
                  reverse=True,
              )
              total += len(rows)
              print(f'\nCASE={code} {name} COUNT={len(rows)} ORG_ID={batch.org_id}')
              for item in rows:
                  published = item.published_at.isoformat() if item.published_at else 'UNKNOWN'
                  print(
                      f'  {published} | type={item.announcement_type or "UNKNOWN"} '
                      f'| id={item.announcement_id} | {item.title}'
                  )
          print(f'\nTOTAL_ANNOUNCEMENTS={total}')
          PY
