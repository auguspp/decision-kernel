name: disclosure-radar-shadow

on:
  pull_request:
    paths:
      - '.github/workflows/disclosure-radar-shadow.yml'

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install current repo
        run: python -m pip install -e .
      - name: Inspect recent official-disclosure response shape
        run: |
          python - <<'PY'
          from datetime import date

          from decision_kernel.adapters.cninfo import resolve_cninfo_org_id
          from decision_kernel.runtime.cninfo_http import (
              CNINFO_ANNOUNCEMENT_QUERY_URL,
              CNINFO_STOCK_MAP_URL,
              _announcement_query_form,
              _request_json,
          )

          cases = (
              ('600519', '贵州茅台'),
              ('300750', '宁德时代'),
              ('600036', '招商银行'),
              ('601088', '中国神华'),
              ('603986', '兆易创新'),
          )
          start = date(2026, 8, 26)
          end = date(2026, 9, 2)
          stock_map = _request_json(
              url=CNINFO_STOCK_MAP_URL,
              method='GET',
              form=None,
              timeout_seconds=20.0,
          )

          print(f'WINDOW={start.isoformat()}..{end.isoformat()}')
          for code, name in cases:
              org_id = resolve_cninfo_org_id(stock_map, stock_code=code)
              raw = _request_json(
                  url=CNINFO_ANNOUNCEMENT_QUERY_URL,
                  method='POST',
                  form=_announcement_query_form(
                      stock_code=code,
                      org_id=org_id,
                      start_date=start,
                      end_date=end,
                      page_size=30,
                      page_number=1,
                  ),
                  timeout_seconds=20.0,
              )
              announcements = raw.get('announcements')
              total = raw.get('totalAnnouncement')
              print(
                  f'CASE={code} {name} ORG_ID={org_id} TOTAL={total!r} '
                  f'ANNOUNCEMENTS_TYPE={type(announcements).__name__} '
                  f'ANNOUNCEMENTS_LEN={len(announcements) if isinstance(announcements, list) else "NA"}'
              )
              if isinstance(announcements, list):
                  for row in announcements:
                      print(
                          '  '
                          f"id={row.get('announcementId')} "
                          f"type={row.get('announcementTypeName')!r} "
                          f"title={row.get('announcementTitle')!r}"
                      )
          PY
