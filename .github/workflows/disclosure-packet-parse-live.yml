name: disclosure-packet-parse-live

on:
  pull_request:
    paths:
      - '.github/workflows/disclosure-packet-parse-live.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install with PDF extraction
        run: python -m pip install -e '.[documents]'
      - name: Generate and self-parse real CATL packet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee smoke.txt
          from datetime import date, datetime, timezone
          from pathlib import Path

          from decision_kernel.research_commit import ResearchCommitPackage
          from decision_kernel.runtime.cninfo_http import fetch_cninfo_disclosures
          from decision_kernel.runtime.disclosure_assessment import (
              parse_disclosure_assessment_packet,
              prepare_disclosure_assessment_packet,
              serialize_disclosure_assessment_packet,
          )
          from decision_kernel.runtime.disclosure_radar import (
              filter_research_uncovered_disclosure_batches,
              group_disclosures_by_publication_date,
          )

          expected = 'deeeeecd4c76ead88b23a62e274d7c9dfa66c30c118f1c38cad14686601704d8'
          snapshot = ResearchCommitPackage.model_validate_json(
              Path('dogfood/300750-catl.json').read_text(encoding='utf-8')
          ).research_snapshot
          raw = fetch_cninfo_disclosures(
              stock_code='300750',
              start_date=date(2026, 8, 27),
              end_date=date(2026, 8, 27),
          )
          batches = group_disclosures_by_publication_date(raw.announcements)
          uncovered = filter_research_uncovered_disclosure_batches(
              batches,
              research_as_of_by_stock={'300750': snapshot.as_of_datetime},
          )
          assert len(uncovered) == 1
          packet = prepare_disclosure_assessment_packet(
              research_snapshot=snapshot,
              batch=uncovered[0],
              prepared_at=datetime(2026, 9, 2, 6, 0, tzinfo=timezone.utc),
          )
          serialized = serialize_disclosure_assessment_packet(packet)
          parsed = parse_disclosure_assessment_packet(serialized)
          assert packet.assessment_input_hash == expected
          assert parsed.assessment_input_hash == expected
          assert serialize_disclosure_assessment_packet(parsed) == serialized
          assert parsed.evidence[0].pdf_sha256 == '2affbff8b1c59521a341c35bf7885ad8e09da45053064c4623eb22ff3e655d79'
          assert parsed.evidence[0].text_sha256 == 'bbe718e43d998e1a078889c4539e75036c4d037708023d65cc907be6d04ffb23'
          assert parsed.evidence[0].page_count == 3
          assert parsed.evidence[0].extracted_char_count == 1305
          print(f'ASSESSMENT_INPUT_HASH={parsed.assessment_input_hash}')
          print(f'PDF_SHA256={parsed.evidence[0].pdf_sha256}')
          print(f'TEXT_SHA256={parsed.evidence[0].text_sha256}')
          print('ROUND_TRIP=EXACT')
          print('INVESTMENT_AUTHORITY=NONE')
          PY
