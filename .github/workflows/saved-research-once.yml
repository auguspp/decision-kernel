name: saved-research-once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-suken-api-once
  cancel-in-progress: false

jobs:
  research:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted workflow code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing parsers and the official Responses SDK
        run: python -m pip install -e '.[documents,feeds,research-api]'
      - name: One frozen Sector question through original admission and Funnel
        env:
          GH_TOKEN: ${{ github.token }}
          SUB2API_API_KEY: ${{ secrets.SUB2API_API_KEY }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SUB2API_API_KEY"
          python -m decision_kernel.runtime.saved_research_once \
            --code-commit "$GITHUB_SHA" --output run-output
      - name: Retain source, candidate, partial failure and bounded execution records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-suken-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-output/
          if-no-files-found: warn
          retention-days: 30
