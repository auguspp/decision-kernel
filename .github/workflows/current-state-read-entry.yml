name: current-state-read-entry

on:
  schedule:
    # 23:50/11:10 UTC = 07:50/19:10 Asia/Shanghai; not one publication per News capture.
    - cron: '50 23 * * *'
    - cron: '10 11 * * *'
  workflow_run:
    workflows: [radar-global-public, sector-radar-shadow, hithink-stock-dump-trial, decision-inbox, kernel-tests, saved-disclosure-research, stock-business-research, radar-smart-money, radar-industry-breadth, tdx-concept-snapshot, radar-concept-detail, radar-concept-source, radar-institutional-source, radar-newsnow-daily, radar-global-market, stock-reading-after-sector]
    types: [requested, completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: current-state-read-entry-publication
  cancel-in-progress: false

jobs:
  # This early title filter is only an optimization. The existing Python
  # wrapper verifies the exact native upstream attempt before any Git write,
  # including when workflow_run notification path/title fields are absent.
  publish-reading:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      ((github.event_name == 'schedule' &&
        (github.event.schedule == '50 23 * * *' || github.event.schedule == '10 11 * * *')) ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.path != '.github/workflows/stock-reading-after-sector.yml' ||
         (github.event.action == 'completed' && (github.event.workflow_run.display_title == 'stock-market-inputs' ||
          github.event.workflow_run.display_title == 'd-auction-inputs' ||
           github.event.workflow_run.display_title == 'd-auction-minutes'))) &&
        (github.event.workflow_run.path != '.github/workflows/hithink-stock-dump-trial.yml' ||
         github.event.workflow_run.display_title != 'tushare-c2-price-check | sector=none | page=base | recovery=none') &&
        (github.event.workflow_run.path != '.github/workflows/radar-smart-money.yml' ||
         github.event.workflow_run.event != 'workflow_dispatch' ||
         github.event.workflow_run.display_title != 'FTShare three-stock comparison 20260930' &&
         github.event.workflow_run.display_title != 'FTShare C2 bounded pilot 20260930') &&
        ((github.event.workflow_run.name == 'kernel-tests' &&
          github.event.action == 'completed' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success') ||
         ((github.event.workflow_run.name == 'saved-disclosure-research' ||
           github.event.workflow_run.name == 'stock-business-research') &&
          github.event.action == 'completed' &&
          github.event.workflow_run.run_attempt == 1 &&
          (github.event.workflow_run.event == 'workflow_run' ||
           github.event.workflow_run.event == 'workflow_dispatch' ||
           (github.event.workflow_run.name == 'stock-business-research' &&
            github.event.workflow_run.path == '.github/workflows/stock-business-research.yml' &&
            github.event.workflow_run.event == 'issues' &&
            github.event.workflow_run.actor.login == 'auguspp') ||
           (github.event.workflow_run.name == 'saved-disclosure-research' &&
            github.event.workflow_run.event == 'push'))) ||
         (github.event.workflow_run.name == 'radar-newsnow-daily' &&
          github.event.workflow_run.path == '.github/workflows/radar-newsnow-daily.yml' &&
          github.event.workflow_run.run_attempt == 1 &&
          github.event.action == 'completed' &&
          (github.event.workflow_run.event == 'workflow_run' ||
           github.event.workflow_run.event == 'workflow_dispatch')) ||
         (github.event.workflow_run.name == 'radar-industry-breadth' &&
          github.event.workflow_run.path == '.github/workflows/radar-industry-breadth.yml' &&
          github.event.workflow_run.run_attempt == 1 &&
          github.event.action == 'completed' &&
          github.event.workflow_run.event == 'workflow_run') ||
         (github.event.workflow_run.name != 'kernel-tests' &&
          github.event.workflow_run.name != 'saved-disclosure-research' &&
          github.event.workflow_run.name != 'stock-business-research' &&
          github.event.workflow_run.name != 'radar-newsnow-daily' &&
          (github.event.workflow_run.event == 'schedule' ||
           github.event.workflow_run.event == 'workflow_dispatch')))))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      # Only trusted default-branch code is executed, never code from an artifact
      # or workflow_run.head_sha. Other producers and their triggers stay unchanged.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Qualify scheduled publication code against independent main CI
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=10 > "$RUNNER_TEMP/reading-ci.json"
          python - <<'PY'
          import json, os
          runs = json.load(open(os.environ['RUNNER_TEMP']+'/reading-ci.json'))['workflow_runs']
          assert runs
          r = max(runs, key=lambda x: (x['created_at'], x['id']))
          assert r['head_sha'] == os.environ['GITHUB_SHA'] and r['head_branch'] == 'main'
          assert r['path'] == '.github/workflows/ci.yml' and r['event'] == 'push'
          assert r['run_attempt'] == 1 and r['status'] == 'completed' and r['conclusion'] == 'success'
          PY
      - name: Install existing package
        # Optional extras supply HTTP, original-PDF replay and saved-file TDX parsing, not dev tools.
        run: python -m pip install -e '.[feeds,documents,concept]'
      - name: Install optional saved-price structure engine
        # Installation failure remains explicit; it must not suppress base reading.
        # The reader records a native-worker gap when this optional extra is absent.
        run: |
          if python -m pip install --only-binary=:all: -e '.[price-structure]'; then
            echo 'CZSC optional dependency installation succeeded.'
          else
            echo 'CZSC optional dependency installation failed; base reading continues.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify saved products and publish read-only ref
        env:
          GH_TOKEN: ${{ github.token }}
          READ_CODE_COMMIT: ${{ github.sha }}
          INCLUDE_CURRENT_STOCK_INPUTS: '1'
          INCLUDE_PRICE_STRUCTURE: '1'
          TRIGGER_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: >-
          python -m decision_kernel.runtime.current_state_delivery_with_odds_watch
          --code-commit "$READ_CODE_COMMIT"
          --output current-state-delivery
          --include-radar-discovery
          --include-concept-discovery
          --include-concept-detail
          --include-external-radar
          --include-industry-breadth
          --include-easy-stock-context
          --include-tdx-concept-context
          --include-daily-news
          --include-smart-money
          --include-global-market
          --include-reviewed-questions
          --publish
      - name: Explain a failed reading publication
        if: failure()
        run: |
          echo '## Current-state reading publication failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the actual read ref: a failure before pointer update preserves it; a lost write response is uncertain. Do not retry or infer delivery.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This failure is not a market quiet result and does not change production restore authority.' >> "$GITHUB_STEP_SUMMARY"
