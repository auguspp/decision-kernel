name: live-dogfood

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: ResearchCommitPackage JSON path
        required: true
        default: dogfood/600519-moutai.json
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PACKAGE_PATH: ${{ inputs.package_path }}
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Check HiThink secret
        shell: bash
        run: |
          if [ -z "${HITHINK_FINANCE_API_KEY:-}" ]; then
            echo "::error::Missing repository secret HITHINK_FINANCE_API_KEY"
            exit 1
          fi
      - name: Run live dogfood
        shell: bash
        run: |
          set -o pipefail
          decision-kernel run-research "$PACKAGE_PATH" | tee live-dogfood-result.txt
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Decision Kernel live dogfood"
            echo
            echo "Package: \`$PACKAGE_PATH\`"
            echo
            if [ -f live-dogfood-result.txt ]; then
              echo '```text'
              cat live-dogfood-result.txt
              echo '```'
            else
              echo "No Decision Kernel result was produced. Check the failed step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
