name: research-continuity-contracts-v2
on:
  workflow_call:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  research-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore this run's preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'V2_REPORT_DIR=%s\n' "$RUNNER_TEMP/kernel-ci-v2" >> "$GITHUB_ENV"
          python3 .github/scripts/ci-matrix.py restore --report-dir "$RUNNER_TEMP/kernel-ci-v2"
      - uses: ./.github/actions/ci-python
        with:
          extras: ci-contracts,feeds
          constraints: ${{ runner.temp }}/kernel-ci-v2/constraints.txt
      - name: Record actual domain environment
        run: |
          python --version > "$V2_REPORT_DIR/python.txt"
          getconf _NPROCESSORS_ONLN > "$V2_REPORT_DIR/cpu-count.txt"
          python -m pip list --format=json > "$V2_REPORT_DIR/packages.json"
          printf 'scope=research-continuity-v2\nfull_suite=NOT_RUN_DOMAIN_ONLY\n' >> "$V2_REPORT_DIR/identity.txt"
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          check = runpy.run_path('.github/scripts/ci-merge-reuse.py')
          out = Path(os.environ['V2_REPORT_DIR'])
          (out / 'environment.json').write_text(json.dumps(check['environment'](Path.cwd(), out, os.environ), sort_keys=True))
          # Do not present the independently collected whole-repo plan as a domain execution.
          (out / 'collection.txt').unlink()
          PY
      - name: Collect research continuity contracts
        run: python -m pytest --collect-only -q @.github/ci-v2-research.txt > "$V2_REPORT_DIR/domain-collection.txt"
      - name: Test research continuity contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q @.github/ci-v2-research.txt --durations=10 \
            --junitxml="$V2_REPORT_DIR/domain.xml" 2>&1 | tee "$V2_REPORT_DIR/domain.log"
      - name: Verify complete domain without promoting it to full CI
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          out = Path(os.environ['V2_REPORT_DIR'])
          check = runpy.run_path('.github/scripts/ci-merge-reuse.py')
          count = check['passed_test_set']((out / 'domain-collection.txt').read_text(), (out / 'domain.xml').read_bytes())
          result = dict(scope='research-continuity-v2', code_sha=os.environ['CI_CODE_SHA'],
                        test_count=count, complete_domain='PASS', full_suite='NOT_RUN_DOMAIN_ONLY',
                        merge_eligible=False, research_acceptance='NOT_ESTABLISHED')
          (out / 'domain-result.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n')
          PY
      - name: Upload domain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-ci-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-ci-v2/
          if-no-files-found: warn
          retention-days: 30
