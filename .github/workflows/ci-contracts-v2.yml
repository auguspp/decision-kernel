name: research-continuity-contracts-v2

# Called by the original CI at the caller revision; no independent schedule,
# dispatch, write token or automatic publication. This is one domain, not full CI.
on:
  workflow_call:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  research-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record domain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_CODE_SHA"
          V2_REPORT_DIR="$RUNNER_TEMP/kernel-ci-v2"
          mkdir -p "$V2_REPORT_DIR"
          printf 'V2_REPORT_DIR=%s\n' "$V2_REPORT_DIR" >> "$GITHUB_ENV"
          printf 'code_sha=%s\nevent=%s\nrun_id=%s\nattempt=%s\nscope=research-continuity-v2\nfull_suite=NOT_RUN_DOMAIN_ONLY\n' \
            "$CI_CODE_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$V2_REPORT_DIR/identity.txt"
      - name: Reuse existing content qualification
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-content-scope.py select --report-dir "$V2_REPORT_DIR"
      - name: Explain content-only delegation
        if: steps.scope.outputs.scope == 'content'
        run: echo 'V2_DOMAIN=NOT_RUN_CONTENT_ONLY; original content gate remains required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.scope.outputs.scope != 'content'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-v2-research.txt
      - name: Install domain dependencies
        if: steps.scope.outputs.scope != 'content'
        run: python -m pip install -e '.[ci-contracts,feeds]'
      - name: Record actual domain environment
        if: steps.scope.outputs.scope != 'content'
        run: |
          python --version > "$V2_REPORT_DIR/python.txt"
          getconf _NPROCESSORS_ONLN > "$V2_REPORT_DIR/cpu-count.txt"
          python -m pip list --format=json > "$V2_REPORT_DIR/packages.json"
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          check = runpy.run_path('.github/scripts/ci-merge-reuse.py')
          out = Path(os.environ['V2_REPORT_DIR'])
          (out / 'environment.json').write_text(json.dumps(check['environment'](Path.cwd(), out, os.environ), sort_keys=True))
          PY
      - name: Collect research continuity contracts
        if: steps.scope.outputs.scope != 'content'
        run: python -m pytest --collect-only -q @.github/ci-v2-research.txt > "$V2_REPORT_DIR/domain-collection.txt"
      - name: Test research continuity contracts
        if: steps.scope.outputs.scope != 'content'
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q @.github/ci-v2-research.txt --durations=10 \
            --junitxml="$V2_REPORT_DIR/domain.xml" 2>&1 | tee "$V2_REPORT_DIR/domain.log"
      - name: Verify complete domain without promoting it to full CI
        if: steps.scope.outputs.scope != 'content'
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          out = Path(os.environ['V2_REPORT_DIR'])
          check = runpy.run_path('.github/scripts/ci-merge-reuse.py')
          count = check['passed_test_set']((out / 'domain-collection.txt').read_text(), (out / 'domain.xml').read_bytes())
          result = dict(scope='research-continuity-v2', code_sha=os.environ['CI_CODE_SHA'],
                        test_count=count, complete_domain='PASS', full_suite='NOT_RUN_DOMAIN_ONLY',
                        merge_eligible=False, research_acceptance='NOT_ESTABLISHED')
          (out / 'domain-result.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'V2 research continuity: {count} tests, complete domain PASS. Not full CI or Research acceptance.\n')
          PY
      - name: Upload domain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kernel-ci-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-ci-v2/
          if-no-files-found: warn
          retention-days: 30
