name: disclosure-freshness-shadow

on:
  pull_request:
    paths:
      - '.github/workflows/disclosure-freshness-shadow.yml'

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install current repo
        run: python -m pip install -e .
      - name: Measure Research-uncovered disclosure batches
        run: |
          python - <<'PY'
          from datetime import date, datetime
          import json
          from pathlib import Path

          from decision_kernel.runtime.cninfo_http import fetch_cninfo_disclosures
          from decision_kernel.runtime.disclosure_radar import (
              filter_research_uncovered_disclosure_batches,
              group_disclosures_by_publication_date,
          )

          case_paths = (
              Path('dogfood/600519-moutai.json'),
              Path('dogfood/300750-catl.json'),
              Path('dogfood/600036-cmb.json'),
              Path('dogfood/601088-shenhua.json'),
              Path('research_cases/603986-gigadevice-deep-research-v1.json'),
          )

          research_as_of_by_stock = {}
          names = {}
          for path in case_paths:
              payload = json.loads(path.read_text(encoding='utf-8'))
              snapshot = payload['research_snapshot']
              ticker = snapshot['ticker']
              research_as_of_by_stock[ticker] = datetime.fromisoformat(
                  snapshot['as_of_datetime'].replace('Z', '+00:00')
              )
              names[ticker] = snapshot['company_name']

          start = date(2026, 8, 26)
          end = date(2026, 9, 2)
          all_announcements = []
          for ticker in research_as_of_by_stock:
              result = fetch_cninfo_disclosures(
                  stock_code=ticker,
                  start_date=start,
                  end_date=end,
                  timeout_seconds=20.0,
              )
              all_announcements.extend(result.announcements)

          batches = group_disclosures_by_publication_date(all_announcements)
          uncovered = filter_research_uncovered_disclosure_batches(
              batches,
              research_as_of_by_stock=research_as_of_by_stock,
          )

          print(f'WINDOW={start.isoformat()}..{end.isoformat()}')
          print(f'RAW_ANNOUNCEMENTS={len(all_announcements)}')
          print(f'DATED_BATCHES={len(batches)}')
          print(f'RESEARCH_UNCOVERED_BATCHES={len(uncovered)}')
          for ticker in sorted(research_as_of_by_stock):
              print(
                  f'RESEARCH_AS_OF={ticker} {names[ticker]} '
                  f'{research_as_of_by_stock[ticker].isoformat()}'
              )
          for batch in uncovered:
              print(
                  f'\nUNCOVERED={batch.publication_date.isoformat()} '
                  f'{batch.stock_code} {names[batch.stock_code]} '
                  f'COUNT={len(batch.announcements)} '
                  f'FIRST={batch.first_published_at.isoformat()} '
                  f'LAST={batch.last_published_at.isoformat()}'
              )
              for item in batch.announcements:
                  print(f'  id={item.announcement_id} | {item.title}')
          PY
