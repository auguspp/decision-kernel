name: sm-final-readback-check
on:
  push:
    branches: [work/sm-final-readback-20260926]
    paths: [.github/workflows/sm-final-readback-check.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: sm-final-readback-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'auguspp/decision-kernel' && github.ref == 'refs/heads/work/sm-final-readback-20260926' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      M: b87b5ea3af2532a5d9824258da7e5fb8889229ec
      R: cc08ced8d7c5e72234b44ca276ea2af03eca227a
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b87b5ea3af2532a5d9824258da7e5fb8889229ec
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing reading dependencies
        run: python -m pip install -e '.[feeds,documents]'
      - name: Export only fixed published reading and its exact references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,re,subprocess,zipfile
          from datetime import datetime,timezone
          from decision_kernel.runtime import current_state as m, smart_money_view as v
          assert datetime.now(timezone.utc)<datetime(2026,9,27,tzinfo=timezone.utc)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['M']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'published-sm';out.mkdir()
          repo='repos/auguspp/decision-kernel/'
          audit=[];total=0;cache={}
          def get(path):
              return json.loads(subprocess.check_output(['gh','api','--method','GET',repo+path],timeout=120))
          def blob(sha):
              if sha in cache:return cache[sha]
              assert re.fullmatch('[0-9a-f]{40}',sha)
              obj=get('git/blobs/'+sha)
              assert obj['sha']==sha and obj['encoding']=='base64'
              raw=base64.b64decode(obj['content'],validate=False)
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              cache[sha]=raw;return raw
          def save(path,raw,sha):
              nonlocal_dummy=None
              global total
              p=pathlib.PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in path
              total+=len(raw);assert total<=180*1024*1024
              target=out/'reading'/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
              audit.append({'path':path,'git_blob':sha,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          obj=get('contents/current-state.json?ref='+os.environ['R'])
          raw=base64.b64decode(obj['content']);assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==obj['sha']
          package=json.loads(raw);m.validate_read_package(package)
          assert package['code_commit']==os.environ['M']
          save('current-state.json',raw,obj['sha'])
          root=get('contents/README.md?ref='+os.environ['R']);raw=base64.b64decode(root['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==root['sha']
          save('README.md',raw,root['sha'])
          entry=package['research']['smart_money'];refs=entry['details']
          assert entry['pending_delivery_count']==0 and entry['browser_status']=='DISPLAY_PROJECTION_COMPLETE'
          def bound(ref):
              assert set(('read_path','git_blob','bytes','sha256'))<=set(ref)
              raw=blob(ref['git_blob'])
              assert len(raw)==ref['bytes'] and hashlib.sha256(raw).hexdigest()==ref['sha256']
              save(ref['read_path'],raw,ref['git_blob']);return raw
          content={name:bound(ref) for name,ref in refs.items()}
          overview=json.loads(content['overview']);meta=json.loads(content['history']);state=json.loads(content['state'])
          assert not state['unresolved'] and overview['status']=='READY'
          assert len(meta['chunks'])<=40
          chunks={r['name']:bound(r['reference']) for r in meta['chunks']}
          history=v.decode_chunks(meta,chunks)
          assert len(history['records'])==137572
          assert len(content['browser'])<30*1024*1024
          for origin in overview['origins'].values():
              arc=origin.get('archive')
              if not arc:continue
              raw=bound(arc)
              import io
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None
          proof={'M':os.environ['M'],'R':os.environ['R'],'verified_at':datetime.now(timezone.utc).isoformat(),
            'run_id':os.environ['GITHUB_RUN_ID'],'verification_code':os.environ['GITHUB_SHA'],
            'reading_hash':package['reading_hash'],'root_validator_executed':True,
            'smart_money':entry,'records':len(history['records']),'chunks':len(chunks),
            'browser_bytes':len(content['browser']),'browser_sha256':hashlib.sha256(content['browser']).hexdigest(),
            'unresolved':state['unresolved'],'source_calls':0,'business_ref_writes':0,'files':audit}
          (out/'readback-proof.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2))
          print(json.dumps({k:proof[k] for k in ('M','R','records','chunks','browser_bytes','unresolved','source_calls','business_ref_writes')}))
          PY
      - name: Retain exact trusted implementation for offline verification
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/published-sm"
          git archive --format=zip HEAD > "$RUNNER_TEMP/published-sm/source.zip"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sm-published-readback-${{ github.run_id }}-1
          path: ${{ runner.temp }}/published-sm/
          retention-days: 30
          if-no-files-found: error
