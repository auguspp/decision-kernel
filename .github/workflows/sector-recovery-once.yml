name: sector-recovery-once

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Same existing group: ordinary Sector and this one-shot cannot run together.
concurrency:
  group: sector-radar-prospective-state
  cancel-in-progress: false

jobs:
  claim:
    if: >-
      github.repository == 'auguspp/decision-kernel' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      launch_sha: ${{ steps.launch.outputs.launch_sha }}
    steps:
      - name: Claim the approved one-shot with a create-only Git ref
        id: launch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request=sector-gap-20260911-v1
          message=$(jq -cn --arg request_id "$request" --arg run_id "$GITHUB_RUN_ID" \
            '{request_id:$request_id,run_id:$run_id,authorization_comment_id:5628923881}')
          tag=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$request" -f message="$message" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/sector-recovery-once/$request" -f sha="$tag" > /tmp/recovery-launch.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/sector-recovery-once/$request" \
            | jq -e --arg tag "$tag" '.object.type == "tag" and .object.sha == $tag' > /dev/null
          printf 'launch_sha=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          echo 'One-shot claimed. A failure or uncertain response is not permission to retry.' >> "$GITHUB_STEP_SUMMARY"

  capture:
    needs: claim
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      RECOVERY_LAUNCH_SHA: ${{ needs.claim.outputs.launch_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the existing package only
        run: python -m pip install -e .
      - name: Read exact authority metadata using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sector-recovery"
          mkdir -p "$root/metadata"
          parent=$(jq -r .parent.run_id radar_inputs/sector-recovery-once-2026-09-11.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$parent" > "$root/metadata/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$parent/artifacts?per_page=100" > "$root/metadata/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sector-radar-shadow.yml/runs?branch=main&status=success&per_page=2" > "$root/metadata/newest.json"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$RECOVERY_LAUNCH_SHA" > "$root/metadata/launch.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/sector-recovery-once/sector-gap-20260911-v1" > "$root/metadata/launch-ref.json"
      - name: Download exact original authoritative state, never the read model
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10109790767'
          run-id: '34364727989'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/sector-recovery/input
      - name: Validate authority, original bundle and this launch before requests
        run: python .github/scripts/capture-sector-recovery.py prepare --root "$RUNNER_TEMP/sector-recovery"
      - name: Reuse the existing shared-Key precheck with the remaining known peers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, runpy
          check = runpy.run_path('.github/scripts/check-sector-scheduled-activity.py')
          check['require_invocation'](os.environ)
          peers = check['PEERS'] | {'.github/workflows/stock-field-source-study.yml', '.github/workflows/sector-member-reading.yml'}
          blockers = check['check_activity'](check['request_reader'](os.environ['GITHUB_TOKEN']), peers=peers)
          if blockers:
              raise SystemExit('BLOCKED_SHARED_KEY_ACTIVITY: ' + ','.join(map(str, blockers)))
          print('No visible peers. Not an atomic/global Key lock or a quota guarantee.')
          PY
      - name: Capture this missing interval once
        id: acquisition
        timeout-minutes: 140
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          HITHINK_SECTOR_REQUEST_PACING: '1'
        run: python .github/scripts/capture-sector-recovery.py capture --root "$RUNNER_TEMP/sector-recovery"
      - name: Rebuild candidate using the original normalizers without credentials
        id: verification
        run: python .github/scripts/capture-sector-recovery.py verify --root "$RUNNER_TEMP/sector-recovery"
      - name: Retain the original inputs and each completed response, including failure
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-recovery-${{ github.run_id }}-1
          path: ${{ runner.temp }}/sector-recovery/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
      - name: Explain the limited result
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.acquisition.outcome }}
          VERIFY_OUTCOME: ${{ steps.verification.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          {
            echo '## Sector missing-session sources — candidate only'
            printf 'Capture: %s; offline rebuild: %s\n\n' "$CAPTURE_OUTCOME" "$VERIFY_OUTCOME"
            printf 'Evidence: %s\n\n' "$ARTIFACT_URL"
            echo 'No production state/cache update, historical signal creation, Research or investment authority.'
            echo 'A saved candidate is not restoration acceptance. Do not Re-run or repeat the one-shot.'
          } >> "$GITHUB_STEP_SUMMARY"
