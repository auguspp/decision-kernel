name: sector-recovery-once

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Share the existing state producer exclusion without changing its trigger/budget.
concurrency:
  group: sector-radar-prospective-state
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      launch: ${{ steps.once.outputs.launch }}
    steps:
      - name: Claim the approved one-off without rewriting any ref
        id: once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = auguspp/decision-kernel
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          request=sector-gap-20260911-v1
          message=$(jq -cn --arg run "$GITHUB_RUN_ID" '{request_id:"sector-gap-20260911-v1",run_id:$run,authorization_comment_id:5628923881}')
          tag=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$request" -f message="$message" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          # Existing ref or uncertain POST stops. No PATCH, DELETE, force or retry.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/sector-recovery-once/$request" -f sha="$tag" > "$RUNNER_TEMP/claim.json"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/sector-recovery-once/$request" --jq .object.sha)
          test "$actual" = "$tag"
          printf 'launch=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  capture:
    needs: claim
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing package only
        run: python -m pip install -e .
      - name: Read the exact parent and current restore authority
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCH: ${{ needs.claim.outputs.launch }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sector-recovery"
          mkdir -p "$root/metadata"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/34364727989" > "$root/metadata/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/34364727989/artifacts?per_page=100" > "$root/metadata/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sector-radar-shadow.yml/runs?branch=main&status=success&per_page=1" > "$root/metadata/newest.json"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$LAUNCH" > "$root/metadata/launch.json"
      - name: Download only the pinned successful state bundle
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10109790767'
          run-id: '34364727989'
          repository: auguspp/decision-kernel
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/sector-recovery/input
      - name: Verify original state and approved intent before market access
        run: python .github/scripts/capture-sector-recovery.py prepare --root "$RUNNER_TEMP/sector-recovery"
      - name: Check visible shared-Key activity once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HITHINK_FINANCE_API_KEY: ''
        run: python .github/scripts/check-sector-scheduled-activity.py
      - name: Acquire missing completed index sessions once
        timeout-minutes: 140
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          HITHINK_SECTOR_REQUEST_PACING: '1'
        run: python .github/scripts/capture-sector-recovery.py capture --root "$RUNNER_TEMP/sector-recovery"
      - name: Rebuild the candidate offline without market credentials
        env:
          HITHINK_FINANCE_API_KEY: ''
        run: python .github/scripts/capture-sector-recovery.py verify --root "$RUNNER_TEMP/sector-recovery"
      - name: Preserve partial or complete sources, not authoritative production state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-recovery-${{ github.run_id }}-1
          path: ${{ runner.temp }}/sector-recovery/
          if-no-files-found: warn
          retention-days: 90
      - name: Explain recovery scope
        if: always()
        run: |
          echo '## Sector missing-session source capture' >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidate and sources only. No authoritative state/cache published, no historical event recreated. Inspect original capture/report.json and offline verification; a green job is NOT production recovery acceptance. Preserve failures; do not Re-run or click again.' >> "$GITHUB_STEP_SUMMARY"
