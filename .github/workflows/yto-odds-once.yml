name: yto-odds-once

on:
  pull_request:
    paths:
      - ".github/workflows/yto-odds-once.yml"

permissions:
  contents: read

jobs:
  run-yto-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Check HiThink secret
        shell: bash
        run: |
          if [ -z "${HITHINK_FINANCE_API_KEY:-}" ]; then
            echo "::error::Missing repository secret HITHINK_FINANCE_API_KEY"
            exit 1
          fi
      - name: Run YTO live Odds once
        shell: bash
        run: |
          set -euo pipefail
          decision-kernel build-inbox \
            research_cases/600233-yto-deep-research-v1.json \
            --output yto-odds/index.html \
            --summary yto-odds/summary.md
          echo "===== YTO ODDS SUMMARY ====="
          cat yto-odds/summary.md
