name: R4 Rigol native main dispatch once
on:
  push:
    branches: [ops/r4-rigol-native-dispatch-20260924]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'auguspp/decision-kernel' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One exact native workflow dispatch; no execution identity override
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dispatch-proof
          python - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          OUT=Path('dispatch-proof');M='5b8c07e49db21de1550ccc103294f6c079124ed9'
          REPO='repos/auguspp/decision-kernel/'
          def read(path):
              r=subprocess.run(['gh','api',REPO+path],capture_output=True,timeout=45,check=True)
              return json.loads(r.stdout)
          def save(n,v):
              (OUT/n).write_text(json.dumps(v,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          main=read('git/ref/heads/main');assert main['object']['sha']==M
          ci=read('actions/runs/35937542199')
          assert (ci['head_sha'],ci['head_branch'],ci['event'],ci['status'],ci['conclusion'],ci['run_attempt'])==(M,'main','push','completed','success',1)
          pubs=read('actions/workflows/current-state-read-entry.yml/runs?head_sha='+M+'&per_page=10')['workflow_runs']
          qualified=[r for r in pubs if r['head_sha']==M and r['head_branch']=='main' and r['event']=='workflow_run' and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success']
          assert qualified,'NORMAL_PUBLISHER_NOT_COMPLETED'
          work=read('git/ref/heads/research-work/stock-business-v0');assert work['object']['sha']=='4b9988f20aa41810c6818d101e2bdb37cf139bde'
          tree=read('git/trees/'+work['object']['sha']+'?recursive=1');assert not tree['truncated']
          prefix='research_runs/candidates/stock-questions/2a5be65a2593e79927fae48ce024861f411a92d6575aa450b1e084ac3c5c193f/'
          assert not any(v['path'].startswith(prefix) for v in tree['tree']),'QUESTION_ALREADY_RESERVED'
          config=read('contents/research_runs/stock-question-request.json?ref='+M)
          assert config['sha']=='0071069bca7292888e3a0ce3ddc03ea1bbc3a50d'
          running=read('actions/workflows/stock-business-research.yml/runs?per_page=20')['workflow_runs']
          assert not any(r['status']!='completed' for r in running),'RESEARCH_IN_FLIGHT'
          body={'ref':'main','inputs':{'reviewed-question':'true','code-sha':M}}
          save('request.json',body)
          receipt={'authority':'https://github.com/auguspp/decision-kernel/issues/297#issuecomment-5804967978','method_authority':'https://github.com/auguspp/decision-kernel/issues/297#issuecomment-5804971139','main':M,'main_ci':ci['id'],'publisher_runs':[r['id'] for r in qualified],'work_before':work['object']['sha'],'request_blob':config['sha'],'dispatcher_run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'started_at':datetime.now(timezone.utc).isoformat(),'status':'DISPATCH_ABOUT_TO_SEND','automatic_retry':False,'model_calls_in_dispatcher':0}
          save('receipt.json',receipt)
          try:
              r=subprocess.run(['gh','api','--include','--method','POST',REPO+'actions/workflows/stock-business-research.yml/dispatches','--input',str(OUT/'request.json')],capture_output=True,timeout=60)
              receipt.update(returncode=r.returncode,status='DISPATCH_ACCEPTED_NOT_EXECUTION_RESULT' if r.returncode==0 else 'DISPATCH_UNCERTAIN_NO_RETRY',response_sha256=__import__('hashlib').sha256(r.stdout).hexdigest())
              (OUT/'response.txt').write_bytes(r.stdout)
              assert r.returncode==0,'DISPATCH_FAILED_OR_UNCERTAIN_NO_RETRY'
          except Exception as e:
              receipt.update(error_type=type(e).__name__,status='DISPATCH_UNCERTAIN_NO_RETRY');raise
          finally:
              receipt['finished_at']=datetime.now(timezone.utc).isoformat();save('receipt.json',receipt)
          print('NATIVE_DISPATCH_ACCEPTED_NO_SECOND_DISPATCH')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-rigol-dispatch-${{ github.run_id }}
          path: dispatch-proof/
          if-no-files-found: error
          retention-days: 30
