name: decision-inbox

on:
  workflow_dispatch:
    inputs:
      scan-disclosures:
        description: Explicitly run the retained six-company disclosure scan; default off
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Check HiThink secret
        shell: bash
        run: |
          if [ -z "${HITHINK_FINANCE_API_KEY:-}" ]; then
            echo "::error::Missing repository secret HITHINK_FINANCE_API_KEY"
            exit 1
          fi
      - name: Build Attention Inbox
        shell: bash
        run: |
          set -euo pipefail

          # R5 daily attention uses only explicitly enabled typed Watch boundaries.
          # Legacy packages remain in Git and shadow sampling, not daily Odds wakes.
          decision_packages=(
          )

          # Research-attention inputs are curated separately. Add only exact,
          # unresolved, validated ResearchFunnelResult handoffs. A resolved
          # cold-start handoff remains audit dogfood and must not become a stale
          # daily DEEPEN_REQUIRED card merely because its file still exists.
          research_attention_handoffs=(
            # Add exact current handoff paths here when real state earns attention.
          )

          research_attention_args=()
          for handoff in "${research_attention_handoffs[@]}"; do
            research_attention_args+=(--research-attention "$handoff")
          done

          # #349-C reuses the exact Attention Inbox market fetches in one process.
          # The typed Watch compares qualified completed closes only with explicit
          # retained Human/Odds boundaries; it never creates Action authority.
          # Watch bytes are nested inside the existing decision-inbox artifact so
          # the read-only current-state collector can validate the same run/archive.
          python -m decision_kernel.runtime.attention_inbox_with_odds_watch \
            "${decision_packages[@]}" \
            "${research_attention_args[@]}" \
            --odds-watch-config decision_inputs/odds-watch-v0.json \
            --odds-watch-registry current_state/registry.json \
            --odds-watch-output decision-inbox/odds-watch
      - name: Capture Surprise Radar market-history shadow
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          # Shadow inputs are exact Research package objects, curated separately
          # from both Human Inbox eligibility and heterogeneous dogfood artifacts.
          # Never replace this with dogfood/*.json: Evidence arrays and Research-
          # attention handoffs are valid dogfood files but invalid shadow packages.
          shadow_packages=(
            dogfood/600519-moutai.json
            dogfood/300750-catl.json
            dogfood/600036-cmb.json
            dogfood/601088-shenhua.json
            research_cases/603986-gigadevice-deep-research-v2.json
            research_cases/002050-sanhua-deep-research-v1.json
          )

          python -m decision_kernel.runtime.market_history_shadow \
            "${shadow_packages[@]}" \
            --output-dir market-history-shadow \
            2>&1 | tee market-history-shadow-status.txt
      - name: Record disclosure request scope
        if: always()
        env:
          DISCLOSURE_SCAN_REQUESTED: ${{ inputs.scan-disclosures }}
        run: |
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          requested = os.environ.get("DISCLOSURE_SCAN_REQUESTED", "")
          if requested not in {"", "false", "true"}:
              raise ValueError("INVALID_DISCLOSURE_SCAN_REQUEST")
          note = (
              "本次显式请求旧版六公司公告扫描；执行结果见独立 disclosures job，不由 Inbox 成功推断。"
              if requested == "true" else
              "本次未请求公告扫描（NOT_REQUESTED）；不代表没有公告，也不是来源获取失败。"
          )
          output = Path("decision-inbox")
          markdown = output / "summary.md"
          page = output / "index.html"
          if markdown.is_file():
              with markdown.open("a", encoding="utf-8") as stream:
                  stream.write("\n## 公告覆盖\n\n" + note + "\n")
          if page.is_file():
              text = page.read_text(encoding="utf-8")
              block = "<aside><h2>公告覆盖</h2><p>" + html.escape(note) + "</p></aside>"
              if "</body>" not in text:
                  raise ValueError("INBOX_HTML_BODY_CLOSURE_MISSING")
              page.write_text(text.replace("</body>", block + "</body>", 1), encoding="utf-8")
          print(note)
          PY
      - name: Publish Human summary
        if: always()
        shell: bash
        run: |
          if [ -f decision-inbox/summary.md ]; then
            cat decision-inbox/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Attention Inbox unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "The batch run failed before a Human attention inbox could be produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f decision-inbox/odds-watch/summary.md ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat decision-inbox/odds-watch/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "## Odds Watch unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No price-condition state is inferred from a missing typed Watch artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload mobile HTML snapshot
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: decision-inbox
          path: decision-inbox/
          retention-days: 14
      - name: Upload typed Odds Watch
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: odds-watch
          path: decision-inbox/odds-watch/
          if-no-files-found: error
          retention-days: 14
      - name: Upload market-history shadow inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-history-shadow
          path: |
            market-history-shadow/
            market-history-shadow-status.txt
          if-no-files-found: ignore
          retention-days: 14

  disclosures:
    if: github.event_name == 'workflow_dispatch' && inputs.scan-disclosures == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: disclosure-receipt-memory
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install with official PDF text extraction
        run: python -m pip install -e '.[documents]'
      - name: Restore best-effort disclosure receipt memory
        id: disclosure-memory
        uses: actions/cache/restore@v6
        with:
          path: decision-state/disclosure-receipts.json
          key: disclosure-receipts-scan-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            disclosure-receipts-state-
      - name: Read pinned disclosure attempt history
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m decision_kernel.runtime.disclosure_attempt_history
          --code-commit "$GITHUB_SHA"
          --output disclosure-attempt-history.json
      - name: Scan official disclosures and prepare Research handoffs
        shell: bash
        run: |
          set -euo pipefail
          through="$(date +%F)"
          receipt_args=()
          memory_status="EMPTY_SAFE_REASSESSMENT"
          if [ -f decision-state/disclosure-receipts.json ]; then
            receipt_args=(--receipts decision-state/disclosure-receipts.json)
            memory_status="RESTORED_BEST_EFFORT"
          fi
          printf 'MEMORY_STATUS=%s\n' "$memory_status" > disclosure-scan-meta.txt
          printf 'THROUGH=%s\n' "$through" >> disclosure-scan-meta.txt
          decision-kernel scan-disclosures \
            dogfood/600519-moutai.json \
            dogfood/300750-catl.json \
            dogfood/600036-cmb.json \
            dogfood/601088-shenhua.json \
            research_cases/603986-gigadevice-deep-research-v2.json \
            research_cases/002050-sanhua-deep-research-v1.json \
            --through "$through" \
            --packet-dir disclosure-assessment-packets \
            --raw-pdf-dir disclosure-primary-bodies \
            --packet-limit 10 \
            --attempt-history disclosure-attempt-history.json \
            "${receipt_args[@]}" | tee disclosure-scan.txt
      - name: Publish disclosure summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Official disclosure scan"
            echo
            if [ -f disclosure-scan-meta.txt ]; then
              source disclosure-scan-meta.txt
              echo "Receipt memory: \`$MEMORY_STATUS\`"
              echo
              echo "Through: \`$THROUGH\` (Asia/Shanghai)"
              echo
            fi
            if [ -f disclosure-scan.txt ]; then
              echo '```text'
              cat disclosure-scan.txt
              echo '```'
            else
              echo "The disclosure scan failed before a result was produced."
            fi
            echo
            echo "Assessment packets are auditable Research-producer inputs only; they do not create a Recommendation, Human wake, or investment authority."
            echo
            echo "Attempt history only prevents repeated packet preparation; it is not semantic assessment or quiet. Receipt memory is a separate best-effort attention optimization."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload disclosure scan and assessment handoffs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: official-disclosure-scan
          path: |
            disclosure-scan.txt
            disclosure-scan-meta.txt
            disclosure-attempt-history.json
            disclosure-assessment-packets/
          retention-days: 14
      - name: Upload already-fetched disclosure PDF bodies
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-disclosure-primary-bodies
          path: |
            disclosure-primary-bodies/
            disclosure-scan-meta.txt
          if-no-files-found: warn
          retention-days: 14
